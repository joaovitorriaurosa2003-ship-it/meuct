*{box-sizing:border-box; margin:0; padding:0;}

body{font-family:"Barlow",system-ui,sans-serif; color:#fff; background:#050B16; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:28px 20px; position:relative; overflow-x:hidden;}
body::before{content:""; position:fixed; inset:0; background:radial-gradient(1100px 620px at 50% -10%, rgba(43,209,126,0.16), transparent 62%), radial-gradient(900px 600px at 50% 120%, rgba(233,185,73,0.10), transparent 60%), linear-gradient(180deg,#0A1528 0%,#050B16 100%); z-index:0;}

.escudo{width:84px; height:84px; border-radius:50%; background:#fff; padding:4px; object-fit:contain; box-shadow:0 0 0 5px rgba(255,255,255,0.10), 0 16px 36px rgba(0,0,0,0.5);}
.clube{margin-top:16px; font-size:12px; font-weight:800; letter-spacing:.32em; text-transform:uppercase; color:#2BD17E;}
.marca{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:64px; line-height:1; margin-top:6px; letter-spacing:.005em; text-shadow:0 10px 40px rgba(0,0,0,0.45);}
.marca span{background:linear-gradient(135deg,#F6DE9A 0%,#E9B949 45%,#B8862C 100%); -webkit-background-clip:text; background-clip:text; color:transparent;}

.campo{position:relative; width:100%; aspect-ratio:16/10; margin-top:26px; border-radius:20px; padding:12px; background:linear-gradient(180deg,#0E1C36,#0A1528); border:1px solid rgba(255,255,255,0.08); box-shadow:0 30px 70px rgba(0,0,0,0.5);}
.gramado{position:relative; width:100%; height:100%; border-radius:12px; overflow:hidden; background:repeating-linear-gradient(90deg,#1F9A55 0 10%,#1B8A4C 10% 20%);}
.gramado::after{content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,0.10), transparent 65%), linear-gradient(180deg, transparent 55%, rgba(4,30,16,0.35));}
.gramado svg{position:absolute; inset:0; width:100%; height:100%;}
.aviso{position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:16px;}
.selo{display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; padding:6px 14px; border-radius:999px; background:rgba(5,14,28,0.82); border:1px solid rgba(255,255,255,0.14);}
.selo i{width:8px; height:8px; border-radius:50%; background:#E9B949; box-shadow:0 0 0 4px rgba(233,185,73,0.25); animation:pulso 1.8s ease-in-out infinite;}
@keyframes pulso{0%,100%{opacity:1;}50%{opacity:.35;}}
@media (prefers-reduced-motion: reduce){.selo i{animation:none;}}
.aviso h1{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:44px; line-height:1.02; text-shadow:0 4px 22px rgba(3,24,13,0.75);}
.aviso p{max-width:360px; font-size:15px; font-weight:500; line-height:1.45; color:rgba(255,255,255,0.94); text-shadow:0 2px 12px rgba(3,24,13,0.8);}

.cartao{width:100%; margin-top:20px; padding:20px 22px; border-radius:20px; background:linear-gradient(180deg,rgba(18,31,58,0.92),rgba(10,20,40,0.92)); border:1px solid rgba(255,255,255,0.09); box-shadow:0 24px 60px rgba(0,0,0,0.4);}
.cartao small{display:block; font-size:11px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,0.55);}
.cartao .nome{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:28px; line-height:1.1; margin-top:6px;}
.cartao .cargo{font-size:14px; color:rgba(255,255,255,0.75); margin-top:4px;}
.acoes{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px;}
.botao{display:inline-flex; align-items:center; gap:9px; padding:12px 20px; border-radius:999px; font:inherit; font-size:15px; font-weight:700; text-decoration:none; transition:transform .15s ease;}
.botao:hover{transform:translateY(-1px);}
.botao:focus-visible{outline:3px solid #F6DE9A; outline-offset:3px;}
.botao.zap{background:#2BD17E; color:#04200F; box-shadow:0 10px 26px rgba(43,209,126,0.28);}
.botao.fone{background:rgba(255,255,255,0.07); color:#fff; border:1px solid rgba(255,255,255,0.16);}
.botao svg{width:18px; height:18px; flex-shrink:0;}
.rodape{margin-top:18px; font-size:12.5px; color:rgba(255,255,255,0.5);}
@media (max-width:520px){ .marca{font-size:52px;} .campo{aspect-ratio:4/3.4;} .aviso h1{font-size:36px;} .aviso p{font-size:14px;} .cartao .nome{font-size:25px;} .botao{width:100%; justify-content:center;} }
</style>
</head>
