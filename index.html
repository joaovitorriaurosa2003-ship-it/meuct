/* ---------- Importador de CSV de análise de jogo ---------- */

function dataBrTracoParaIso(dataBr) {
  const [d, m, y] = (dataBr || "").split("-");
  if (!d || !m || !y) return dataBr || "";
  return `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
}

function extrairNomesJogadores(campoPlayer) {
  campoPlayer = (campoPlayer || "").trim();
  if (!campoPlayer) return [];
  return campoPlayer
    .split("|")
    .map((p) => p.trim())
    .filter(Boolean)
    .map((parte) => {
      const m = parte.match(/^\d+-(.+)$/);
      return m ? m[1].trim() : parte;
    });
}

/** Porta em JS do parse_jogo_csv.py — lê o CSV bruto de eventos e agrega por jogador. */
function parseJogoCsv(texto) {
  const linhas = texto.split(/\r?\n/);
  const n = linhas.length;
  let i = 0;

  const meta = {};
  while (i < n && linhas[i].trim() !== "") {
    const linha = linhas[i];
    if (linha.includes(";") && linha.trim() !== "Resumo") {
      const idx = linha.indexOf(";");
      meta[linha.slice(0, idx).trim()] = linha.slice(idx + 1).trim();
    }
    i++;
  }

  const dataIso = dataBrTracoParaIso(meta["Data"]);
  const tituloJogo = `Jogo — ${meta["Equipe Local"] || "?"} ${meta["Resultado"] || "?"} x ${meta["Equipe Visitante"] || "?"} ${meta["Competição"] || ""}`.trim();

  const contagem = {};
  let categoriaAtual = null;

  while (i < n) {
    const linha = linhas[i];
    const mCat = linha.match(/^CATEGORY:\s*(.+?)\s*$/);
    if (mCat) {
      categoriaAtual = mCat[1].trim();
      i++;
      if (i < n) i++; // pula linha de cabeçalho da categoria
      continue;
    }
    if (categoriaAtual && linha.trim() !== "") {
      const campos = linha.split(";");
      if (campos.length > 5) {
        extrairNomesJogadores(campos[5]).forEach((jogador) => {
          if (!contagem[jogador]) contagem[jogador] = {};
          contagem[jogador][categoriaAtual] = (contagem[jogador][categoriaAtual] || 0) + 1;
        });
      }
      i++;
      continue;
    }
    if (linha.trim() === "") categoriaAtual = null;
    i++;
  }

  const registros = Object.keys(contagem)
    .sort()
    .map((jogador) => {
      const cats = contagem[jogador];
      const nota = Object.keys(cats).sort().map((c) => `${c}: ${cats[c]}`).join(", ") + " (importado da análise de jogo)";
      return { atletaNome: jogador, data: dataIso, tipo: tituloJogo, nota, sinal: "neutro", origem: "analise_jogo_import_csv" };
    });

  return { meta, tituloJogo, dataIso, registros };
}

function ImportadorCSV({ atletas, onImportado }) {
  const { useState } = React;
  const [preview, setPreview] = useState(null);
  const [erroLeitura, setErroLeitura] = useState(null);
  const [importando, setImportando] = useState(false);
  const [resultado, setResultado] = useState(null);

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setResultado(null);
    setErroLeitura(null);
    setPreview(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = parseJogoCsv(ev.target.result);
        if (parsed.registros.length === 0) {
          setErroLeitura("Não consegui identificar nenhum jogador nesse arquivo. Confere se é o formato certo de análise de jogo.");
          return;
        }
        setPreview(parsed);
      } catch (err) {
        setErroLeitura("Erro ao ler o arquivo: " + err.message);
      }
    };
    reader.readAsText(file, "utf-8");
  }

  async function confirmarImportacao() {
    if (!preview) return;
    setImportando(true);
    let importados = 0, pulados = 0, novosAtletas = 0;

    for (const reg of preview.registros) {
      let atleta = atletas.find((a) => (a.nome || "").trim().toLowerCase() === reg.atletaNome.trim().toLowerCase());
      let atletaId;
      if (atleta) {
        atletaId = atleta.id;
      } else {
        const novo = await db.collection(COL_ATLETAS).add({
          nome: reg.atletaNome,
          categoria: "",
          origem: "importacao_csv_site",
          pendente_vinculo: true,
        });
        atletaId = novo.id;
        novosAtletas++;
      }

      // evita duplicar o mesmo jogo pro mesmo atleta
      const existentes = await db.collection(COL_ATLETAS).doc(atletaId)
        .collection(SUBCOLS.performance).where("tipo", "==", reg.tipo).limit(1).get();
      if (!existentes.empty) {
        pulados++;
        continue;
      }

      await adicionarRegistro(atletaId, "performance", {
        data: reg.data, tipo: reg.tipo, nota: reg.nota, sinal: reg.sinal, origem: reg.origem,
      });
      importados++;
    }

    setImportando(false);
    setResultado({ importados, pulados, novosAtletas });
    setPreview(null);
    onImportado();
  }

  return (
    <div className="import-box">
      <div className="import-drop">
        <input type="file" accept=".csv" id="csv-input" onChange={handleFile} style={{display:"none"}} />
        <label htmlFor="csv-input" className="pill-btn primary">Escolher arquivo CSV</label>
        <span className="import-hint">Exporte do sistema de análise de jogo e envie aqui — um arquivo por partida.</span>
      </div>

      {erroLeitura && (
        <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)", marginTop:14}}>
          <span>{erroLeitura}</span>
        </div>
      )}

      {preview && (
        <div className="import-preview">
          <div className="access-note admin" style={{marginTop:14}}>
            <span><b>{preview.tituloJogo}</b> · {preview.registros.length} jogador(es) identificado(s). Confira antes de confirmar.</span>
          </div>
          <table>
            <thead><tr><th>Jogador</th><th>Estatísticas</th><th>Já cadastrado?</th></tr></thead>
            <tbody>
              {preview.registros.map((r, i) => {
                const existe = atletas.some((a) => (a.nome || "").trim().toLowerCase() === r.atletaNome.trim().toLowerCase());
                return (
                  <tr key={i}>
                    <td style={{fontWeight:600, color:"var(--navy)"}}>{r.atletaNome}</td>
                    <td className="muted">{r.nota}</td>
                    <td>{existe ? <span className="badge verde">Sim</span> : <span className="badge amarelo">Novo atleta</span>}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="form-actions" style={{padding:"14px 0 0"}}>
            <button className="pill-btn" onClick={() => setPreview(null)} disabled={importando}>Cancelar</button>
            <button className="pill-btn primary" onClick={confirmarImportacao} disabled={importando}>
              {importando ? "Importando..." : `Confirmar importação (${preview.registros.length})`}
            </button>
          </div>
        </div>
      )}

      {resultado && (
        <div className="access-note" style={{background:"var(--verde-bg)", borderColor:"var(--verde)", marginTop:14}}>
          <span><b>Importado:</b> {resultado.importados} registro(s) novo(s), {resultado.pulados} pulado(s) (jogo já existia pro atleta), {resultado.novosAtletas} atleta(s) novo(s) criado(s) (marcados como pendente de vínculo).</span>
        </div>
      )}
    </div>
  );
}

  const [atletas, setAtletas] = useState(null);
  const [registros, setRegistros] = useState({});
  const [erro, setErro] = useState(null);
  const [formAberto, setFormAberto] = useState(false);
  const [toast, setToast] = useState(null);

  async function carregar() {
    const [listaAtletas, dadosArea] = await Promise.all([
      carregarAtletas(),
      carregarTodosRegistros("social"),
    ]);
    setAtletas(listaAtletas);
    setRegistros(dadosArea);
  }

  useEffect(() => { carregar().catch(e => setErro(e.message)); }, []);

  async function adicionar(atletaId, registro) {
    await adicionarRegistro(atletaId, "social", registro);
    await carregar();
    setToast("Registro salvo para " + nomeAtleta(atletas, atletaId));
    setFormAberto(false);
    setTimeout(() => setToast(null), 3200);
  }

  return (
    <div>
      <div className="page">
        <div className="page-head">
          <div>
            <h1>Serviço Social</h1>
            <div className="crumb">CT Integrado · Meia Noite EC · conectado ao Firestore</div>
          </div>
        </div>

        {erro ? (
          <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)"}}>
            <span><b>Não consegui carregar os dados:</b> {erro}</span>
          </div>
        ) : !atletas ? (
          <SkeletonPanel />
        ) : (
          <React.Fragment>
            <div className="access-note admin">
              <span><b>Modo Administrador:</b> visualizando o detalhe completo dos acompanhamentos.</span>
            </div>
            <div className="panel">
              <div className="panel-head">
                <h3>Acompanhamento social — todos os atletas</h3>
                <button className="pill-btn primary" onClick={() => setFormAberto(v => !v)}>{formAberto ? "Fechar" : "+ Novo registro"}</button>
              </div>
              {formAberto && (
                <FormNovoRegistroSocial atletas={atletas} onSalvar={adicionar} onCancelar={() => setFormAberto(false)} />
              )}
              <div className="panel-body">
                <table>
                  <thead><tr><th>Atleta</th><th>Data</th><th>Tipo</th><th>Status</th><th>Detalhe</th></tr></thead>
                  <tbody>
                    {Object.entries(registros).flatMap(([athleteId, regs]) =>
                      regs.map((r, i) => (
                        <tr key={athleteId + i}>
                          <td style={{fontWeight:600, color:"var(--navy)"}}>{nomeAtleta(atletas, athleteId)}</td>
                          <td>{formatarData(r.data)}</td>
                          <td>{r.tipo}</td>
                          <td><span className={"badge " + (r.statusPublico === "atencao" ? "amarelo" : "verde")}>{r.statusPublico === "atencao" ? "Em atenção" : "Ativo"}</span></td>
                          <td className="muted">{r.detalhe}</td>
                        </tr>
                      ))
                    )}
                    {Object.keys(registros).length === 0 && <tr><td colSpan="5" className="empty-state">Nenhum registro lançado ainda.</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          </React.Fragment>
        )}
      </div>
      {toast && <div className="toast"><span className="dot"></span>{toast}</div>}
    </div>
  );
}

function ViewDesempenho() {
  const [atletas, setAtletas] = useState(null);
  const [registros, setRegistros] = useState({});
  const [erro, setErro] = useState(null);
  const [formAberto, setFormAberto] = useState(false);
  const [importadorAberto, setImportadorAberto] = useState(false);
  const [toast, setToast] = useState(null);

  async function carregar() {
    const [listaAtletas, dadosArea] = await Promise.all([
      carregarAtletas(),
      carregarTodosRegistros("performance"),
    ]);
    setAtletas(listaAtletas);
    setRegistros(dadosArea);
  }

  useEffect(() => { carregar().catch(e => setErro(e.message)); }, []);

  async function adicionar(atletaId, registro) {
    await adicionarRegistro(atletaId, "performance", registro);
    await carregar();
    setToast("Registro salvo para " + nomeAtleta(atletas, atletaId));
    setFormAberto(false);
    setTimeout(() => setToast(null), 3200);
  }

  return (
    <div>
      <div className="page">
        <div className="page-head">
          <div>
            <h1>Desempenho</h1>
            <div className="crumb">CT Integrado · Meia Noite EC · conectado ao Firestore</div>
          </div>
        </div>

        {erro ? (
          <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)"}}>
            <span><b>Não consegui carregar os dados:</b> {erro}</span>
          </div>
        ) : !atletas ? (
          <SkeletonPanel />
        ) : (
          <React.Fragment>
            <div className="panel">
              <div className="panel-head">
                <h3>Importar CSV de análise de jogo</h3>

              </div>
              {importadorAberto && (
                <div style={{padding:"14px 20px 20px"}}>
                  <ImportadorCSV atletas={atletas} onImportado={() => { carregar(); setImportadorAberto(false); }} />
                </div>
              )}
            </div>

            <div className="panel">
            <div className="panel-head">
              <h3>Estatísticas de desempenho — todos os atletas</h3>
              <button className="pill-btn primary" onClick={() => setFormAberto(v => !v)}>{formAberto ? "Fechar" : "+ Novo registro"}</button>
            </div>
            {formAberto && (
              <FormNovoRegistro
                atletas={atletas}
                tiposSugeridos={["Jogo", "Treino avaliado", "Relatório tático"]}
                chave="performance"
                onSalvar={adicionar}
                onCancelar={() => setFormAberto(false)}
              />
            )}
            <div className="panel-body">
              <table>
                <thead><tr><th>Atleta</th><th>Data</th><th>Tipo</th><th>Observação</th><th>Sinal</th></tr></thead>
                <tbody>
                  {Object.entries(registros).flatMap(([athleteId, regs]) =>
                    regs.map((r, i) => (
                      <tr key={athleteId + i}>
                        <td style={{fontWeight:600, color:"var(--navy)"}}>{nomeAtleta(atletas, athleteId)}</td>
                        <td>{formatarData(r.data)}</td>
                        <td>{r.tipo}</td>
                        <td className="muted">{r.nota}</td>
                        <td><span className={"badge " + (r.sinal === "neutro" ? "neutro" : r.sinal)}>{r.sinal === "verde" ? "Regular" : r.sinal === "amarelo" ? "Atenção" : r.sinal === "vermelho" ? "Prioridade" : "Informativo"}</span></td>
                      </tr>
                    ))
                  )}
                  {Object.keys(registros).length === 0 && <tr><td colSpan="5" className="empty-state">Nenhum registro lançado ainda.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
          </React.Fragment>
        )}
      </div>
      {toast && <div className="toast"><span className="dot"></span>{toast}</div>}
    </div>
  );
}

function ViewAdmin() {
  const [view, setView] = useState("dashboard");
  const [atletaAberto, setAtletaAberto] = useState(null);
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState(null);

  function recarregar() {
    return carregarTudo().then(setDados).catch(e => setErro(e.message));
  }

  useEffect(() => { recarregar(); }, []);

  function openAtleta(id) { setAtletaAberto(id); }
  function fecharAtleta() { setAtletaAberto(null); }

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>{atletaAberto ? "Perfil do atleta" : (view === "dashboard" ? "Painel geral" : "Atletas")}</h1>
          <div className="crumb">CT Integrado · Meia Noite EC · conectado ao Firestore</div>
        </div>
        {!atletaAberto && dados && (
          <div style={{display:"flex", gap:8}}>
            <button className={"pill-btn" + (view === "dashboard" ? " primary" : "")} onClick={() => setView("dashboard")}>Painel geral</button>
            <button className={"pill-btn" + (view === "atletas" ? " primary" : "")} onClick={() => setView("atletas")}>Lista de atletas</button>
          </div>
        )}
      </div>

      {erro ? (
        <ErroCarregamento mensagem={erro} />
      ) : !dados ? (
        <Carregando />
      ) : atletaAberto ? (
        <PerfilAtleta atletaId={atletaAberto} onBack={fecharAtleta} dados={dados} onRecarregar={recarregar} />
      ) : view === "dashboard" ? (
        <Dashboard dados={dados} onOpenAtleta={openAtleta} />
      ) : (
        <ListaAtletas dados={dados} onOpenAtleta={openAtleta} onRecarregar={recarregar} />
      )}
    </div>
  );
}

function App() {
  const [pagina, setPagina] = useState("admin");
  return (
    <div className="app-shell">
      <HubBar current={pagina} onNavigate={setPagina} />
      <div className="main-content">
        <ChatWidget />
        {pagina === "admin" && <ViewAdmin />}
        {pagina === "psicologia" && <ViewPsicologia />}
        {pagina === "fisioterapia" && <ViewFisioterapia />}
        {pagina === "fisiologia" && <ViewFisiologia />}
        {pagina === "social" && <ViewSocial />}
        {pagina === "desempenho" && <ViewDesempenho />}
        {pagina === "treinador" && <PainelTreinador />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
