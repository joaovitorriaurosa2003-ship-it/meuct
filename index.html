<style>
  :root{
    --navy:#0A1F35;
    --navy-2:#12314f;
    --gold:#B8976A;
    --gold-2:#d4b585;
    --paper:#F7F5F1;
    --ink:#1c2530;
    --line:#e3ddd2;
    --good:#5c7a52;
    --warn:#b3612c;
    --bad:#a13d3d;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  .serif{font-family:'Fraunces',serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d8d0c0;border-radius:4px;}
  .kg-card{background:#fff;border:1px solid var(--line);border-radius:10px;}
  .kg-input{border:1px solid #d7d0c2;border-radius:7px;padding:8px 10px;font-size:14px;background:#fff;width:100%;}
  .kg-input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold);}
  .kg-btn{background:var(--navy);color:#fff;border-radius:7px;padding:9px 16px;font-size:14px;font-weight:600;transition:background .15s;}
  .kg-btn:hover{background:var(--navy-2);}
  .kg-btn-gold{background:var(--gold);color:var(--navy);border-radius:7px;padding:9px 16px;font-size:14px;font-weight:700;transition:background .15s;}
  .kg-btn-gold:hover{background:var(--gold-2);}
  .kg-btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;}
  .kg-btn-ghost:hover{background:#f1ede4;}
  .kg-tab{padding:10px 4px;font-size:14px;font-weight:600;color:#8b8272;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
  .kg-tab.active{color:var(--navy);border-bottom-color:var(--gold);}
  .kg-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;}
  table.kg-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.kg-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8b8272;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.kg-table td{padding:9px 10px;border-bottom:1px solid #efeae0;vertical-align:top;}
  table.kg-table tr:hover td{background:#faf8f4;}
  .fade-in{animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block; position:absolute; top:0; left:0; width:100%; padding:20px; color:#1c2530; font-family:'Inter',system-ui,sans-serif;}
    .no-print{display:none !important;}
  }
</style>
</head>

function fmt(n, dec=1){
  if (n===null||n===undefined||isNaN(n)) return "—";
  return n.toLocaleString("pt-BR", {minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function brl(n){
  if (n===null||n===undefined||isNaN(n)) return "—";
  return n.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

====================================================================== */
// converte uma quantidade+unidade de uso (na ficha técnica) para gramas
function paraGramas(quantidade, unidade, produto){
  const q = parseFloat(quantidade)||0;
  switch(unidade){
    case "kg": return q*1000;
    case "g": return q;
    case "L": return q*1000; // aprox. densidade 1
    case "ml": return q;
    case "un": return q*(parseFloat(produto?.pesoUnitario)||0);
    default: return q;
  }
}

// custo por grama do produto, já considerando fator de correção (perda)
function custoPorGrama(produto){
  if (!produto) return 0;
  const preco = parseFloat(produto.precoCompra)||0;
  let base = 0;
  switch(produto.unidadeCompra){
    case "kg": base = preco/1000; break;
    case "g": base = preco; break;
    case "L": base = preco/1000; break;
    case "ml": base = preco; break;
    case "un": base = preco/(parseFloat(produto.pesoUnitario)||1); break;
    default: base = 0;
  }
  const fc = parseFloat(produto.fatorCorrecao);
  const fator = (fc && fc>0) ? fc/100 : 1;
  return base/fator;
}

// dados nutricionais (por 1g) de um produto, olhando o alimento TACO vinculado
function nutrientesPorGrama(produto, tacoIndex, customIndex){
  if (!produto) return null;
  let fonte = null;
  if (produto.tacoId){
    fonte = tacoIndex[produto.tacoId];
  } else if (produto.customId){
    fonte = customIndex[produto.customId];
  }
  if (!fonte) return null;
  const out = {};
  TODOS_NUTRIENTES.forEach(n=>{
    const v = fonte[n.k];
    out[n.k] = (v===null||v===undefined) ? null : v/100;
  });
  return out;
}

function calcularFicha(ficha, produtosIndex, tacoIndex, customIndex){
  let custoTotal = 0;
  const nutriTotal = {};
  TODOS_NUTRIENTES.forEach(n=> nutriTotal[n.k] = {soma:0, temDado:false});
  let pesoTotalG = 0;

  (ficha.ingredientes||[]).forEach(ing=>{
    const produto = produtosIndex[ing.produtoId];
    if (!produto) return;
    const gramas = paraGramas(ing.quantidade, ing.unidade, produto);
    pesoTotalG += gramas;
    custoTotal += custoPorGrama(produto)*gramas;
    const npg = nutrientesPorGrama(produto, tacoIndex, customIndex);
    if (npg){
      TODOS_NUTRIENTES.forEach(n=>{
        if (npg[n.k]!==null){
          nutriTotal[n.k].soma += npg[n.k]*gramas;
          nutriTotal[n.k].temDado = true;
        }
      });
    }
  });

  const porcoes = parseFloat(ficha.rendimentoPorcoes)||1;
  const custoPorcao = custoTotal/porcoes;
  const nutriPorcao = {};
  TODOS_NUTRIENTES.forEach(n=>{
    nutriPorcao[n.k] = nutriTotal[n.k].temDado ? nutriTotal[n.k].soma/porcoes : null;
  });

  return {custoTotal, custoPorcao, nutriPorcao, pesoTotalG, pesoPorcaoG: pesoTotalG/porcoes};
}

// resolve o objeto do alimento (taco ou customizado) de um item de refeição
function alimentoDoItem(item, tacoIndex, customIndex){
  if (item.tipo === "custom") return customIndex[item.itemId];
  return tacoIndex[item.itemId];
}

function nutrientesPorGramaAlimento(alimento){
  if (!alimento) return null;
  const out = {};
  TODOS_NUTRIENTES.forEach(n=>{
    const v = alimento[n.k];
    out[n.k] = (v===null||v===undefined) ? null : v/100;
  });
  return out;
}

// procura alimentos (TACO + customizados) cujo nome bate com as palavras-chave de um grupo
function alimentosDoGrupo(grupoId, tacoData, customFoods){
  const g = grupoInfo(grupoId);
  if (!g) return [];
  const todos = [...tacoData.map(t=>({...t, tipo:"taco"})), ...customFoods.map(c=>({...c, tipo:"custom"}))];
  return todos.filter(a=>{
    if (!a.energy_kcal || a.energy_kcal<=0) return false;
    const nome = a.nome.toLowerCase();
    return g.palavras.some(p=>nome.includes(p));
  });
}

function calcularRefeicao(refeicao, tacoIndex, customIndex){
  const nutriTotal = {};
  TODOS_NUTRIENTES.forEach(n=> nutriTotal[n.k] = {soma:0, temDado:false});
  let pesoTotalG = 0;
  (refeicao.itens||[]).forEach(item=>{
    const alimento = alimentoDoItem(item, tacoIndex, customIndex);
    if (!alimento) return;
    const g = parseFloat(item.quantidade)||0;
    pesoTotalG += g;
    const npg = nutrientesPorGramaAlimento(alimento);
    if (npg){
      TODOS_NUTRIENTES.forEach(n=>{
        if (npg[n.k]!==null){ nutriTotal[n.k].soma += npg[n.k]*g; nutriTotal[n.k].temDado = true; }
      });
    }
  });
  const nutri = {};
  TODOS_NUTRIENTES.forEach(n=> nutri[n.k] = nutriTotal[n.k].temDado ? nutriTotal[n.k].soma : null);
  return {nutri, pesoTotalG};
}

function calcularCardapio(cardapio, tacoIndex, customIndex){
  const nutriTotal = {};
  TODOS_NUTRIENTES.forEach(n=> nutriTotal[n.k] = {soma:0, temDado:false});
  const porRefeicao = (cardapio.refeicoes||[]).map(r=>{
    const calc = calcularRefeicao(r, tacoIndex, customIndex);
    TODOS_NUTRIENTES.forEach(n=>{
      if (calc.nutri[n.k]!==null){ nutriTotal[n.k].soma += calc.nutri[n.k]; nutriTotal[n.k].temDado = true; }
    });
    return {refeicao:r, ...calc};
  });
  const nutri = {};
  TODOS_NUTRIENTES.forEach(n=> nutri[n.k] = nutriTotal[n.k].temDado ? nutriTotal[n.k].soma : null);
  return {nutri, porRefeicao};
}

// gera automaticamente os itens de UMA refeição a partir da composição por grupo
function gerarItensRefeicao(refeicao, kcalAlvoRefeicao, tacoData, customFoods){
  const composicao = refeicao.composicao||[];
  if (!composicao.length) return refeicao.itens||[];
  const itens = [];
  composicao.forEach(c=>{
    const candidatos = alimentosDoGrupo(c.grupo, tacoData, customFoods);
    if (!candidatos.length) return;
    const escolhido = candidatos[Math.floor(Math.random()*candidatos.length)];
    const kcalGrupo = kcalAlvoRefeicao * (parseFloat(c.pct)||0) / 100;
    let gramas = (kcalGrupo / escolhido.energy_kcal) * 100;
    gramas = Math.max(5, Math.round(gramas/5)*5);
    itens.push({id:uid(), tipo:escolhido.tipo, itemId:escolhido.id, quantidade:gramas, grupo:c.grupo});
  });
  return itens;
}

// gera o cardápio inteiro (todas as refeições que tenham composição definida)
function gerarCardapioCompleto(cardapio, tacoData, customFoods){
  const refeicoes = (cardapio.refeicoes||[]).map(r=>{
    if (!r.composicao || !r.composicao.length) return r;
    const kcalAlvoRefeicao = (parseFloat(cardapio.kcalAlvo)||0) * (parseFloat(r.pct)||0) / 100;
    return {...r, itens: gerarItensRefeicao(r, kcalAlvoRefeicao, tacoData, customFoods)};
  });
  return {...cardapio, refeicoes};
}

// sugestões de troca para um item: alimentos do mesmo grupo com kcal/100g parecido,
// já com a gramagem ajustada para manter a mesma contribuição calórica
function sugerirTrocas(item, tacoData, customFoods, tacoIndex, customIndex, limite=6){
  const atual = alimentoDoItem(item, tacoIndex, customIndex);
  if (!atual) return [];
  let grupoId = item.grupo;
  if (!grupoId){
    const nome = atual.nome.toLowerCase();
    const g = GRUPOS_ALIMENTARES.find(g=>g.palavras.some(p=>nome.includes(p)));
    grupoId = g?.id;
  }
  const candidatos = grupoId ? alimentosDoGrupo(grupoId, tacoData, customFoods) : [...tacoData.map(t=>({...t,tipo:"taco"})), ...customFoods.map(c=>({...c,tipo:"custom"}))];
  const kcalAtual100 = atual.energy_kcal;
  const gramasAtual = parseFloat(item.quantidade)||0;
  const kcalContribuicao = kcalAtual100 * gramasAtual / 100;
  return candidatos
    .filter(a=>!(a.tipo===item.tipo && a.id===item.itemId))
    .sort((a,b)=>Math.abs(a.energy_kcal-kcalAtual100) - Math.abs(b.energy_kcal-kcalAtual100))
    .slice(0, limite)
    .map(a=>{
      let gramas = (kcalContribuicao / a.energy_kcal) * 100;
      gramas = Math.max(5, Math.round(gramas/5)*5);
      return {tipo:a.tipo, itemId:a.id, nome:a.nome, energy_kcal:a.energy_kcal, quantidadeSugerida:gramas, grupo:grupoId};
    });
}

// agrega todos os alimentos do cardápio (somando repetições entre refeições) numa
// lista de compras, agrupada por categoria e já convertida para g/kg de forma legível
function gerarListaCompras(cardapio, tacoIndex, customIndex){
  const somaPorItem = {};
  (cardapio.refeicoes||[]).forEach(r=>{
    (r.itens||[]).forEach(item=>{
      const alimento = alimentoDoItem(item, tacoIndex, customIndex);
      if (!alimento) return;
      const chave = item.tipo+"_"+item.itemId;
      const g = parseFloat(item.quantidade)||0;
      if (!somaPorItem[chave]) somaPorItem[chave] = {nome:alimento.nome, categoria:alimento.categoria||"Outros", gramas:0};
      somaPorItem[chave].gramas += g;
    });
  });
  const porCategoria = {};
  Object.values(somaPorItem).forEach(it=>{
    const cat = it.categoria;
    if (!porCategoria[cat]) porCategoria[cat] = [];
    const gramas = it.gramas;
    const display = gramas>=1000 ? `${fmt(gramas/1000,2)} kg` : `${fmt(gramas,0)} g`;
    porCategoria[cat].push({nome:it.nome, gramas, display});
  });
  return Object.entries(porCategoria)
    .map(([categoria, itens])=>({categoria, itens: itens.sort((a,b)=>a.nome.localeCompare(b.nome))}))
    .sort((a,b)=>a.categoria.localeCompare(b.categoria));
}

function App(){
  const [usuario, setUsuario] = useState(null);
  const [perfil, setPerfil] = useState(null);
  const [carregandoAuth, setCarregandoAuth] = useState(true);

  useEffect(()=>{
    if (!firebaseOk){ setCarregandoAuth(false); return; }
    const unsub = auth.onAuthStateChanged(async (user)=>{
      setUsuario(user);
      if (user){
        try {
          const doc = await db.collection("nutricionistas").doc(user.uid).get();
          setPerfil(doc.exists ? doc.data() : null);
        } catch(e){ console.error(e); setPerfil(null); }
      } else {
        setPerfil(null);
      }
      setCarregandoAuth(false);
    });
    return unsub;
  },[]);

  if (!firebaseOk){
    return <div className="min-h-screen flex items-center justify-center p-6 text-center text-sm text-stone-500 max-w-sm mx-auto">
      Este aplicativo precisa do Firebase configurado para funcionar — login e a base compartilhada entre nutricionistas exigem conexão com o banco de dados.
    </div>;
  }
  if (carregandoAuth){
    return <div className="min-h-screen flex items-center justify-center text-sm text-stone-500">Carregando...</div>;
  }
  if (!usuario){
    return <Auth />;
  }
  if (!perfil){
    return <CompletarPerfil usuario={usuario} onCompleto={setPerfil} />;
  }

  const isAdmin = ADMIN_EMAILS.includes(usuario.email);
  return <AppLogado usuario={usuario} perfil={perfil} isAdmin={isAdmin} />;
}

function traduzErroAuth(codigo){
  const mapa = {
    "auth/email-already-in-use": "Esse e-mail já está cadastrado. Tente entrar.",
    "auth/invalid-email": "E-mail inválido.",
    "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
    "auth/user-not-found": "E-mail não encontrado.",
    "auth/wrong-password": "Senha incorreta.",
    "auth/invalid-credential": "E-mail ou senha incorretos.",
    "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco e tente de novo.",
  };
  return mapa[codigo] || "Não foi possível concluir. Tente novamente.";
}

function Auth(){
  const [modo, setModo] = useState("login"); // login | cadastro
  const [carregando, setCarregando] = useState(false);
  const [erro, setErro] = useState("");
  const [mensagem, setMensagem] = useState("");
  const [f, setF] = useState({nome:"", crn:"", email:"", senha:"", confirmarSenha:""});
  const set = (k,v)=>setF(prev=>({...prev,[k]:v}));

  const entrar = async ()=>{
    setErro(""); setCarregando(true);
    try {
      await auth.signInWithEmailAndPassword(f.email.trim(), f.senha);
    } catch(e){ setErro(traduzErroAuth(e.code)); }
    setCarregando(false);
  };

  const cadastrar = async ()=>{
    setErro("");
    if (!f.nome.trim() || !f.crn.trim() || !f.email.trim() || !f.senha){ setErro("Preencha todos os campos."); return; }
    if (f.senha !== f.confirmarSenha){ setErro("As senhas não coincidem."); return; }
    setCarregando(true);
    try {
      const cred = await auth.createUserWithEmailAndPassword(f.email.trim(), f.senha);
      await db.collection("nutricionistas").doc(cred.user.uid).set({
        nome: f.nome.trim(), crn: f.crn.trim(), email: f.email.trim(),
        criadoEm: new Date().toISOString()
      });
    } catch(e){ setErro(traduzErroAuth(e.code)); }
    setCarregando(false);
  };

  const recuperarSenha = async ()=>{
    setErro(""); setMensagem("");
    if (!f.email.trim()){ setErro("Digite seu e-mail para recuperar a senha."); return; }
    try {
      await auth.sendPasswordResetEmail(f.email.trim());
      setMensagem("Enviamos um link de recuperação para o seu e-mail.");
    } catch(e){ setErro(traduzErroAuth(e.code)); }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-5" style={{background:"var(--navy)"}}>
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">
          <div style={{background:"var(--gold)"}} className="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3">
            <span style={{color:"var(--navy)"}} className="font-bold serif">MN</span>
          </div>
          <div className="serif text-2xl text-white">MeuNutri</div>
          <div className="text-white/50 text-xs mt-1">Plataforma para nutricionistas</div>
        </div>

        <div className="kg-card p-6">
          <div className="flex gap-4 mb-4 text-sm font-semibold border-b" style={{borderColor:"var(--line)"}}>
            <div className={"pb-2 cursor-pointer " + (modo==="login"?"":"text-stone-400")} style={modo==="login"?{borderBottom:"2px solid var(--gold)", color:"var(--navy)"}:{}} onClick={()=>{setModo("login"); setErro(""); setMensagem("");}}>Entrar</div>
            <div className={"pb-2 cursor-pointer " + (modo==="cadastro"?"":"text-stone-400")} style={modo==="cadastro"?{borderBottom:"2px solid var(--gold)", color:"var(--navy)"}:{}} onClick={()=>{setModo("cadastro"); setErro(""); setMensagem("");}}>Criar conta</div>
          </div>

          {modo==="cadastro" && (
            <>
              <input className="kg-input mb-2" placeholder="Nome completo" value={f.nome} onChange={e=>set("nome",e.target.value)} />
              <input className="kg-input mb-2" placeholder="CRN (registro profissional)" value={f.crn} onChange={e=>set("crn",e.target.value)} />
            </>
          )}
          <input className="kg-input mb-2" type="email" placeholder="E-mail" value={f.email} onChange={e=>set("email",e.target.value)} />
          <input className="kg-input mb-2" type="password" placeholder="Senha" value={f.senha} onChange={e=>set("senha",e.target.value)} />
          {modo==="cadastro" && (
            <input className="kg-input mb-2" type="password" placeholder="Confirmar senha" value={f.confirmarSenha} onChange={e=>set("confirmarSenha",e.target.value)} />
          )}

          {erro && <div className="text-xs mb-2" style={{color:"var(--bad)"}}>{erro}</div>}
          {mensagem && <div className="text-xs mb-2" style={{color:"var(--good)"}}>{mensagem}</div>}

          {modo==="login" ? (
            <>
              <button disabled={carregando} className="kg-btn-gold w-full mt-2" onClick={entrar}>{carregando?"Entrando...":"Entrar"}</button>
              <div className="text-xs text-center mt-3 cursor-pointer text-stone-500 underline" onClick={recuperarSenha}>Esqueci minha senha</div>
            </>
          ) : (
            <button disabled={carregando} className="kg-btn-gold w-full mt-2" onClick={cadastrar}>{carregando?"Criando conta...":"Criar minha conta"}</button>
          )}
        </div>
      </div>
    </div>
  );
}

function CompletarPerfil({usuario, onCompleto}){
  const [f, setF] = useState({nome:"", crn:""});
  const [salvando, setSalvando] = useState(false);
  const salvar = async ()=>{
    if (!f.nome.trim() || !f.crn.trim()) return;
    setSalvando(true);
    const perfil = {nome:f.nome.trim(), crn:f.crn.trim(), email:usuario.email, criadoEm:new Date().toISOString()};
    await db.collection("nutricionistas").doc(usuario.uid).set(perfil);
    onCompleto(perfil);
    setSalvando(false);
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-5" style={{background:"var(--navy)"}}>
      <div className="kg-card p-6 w-full max-w-sm">
        <div className="font-semibold mb-3">Complete seu perfil</div>
        <input className="kg-input mb-2" placeholder="Nome completo" value={f.nome} onChange={e=>setF({...f,nome:e.target.value})} />
        <input className="kg-input mb-3" placeholder="CRN (registro profissional)" value={f.crn} onChange={e=>setF({...f,crn:e.target.value})} />
        <button disabled={salvando} className="kg-btn-gold w-full" onClick={salvar}>{salvando?"Salvando...":"Salvar e continuar"}</button>
      </div>
    </div>
  );
}

/* ======================================================================
   APP LOGADO — cada nutricionista só vê os próprios dados (produtos,
   fichas técnicas e cardápios). A base de alimentos (TACO + customizados)
   é compartilhada entre todos.
====================================================================== */
function AppLogado({usuario, perfil, isAdmin}){
  const [tab, setTab] = useState("dashboard");
  const [tacoData, setTacoData] = useState([]);
  const [produtos, setProdutos] = useState([]);
  const [customFoods, setCustomFoods] = useState([]);
  const [fichas, setFichas] = useState([]);
  const [cardapios, setCardapios] = useState([]);
  const [loadingTaco, setLoadingTaco] = useState(true);

  // base TACO embutida no próprio arquivo — funciona mesmo aberto localmente, sem servidor
  useEffect(()=>{
    setTacoData(TACO_DATA_EMBUTIDA);
    setLoadingTaco(false);
  },[]);

  // Firestore: produtos, fichas e cardápios são PRIVADOS (filtrados pelo dono);
  // alimentosCustom é COMPARTILHADO entre todos os nutricionistas da plataforma
  useEffect(()=>{
    const u1 = db.collection("produtos").where("donoId","==",usuario.uid).onSnapshot(snap=>{
      setProdutos(snap.docs.map(d=>({id:d.id, ...d.data()})));
    });
    const u2 = db.collection("fichasTecnicas").where("donoId","==",usuario.uid).onSnapshot(snap=>{
      setFichas(snap.docs.map(d=>({id:d.id, ...d.data()})));
    });
    const u3 = db.collection("alimentosCustom").onSnapshot(snap=>{
      setCustomFoods(snap.docs.map(d=>({id:d.id, ...d.data()})));
    });
    const u4 = db.collection("cardapios").where("donoId","==",usuario.uid).onSnapshot(snap=>{
      setCardapios(snap.docs.map(d=>({id:d.id, ...d.data()})));
    });
    return ()=>{u1();u2();u3();u4();};
  },[usuario.uid]);

  const tacoIndex = useMemo(()=>{
    const idx = {}; tacoData.forEach(t=>idx[t.id]=t); return idx;
  },[tacoData]);
  const customIndex = useMemo(()=>{
    const idx = {}; customFoods.forEach(t=>idx[t.id]=t); return idx;
  },[customFoods]);
  const produtosIndex = useMemo(()=>{
    const idx = {}; produtos.forEach(p=>idx[p.id]=p); return idx;
  },[produtos]);

  // ---- persistência (sempre com donoId = nutricionista logado) ----
  const salvarProduto = async (produto)=>{
    if (produto.id){
      const {id, ...rest} = produto;
      await db.collection("produtos").doc(id).set({...rest, donoId:usuario.uid});
    } else {
      await db.collection("produtos").add({...produto, donoId:usuario.uid});
    }
  };
  const excluirProduto = async (id)=>{ await db.collection("produtos").doc(id).delete(); };

  const salvarFicha = async (ficha)=>{
    if (ficha.id){
      const {id, ...rest} = ficha;
      await db.collection("fichasTecnicas").doc(id).set({...rest, donoId:usuario.uid});
    } else {
      await db.collection("fichasTecnicas").add({...ficha, donoId:usuario.uid});
    }
  };
  const excluirFicha = async (id)=>{ await db.collection("fichasTecnicas").doc(id).delete(); };

  // alimentos customizados são compartilhados — qualquer nutricionista adiciona,
  // todos passam a ver (fica registrado quem criou, pra referência)
  const salvarCustomFood = async (food)=>{
    if (food.id){ const {id,...rest}=food; await db.collection("alimentosCustom").doc(id).set({...rest, criadoPor:usuario.uid}); }
    else { await db.collection("alimentosCustom").add({...food, criadoPor:usuario.uid}); }
  };
  const excluirCustomFood = async (id)=>{ await db.collection("alimentosCustom").doc(id).delete(); };

  const salvarCardapio = async (cardapio)=>{
    if (cardapio.id){
      const {id, ...rest} = cardapio;
      await db.collection("cardapios").doc(id).set({...rest, donoId:usuario.uid});
    } else {
      await db.collection("cardapios").add({...cardapio, donoId:usuario.uid});
    }
  };
  const excluirCardapio = async (id)=>{ await db.collection("cardapios").doc(id).delete(); };

  const TABS = [
    {k:"dashboard", label:"Painel"},
    {k:"alimentos", label:"Base de Alimentos"},
    {k:"produtos", label:"Produtos & Custos"},
    {k:"fichas", label:"Fichas Técnicas"},
    {k:"cardapios", label:"Cardápios"},
    ...(isAdmin ? [{k:"admin", label:"Administração"}] : []),
  ];

  return (
    <div className="min-h-screen">
      <header style={{background:"var(--navy)"}} className="text-white">
        <div className="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div style={{background:"var(--gold)"}} className="w-9 h-9 rounded-full flex items-center justify-center">
              <span style={{color:"var(--navy)"}} className="font-bold text-sm serif">MN</span>
            </div>
            <div>
              <div className="serif text-lg leading-none" style={{color:"var(--gold-2)"}}>MeuNutri</div>
              <div className="text-[11px] text-white/50 tracking-wide">{perfil.nome} · CRN {perfil.crn}</div>
            </div>
          </div>
          <div className="flex items-center gap-3">
            {isAdmin && <span className="kg-badge" style={{background:"var(--gold)", color:"var(--navy)"}}>admin</span>}
            <button className="text-xs text-white/60 hover:text-white underline" onClick={()=>auth.signOut()}>Sair</button>
          </div>
        </div>
        <div className="max-w-7xl mx-auto px-5 flex gap-6 border-t border-white/10">
          {TABS.map(t=>(
            <div key={t.k}
              onClick={()=>setTab(t.k)}
              className={"kg-tab " + (tab===t.k ? "active":"")}
              style={tab===t.k ? {color:"#fff", borderBottomColor:"var(--gold)"} : {color:"rgba(255,255,255,.55)"}}>
              {t.label}
            </div>
          ))}
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-5 py-6">
        {tab==="dashboard" && <Dashboard produtos={produtos} fichas={fichas} cardapios={cardapios} tacoData={tacoData} loadingTaco={loadingTaco} produtosIndex={produtosIndex} tacoIndex={tacoIndex} customIndex={customIndex} setTab={setTab} />}
        {tab==="alimentos" && <BaseAlimentos tacoData={tacoData} loadingTaco={loadingTaco} customFoods={customFoods} salvarCustomFood={salvarCustomFood} excluirCustomFood={excluirCustomFood} />}
        {tab==="produtos" && <Produtos produtos={produtos} tacoData={tacoData} customFoods={customFoods} salvarProduto={salvarProduto} excluirProduto={excluirProduto} />}
        {tab==="fichas" && <FichasTecnicas fichas={fichas} produtos={produtos} tacoIndex={tacoIndex} customIndex={customIndex} produtosIndex={produtosIndex} salvarFicha={salvarFicha} excluirFicha={excluirFicha} />}
        {tab==="cardapios" && <Cardapios cardapios={cardapios} tacoData={tacoData} customFoods={customFoods} tacoIndex={tacoIndex} customIndex={customIndex} loadingTaco={loadingTaco} salvarCardapio={salvarCardapio} excluirCardapio={excluirCardapio} perfil={perfil} />}
        {tab==="admin" && isAdmin && <Admin />}
      </main>
    </div>
  );
}

/* ======================================================================
   BASE DE ALIMENTOS (TACO + customizados)
====================================================================== */
function BaseAlimentos({tacoData, loadingTaco, customFoods, salvarCustomFood, excluirCustomFood}){
  const [busca, setBusca] = useState("");
  const [categoria, setCategoria] = useState("Todas");
  const [selecionado, setSelecionado] = useState(null);
  const [modoCustom, setModoCustom] = useState(false);

  const categorias = useMemo(()=>{
    const s = new Set(tacoData.map(t=>t.categoria));
    return ["Todas", ...Array.from(s).sort()];
  },[tacoData]);

  const listaCompleta = useMemo(()=>{
    const custom = customFoods.map(c=>({...c, custom:true}));
    return [...tacoData, ...custom];
  },[tacoData, customFoods]);

  const filtrados = useMemo(()=>{
    let out = listaCompleta;
    if (categoria!=="Todas") out = out.filter(t=>t.categoria===categoria);
    if (busca.trim()){
      const b = busca.toLowerCase();
      out = out.filter(t=>t.nome.toLowerCase().includes(b));
    }
    return out.slice(0,200);
  },[listaCompleta, busca, categoria]);

  return (
    <div className="fade-in grid lg:grid-cols-5 gap-5">
      <div className="lg:col-span-3 kg-card p-4">
        <div className="flex flex-wrap gap-2 mb-3">
          <input className="kg-input flex-1 min-w-[200px]" placeholder="Buscar alimento (ex: arroz, frango, alface)..."
            value={busca} onChange={e=>setBusca(e.target.value)} />
          <select className="kg-input w-auto" value={categoria} onChange={e=>setCategoria(e.target.value)}>
            {categorias.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <button className="kg-btn-gold" onClick={()=>{setModoCustom(true); setSelecionado(null);}}>+ Alimento customizado</button>
        </div>
        {loadingTaco ? (
          <div className="text-sm text-stone-500 p-6 text-center">Carregando base TACO...</div>
        ) : (
          <div className="max-h-[65vh] overflow-y-auto">
            <table className="kg-table">
              <thead><tr><th>Alimento</th><th>Categoria</th><th>kcal/100g</th><th></th></tr></thead>
              <tbody>
                {filtrados.map(t=>(
                  <tr key={(t.custom?"c":"t")+t.id} onClick={()=>{setSelecionado(t); setModoCustom(false);}} className="cursor-pointer">
                    <td className="font-medium">{t.nome}{t.custom && <span className="kg-badge ml-2" style={{background:"#eee6d8",color:"var(--navy)"}}>custom</span>}</td>
                    <td className="text-stone-500">{t.categoria}</td>
                    <td>{fmt(t.energy_kcal,0)}</td>
                    <td className="text-right">{t.custom && <button className="text-xs text-red-600" onClick={(e)=>{e.stopPropagation(); excluirCustomFood(t.id);}}>excluir</button>}</td>
                  </tr>
                ))}
                {filtrados.length===0 && <tr><td colSpan="4" className="text-center text-stone-400 py-6">Nenhum alimento encontrado.</td></tr>}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div className="lg:col-span-2">
        {modoCustom ? (
          <FormAlimentoCustom onSalvar={(f)=>{salvarCustomFood(f); setModoCustom(false);}} onCancelar={()=>setModoCustom(false)} />
        ) : selecionado ? (
          <FichaNutricional alimento={selecionado} />
        ) : (
          <div className="kg-card p-6 text-sm text-stone-500">Selecione um alimento na lista para ver a composição nutricional completa (macro e micronutrientes por 100g).</div>
        )}
      </div>
    </div>
  );
}

          <table className="kg-table">
            <thead><tr><th>Produto</th><th>Categoria</th><th>Custo/g</th><th>Vínculo TACO</th><th></th></tr></thead>
            <tbody>
              {filtrados.map(p=>(
                <tr key={p.id} className="cursor-pointer" onClick={()=>setEditando(p)}>

                  <td className="text-stone-500">{p.categoria}</td>
                  <td>{brl(custoPorGrama(p))}</td>
                  <td className="text-stone-500">{p.tacoId ? (tacoData.find(t=>t.id===parseInt(p.tacoId))?.nome || customFoods.find(c=>c.id===p.tacoId)?.nome || "—") : "—"}</td>
                  <td className="text-right"><button className="text-xs text-red-600" onClick={(e)=>{e.stopPropagation(); if(confirm("Excluir produto "+p.nome+"?")) excluirProduto(p.id);}}>excluir</button></td>
                </tr>
              ))}
              {filtrados.length===0 && <tr><td colSpan="5" className="text-center text-stone-400 py-6">Nenhum produto cadastrado.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      <div className="lg:col-span-2">
        {editando ? (
          <FormProduto produto={editando} alimentosVinculo={alimentosParaVinculo}

          <div className="kg-card p-6 text-sm text-stone-500">Selecione um produto para editar, ou cadastre um novo. O custo por grama já considera unidade de compra e fator de correção (perda no preparo).</div>
        )}
      </div>
    </div>
  );
}

function FormProduto({produto, alimentosVinculo, onSalvar, onCancelar}){
  const [f, setF] = useState(produto);
  useEffect(()=>setF(produto),[produto]);
  const set = (k,v)=>setF(prev=>({...prev,[k]:v}));

  const custoG = custoPorGrama(f);

  return (
    <div className="kg-card p-5 fade-in">
      <div className="font-semibold mb-3">{f.id ? "Editar produto" : "Novo produto"}</div>

        <input className="kg-input" placeholder="Nome do produto" value={f.nome} onChange={e=>set("nome",e.target.value)} />
        <select className="kg-input" value={f.categoria} onChange={e=>set("categoria",e.target.value)}>
          {CATEGORIAS_PRODUTO.map(c=><option key={c}>{c}</option>)}
        </select>

        <div className="grid grid-cols-2 gap-2">
          <div>
            <label className="text-[11px] text-stone-500">Unidade de compra</label>
            <select className="kg-input" value={f.unidadeCompra} onChange={e=>set("unidadeCompra",e.target.value)}>
              {UNIDADES_COMPRA.map(u=><option key={u.v} value={u.v}>{u.label}</option>)}
            </select>
          </div>
          <div>
            <label className="text-[11px] text-stone-500">Preço pago por essa unidade (R$)</label>
            <input type="number" step="any" className="kg-input" value={f.precoCompra} onChange={e=>set("precoCompra",e.target.value)} />
          </div>
        </div>

        {f.unidadeCompra==="un" && (
          <div>
            <label className="text-[11px] text-stone-500">Peso de 1 unidade (g)</label>
            <input type="number" step="any" className="kg-input" value={f.pesoUnitario} onChange={e=>set("pesoUnitario",e.target.value)} />
          </div>
        )}

        <div>
          <label className="text-[11px] text-stone-500">Fator de correção — % aproveitável após limpeza/preparo (100 = sem perda)</label>
          <input type="number" step="any" className="kg-input" value={f.fatorCorrecao} onChange={e=>set("fatorCorrecao",e.target.value)} />
        </div>

        <div>
          <label className="text-[11px] text-stone-500">Vínculo nutricional (TACO ou alimento customizado)</label>
          <select className="kg-input" value={f.tacoId||""} onChange={e=>set("tacoId", e.target.value)}>
            <option value="">— sem vínculo (sem cálculo nutricional) —</option>
            {alimentosVinculo.map(a=><option key={a.tipo+a.id} value={a.id}>{a.nome}{a.tipo==="custom"?" (custom)":""}</option>)}
          </select>
        </div>

        <input className="kg-input" placeholder="Fornecedor (opcional)" value={f.fornecedor||""} onChange={e=>set("fornecedor",e.target.value)} />
        <textarea className="kg-input" placeholder="Observações" rows="2" value={f.observacoes||""} onChange={e=>set("observacoes",e.target.value)} />

        <div className="rounded-lg px-3 py-2 text-sm" style={{background:"#f1ede0"}}>
          Custo calculado: <strong>{brl(custoG)}</strong> por grama {f.unidadeCompra==="un" && f.pesoUnitario ? `(${brl(custoG*parseFloat(f.pesoUnitario))} por unidade)` : ""}
        </div>
      </div>
      <div className="flex gap-2 mt-4">
        <button className="kg-btn-gold" onClick={()=>{ if(f.nome.trim()) onSalvar(f); }}>Salvar produto</button>
        <button className="kg-btn-ghost" onClick={onCancelar}>Cancelar</button>
      </div>
    </div>
  );
}

   FICHAS TÉCNICAS
====================================================================== */
function fichaVazia(){
  return {
    nome:"", categoria:CATEGORIAS_FICHA[0], rendimentoPorcoes:"1",
    modoPreparo:"", ingredientes:[]
  };
}

function FichasTecnicas({fichas, produtos, tacoIndex, customIndex, produtosIndex, salvarFicha, excluirFicha}){
  const [editando, setEditando] = useState(null);
  const [busca, setBusca] = useState("");

  const filtradas = useMemo(()=>{
    let out = fichas;
    if (busca.trim()) out = out.filter(f=>f.nome.toLowerCase().includes(busca.toLowerCase()));
    return out.sort((a,b)=>a.nome.localeCompare(b.nome));
  },[fichas, busca]);

  if (editando){
    return <FormFicha ficha={editando} produtos={produtos} tacoIndex={tacoIndex} customIndex={customIndex} produtosIndex={produtosIndex}
      onSalvar={(f)=>{salvarFicha(f); setEditando(null);}} onCancelar={()=>setEditando(null)} />;
  }

  return (
    <div className="fade-in kg-card p-4">
      <div className="flex flex-wrap gap-2 mb-4">
        <input className="kg-input flex-1 min-w-[200px]" placeholder="Buscar ficha técnica..." value={busca} onChange={e=>setBusca(e.target.value)} />
        <button className="kg-btn-gold" onClick={()=>setEditando(fichaVazia())}>+ Nova ficha técnica</button>
      </div>
      <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-3">
        {filtradas.map(f=>{
          const calc = calcularFicha(f, produtosIndex, tacoIndex, customIndex);
          return (
            <div key={f.id} className="kg-card p-4 cursor-pointer hover:shadow-sm" onClick={()=>setEditando(f)}>
              <div className="flex items-start justify-between">
                <div>
                  <div className="text-[11px] uppercase tracking-wide text-stone-400">{f.categoria}</div>
                  <div className="font-semibold serif" style={{color:"var(--navy)"}}>{f.nome}</div>
                </div>
                <button className="text-xs text-red-600" onClick={(e)=>{e.stopPropagation(); if(confirm("Excluir "+f.nome+"?")) excluirFicha(f.id);}}>excluir</button>
              </div>
              <div className="grid grid-cols-3 gap-2 mt-3 text-sm">
                <div><div className="text-[11px] text-stone-500">Custo/porção</div><div className="font-semibold">{brl(calc.custoPorcao)}</div></div>
                <div><div className="text-[11px] text-stone-500">Kcal/porção</div><div className="font-semibold">{fmt(calc.nutriPorcao.energy_kcal,0)}</div></div>
                <div><div className="text-[11px] text-stone-500">Porções</div><div className="font-semibold">{f.rendimentoPorcoes}</div></div>
              </div>
            </div>
          );
        })}
        {filtradas.length===0 && <div className="text-stone-400 text-sm py-8 col-span-3 text-center">Nenhuma ficha técnica cadastrada ainda.</div>}
      </div>
    </div>
  );
}

function FormFicha({ficha, produtos, tacoIndex, customIndex, produtosIndex, onSalvar, onCancelar}){
  const [f, setF] = useState(ficha);
  useEffect(()=>setF(ficha),[ficha]);
  const set = (k,v)=>setF(prev=>({...prev,[k]:v}));

  const produtosOrdenados = useMemo(()=>[...produtos].sort((a,b)=>a.nome.localeCompare(b.nome)),[produtos]);

  const addIngrediente = ()=> set("ingredientes", [...(f.ingredientes||[]), {id:uid(), produtoId:"", quantidade:"", unidade:"g"}]);
  const updIngrediente = (id, patch)=> set("ingredientes", f.ingredientes.map(i=>i.id===id?{...i,...patch}:i));
  const rmIngrediente = (id)=> set("ingredientes", f.ingredientes.filter(i=>i.id!==id));

  const calc = useMemo(()=>calcularFicha(f, produtosIndex, tacoIndex, customIndex),[f, produtosIndex, tacoIndex, customIndex]);

  return (
    <div className="fade-in grid lg:grid-cols-5 gap-5">
      <div className="lg:col-span-3 kg-card p-5">
        <div className="font-semibold mb-3">{f.id ? "Editar ficha técnica" : "Nova ficha técnica"}</div>
        <div className="grid grid-cols-2 gap-2 mb-2">
          <input className="kg-input col-span-2" placeholder="Nome da preparação" value={f.nome} onChange={e=>set("nome",e.target.value)} />
          <select className="kg-input" value={f.categoria} onChange={e=>set("categoria",e.target.value)}>
            {CATEGORIAS_FICHA.map(c=><option key={c}>{c}</option>)}
          </select>
          <input type="number" step="any" className="kg-input" placeholder="Rendimento (nº de porções)" value={f.rendimentoPorcoes} onChange={e=>set("rendimentoPorcoes",e.target.value)} />
        </div>
        <textarea className="kg-input mb-3" placeholder="Modo de preparo" rows="3" value={f.modoPreparo||""} onChange={e=>set("modoPreparo",e.target.value)} />

        <div className="flex items-center justify-between mb-2">
          <div className="text-xs font-semibold text-stone-500">INGREDIENTES</div>
          <button className="kg-btn-ghost" onClick={addIngrediente}>+ ingrediente</button>
        </div>
        <div className="space-y-2 max-h-[40vh] overflow-y-auto pr-1">
          {(f.ingredientes||[]).map(ing=>{
            const produtoSel = produtosIndex[ing.produtoId];
            const g = paraGramas(ing.quantidade, ing.unidade, produtoSel);
            const custoIng = produtoSel ? custoPorGrama(produtoSel)*g : 0;
            return (
              <div key={ing.id} className="flex flex-wrap gap-1.5 items-center bg-stone-50 rounded-lg p-2">
                <select className="kg-input flex-1 min-w-[140px]" value={ing.produtoId} onChange={e=>updIngrediente(ing.id,{produtoId:e.target.value})}>
                  <option value="">Selecione o produto...</option>
                  {produtosOrdenados.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}
                </select>
                <input type="number" step="any" className="kg-input w-20" placeholder="qtd" value={ing.quantidade} onChange={e=>updIngrediente(ing.id,{quantidade:e.target.value})} />
                <select className="kg-input w-24" value={ing.unidade} onChange={e=>updIngrediente(ing.id,{unidade:e.target.value})}>
                  <option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="L">L</option><option value="un">un</option>
                </select>
                <span className="text-xs text-stone-500 w-20 text-right">{brl(custoIng)}</span>
                <button className="text-xs text-red-600 px-1" onClick={()=>rmIngrediente(ing.id)}>×</button>
              </div>
            );
          })}
          {(f.ingredientes||[]).length===0 && <div className="text-xs text-stone-400 py-3">Nenhum ingrediente adicionado.</div>}
        </div>

        <div className="flex gap-2 mt-4">
          <button className="kg-btn-gold" onClick={()=>{ if(f.nome.trim()) onSalvar(f); }}>Salvar ficha técnica</button>
          <button className="kg-btn-ghost" onClick={onCancelar}>Cancelar</button>

      <div className="lg:col-span-2 space-y-4">
        <div className="kg-card p-5" style={{background:"var(--navy)"}}>
          <div className="text-white/60 text-xs uppercase tracking-wide mb-1">Custo total da ficha</div>
          <div className="serif text-3xl text-white mb-3">{brl(calc.custoTotal)}</div>
          <div className="grid grid-cols-2 gap-2 text-sm">
            <div className="bg-white/10 rounded-lg px-3 py-2">
              <div className="text-white/50 text-[11px]">Custo por porção</div>
              <div className="text-white font-semibold">{brl(calc.custoPorcao)}</div>
            </div>
            <div className="bg-white/10 rounded-lg px-3 py-2">
              <div className="text-white/50 text-[11px]">Peso por porção</div>
              <div className="text-white font-semibold">{fmt(calc.pesoPorcaoG,0)} g</div>
            </div>
          </div>
        </div>

        <div className="kg-card p-5">
          <div className="text-xs font-semibold text-stone-500 mb-2">MACRONUTRIENTES POR PORÇÃO</div>
          <div className="grid grid-cols-2 gap-2 mb-4">
            {NUTRIENTES_MACRO.map(n=>(
              <div key={n.k} className="bg-stone-50 rounded-lg px-3 py-2">
                <div className="text-[11px] text-stone-500">{n.label}</div>
                <div className="font-semibold">{fmt(calc.nutriPorcao[n.k], n.dec)} {n.unit}</div>
              </div>
            ))}
          </div>
          <div className="text-xs font-semibold text-stone-500 mb-2">MICRONUTRIENTES POR PORÇÃO</div>
          <div className="grid grid-cols-2 gap-2">
            {NUTRIENTES_MICRO.map(n=>(
              <div key={n.k} className="bg-stone-50 rounded-lg px-3 py-2">
                <div className="text-[11px] text-stone-500">{n.label}</div>
                <div className="font-semibold">{fmt(calc.nutriPorcao[n.k], n.dec)} {n.unit}</div>
              </div>
            ))}
          </div>
          <div className="text-[11px] text-stone-400 mt-3">Ingredientes sem vínculo TACO/customizado não entram no cálculo nutricional (só no custo).</div>
        </div>
      </div>
    </div>
  );
}

function Cardapios({cardapios, tacoData, customFoods, tacoIndex, customIndex, loadingTaco, salvarCardapio, excluirCardapio, perfil}){
  const [editando, setEditando] = useState(null);
  const [busca, setBusca] = useState("");

  const meusModelos = useMemo(()=>cardapios.filter(c=>c.isModelo), [cardapios]);
  const meusCardapios = useMemo(()=>{
    let out = cardapios.filter(c=>!c.isModelo);
    if (busca.trim()) out = out.filter(c=>c.nome.toLowerCase().includes(busca.toLowerCase()));
    return out.sort((a,b)=>a.nome.localeCompare(b.nome));
  }, [cardapios, busca]);

  if (loadingTaco){
    return <div className="kg-card p-8 text-center text-sm text-stone-500">Carregando base de alimentos...</div>;
  }

  if (editando){
    return <FormCardapio cardapio={editando} tacoData={tacoData} customFoods={customFoods} tacoIndex={tacoIndex} customIndex={customIndex} perfil={perfil}
      onSalvar={(c)=>{salvarCardapio(c); setEditando(null);}} onCancelar={()=>setEditando(null)} />;
  }

  return (
    <div className="fade-in space-y-5">
      <div className="kg-card p-4">
        <div className="font-semibold mb-3">Modelos prontos — use como ponto de partida</div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-2">
          {MODELOS_CARDAPIO_PADRAO.map((m,i)=>(
            <div key={i} className="border rounded-lg p-3 cursor-pointer hover:shadow-sm" style={{borderColor:"var(--line)"}}
              onClick={()=>setEditando(cardapioDeModelo(m))}>
              <div className="font-semibold text-sm">{m.nome}</div>
              <div className="text-[11px] text-stone-500 mt-1">CHO {m.macroPct.cho}% · PTN {m.macroPct.ptn}% · LIP {m.macroPct.lip}%</div>
            </div>
          ))}
          {meusModelos.map(m=>(
            <div key={m.id} className="border rounded-lg p-3 cursor-pointer hover:shadow-sm relative" style={{borderColor:"var(--gold)"}}
              onClick={()=>setEditando(cardapioDeModelo({...m, refeicoes:m.refeicoes}))}>
              <div className="font-semibold text-sm">{m.nome} <span className="kg-badge" style={{background:"#eee6d8",color:"var(--navy)"}}>seu modelo</span></div>
              <div className="text-[11px] text-stone-500 mt-1">{m.kcalAlvo} kcal · CHO {m.macroPct.cho}% · PTN {m.macroPct.ptn}% · LIP {m.macroPct.lip}%</div>
              <button className="absolute top-1 right-1 text-xs text-red-600 px-1" onClick={(e)=>{e.stopPropagation(); if(confirm("Excluir modelo "+m.nome+"?")) excluirCardapio(m.id);}}>×</button>
            </div>
          ))}
        </div>
      </div>

      <div className="kg-card p-4">
        <div className="flex flex-wrap gap-2 mb-4">
          <input className="kg-input flex-1 min-w-[200px]" placeholder="Buscar cardápio..." value={busca} onChange={e=>setBusca(e.target.value)} />
          <button className="kg-btn-gold" onClick={()=>setEditando(cardapioVazio())}>+ Novo cardápio em branco</button>
        </div>
        <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-3">
          {meusCardapios.map(c=>{
            const calc = calcularCardapio(c, tacoIndex, customIndex);
            return (
              <div key={c.id} className="kg-card p-4 cursor-pointer hover:shadow-sm" onClick={()=>setEditando(c)}>
                <div className="flex items-start justify-between">
                  <div className="font-semibold serif" style={{color:"var(--navy)"}}>{c.nome || "Sem nome"}</div>
                  <button className="text-xs text-red-600" onClick={(e)=>{e.stopPropagation(); if(confirm("Excluir "+c.nome+"?")) excluirCardapio(c.id);}}>excluir</button>
                </div>
                <div className="grid grid-cols-3 gap-2 mt-3 text-sm">
                  <div><div className="text-[11px] text-stone-500">Alvo</div><div className="font-semibold">{c.kcalAlvo} kcal</div></div>
                  <div><div className="text-[11px] text-stone-500">Calculado</div><div className="font-semibold">{fmt(calc.nutri.energy_kcal,0)} kcal</div></div>
                  <div><div className="text-[11px] text-stone-500">Refeições</div><div className="font-semibold">{(c.refeicoes||[]).length}</div></div>
                </div>
              </div>
            );
          })}
          {meusCardapios.length===0 && <div className="text-stone-400 text-sm py-8 col-span-3 text-center">Nenhum cardápio criado ainda. Comece por um modelo pronto acima ou crie um em branco.</div>}
        </div>
      </div>
    </div>
  );
}

function SeletorAlimento({tacoData, customFoods, onEscolher, onFechar}){
  const [busca, setBusca] = useState("");
  const resultados = useMemo(()=>{
    if (!busca.trim()) return [];
    const b = busca.toLowerCase();
    const todos = [...tacoData.map(t=>({...t,tipo:"taco"})), ...customFoods.map(c=>({...c,tipo:"custom"}))];
    return todos.filter(a=>a.nome.toLowerCase().includes(b)).slice(0,30);
  },[busca, tacoData, customFoods]);

  return (
    <div className="bg-stone-50 border rounded-lg p-3 mb-2" style={{borderColor:"var(--gold)"}}>
      <div className="flex gap-2 mb-2">
        <input autoFocus className="kg-input" placeholder="Buscar alimento para adicionar..." value={busca} onChange={e=>setBusca(e.target.value)} />
        <button className="kg-btn-ghost" onClick={onFechar}>fechar</button>
      </div>
      {resultados.length>0 && (
        <div className="max-h-48 overflow-y-auto space-y-1">
          {resultados.map(a=>(
            <div key={a.tipo+a.id} className="flex items-center justify-between text-sm px-2 py-1.5 rounded hover:bg-white cursor-pointer"
              onClick={()=>onEscolher(a)}>
              <span>{a.nome}</span>
              <span className="text-stone-400 text-xs">{fmt(a.energy_kcal,0)} kcal/100g</span>
            </div>
          ))}
        </div>
      )}
      {busca.trim() && resultados.length===0 && <div className="text-xs text-stone-400 py-2">Nenhum alimento encontrado.</div>}
    </div>
  );
}

function ItemRefeicao({item, tacoIndex, customIndex, tacoData, customFoods, onAtualizar, onRemover}){
  const [trocando, setTrocando] = useState(false);
  const alimento = alimentoDoItem(item, tacoIndex, customIndex);
  const npg = nutrientesPorGramaAlimento(alimento);
  const g = parseFloat(item.quantidade)||0;
  const kcal = npg?.energy_kcal!=null ? npg.energy_kcal*g : null;

  const trocas = useMemo(()=> trocando ? sugerirTrocas(item, tacoData, customFoods, tacoIndex, customIndex) : [], [trocando]);

  return (
    <div className="bg-stone-50 rounded-lg p-2">
      <div className="flex flex-wrap items-center gap-2">
        <span className="flex-1 text-sm font-medium">{alimento?.nome || "(alimento não encontrado)"}</span>
        {item.grupo && <span className="kg-badge" style={{background:grupoInfo(item.grupo)?.cor+"22", color:grupoInfo(item.grupo)?.cor}}>{grupoInfo(item.grupo)?.label}</span>}
        <input type="number" step="any" className="kg-input w-20" value={item.quantidade} onChange={e=>onAtualizar({...item, quantidade:e.target.value})} />
        <span className="text-xs text-stone-500 w-10">g</span>
        <span className="text-xs text-stone-600 w-16 text-right">{fmt(kcal,0)} kcal</span>
        <button className="text-xs" style={{color:"var(--gold)"}} onClick={()=>setTrocando(v=>!v)}>🔄 trocar</button>
        <button className="text-xs text-red-600 px-1" onClick={onRemover}>×</button>
      </div>
      {trocando && (
        <div className="mt-2 pl-2 border-l-2" style={{borderColor:"var(--gold)"}}>
          <div className="text-[11px] text-stone-500 mb-1">Sugestões de troca (mesma carga calórica aproximada):</div>
          <div className="space-y-1">
            {trocas.map(t=>(
              <div key={t.tipo+t.itemId} className="flex items-center justify-between text-xs px-2 py-1 rounded hover:bg-white cursor-pointer"
                onClick={()=>{ onAtualizar({...item, tipo:t.tipo, itemId:t.itemId, quantidade:t.quantidadeSugerida}); setTrocando(false); }}>
                <span>{t.nome}</span>
                <span className="text-stone-400">{t.quantidadeSugerida}g · {fmt(t.energy_kcal,0)} kcal/100g</span>
              </div>
            ))}
            {trocas.length===0 && <div className="text-stone-400 text-xs py-1">Nenhuma sugestão encontrada.</div>}
          </div>
        </div>
      )}
    </div>
  );
}

function ComposicaoRefeicao({refeicao, onAtualizar}){
  const [grupoNovo, setGrupoNovo] = useState(GRUPOS_ALIMENTARES[0].id);
  const [pctNovo, setPctNovo] = useState("30");
  const composicao = refeicao.composicao||[];
  const somaPct = composicao.reduce((s,c)=>s+(parseFloat(c.pct)||0),0);

  const addGrupo = ()=>{
    onAtualizar([...composicao, {grupo:grupoNovo, pct:parseFloat(pctNovo)||0}]);
  };
  const rmGrupo = (i)=> onAtualizar(composicao.filter((_,idx)=>idx!==i));
  const updPct = (i,v)=> onAtualizar(composicao.map((c,idx)=>idx===i?{...c,pct:v}:c));

  return (
    <div className="bg-white border rounded-lg p-2" style={{borderColor:"var(--line)"}}>
      <div className="text-[11px] font-semibold text-stone-500 mb-1.5">COMPOSIÇÃO PARA GERAÇÃO AUTOMÁTICA {somaPct!==100 && composicao.length>0 && <span className="text-orange-500">(soma {somaPct}%, ideal 100%)</span>}</div>
      <div className="flex flex-wrap gap-1.5 mb-2">
        {composicao.map((c,i)=>(
          <div key={i} className="flex items-center gap-1 kg-badge" style={{background:grupoInfo(c.grupo)?.cor+"22", color:grupoInfo(c.grupo)?.cor}}>
            {grupoInfo(c.grupo)?.label}
            <input type="number" className="w-10 bg-transparent text-right" style={{border:"none",outline:"none",color:"inherit"}} value={c.pct} onChange={e=>updPct(i,e.target.value)} />%
            <span className="cursor-pointer" onClick={()=>rmGrupo(i)}>×</span>
          </div>
        ))}
      </div>
      <div className="flex gap-1.5">
        <select className="kg-input" value={grupoNovo} onChange={e=>setGrupoNovo(e.target.value)}>
          {GRUPOS_ALIMENTARES.map(g=><option key={g.id} value={g.id}>{g.label}</option>)}
        </select>
        <input type="number" className="kg-input w-16" value={pctNovo} onChange={e=>setPctNovo(e.target.value)} />
        <button className="kg-btn-ghost" onClick={addGrupo}>+ grupo</button>
      </div>
    </div>
  );
}

function RefeicaoCard({refeicao, cardapio, tacoData, customFoods, tacoIndex, customIndex, onAtualizar, onRemover}){
  const [mostrarSeletor, setMostrarSeletor] = useState(false);
  const calc = calcularRefeicao(refeicao, tacoIndex, customIndex);
  const kcalAlvoRefeicao = (parseFloat(cardapio.kcalAlvo)||0) * (parseFloat(refeicao.pct)||0) / 100;

  const set = (patch)=> onAtualizar({...refeicao, ...patch});
  const addItem = (alimento)=> set({itens:[...(refeicao.itens||[]), {id:uid(), tipo:alimento.tipo, itemId:alimento.id, quantidade:100}]});
  const updItem = (id, novo)=> set({itens: refeicao.itens.map(i=>i.id===id?novo:i)});
  const rmItem = (id)=> set({itens: refeicao.itens.filter(i=>i.id!==id)});

  const gerarEsta = ()=>{
    const novosItens = gerarItensRefeicao(refeicao, kcalAlvoRefeicao, tacoData, customFoods);
    set({itens: novosItens});
  };

  return (
    <div className="kg-card p-4">
      <div className="flex flex-wrap items-center gap-2 mb-2">
        <input className="kg-input flex-1 min-w-[140px] font-semibold" value={refeicao.nome} onChange={e=>set({nome:e.target.value})} />
        <input className="kg-input w-24" placeholder="horário" value={refeicao.horario||""} onChange={e=>set({horario:e.target.value})} />
        <div className="flex items-center gap-1">
          <input type="number" className="kg-input w-16" value={refeicao.pct} onChange={e=>set({pct:e.target.value})} />
          <span className="text-xs text-stone-500">% do dia ({fmt(kcalAlvoRefeicao,0)} kcal)</span>
        </div>
        <button className="text-xs text-red-600" onClick={onRemover}>excluir refeição</button>
      </div>

      <ComposicaoRefeicao refeicao={refeicao} onAtualizar={(composicao)=>set({composicao})} />

      <div className="flex items-center justify-between mt-3 mb-2">
        <div className="text-[11px] font-semibold text-stone-500">ALIMENTOS DESTA REFEIÇÃO — {fmt(calc.nutri.energy_kcal,0)} kcal</div>
        <div className="flex gap-2">
          {refeicao.composicao?.length>0 && <button className="kg-btn-ghost" onClick={gerarEsta}>🎲 gerar esta refeição</button>}
          <button className="kg-btn-ghost" onClick={()=>setMostrarSeletor(v=>!v)}>+ alimento</button>
        </div>
      </div>

      {mostrarSeletor && <SeletorAlimento tacoData={tacoData} customFoods={customFoods}
        onEscolher={(a)=>{ addItem(a); setMostrarSeletor(false); }} onFechar={()=>setMostrarSeletor(false)} />}

      <div className="space-y-1.5">
        {(refeicao.itens||[]).map(item=>(
          <ItemRefeicao key={item.id} item={item} tacoIndex={tacoIndex} customIndex={customIndex} tacoData={tacoData} customFoods={customFoods}
            onAtualizar={(novo)=>updItem(item.id, novo)} onRemover={()=>rmItem(item.id)} />
        ))}
        {(refeicao.itens||[]).length===0 && <div className="text-xs text-stone-400 py-2">Nenhum alimento nesta refeição ainda. Adicione manualmente ou defina a composição acima e gere automaticamente.</div>}
      </div>
    </div>
  );
}

function FormCardapio({cardapio, tacoData, customFoods, tacoIndex, customIndex, perfil, onSalvar, onCancelar}){
  const [c, setC] = useState(cardapio);
  useEffect(()=>setC(cardapio),[cardapio]);
  const set = (patch)=> setC(prev=>({...prev, ...patch}));
  const [mostrarLista, setMostrarLista] = useState(false);
  const [imprimindo, setImprimindo] = useState(false);

  const calc = useMemo(()=>calcularCardapio(c, tacoIndex, customIndex), [c, tacoIndex, customIndex]);
  const listaCompras = useMemo(()=>gerarListaCompras(c, tacoIndex, customIndex), [c, tacoIndex, customIndex]);
  const somaPctRefeicoes = (c.refeicoes||[]).reduce((s,r)=>s+(parseFloat(r.pct)||0),0);

  const addRefeicao = ()=> set({refeicoes:[...(c.refeicoes||[]), {id:uid(), nome:"Nova refeição", pct:0, horario:"", composicao:[], itens:[]}]});
  const updRefeicao = (id, nova)=> set({refeicoes: c.refeicoes.map(r=>r.id===id?nova:r)});
  const rmRefeicao = (id)=> set({refeicoes: c.refeicoes.filter(r=>r.id!==id)});

  const gerarTudo = ()=> set(gerarCardapioCompleto(c, tacoData, customFoods));

  const exportarPdf = ()=>{
    setImprimindo(true);
    setTimeout(()=>{ window.print(); }, 150);
  };
  useEffect(()=>{
    const onAfterPrint = ()=> setImprimindo(false);
    window.addEventListener('afterprint', onAfterPrint);
    return ()=> window.removeEventListener('afterprint', onAfterPrint);
  },[]);

  const kcalAlvoNum = parseFloat(c.kcalAlvo)||0;
  const somaMacroPct = (parseFloat(c.macroPct?.cho)||0)+(parseFloat(c.macroPct?.ptn)||0)+(parseFloat(c.macroPct?.lip)||0);
  const metaG = {
    cho: kcalAlvoNum*(parseFloat(c.macroPct?.cho)||0)/100/4,
    ptn: kcalAlvoNum*(parseFloat(c.macroPct?.ptn)||0)/100/4,
    lip: kcalAlvoNum*(parseFloat(c.macroPct?.lip)||0)/100/9,
  };

  return (
    <div className="fade-in grid lg:grid-cols-5 gap-5">
      {imprimindo && <PrintCardapio cardapio={c} calc={calc} listaCompras={listaCompras} metaG={metaG} kcalAlvoNum={kcalAlvoNum} perfil={perfil} tacoIndex={tacoIndex} customIndex={customIndex} />}
      <div className="lg:col-span-3 space-y-3 no-print">
        <div className="kg-card p-4">
          <div className="font-semibold mb-3">{c.id ? "Editar cardápio" : "Novo cardápio"}</div>
          <div className="grid sm:grid-cols-2 gap-2 mb-2">
            <input className="kg-input" placeholder="Nome do cardápio / cliente" value={c.nome} onChange={e=>set({nome:e.target.value})} />
            <input type="number" className="kg-input" placeholder="Kcal alvo diário" value={c.kcalAlvo} onChange={e=>set({kcalAlvo:e.target.value})} />
          </div>
          <div className="text-[11px] font-semibold text-stone-500 mb-1">DISTRIBUIÇÃO DE MACROS (% do total de kcal) {somaMacroPct!==100 && <span className="text-orange-500">— soma {somaMacroPct}%, ideal 100%</span>}</div>
          <div className="grid grid-cols-3 gap-2">
            <div><label className="text-[11px] text-stone-500">Carboidrato %</label><input type="number" className="kg-input" value={c.macroPct?.cho} onChange={e=>set({macroPct:{...c.macroPct, cho:e.target.value}})} /></div>
            <div><label className="text-[11px] text-stone-500">Proteína %</label><input type="number" className="kg-input" value={c.macroPct?.ptn} onChange={e=>set({macroPct:{...c.macroPct, ptn:e.target.value}})} /></div>
            <div><label className="text-[11px] text-stone-500">Lipídeo %</label><input type="number" className="kg-input" value={c.macroPct?.lip} onChange={e=>set({macroPct:{...c.macroPct, lip:e.target.value}})} /></div>
          </div>
        </div>

        <div className="flex flex-wrap items-center justify-between gap-2">
          <div className="text-sm font-semibold">Refeições {somaPctRefeicoes!==100 && <span className="text-orange-500 text-xs font-normal">(soma {somaPctRefeicoes}% do dia, ideal 100%)</span>}</div>
          <div className="flex gap-2 flex-wrap">
            <button className="kg-btn-gold" onClick={gerarTudo}>⚡ Gerar cardápio completo</button>
            <button className="kg-btn-ghost" onClick={addRefeicao}>+ refeição</button>
          </div>
        </div>

        <div className="space-y-3">
          {(c.refeicoes||[]).map(r=>(
            <RefeicaoCard key={r.id} refeicao={r} cardapio={c} tacoData={tacoData} customFoods={customFoods} tacoIndex={tacoIndex} customIndex={customIndex}
              onAtualizar={(nova)=>updRefeicao(r.id, nova)} onRemover={()=>rmRefeicao(r.id)} />
          ))}
        </div>

        <div className="flex gap-2 flex-wrap">
          <button className="kg-btn-gold" onClick={()=>{ if(c.nome.trim()) onSalvar({...c, isModelo:false}); }}>Salvar cardápio</button>
          <button className="kg-btn-ghost" onClick={()=>{ if(c.nome.trim()) onSalvar({...c, isModelo:true}); }}>Salvar como modelo reutilizável</button>
          <button className="kg-btn-ghost" onClick={()=>setMostrarLista(v=>!v)}>🛒 Lista de compras</button>
          <button className="kg-btn-ghost" onClick={exportarPdf}>📄 Exportar PDF</button>
          <button className="kg-btn-ghost" onClick={onCancelar}>Cancelar</button>
        </div>

        {mostrarLista && <ListaComprasPanel listaCompras={listaCompras} />}
      </div>

      <div className="lg:col-span-2 space-y-4 sticky top-4 self-start no-print">
        <div className="kg-card p-5" style={{background:"var(--navy)"}}>
          <div className="text-white/60 text-xs uppercase tracking-wide mb-1">Total calculado do dia</div>
          <div className="serif text-3xl text-white mb-1">{fmt(calc.nutri.energy_kcal,0)} kcal</div>
          <div className="text-white/50 text-xs mb-3">alvo: {fmt(kcalAlvoNum,0)} kcal {kcalAlvoNum>0 && <span style={{color: Math.abs((calc.nutri.energy_kcal||0)-kcalAlvoNum) <= kcalAlvoNum*0.05 ? "#8fd19e" : "#e0a45c"}}>({calc.nutri.energy_kcal>kcalAlvoNum?"+":""}{fmt((calc.nutri.energy_kcal||0)-kcalAlvoNum,0)} kcal)</span>}</div>
          <div className="grid grid-cols-3 gap-2 text-sm">
            <div className="bg-white/10 rounded-lg px-2 py-2 text-center">
              <div className="text-white/50 text-[10px]">CHO</div>
              <div className="text-white font-semibold">{fmt(calc.nutri.carbohydrate_g,0)}g</div>
              <div className="text-white/40 text-[10px]">meta {fmt(metaG.cho,0)}g</div>
            </div>
            <div className="bg-white/10 rounded-lg px-2 py-2 text-center">
              <div className="text-white/50 text-[10px]">PTN</div>
              <div className="text-white font-semibold">{fmt(calc.nutri.protein_g,0)}g</div>
              <div className="text-white/40 text-[10px]">meta {fmt(metaG.ptn,0)}g</div>
            </div>
            <div className="bg-white/10 rounded-lg px-2 py-2 text-center">
              <div className="text-white/50 text-[10px]">LIP</div>
              <div className="text-white font-semibold">{fmt(calc.nutri.lipid_g,0)}g</div>
              <div className="text-white/40 text-[10px]">meta {fmt(metaG.lip,0)}g</div>
            </div>
          </div>
        </div>

        <div className="kg-card p-5">
          <div className="text-xs font-semibold text-stone-500 mb-2">POR REFEIÇÃO</div>
          <div className="space-y-1.5 mb-4">
            {calc.porRefeicao.map(pr=>(
              <div key={pr.refeicao.id} className="flex items-center justify-between text-sm border-b border-stone-100 pb-1.5">
                <span>{pr.refeicao.nome}</span>
                <span className="text-stone-500">{fmt(pr.nutri.energy_kcal,0)} kcal</span>
              </div>
            ))}
          </div>
          <div className="text-xs font-semibold text-stone-500 mb-2">MICRONUTRIENTES DO DIA</div>
          <div className="grid grid-cols-2 gap-2">
            {NUTRIENTES_MICRO.map(n=>(
              <div key={n.k} className="bg-stone-50 rounded-lg px-3 py-2">
                <div className="text-[11px] text-stone-500">{n.label}</div>
                <div className="font-semibold">{fmt(calc.nutri[n.k], n.dec)} {n.unit}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function ListaComprasPanel({listaCompras}){
  return (
    <div className="kg-card p-4 fade-in">
      <div className="font-semibold mb-3">🛒 Lista de compras deste cardápio</div>
      {listaCompras.length===0 ? (
        <div className="text-sm text-stone-400">Adicione alimentos às refeições para ver a lista de compras.</div>
      ) : (
        <div className="grid sm:grid-cols-2 gap-4">
          {listaCompras.map(grupo=>(
            <div key={grupo.categoria}>
              <div className="text-[11px] font-semibold text-stone-500 uppercase mb-1">{grupo.categoria}</div>
              <div className="space-y-1">
                {grupo.itens.map((it,i)=>(
                  <div key={i} className="flex items-center justify-between text-sm border-b border-stone-100 pb-1">
                    <span>{it.nome}</span>
                    <span className="font-semibold text-stone-600">{it.display}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// versão de impressão do cardápio — só isso fica visível quando window.print() é chamado
function PrintCardapio({cardapio, calc, listaCompras, metaG, kcalAlvoNum, perfil, tacoIndex, customIndex}){
  return (
    <div id="print-area">
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", borderBottom:"2px solid #0A1F35", paddingBottom:"10px", marginBottom:"16px"}}>
        <div>
          <div style={{fontFamily:"Fraunces, serif", fontSize:"20px", color:"#0A1F35"}}>MeuNutri</div>
          <div style={{fontSize:"11px", color:"#666"}}>Plano alimentar</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontWeight:700}}>{perfil?.nome}</div>
          <div style={{fontSize:"11px", color:"#666"}}>CRN {perfil?.crn}</div>
        </div>
      </div>

      <div style={{fontSize:"18px", fontWeight:700, marginBottom:"2px"}}>{cardapio.nome || "Cardápio"}</div>
      <div style={{fontSize:"11px", color:"#666", marginBottom:"14px"}}>Emitido em {new Date().toLocaleDateString("pt-BR")} · Alvo: {fmt(kcalAlvoNum,0)} kcal/dia · Calculado: {fmt(calc.nutri.energy_kcal,0)} kcal/dia</div>

      <div style={{display:"flex", gap:"8px", marginBottom:"18px"}}>
        <div style={{flex:1, background:"#f1ede0", borderRadius:"8px", padding:"8px", textAlign:"center"}}>
          <div style={{fontSize:"10px", color:"#666"}}>CARBOIDRATO</div>
          <div style={{fontWeight:700}}>{fmt(calc.nutri.carbohydrate_g,0)}g</div>
        </div>
        <div style={{flex:1, background:"#f1ede0", borderRadius:"8px", padding:"8px", textAlign:"center"}}>
          <div style={{fontSize:"10px", color:"#666"}}>PROTEÍNA</div>
          <div style={{fontWeight:700}}>{fmt(calc.nutri.protein_g,0)}g</div>
        </div>
        <div style={{flex:1, background:"#f1ede0", borderRadius:"8px", padding:"8px", textAlign:"center"}}>
          <div style={{fontSize:"10px", color:"#666"}}>LIPÍDEO</div>
          <div style={{fontWeight:700}}>{fmt(calc.nutri.lipid_g,0)}g</div>
        </div>
      </div>

      {calc.porRefeicao.map(pr=>(
        <div key={pr.refeicao.id} style={{marginBottom:"14px", breakInside:"avoid"}}>
          <div style={{display:"flex", justifyContent:"space-between", borderBottom:"1px solid #ccc", paddingBottom:"3px", marginBottom:"5px"}}>
            <div style={{fontWeight:700}}>{pr.refeicao.nome} {pr.refeicao.horario && <span style={{fontWeight:400, color:"#666"}}>· {pr.refeicao.horario}</span>}</div>
            <div style={{color:"#666"}}>{fmt(pr.nutri.energy_kcal,0)} kcal</div>
          </div>
          <PrintItensRefeicao refeicao={pr.refeicao} tacoIndex={tacoIndex} customIndex={customIndex} />
        </div>
      ))}

      {listaCompras.length>0 && (
        <div style={{marginTop:"20px", breakInside:"avoid"}}>
          <div style={{fontSize:"14px", fontWeight:700, borderBottom:"2px solid #0A1F35", paddingBottom:"4px", marginBottom:"8px"}}>Lista de compras</div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px"}}>
            {listaCompras.map(grupo=>(
              <div key={grupo.categoria}>
                <div style={{fontSize:"10px", fontWeight:700, color:"#666", textTransform:"uppercase"}}>{grupo.categoria}</div>
                {grupo.itens.map((it,i)=>(
                  <div key={i} style={{display:"flex", justifyContent:"space-between", fontSize:"12px", borderBottom:"1px solid #eee", padding:"2px 0"}}>
                    <span>{it.nome}</span><span style={{fontWeight:700}}>{it.display}</span>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function PrintItensRefeicao({refeicao, tacoIndex, customIndex}){
  return (
    <>
      {(refeicao.itens||[]).map(item=>{
        const alimento = alimentoDoItem(item, tacoIndex, customIndex);
        const npg = nutrientesPorGramaAlimento(alimento);
        const g = parseFloat(item.quantidade)||0;
        const kcal = npg?.energy_kcal!=null ? npg.energy_kcal*g : null;
        return (
          <div key={item.id} style={{display:"flex", justifyContent:"space-between", fontSize:"12px", padding:"1px 0"}}>
            <span>• {alimento?.nome || "Alimento"} — {fmt(g,0)}g</span>
            <span style={{color:"#666"}}>{fmt(kcal,0)} kcal</span>
          </div>
        );
      })}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
