<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CT Integrado — Meia Noite EC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --navy: #0A1F35;
  --navy-2: #0F2A47;
  --navy-3: #16385B;
  --gold: #B8976A;
  --gold-soft: #D8C4A4;
  --paper: #F5F2EC;
  --ink: #1B1F24;
  --muted: #7C8794;
  --line: rgba(255,255,255,0.10);
  --line-soft: rgba(10,31,53,0.10);
  --verde: #4C8B63;
  --verde-bg: rgba(76,139,99,0.14);
  --amarelo: #B5883A;
  --amarelo-bg: rgba(181,136,58,0.14);
  --vermelho: #A6473C;
  --vermelho-bg: rgba(166,71,60,0.14);
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(10,31,53,0.06), 0 1px 1px rgba(10,31,53,0.04);
  --shadow-md: 0 4px 16px rgba(10,31,53,0.08), 0 1px 3px rgba(10,31,53,0.06);
  --shadow-lift: 0 10px 28px rgba(10,31,53,0.14);
  --bg-app: #F7F6F3;
  --sidebar-w: 236px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Barlow', system-ui, sans-serif;
  background: var(--bg-app);
  color: var(--ink);
  -webkit-font-smoothing:antialiased;
}
#root{min-height:100vh;}
h1,h2,h3,h4{font-family:'Barlow Condensed','Barlow',sans-serif; margin:0; letter-spacing:0.01em;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

/* ---------- Shell do app (sidebar fixa + conteúdo) ---------- */
.app-shell{display:flex; min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); flex-shrink:0; position:sticky; top:0; height:100vh; overflow-y:auto;
  background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
  display:flex; flex-direction:column; padding:20px 14px; z-index:40;
}
.sidebar-brand{display:flex; align-items:center; gap:11px; padding:6px 8px 24px;}
.crest-badge{
  width:40px; height:40px; border-radius:50%; background:#fff; object-fit:contain;
  padding:3px; box-shadow:0 2px 8px rgba(0,0,0,0.25); flex-shrink:0;
}
.sidebar-brand-text{display:flex; flex-direction:column; line-height:1.25;}
.sidebar-brand-text .clube{color:#fff; font-weight:800; font-size:14px; letter-spacing:0.01em;}
.sidebar-brand-text .sistema{color:var(--gold-soft); font-size:10.5px; font-weight:500;}
.sidebar-nav{display:flex; flex-direction:column; gap:3px; flex:1;}
.sidebar-tab{
  display:flex; align-items:center; gap:11px; text-align:left;
  padding:10px 12px; border-radius:9px; font-size:13.5px; font-weight:600; border:none;
  color:rgba(255,255,255,0.60); background:transparent; cursor:pointer;
  transition:background .14s ease, color .14s ease, transform .1s ease;
}
.sidebar-tab:hover{color:#fff; background:rgba(255,255,255,0.06);}
.sidebar-tab.active{color:#fff; background:rgba(184,151,106,0.22); box-shadow:inset 2px 0 0 var(--gold);}
.sidebar-tab .dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.65; flex-shrink:0;}
.sidebar-foot{padding-top:14px; margin-top:10px; border-top:1px solid rgba(255,255,255,0.10);}
.admin-badge{
  display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:11px;
  background:rgba(184,151,106,0.14); border:1px solid rgba(184,151,106,0.30);
}
.admin-badge .avatar{
  width:26px; height:26px; border-radius:50%; background:var(--gold); color:var(--navy);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11px; flex-shrink:0;
}
.admin-badge .label{font-size:11.5px; font-weight:700; color:var(--gold-soft); letter-spacing:0.01em; line-height:1.3;}
.main-content{flex:1; min-width:0;}

@media (max-width: 860px){
  .app-shell{flex-direction:column;}
  .sidebar{
    width:100%; height:auto; position:sticky; top:0; flex-direction:row; align-items:center;
    padding:10px 14px; overflow-x:auto; overflow-y:visible;
  }
  .sidebar-brand{padding:4px 10px 4px 2px; flex-shrink:0;}
  .sidebar-nav{flex-direction:row; flex:none;}
  .sidebar-tab{white-space:nowrap; padding:8px 12px;}
  .sidebar-tab.active{box-shadow:inset 0 -2px 0 var(--gold);}
  .sidebar-foot{border-top:none; margin:0 0 0 8px; padding:0; flex-shrink:0;}
  .admin-badge .label{display:none;}
}


/* ---------- Área de conteúdo ---------- */
.page{padding:28px 32px 60px; max-width:1180px; margin:0 auto;}
.page-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; gap:16px;}
.page-head h1{font-size:25px; font-weight:700; color:var(--navy);}
.page-head .crumb{font-size:12.5px; color:var(--muted); margin-top:4px; font-weight:500;}

/* ---------- Cards / KPIs ---------- */
.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px;}
.kpi-card{
  background:#fff; border:1px solid var(--line-soft); border-left:3px solid var(--navy);
  border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-sm);
  transition:box-shadow .16s ease, transform .16s ease;
}
.kpi-card:hover{box-shadow:var(--shadow-md); transform:translateY(-1px);}
.kpi-card.acento-verde{border-left-color:var(--verde);}
.kpi-card.acento-amarelo{border-left-color:var(--amarelo);}
.kpi-card.acento-vermelho{border-left-color:var(--vermelho);}
.kpi-card .label{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:8px;}
.kpi-card .value{font-size:28px; font-weight:700; color:var(--navy); font-family:'Barlow Condensed';}
.kpi-card .value.verde{color:var(--verde);}
.kpi-card .value.amarelo{color:var(--amarelo);}

/* ---------- Skeleton de carregamento ---------- */
@keyframes skeleton-pulse{ 0%{opacity:.55;} 50%{opacity:1;} 100%{opacity:.55;} }
.skeleton-wrap{padding:4px 0;}
.skeleton-block{
  background:linear-gradient(100deg, rgba(10,31,53,0.06) 30%, rgba(10,31,53,0.10) 50%, rgba(10,31,53,0.06) 70%);
  background-size:200% 100%; border-radius:8px; animation:skeleton-pulse 1.4s ease-in-out infinite;
}
.skeleton-kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px;}
.skeleton-kpi{height:74px; border-radius:var(--radius);}
.skeleton-panel{height:220px; border-radius:var(--radius); margin-bottom:20px;}
.skeleton-line{height:14px; border-radius:5px; margin-bottom:10px;}
.kpi-card .value.vermelho{color:var(--vermelho);}

.panel{background:#fff; border:1px solid var(--line-soft); border-radius:var(--radius); margin-bottom:20px; overflow:hidden;}
.panel-head{padding:16px 20px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; justify-content:space-between;}
.panel-head h3{font-size:17px; color:var(--navy); font-weight:700;}
.panel-body{padding:6px 0;}

/* ---------- Semáforo grid ---------- */
.athlete-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; padding:18px 20px;}
.athlete-card{border:1px solid var(--line-soft); border-radius:9px; padding:14px 15px; cursor:pointer; transition:transform .1s ease, box-shadow .1s ease; position:relative;}
.athlete-card:hover{transform:translateY(-1px); box-shadow:0 4px 14px rgba(10,31,53,0.08);}
.athlete-card .sinal{position:absolute; top:14px; right:14px; width:10px; height:10px; border-radius:50%;}
.athlete-card .sinal.verde{background:var(--verde);}
.athlete-card .sinal.amarelo{background:var(--amarelo);}
.athlete-card .sinal.vermelho{background:var(--vermelho);}
.athlete-card .nome{font-weight:700; color:var(--navy); font-size:15.5px; margin-bottom:2px; padding-right:20px;}
.athlete-card .cat{font-size:12px; color:var(--muted); margin-bottom:10px;}
.athlete-card .flags{display:flex; flex-wrap:wrap; gap:5px;}
.flag{font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:100px;}
.flag.psi{background:rgba(139,109,224,0.12); color:#6E56C8;}
.flag.fisio{background:rgba(58,138,161,0.12); color:#2E7A93;}
.flag.social{background:rgba(181,136,58,0.14); color:var(--amarelo);}
.flag.performance{background:rgba(166,71,60,0.12); color:#A6473C;}
.flag.ok{background:var(--verde-bg); color:var(--verde);}

/* ---------- Table ---------- */
table{width:100%; border-collapse:collapse; font-size:14px;}
thead th{text-align:left; font-size:11.5px; color:var(--muted); font-weight:600; padding:10px 20px; border-bottom:1px solid var(--line-soft);}
tbody td{padding:12px 20px; border-bottom:1px solid var(--line-soft); color:var(--ink); vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.clickable{cursor:pointer;}
tbody tr.clickable:hover{background:rgba(10,31,53,0.02);}
.badge{font-size:11px; font-weight:600; padding:3px 9px; border-radius:100px; display:inline-block;}
.badge.verde{background:var(--verde-bg); color:var(--verde);}
.badge.amarelo{background:var(--amarelo-bg); color:var(--amarelo);}
.badge.vermelho{background:var(--vermelho-bg); color:var(--vermelho);}
.badge.neutro{background:rgba(10,31,53,0.06); color:var(--navy);}

/* ---------- Timeline ---------- */
.timeline{padding:22px 24px;}
.tl-item{display:flex; gap:14px; margin-bottom:2px;}
.tl-rail{display:flex; flex-direction:column; align-items:center; width:16px; flex-shrink:0;}
.tl-dot{width:10px; height:10px; border-radius:50%; margin-top:5px; flex-shrink:0;}
.tl-dot.psi{background:#6E56C8;}
.tl-dot.fisio{background:#2E7A93;}
.tl-dot.social{background:var(--amarelo);}
.tl-dot.performance{background:#A6473C;}
.tl-line{flex:1; width:1.5px; background:var(--line-soft); margin-top:2px;}
.tl-body{padding-bottom:22px; flex:1;}
.tl-date{font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:2px;}
.tl-area{font-size:10.5px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase;}
.tl-area.psi{color:#6E56C8;}
.tl-area.fisio{color:#2E7A93;}
.tl-area.social{color:var(--amarelo);}
.tl-area.performance{color:#A6473C;}
.tl-desc{font-size:14px; color:var(--ink); margin-top:3px; line-height:1.45;}

/* ---------- Perfil do atleta ---------- */
.profile-head{display:flex; align-items:center; gap:16px; margin-bottom:22px;}
.profile-avatar{width:56px; height:56px; border-radius:50%; background:var(--navy); color:var(--gold-soft); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; flex-shrink:0;}
.profile-name{font-size:24px; font-weight:700; color:var(--navy);}
.profile-meta{font-size:13px; color:var(--muted); margin-top:2px; font-weight:500;}
.back-link{display:inline-flex; align-items:center; gap:5px; font-size:13px; color:var(--muted); cursor:pointer; margin-bottom:16px; font-weight:600; background:none; border:none; padding:0;}
.back-link:hover{color:var(--navy);}

.access-note{font-size:12.5px; color:var(--muted); background:rgba(10,31,53,0.035); border:1px solid var(--line-soft); border-radius:8px; padding:10px 14px; margin-bottom:18px; display:flex; align-items:flex-start; gap:8px; line-height:1.5;}
.access-note b{color:var(--navy);}
.access-note.admin{background:rgba(184,151,106,0.08); border-color:rgba(184,151,106,0.3);}

/* ---------- Formulário ---------- */
.form-panel{padding:18px 20px 20px; border-top:1px solid var(--line-soft); background:rgba(10,31,53,0.015);}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
.form-grid.full{grid-template-columns:1fr;}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12px; font-weight:600; color:var(--navy);}
.field select, .field input[type=date], .field input[type=text]{padding:9px 11px; border:1px solid var(--line-soft); border-radius:7px; font-size:13.5px; color:var(--ink); background:#fff;}
.field textarea{padding:9px 11px; border:1px solid var(--line-soft); border-radius:7px; font-size:13.5px; color:var(--ink); resize:vertical; min-height:64px; font-family:inherit; background:#fff;}
.field select:focus, .field input:focus, .field textarea:focus{outline:none; border-color:var(--gold);}
.sinal-picker{display:flex; gap:8px;}
.sinal-opt{flex:1; text-align:center; padding:8px 6px; border-radius:7px; border:1.5px solid var(--line-soft); font-size:12.5px; font-weight:600; cursor:pointer; color:var(--muted);}
.sinal-opt.verde.on{border-color:var(--verde); background:var(--verde-bg); color:var(--verde);}
.sinal-opt.amarelo.on{border-color:var(--amarelo); background:var(--amarelo-bg); color:var(--amarelo);}
.sinal-opt.vermelho.on{border-color:var(--vermelho); background:var(--vermelho-bg); color:var(--vermelho);}
.form-actions{display:flex; justify-content:flex-end; gap:10px;}
.save-note{font-size:11.5px; color:var(--muted); margin-top:10px; display:flex; gap:6px; align-items:flex-start;}
.toast{position:fixed; bottom:24px; right:24px; background:var(--navy); color:#fff; padding:12px 18px; border-radius:9px; font-size:13.5px; font-weight:600; box-shadow:0 8px 24px rgba(10,31,53,0.28); z-index:50; display:flex; align-items:center; gap:8px;}
.toast .dot{width:7px; height:7px; border-radius:50%; background:var(--verde);}

/* ---------- Utilidades ---------- */
.muted{color:var(--muted);}
.empty-state{padding:40px 20px; text-align:center; color:var(--muted); font-size:14px;}
.pill-btn{padding:7px 14px; border-radius:8px; border:1px solid var(--line-soft); background:#fff; color:var(--navy); font-size:13px; font-weight:600; cursor:pointer;}
.pill-btn:hover{border-color:var(--gold);}
.pill-btn.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
.pill-btn.primary:hover{background:var(--navy-3);}
.pill-btn:disabled{opacity:.5; cursor:not-allowed;}

@media (max-width: 900px){
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .page{padding:20px 16px;}
  .form-grid{grid-template-columns:1fr;}
}


/* ---------- Chatbot de ajuda ---------- */
.chat-fab{
  position:fixed; bottom:24px; right:24px; width:52px; height:52px; border-radius:50%;
  background:var(--navy); color:var(--gold-soft); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(10,31,53,0.28);
  z-index:60; transition:transform .12s ease;
}
.chat-fab:hover{transform:scale(1.05);}
.chat-panel{
  position:fixed; bottom:88px; right:24px; width:340px; max-width:calc(100vw - 32px);
  height:460px; max-height:calc(100vh - 120px); background:#fff; border-radius:14px;
  box-shadow:0 16px 44px rgba(10,31,53,0.28); border:1px solid var(--line-soft);
  display:flex; flex-direction:column; overflow:hidden; z-index:60;
}
.chat-head{
  background:var(--navy); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0;
}
.chat-head .title{font-size:14px; font-weight:700;}
.chat-head .sub{font-size:11px; color:var(--gold-soft); margin-top:1px;}
.chat-head button{background:none; border:none; color:rgba(255,255,255,0.7); cursor:pointer; font-size:18px; line-height:1; padding:2px 4px;}
.chat-head button:hover{color:#fff;}
.chat-body{flex:1; overflow-y:auto; padding:14px 14px 6px; display:flex; flex-direction:column; gap:10px;}
.chat-msg{max-width:85%; padding:9px 12px; border-radius:11px; font-size:13px; line-height:1.5; white-space:pre-wrap;}
.chat-msg.assistant{background:rgba(10,31,53,0.05); color:var(--ink); align-self:flex-start; border-bottom-left-radius:3px;}
.chat-msg.user{background:var(--navy); color:#fff; align-self:flex-end; border-bottom-right-radius:3px;}
.chat-msg.loading{color:var(--muted); font-style:italic;}
.chat-input-row{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line-soft); flex-shrink:0;}
.chat-input-row input{
  flex:1; padding:9px 11px; border:1px solid var(--line-soft); border-radius:8px; font-size:13px;
  font-family:inherit; color:var(--ink);
}
.chat-input-row input:focus{outline:none; border-color:var(--gold);}
.chat-input-row button{
  background:var(--navy); color:#fff; border:none; border-radius:8px; padding:0 14px; font-size:13px;
  font-weight:600; cursor:pointer; flex-shrink:0;
}
.chat-input-row button:disabled{opacity:.5; cursor:not-allowed;}
@media (max-width: 480px){
  .chat-panel{right:16px; left:16px; width:auto;}
  .chat-fab{right:16px;}
}



/* ---------- Painel comparativo (gráficos) ---------- */
.charts-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:18px 20px;}
.chart-box{border:1px solid var(--line-soft); border-radius:9px; padding:14px 16px; background:#fff;}
.chart-box h4{font-size:13px; color:var(--navy); font-weight:700; margin-bottom:10px;}
.chart-box canvas{max-height:220px;}
@media (max-width: 900px){ .charts-row{grid-template-columns:1fr;} }

/* ---------- Elenco — tema campo de futebol ---------- */
.pitch-panel{
  border-radius:var(--radius); margin-bottom:20px; overflow:hidden;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,0.045) 0px, rgba(255,255,255,0.045) 40px, transparent 40px, transparent 80px),
    radial-gradient(circle at 50% 50%, #1c5c3a 0%, #164a2f 70%),
    linear-gradient(180deg, #1c5c3a, #123f27);
  border:1px solid rgba(255,255,255,0.08);
  position:relative;
}
.pitch-panel .pitch-head{
  padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,0.14);
  background:rgba(10,31,53,0.25);
}
.pitch-panel .pitch-head h3{font-size:17px; color:#fff; font-weight:700;}
.pitch-panel .pitch-head .sub{font-size:11.5px; color:rgba(255,255,255,0.6); margin-top:2px;}
.pitch-markings{
  position:absolute; top:56px; left:50%; transform:translateX(-50%);
  width:120px; height:120px; border:2px solid rgba(255,255,255,0.10); border-radius:50%;
  pointer-events:none;
}
.jersey-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:14px;
  padding:22px 20px; position:relative; z-index:1;
}
.jersey-btn{
  background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.14); border-radius:12px;
  padding:14px 10px 12px; cursor:pointer; text-align:center; transition:transform .12s ease, background .12s ease;
  position:relative; backdrop-filter:blur(2px);
}
.jersey-btn:hover{transform:translateY(-2px); background:rgba(255,255,255,0.11);}
.jersey-badge{
  width:44px; height:44px; margin:0 auto 8px; border-radius:9px;
  background:linear-gradient(160deg, var(--gold) 0%, #967650 100%);
  color:var(--navy); font-weight:800; font-size:15px; letter-spacing:-0.02em;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 8px rgba(0,0,0,0.25);
}
.jersey-nome{font-size:12.5px; font-weight:700; color:#fff; line-height:1.3; margin-bottom:2px;}
.jersey-cat{font-size:10.5px; color:rgba(255,255,255,0.55); margin-bottom:8px;}
.jersey-sinal{
  position:absolute; top:8px; right:8px; width:9px; height:9px; border-radius:50%;
  box-shadow:0 0 0 2px rgba(255,255,255,0.15);
}
.jersey-sinal.verde{background:#5FE0A5;}
.jersey-sinal.amarelo{background:#E0C15F;}
.jersey-sinal.vermelho{background:#E0715F;}
.jersey-stats{display:flex; justify-content:center; gap:6px; flex-wrap:wrap;}
.jersey-stat{
  font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:100px;
  background:rgba(255,255,255,0.10); color:rgba(255,255,255,0.85);
}

/* ---------- Controles de gráfico por instrumento/estatística ---------- */
.chart-controls{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.chart-controls label{font-size:12.5px; font-weight:600; color:var(--navy);}
.chart-controls select{padding:7px 10px; border:1px solid var(--line-soft); border-radius:7px; font-size:13px; color:var(--ink); background:#fff;}
.chart-controls-note{font-size:11.5px; color:var(--muted);}
.chart-box-wide{border:1px solid var(--line-soft); border-radius:9px; padding:16px; background:#fff; height:320px;}

/* ---------- Abas de filtro (substituem <select>) ---------- */
.tab-select{display:flex; flex-wrap:wrap; gap:6px;}
.tab-select-item{
  padding:7px 13px; border-radius:100px; border:1.5px solid var(--line-soft); background:#fff;
  color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer; transition:all .12s ease;
}
.tab-select-item:hover{border-color:var(--gold); color:var(--navy);}
.tab-select-item.active{background:var(--navy); border-color:var(--navy); color:#fff;}
.tab-select-sm .tab-select-item{padding:5px 11px; font-size:11.5px;}

/* ---------- Cruzamento de dados ---------- */
.cruzamento-eixos{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap;}
.eixo-picker{flex:1; min-width:220px; display:flex; flex-direction:column; gap:8px; background:rgba(10,31,53,0.02); border:1px solid var(--line-soft); border-radius:9px; padding:14px;}
.eixo-label{font-size:11px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:0.04em;}
.cruzamento-x{font-size:20px; font-weight:700; color:var(--muted); padding-top:34px; flex-shrink:0;}
@media (max-width: 700px){ .cruzamento-eixos{flex-direction:column;} .cruzamento-x{padding-top:0; text-align:center;} }

/* ---------- Ficha do atleta ---------- */
.ficha-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:16px 20px;}
.ficha-item{background:rgba(10,31,53,0.025); border-radius:8px; padding:10px 12px;}
.ficha-label{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px;}
.ficha-valor{font-size:14px; font-weight:600; color:var(--navy);}
.ficha-clubes{padding:0 20px 18px;}
.clube-lista{display:flex; flex-direction:column; gap:6px;}
.clube-item{display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:rgba(10,31,53,0.025); border-radius:7px; font-size:13px;}
.clube-nome{font-weight:600; color:var(--navy);}
.clube-periodo{color:var(--muted); font-size:12px;}
.clube-row{display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:center;}
.clube-row input{padding:8px 10px; border:1px solid var(--line-soft); border-radius:7px; font-size:12.5px;}
@media (max-width: 900px){ .ficha-grid{grid-template-columns:repeat(2,1fr);} .clube-row{grid-template-columns:1fr;} }
</style>

<script type="text/babel" data-presets="react">
/**
 * CAMADA DE DADOS — Firebase (Firestore) do CT Integrado
 * ---------------------------------------------------------
 * Roda no projeto meurh-23fad, sob coleções prefixadas com "ct_"
 * para não colidir com os dados de RH que já vivem no mesmo projeto.
 *
 * Acesso hoje é aberto (sem autenticação), por decisão do responsável.
 * As Firestore Rules liberando /ct_atletas/** já estão publicadas.
 */

const firebaseConfig = {
  apiKey: "AIzaSyARvBxwWERljcaAaJsqLZdMstSVIi-6j2g",
  authDomain: "meurh-23fad.firebaseapp.com",
  projectId: "meurh-23fad",
  storageBucket: "meurh-23fad.firebasestorage.app",
  messagingSenderId: "241699999089",
  appId: "1:241699999089:web:cc50293405d6c17db73ad0",
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

const COL_ATLETAS = "ct_atletas";
const SUBCOLS = {
  psi: "ct_psi_avaliacoes",
  fisio: "ct_fisio_registros",
  fisiologia: "ct_fisiologia_dados",
  social: "ct_social_acompanhamento",
  performance: "ct_performance_jogos",
};

/** Carrega a lista de atletas (ordenada por nome). */
async function carregarAtletas() {
  const snap = await db.collection(COL_ATLETAS).orderBy("nome").get();
  return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
}

/**
 * Carrega TODOS os registros de uma área (psi/fisio/fisiologia/social/performance),
 * de todos os atletas de uma vez, via collectionGroup — evita N+1 consultas.
 * Retorna um objeto { [atletaId]: [registros ordenados por data desc] }.
 */
async function carregarTodosRegistros(chave) {
  const snap = await db.collectionGroup(SUBCOLS[chave]).get();
  const porAtleta = {};
  snap.docs.forEach((d) => {
    const atletaId = d.ref.parent.parent.id;
    const registro = { id: d.id, ...d.data() };
    if (!porAtleta[atletaId]) porAtleta[atletaId] = [];
    porAtleta[atletaId].push(registro);
  });
  Object.values(porAtleta).forEach((lista) =>
    lista.sort((a, b) => (b.data || "").localeCompare(a.data || ""))
  );
  return porAtleta;
}

/** Carrega as 5 áreas de uma vez (usado no Painel Admin, que precisa de tudo). */
async function carregarTudo() {
  const [atletas, psiData, fisioData, fisiologiaData, socialData, perfData] = await Promise.all([
    carregarAtletas(),
    carregarTodosRegistros("psi"),
    carregarTodosRegistros("fisio"),
    carregarTodosRegistros("fisiologia"),
    carregarTodosRegistros("social"),
    carregarTodosRegistros("performance"),
  ]);
  return { atletas, psiData, fisioData, fisiologiaData, socialData, perfData };
}


/** Grava um novo registro na subcoleção de uma área, para um atleta. */
async function adicionarRegistro(atletaId, chave, dados) {
  return db
    .collection(COL_ATLETAS)
    .doc(atletaId)
    .collection(SUBCOLS[chave])
    .add({ ...dados, criado_em: firebase.firestore.FieldValue.serverTimestamp() });
}

/* ---------- Motor do semáforo (mesmo cálculo de antes) ---------- */
function nivelParaPeso(s) { return s === "vermelho" ? 2 : s === "amarelo" ? 1 : 0; }

function calcularSemaforo(atletaId, dados) {
  const { psiData, fisioData, socialData, perfData } = dados;
  const sinais = [];
  const psi = (psiData[atletaId] || [])[0];
  const fisio = (fisioData[atletaId] || [])[0];
  const social = (socialData[atletaId] || [])[0];
  const perf = (perfData[atletaId] || [])[0];

  let peso = 0;
  if (psi) { peso += nivelParaPeso(psi.sinal); if (psi.sinal !== "verde" && psi.sinal !== "neutro") sinais.push({ area: "psi", label: "Psicologia" }); }
  if (fisio) { peso += nivelParaPeso(fisio.sinal); if (fisio.sinal !== "verde" && fisio.sinal !== "neutro") sinais.push({ area: "fisio", label: "Fisioterapia" }); }
  if (social) { const w = social.statusPublico === "atencao" ? 1 : 0; peso += w; if (w) sinais.push({ area: "social", label: "Serviço social" }); }
  if (perf) { peso += nivelParaPeso(perf.sinal); if (perf.sinal !== "verde" && perf.sinal !== "neutro") sinais.push({ area: "performance", label: "Desempenho" }); }

  const risco = peso >= 3 ? "vermelho" : peso >= 1 ? "amarelo" : "verde";
  return { risco, sinais };
}

function formatarData(iso) {
  if (!iso || typeof iso !== "string" || !iso.includes("-")) return iso || "—";
  const [y, m, d] = iso.split("-");
  return d + "/" + m + "/" + y;
}

function hojeISO() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + mm + "-" + dd;
}

function nomeAtleta(atletas, id) {
  const a = (atletas || []).find((x) => x.id === id);
  return a ? a.nome : "—";
}

Sua função é ajudar o usuário (hoje, só o Administrador/CEO) a entender COMO USAR o sistema — não responder sobre dados clínicos de nenhum atleta específico, já que você não tem acesso a esses dados.

Estrutura do sistema (fase atual: arquivo único, navegação interna pelas abas do topo — Painel Admin, Psicologia, Fisioterapia, Fisiologia, Serviço Social, Desempenho, Treinadores):

1. PAINEL ADMIN — visão geral: semáforo de todos os atletas (verde=regular, amarelo=atenção, vermelho=prioridade), gráficos comparativos entre áreas, cruzamento livre de dados (o usuário escolhe dois eixos pra comparar), lista de atletas com criação/edição/mesclagem de cadastro, e o perfil individual de cada atleta com radar de atributos, ficha (idade, localidade, perna dominante, histórico de clubes) e painéis de todas as áreas.

2. PSICOLOGIA — registros de avaliações psicológicas: escalas, testes cognitivos, relatos de sessão.

3. FISIOTERAPIA — avaliações físicas, lesões, retorno ao jogo e carga de treino.

4. FISIOLOGIA — testes físicos/biométricos: VO2 máximo, velocidade, composição corporal, salto vertical, força/potência. Diferente de Fisioterapia (que é sobre lesão/reabilitação).

5. SERVIÇO SOCIAL — acompanhamento social e familiar. Tem "status público" (Ativo / Em atenção) visível na direção, e um "detalhe do caso" mais completo.

6. DESEMPENHO — estatísticas de jogo. Tem um importador de CSV de análise de jogo, que lê o arquivo no navegador e sobe os dados agregados por jogador automaticamente.

7. TREINADORES — visão só-leitura, mostra apenas o sinal (semáforo) de cada atleta e quais áreas estão em atenção, sem nenhum dado clínico bruto.

Em qualquer braço (Psicologia/Fisioterapia/Fisiologia/Desempenho), pra lançar um novo registro: clica em "+ Novo registro", escolhe o atleta, data, tipo, escreve a observação e marca o sinal.

O SEMÁFORO é calculado automaticamente cruzando o sinal mais recente de cada área — quanto mais sinais amarelo/vermelho, maior o risco mostrado.

O sistema está conectado a um banco de dados real (Firestore) — os registros lançados são salvos de verdade e continuam lá mesmo depois de fechar a página.

Responda sempre em português do Brasil, de forma direta e prática. Se perguntarem algo sobre um atleta específico ou dado clínico, explique que você não tem acesso a esses dados — sua função é só orientar o uso do sistema.`;

function ChatWidget() {
  const { useState, useRef, useEffect } = React;
  const [aberto, setAberto] = useState(false);
  const [mensagens, setMensagens] = useState([
    { role: "assistant", content: "Oi! Posso ajudar a entender como usar o CT Integrado — onde lançar um registro, o que é o semáforo, como navegar entre os hubs. O que você quer saber?" },
  ]);
  const [input, setInput] = useState("");
  const [carregando, setCarregando] = useState(false);
  const bodyRef = useRef(null);

  useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [mensagens, carregando]);

  async function enviar() {
    const texto = input.trim();
    if (!texto || carregando) return;

    const historico = [...mensagens, { role: "user", content: texto }];
    setMensagens(historico);
    setInput("");
    setCarregando(true);

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: SYSTEM_PROMPT_CT,
          messages: historico.map((m) => ({ role: m.role, content: m.content })),
        }),
      });
      const data = await response.json();
      const blocos = data.content || [];
      const respostaTexto = blocos
        .filter((b) => b.type === "text")
        .map((b) => b.text)
        .join("\n")
        .trim();

      setMensagens((prev) => [
        ...prev,
        { role: "assistant", content: respostaTexto || "Não consegui gerar uma resposta agora. Tenta reformular a pergunta." },
      ]);
    } catch (e) {
      setMensagens((prev) => [
        ...prev,
        { role: "assistant", content: "Não consegui conectar com o assistente agora. Tenta de novo em instantes." },
      ]);
    }
    setCarregando(false);
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      enviar();
    }
  }

  return (
    <React.Fragment>
      {aberto && (
        <div className="chat-panel">
          <div className="chat-head">
            <div>
              <div className="title">Assistente do CT Integrado</div>
              <div className="sub">Dúvidas de uso do sistema</div>
            </div>
            <button onClick={() => setAberto(false)} aria-label="Fechar">×</button>
          </div>
          <div className="chat-body" ref={bodyRef}>
            {mensagens.map((m, i) => (
              <div key={i} className={"chat-msg " + m.role}>{m.content}</div>
            ))}
            {carregando && <div className="chat-msg assistant loading">digitando...</div>}
          </div>
          <div className="chat-input-row">
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="Pergunte algo sobre o sistema..."
              disabled={carregando}
            />
            <button onClick={enviar} disabled={carregando || !input.trim()}>Enviar</button>
          </div>
        </div>
      )}
      <button className="chat-fab" onClick={() => setAberto((v) => !v)} aria-label="Abrir assistente">
        {aberto ? "×" : "💬"}
      </button>
    </React.Fragment>
  );
}

/**
 * Extrai os campos "Chave: valor" embutidos no texto de uma observação
 * (nota) — tanto do formato de psicologia ("CSAI-2R — Ans. Cognitiva: 10,
 * Ans. Somática: 7...") quanto do de performance ("PASSE CERTO: 9, FALTA: 2...").
 * Ignora o sufixo "(importado de...)" quando presente.
 */
function parseNota(nota, tipoConhecido) {
  if (!nota) return { titulo: "", campos: {} };
  const semSufixo = nota.replace(/\s*\([^)]*\)\s*$/, "");
  let titulo = "";
  let corpo = semSufixo;

  if (tipoConhecido && semSufixo.indexOf(tipoConhecido + " — ") === 0) {
    // corte exato pelo nome do instrumento já conhecido — funciona mesmo
    // quando o próprio nome do instrumento contém um travessão (ex: "SIQ — IMAGEM MENTAL").
    titulo = tipoConhecido;
    corpo = semSufixo.slice((tipoConhecido + " — ").length);
  } else {
    const idxTraco = semSufixo.indexOf(" — ");
    if (idxTraco !== -1) {
      titulo = semSufixo.slice(0, idxTraco);
      corpo = semSufixo.slice(idxTraco + 3);
    }
  }

  const campos = {};
  corpo.split(",").forEach((par) => {
    const idx = par.indexOf(":");
    if (idx === -1) return;
    const chave = par.slice(0, idx).trim();
    const valorStr = par.slice(idx + 1).trim();
    const valorNum = Number(valorStr);
    campos[chave] = isNaN(valorNum) || valorStr === "" ? valorStr : valorNum;
  });
  return { titulo, campos };
}

const PALETA_SUBESCALAS = ["#6E56C8", "#2E7A93", "#B5883A", "#A6473C", "#4C8B63", "#8a7a4a", "#4a6a8a", "#a84a7a"];

function GraficoComparativo({ titulo, labels, datasets, tipo, empilhado }) {
  const { useRef, useEffect } = React;
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: tipo || "bar",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: datasets.length > 1, labels: { font: { size: 10.5 } } } },
        scales: {
          x: { stacked: !!empilhado, ticks: { font: { size: 10.5 } } },
          y: { stacked: !!empilhado, beginAtZero: true, ticks: { precision: 0, font: { size: 10.5 } } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(labels), JSON.stringify(datasets)]);

  return (
    <div className="chart-box">
      <h4>{titulo}</h4>
      <canvas ref={canvasRef}></canvas>
    </div>
  );
}

/* ---------- Funções auxiliares de extração de dados (usadas nos gráficos e no cruzamento) ---------- */

function instrumentosPsi(dados) {
  return Array.from(new Set(Object.values(dados.psiData).flat().map((r) => r.tipo))).sort();
}

function estatisticasPerformance(dados) {
  return Array.from(new Set(
    Object.values(dados.perfData).flat().flatMap((r) => Object.keys(parseNota(r.nota, r.tipo).campos))
  )).sort();
}

function subcamposDoInstrumento(dados, instrumento) {
  for (const lista of Object.values(dados.psiData)) {
    const reg = lista.find((r) => r.tipo === instrumento);
    if (reg) {
      const campos = parseNota(reg.nota, reg.tipo).campos;
      return Object.keys(campos).filter((k) => typeof campos[k] === "number");
    }
  }
  return [];
}

/** Valor mais recente de um atleta para instrumento+subcampo de psicologia (ou null). */
function valorPsi(dados, atletaId, instrumento, subcampo) {
  const reg = (dados.psiData[atletaId] || []).find((r) => r.tipo === instrumento);
  if (!reg) return null;
  const v = parseNota(reg.nota, reg.tipo).campos[subcampo];
  return typeof v === "number" ? v : null;
}

/** Valor mais recente de um atleta para uma estatística de performance (ou null). */
function valorPerformance(dados, atletaId, estatistica) {
  const regs = dados.perfData[atletaId] || [];
  if (!regs.length) return null;
  const v = parseNota(regs[0].nota).campos[estatistica];
  return typeof v === "number" ? v : null;
}

/**
 * Mapeamento de CONSTRUTOS psicológicos -> quais instrumentos/campos
 * alimentam cada um. Um construto pode ser medido por mais de um
 * instrumento (ex: ansiedade somática aparece no CSAI-2R, no SAS e no
 * HAM-A). Isso é uma categorização clínica — o agrupamento abaixo é
 * uma proposta inicial baseada nos nomes dos campos; vale revisão de
 * quem faz a análise, já que instrumentos diferentes podem usar
 * escalas de pontuação diferentes mesmo medindo "a mesma coisa".
 */
const CONSTRUCTOS_PSI = {
  "Ansiedade Cognitiva": [{ tipo: "CSAI-2R", campo: "Ans. Cognitiva" }],
  "Ansiedade Somática": [
    { tipo: "CSAI-2R", campo: "Ans. Somática" },

    { tipo: "HAM-A", campo: "Ansiedade Somática" },
  ],

  "Ansiedade Total (HAM-A)": [{ tipo: "HAM-A", campo: "Total" }],
  "Autoconfiança": [
    { tipo: "CSAI-2R", campo: "Autoconfiança" },
    { tipo: "ACSI-28", campo: "Confiança" },
  ],
  "Preocupação": [
    { tipo: "SAS", campo: "Preocupação" },
    { tipo: "ACSI-28", campo: "Preocupação" },
  ],
  "Concentração": [
    { tipo: "SAS", campo: "Concentração" },
    { tipo: "ACSI-28", campo: "Concentração" },
  ],
  "Enfrentamento de Adversidade": [
    { tipo: "ACSI-28", campo: "Adversidade" },
    { tipo: "RESILIÊNCIA ESPORTIVA", campo: "Recuperação de Adversidades" },
  ],
  "Persistência e Adaptação": [{ tipo: "RESILIÊNCIA ESPORTIVA", campo: "Persistência e Adaptação" }],
  "Pressão Competitiva": [{ tipo: "ACSI-28", campo: "Pressão" }],
  "Definição de Metas": [{ tipo: "ACSI-28", campo: "Metas" }],
  "Treinabilidade": [{ tipo: "ACSI-28", campo: "Treinabilidade" }],
  "Imagem Mental — Cognitiva": [{ tipo: "SIQ — IMAGEM MENTAL", campo: "Imagem Cognitiva" }],
  "Imagem Mental — Motivacional": [{ tipo: "SIQ — IMAGEM MENTAL", campo: "Imagem Motivacional" }],
  "Controle Emocional": [{ tipo: "SIQ — IMAGEM MENTAL", campo: "Controle Emocional" }],
  "Suporte da Família": [{ tipo: "SUPORTE SOCIAL PERCEBIDO", campo: "Suporte da Família" }],
  "Suporte do Treinador": [{ tipo: "SUPORTE SOCIAL PERCEBIDO", campo: "Suporte do Treinador" }],
  "Suporte dos Colegas": [{ tipo: "SUPORTE SOCIAL PERCEBIDO", campo: "Suporte dos Colegas" }],
  "Tempo de Reação": [

  ],

  ],

  ],
  "Raciocínio Lógico": [{ tipo: "MATRIZES PROGRESSIVAS", campo: "Percentual" }],
  "Função Executiva / Flexibilidade": [

/** Todos os construtos para os quais existe pelo menos 1 registro no banco. */
function construtosDisponiveis(dados) {
  const tiposExistentes = new Set(Object.values(dados.psiData).flat().map((r) => r.tipo));
  return Object.keys(CONSTRUCTOS_PSI).filter((construto) =>
    CONSTRUCTOS_PSI[construto].some((fonte) => tiposExistentes.has(fonte.tipo))
  );
}

/** Fontes (instrumentos) de um construto que realmente têm dado no banco. */
function fontesDoConstruto(dados, construto) {
  const tiposExistentes = new Set(Object.values(dados.psiData).flat().map((r) => r.tipo));
  return (CONSTRUCTOS_PSI[construto] || []).filter((f) => tiposExistentes.has(f.tipo));
}

/** Valor mais recente de um atleta para um construto, entre todas as fontes que ele tiver. */
function valorConstrutoAtleta(dados, atletaId, construto) {
  const fontes = CONSTRUCTOS_PSI[construto] || [];
  let melhor = null;
  fontes.forEach(({ tipo, campo }) => {
    (dados.psiData[atletaId] || []).filter((r) => r.tipo === tipo).forEach((r) => {
      const v = parseNota(r.nota, r.tipo).campos[campo];
      if (typeof v === "number" && (!melhor || r.data > melhor.data)) {
        melhor = { valor: v, data: r.data, instrumento: tipo, campo };
      }
    });
  });
  return melhor;
}

/** Todo o histórico (todas as datas) de um atleta para um construto, agrupado por instrumento. */
function historicoConstrutoAtleta(dados, atletaId, construto) {
  const fontes = CONSTRUCTOS_PSI[construto] || [];
  const porInstrumento = {};
  fontes.forEach(({ tipo, campo }) => {
    (dados.psiData[atletaId] || []).filter((r) => r.tipo === tipo).forEach((r) => {
      const v = parseNota(r.nota, r.tipo).campos[campo];
      if (typeof v === "number") {
        if (!porInstrumento[tipo]) porInstrumento[tipo] = [];
        porInstrumento[tipo].push({ data: r.data, valor: v });
      }
    });
  });
  Object.values(porInstrumento).forEach((lista) => lista.sort((a, b) => a.data.localeCompare(b.data)));
  return porInstrumento;
}

function DadosPorConstruto({ dados }) {
  const { useState } = React;

  const construtos = construtosDisponiveis(dados);
  const [construto, setConstruto] = useState(construtos[0] || "");
  const fontes = fontesDoConstruto(dados, construto);

  const registros = dados.atletas
    .map((a) => {
      const porFonte = {};
      fontes.forEach(({ tipo, campo }) => {
        const reg = (dados.psiData[a.id] || []).filter((r) => r.tipo === tipo).sort((x, y) => y.data.localeCompare(x.data))[0];
        if (reg) {
          const v = parseNota(reg.nota, reg.tipo).campos[campo];
          if (typeof v === "number") porFonte[tipo] = v;
        }
      });
      if (Object.keys(porFonte).length === 0) return null;
      return { atleta: a.nome, porFonte };
    })
    .filter(Boolean);

  const labels = registros.map((r) => r.atleta);
  const datasets = fontes.map((f, i) => ({
    label: f.tipo,
    backgroundColor: PALETA_SUBESCALAS[i % PALETA_SUBESCALAS.length],
    data: registros.map((r) => (typeof r.porFonte[f.tipo] === "number" ? r.porFonte[f.tipo] : null)),
  }));

  if (construtos.length === 0) {
    return <div className="empty-state">Nenhum dado de psicologia lançado ainda.</div>;
  }

  return (
    <div>
      <div className="chart-controls">
        <TabSelect opcoes={construtos} valor={construto} onChange={setConstruto} />
        <span className="chart-controls-note">
          {fontes.length > 1
            ? `Medido por ${fontes.length} instrumentos diferentes (${fontes.map(f => f.tipo).join(", ")}) — barras separadas por instrumento, sem misturar escalas.`
            : fontes[0] ? `Fonte: ${fontes[0].tipo}` : ""}
        </span>
      </div>
      {registros.length === 0 ? (
        <div className="empty-state">Nenhum atleta com esse construto lançado.</div>
      ) : (
        <div className="chart-box-wide">
          <canvas ref={el => renderizarBarras(el, labels, datasets)}></canvas>
        </div>
      )}
    </div>
  );
}


function DadosPorEstatistica({ dados }) {
  const { useState } = React;

  const stats = Array.from(new Set(
    Object.values(dados.perfData).flat().flatMap(r => Object.keys(parseNota(r.nota, r.tipo).campos))
  )).sort();
  const [stat, setStat] = useState(stats.includes("AÇÃO COM BOLA") ? "AÇÃO COM BOLA" : (stats[0] || ""));

  const registros = dados.atletas
    .map(a => {
      const regs = dados.perfData[a.id] || [];
      if (!regs.length) return null;
      const campos = parseNota(regs[0].nota).campos;
      const valor = campos[stat];
      return typeof valor === "number" ? { atleta: a.nome, valor } : null;
    })
    .filter(Boolean)
    .sort((a, b) => b.valor - a.valor);

  if (stats.length === 0) {
    return <div className="empty-state">Nenhum dado de performance lançado ainda.</div>;
  }

  const labels = registros.map(r => r.atleta);
  const datasets = [{ label: stat, backgroundColor: "#A6473C", data: registros.map(r => r.valor) }];

  return (
    <div>
      <div className="chart-controls">
        <TabSelect opcoes={stats} valor={stat} onChange={setStat} />
        <span className="chart-controls-note">{registros.length} atleta{registros.length === 1 ? "" : "s"} com essa estatística no jogo mais recente, ordenado do maior pro menor</span>
      </div>
      {registros.length === 0 ? (
        <div className="empty-state">Nenhum atleta com essa estatística lançada.</div>
      ) : (
        <div className="chart-box chart-box-wide">
          <canvas ref={el => renderizarBarras(el, labels, datasets)}></canvas>
        </div>
      )}
    </div>
  );
}

function renderizarBarras(canvas, labels, datasets) {
  if (!canvas) return;
  if (canvas._chartInstance) canvas._chartInstance.destroy();
  canvas._chartInstance = new Chart(canvas, {
    type: "bar",
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: datasets.length > 1, labels: { font: { size: 10.5 } } } },
      scales: {
        x: { ticks: { font: { size: 10.5 }, maxRotation: 45, minRotation: 0 } },
        y: { beginAtZero: true, ticks: { precision: 0, font: { size: 10.5 } } },
      },
    },
  });
}

function EixoPicker({ label, dados, config, onChange }) {
  const areas = ["Psicologia", "Desempenho"];
  const construtos = construtosDisponiveis(dados);
  const stats = estatisticasPerformance(dados);

  function setArea(area) {
    if (area === "Psicologia") {
      onChange({ area, construto: construtos[0] || "", estatistica: "" });
    } else {
      onChange({ area, construto: "", estatistica: stats[0] || "" });
    }
  }

  return (
    <div className="eixo-picker">
      <div className="eixo-label">{label}</div>
      <TabSelect opcoes={areas} valor={config.area} onChange={setArea} tamanho="sm" />
      {config.area === "Psicologia" ? (
        <TabSelect opcoes={construtos} valor={config.construto} onChange={(c) => onChange({ ...config, construto: c })} tamanho="sm" />
      ) : (
        <TabSelect opcoes={stats} valor={config.estatistica} onChange={(e) => onChange({ ...config, estatistica: e })} tamanho="sm" />
      )}
    </div>
  );
}

function valorDoEixo(dados, atletaId, config) {
  if (config.area === "Psicologia") {
    const r = valorConstrutoAtleta(dados, atletaId, config.construto);
    return r ? r.valor : null;
  }
  return valorPerformance(dados, atletaId, config.estatistica);
}

function labelDoEixo(config) {
  if (config.area === "Psicologia") return config.construto;
  return config.estatistica;
}

function CruzamentoDados({ dados }) {
  const { useState, useRef, useEffect } = React;
  const construtosIniciais = construtosDisponiveis(dados);
  const statsIniciais = estatisticasPerformance(dados);

  const [eixoX, setEixoX] = useState({
    area: "Psicologia",
    construto: construtosIniciais[0] || "",
    estatistica: "",
  });
  const [eixoY, setEixoY] = useState({
    area: "Desempenho",
    construto: "",
    estatistica: statsIniciais[0] || "",
  });

  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  const pontos = dados.atletas
    .map((a) => {
      const x = valorDoEixo(dados, a.id, eixoX);
      const y = valorDoEixo(dados, a.id, eixoY);
      if (typeof x !== "number" || typeof y !== "number") return null;
      const fonteX = eixoX.area === "Psicologia" ? (valorConstrutoAtleta(dados, a.id, eixoX.construto) || {}).instrumento : null;
      const fonteY = eixoY.area === "Psicologia" ? (valorConstrutoAtleta(dados, a.id, eixoY.construto) || {}).instrumento : null;
      return { x, y, nome: a.nome, fonteX, fonteY };
    })
    .filter(Boolean);

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "scatter",
      data: {
        datasets: [{
          label: `${labelDoEixo(eixoX)} × ${labelDoEixo(eixoY)}`,
          data: pontos,
          backgroundColor: "#B8976A",
          borderColor: "#0A1F35",
          borderWidth: 1,
          pointRadius: 6,
          pointHoverRadius: 8,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const p = ctx.raw;
                const partX = p.fonteX ? `${labelDoEixo(eixoX)} (${p.fonteX}) = ${p.x}` : `${labelDoEixo(eixoX)} = ${p.x}`;
                const partY = p.fonteY ? `${labelDoEixo(eixoY)} (${p.fonteY}) = ${p.y}` : `${labelDoEixo(eixoY)} = ${p.y}`;
                return `${p.nome}: ${partX}, ${partY}`;
              },
            },
          },
        },
        scales: {
          x: { title: { display: true, text: labelDoEixo(eixoX), font: { size: 11 } }, ticks: { font: { size: 10.5 } } },
          y: { title: { display: true, text: labelDoEixo(eixoY), font: { size: 11 } }, ticks: { font: { size: 10.5 } } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(eixoX), JSON.stringify(eixoY), JSON.stringify(pontos)]);

  return (
    <div>
      <div className="cruzamento-eixos">
        <EixoPicker label="Eixo X" dados={dados} config={eixoX} onChange={setEixoX} />
        <div className="cruzamento-x">×</div>
        <EixoPicker label="Eixo Y" dados={dados} config={eixoY} onChange={setEixoY} />
      </div>
      {pontos.length === 0 ? (
        <div className="empty-state">Nenhum atleta tem os dois dados selecionados ao mesmo tempo — escolha outra combinação.</div>
      ) : (
        <React.Fragment>
          <div className="chart-box-wide" style={{marginTop:14}}>
            <canvas ref={canvasRef}></canvas>
          </div>
          <div className="chart-controls-note" style={{marginTop:8}}>{pontos.length} atleta{pontos.length === 1 ? "" : "s"} com os dois valores disponíveis. Passe o mouse sobre um ponto pra ver quem é.</div>
        </React.Fragment>
      )}
    </div>
  );
}

function calcularIdade(dataNascimento) {
  if (!dataNascimento) return null;
  const [ano, mes, dia] = dataNascimento.split("-").map(Number);
  const hoje = new Date();
  let idade = hoje.getFullYear() - ano;
  const aindaNaoFezAniversario = hoje.getMonth() + 1 < mes || (hoje.getMonth() + 1 === mes && hoje.getDate() < dia);
  if (aindaNaoFezAniversario) idade--;
  return idade;
}

function FormClube({ clube, onChange, onRemover }) {
  return (
    <div className="clube-row">
      <input type="text" placeholder="Nome do clube" value={clube.clube || ""} onChange={(e) => onChange({ ...clube, clube: e.target.value })} />
      <input type="date" value={clube.inicio || ""} onChange={(e) => onChange({ ...clube, inicio: e.target.value })} />
      <input type="date" value={clube.fim || ""} onChange={(e) => onChange({ ...clube, fim: e.target.value })} placeholder="Atual" />
      <button type="button" className="pill-btn" onClick={onRemover}>Remover</button>
    </div>
  );
}

function FormAtleta({ atleta, onSalvar, onCancelar }) {
  const { useState } = React;
  const [nome, setNome] = useState(atleta ? atleta.nome : "");
  const [categoria, setCategoria] = useState(atleta ? atleta.categoria || "" : "");
  const [dataNascimento, setDataNascimento] = useState(atleta ? atleta.data_nascimento || "" : "");
  const [localidade, setLocalidade] = useState(atleta ? atleta.localidade || "" : "");
  const [pernaDominante, setPernaDominante] = useState(atleta ? atleta.perna_dominante || "" : "");
  const [acertoDireita, setAcertoDireita] = useState(atleta && atleta.percentual_acerto_perna_direita != null ? String(atleta.percentual_acerto_perna_direita) : "");
  const [acertoEsquerda, setAcertoEsquerda] = useState(atleta && atleta.percentual_acerto_perna_esquerda != null ? String(atleta.percentual_acerto_perna_esquerda) : "");
  const [clubes, setClubes] = useState(atleta && atleta.historico_clubes ? atleta.historico_clubes : []);
  const [salvando, setSalvando] = useState(false);

  function atualizarClube(i, novo) {
    setClubes((prev) => prev.map((c, idx) => (idx === i ? novo : c)));
  }
  function removerClube(i) {
    setClubes((prev) => prev.filter((_, idx) => idx !== i));
  }
  function adicionarClube() {
    setClubes((prev) => [...prev, { clube: "", inicio: "", fim: "" }]);
  }

  async function handleSubmit() {
    if (!nome.trim() || salvando) return;
    setSalvando(true);
    try {
      await onSalvar({
        nome: nome.trim(),
        categoria: categoria.trim(),
        data_nascimento: dataNascimento || null,
        localidade: localidade.trim(),
        perna_dominante: pernaDominante,
        percentual_acerto_perna_direita: acertoDireita === "" ? null : Number(acertoDireita),
        percentual_acerto_perna_esquerda: acertoEsquerda === "" ? null : Number(acertoEsquerda),
        historico_clubes: clubes.filter((c) => c.clube.trim() !== ""),
      });
    } finally {
      setSalvando(false);
    }
  }

  return (
    <div className="form-panel">
      <div className="form-grid">
        <div className="field"><label>Nome completo</label><input type="text" value={nome} onChange={(e) => setNome(e.target.value)} /></div>
        <div className="field"><label>Categoria</label>
          <select value={categoria} onChange={(e) => setCategoria(e.target.value)}>
            <option value="">—</option>
            <option value="Sub 15">Sub 15</option>
            <option value="Sub-17">Sub-17</option>
          </select>
        </div>
      </div>
      <div className="form-grid">
        <div className="field"><label>Data de nascimento</label><input type="date" value={dataNascimento} onChange={(e) => setDataNascimento(e.target.value)} /></div>
        <div className="field"><label>Localidade</label><input type="text" placeholder="Cidade / bairro" value={localidade} onChange={(e) => setLocalidade(e.target.value)} /></div>
      </div>
      <div className="form-grid">
        <div className="field">
          <label>Perna dominante</label>
          <div className="sinal-picker">
            <div className={"sinal-opt verde" + (pernaDominante === "Destro" ? " on" : "")} onClick={() => setPernaDominante("Destro")}>Destro</div>
            <div className={"sinal-opt amarelo" + (pernaDominante === "Canhoto" ? " on" : "")} onClick={() => setPernaDominante("Canhoto")}>Canhoto</div>
            <div className={"sinal-opt vermelho" + (pernaDominante === "Ambidestro" ? " on" : "")} onClick={() => setPernaDominante("Ambidestro")}>Ambidestro</div>
          </div>
        </div>
        <div className="field">
          <label>% acerto perna direita / esquerda</label>
          <div style={{display:"flex", gap:8}}>
            <input type="number" min="0" max="100" placeholder="Direita %" value={acertoDireita} onChange={(e) => setAcertoDireita(e.target.value)} />
            <input type="number" min="0" max="100" placeholder="Esquerda %" value={acertoEsquerda} onChange={(e) => setAcertoEsquerda(e.target.value)} />
          </div>
        </div>
      </div>
      <div className="field" style={{marginBottom:14}}>
        <label>Histórico de clubes</label>
        {clubes.map((c, i) => <FormClube key={i} clube={c} onChange={(novo) => atualizarClube(i, novo)} onRemover={() => removerClube(i)} />)}
        <button type="button" className="pill-btn" onClick={adicionarClube} style={{marginTop:6, alignSelf:"flex-start"}}>+ Adicionar clube</button>
      </div>
      <div className="form-actions">
        <button className="pill-btn" onClick={onCancelar} disabled={salvando}>Cancelar</button>
        <button className="pill-btn primary" onClick={handleSubmit} disabled={!nome.trim() || salvando}>{salvando ? "Salvando..." : "Salvar"}</button>
      </div>
    </div>
  );
}

function MesclarAtletas({ atletas, onMesclado }) {
  const { useState } = React;
  const [idA, setIdA] = useState("");
  const [idB, setIdB] = useState("");
  const [canonico, setCanonico] = useState("");
  const [mesclando, setMesclando] = useState(false);
  const [erro, setErro] = useState(null);

  async function confirmarMescla() {
    if (!idA || !idB || idA === idB || !canonico) return;
    setMesclando(true);
    setErro(null);
    try {
      const duplicadoId = canonico === idA ? idB : idA;
      const canonicoId = canonico;
      for (const subcol of Object.values(SUBCOLS)) {
        const snap = await db.collection(COL_ATLETAS).doc(duplicadoId).collection(subcol).get();
        for (const doc of snap.docs) {
          await db.collection(COL_ATLETAS).doc(canonicoId).collection(subcol).add(doc.data());
          await doc.ref.delete();
        }
      }
      await db.collection(COL_ATLETAS).doc(canonicoId).update({ pendente_vinculo: false });
      await db.collection(COL_ATLETAS).doc(duplicadoId).delete();
      setIdA(""); setIdB(""); setCanonico("");
      onMesclado();
    } catch (e) {
      setErro(e.message);
    }
    setMesclando(false);
  }

  const atletaA = atletas.find((a) => a.id === idA);
  const atletaB = atletas.find((a) => a.id === idB);

  return (
    <div className="form-panel">
      <div className="form-grid">
        <div className="field">
          <label>Atleta 1</label>
          <select value={idA} onChange={(e) => { setIdA(e.target.value); setCanonico(""); }}>
            <option value="">Selecione...</option>
            {atletas.map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Atleta 2</label>
          <select value={idB} onChange={(e) => { setIdB(e.target.value); setCanonico(""); }}>
            <option value="">Selecione...</option>
            {atletas.map((a) => <option key={a.id} value={a.id}>{a.nome}</option>)}
          </select>
        </div>
      </div>
      {idA && idB && idA !== idB && (
        <div className="field" style={{marginBottom:14}}>
          <label>Qual nome fica? (o outro é apagado e o histórico é movido pra este)</label>
          <div className="sinal-picker">
            <div className={"sinal-opt verde" + (canonico === idA ? " on" : "")} onClick={() => setCanonico(idA)}>{atletaA.nome}</div>
            <div className={"sinal-opt verde" + (canonico === idB ? " on" : "")} onClick={() => setCanonico(idB)}>{atletaB.nome}</div>
          </div>
        </div>
      )}
      {erro && <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)"}}><span>{erro}</span></div>}
      <div className="form-actions">
        <button className="pill-btn primary" onClick={confirmarMescla} disabled={!canonico || mesclando}>{mesclando ? "Mesclando..." : "Confirmar mesclagem"}</button>
      </div>
      <div className="save-note"><span>Move todos os registros (psicologia, fisioterapia, fisiologia, social, desempenho) do duplicado para o nome escolhido, depois apaga o duplicado.</span></div>
    </div>
  );
}

function ListaAtletas({ dados, onOpenAtleta, onRecarregar }) {
  const { useState } = React;
  const [modo, setModo] = useState(null); // null | "novo" | { editando: atletaId } | "mesclar"
  const linha = dados.atletas.map(a => ({ ...a, ...calcularSemaforo(a.id, dados) }));

  async function salvarNovo(campos) {
    await db.collection(COL_ATLETAS).add({ ...campos, origem: "cadastro_manual", pendente_vinculo: false });
    setModo(null);
    onRecarregar();
  }

  async function salvarEdicao(atletaId, campos) {
    await db.collection(COL_ATLETAS).doc(atletaId).update(campos);
    setModo(null);
    onRecarregar();
  }

  const atletaEmEdicao = modo && modo.editando ? dados.atletas.find(a => a.id === modo.editando) : null;

  return (
    <div>
      <div className="panel">
        <div className="panel-head">
          <h3>Todos os atletas ({linha.length})</h3>
          <div style={{display:"flex", gap:8}}>
            <button className={"pill-btn" + (modo === "mesclar" ? " primary" : "")} onClick={() => setModo(modo === "mesclar" ? null : "mesclar")}>Mesclar duplicata</button>
            <button className={"pill-btn primary"} onClick={() => setModo(modo === "novo" ? null : "novo")}>{modo === "novo" ? "Fechar" : "+ Novo atleta"}</button>
          </div>
        </div>

        {modo === "novo" && (
          <FormAtleta atleta={null} onSalvar={salvarNovo} onCancelar={() => setModo(null)} />
        )}
        {modo === "mesclar" && (
          <MesclarAtletas atletas={dados.atletas} onMesclado={() => { setModo(null); onRecarregar(); }} />
        )}
        {atletaEmEdicao && (
          <FormAtleta atleta={atletaEmEdicao} onSalvar={(campos) => salvarEdicao(atletaEmEdicao.id, campos)} onCancelar={() => setModo(null)} />
        )}

        <div className="panel-body">
          <table>
            <thead><tr><th>Nome</th><th>Categoria</th><th>Origem</th><th>Status</th><th></th></tr></thead>
            <tbody>
              {linha.map(d => (
                <tr key={d.id} className="clickable">
                  <td style={{fontWeight:600, color:"var(--navy)"}} onClick={() => onOpenAtleta(d.id)}>{d.nome}{d.pendente_vinculo ? " ⚠︎ pendente de vínculo" : ""}</td>
                  <td onClick={() => onOpenAtleta(d.id)}>{d.categoria || "—"}</td>
                  <td className="muted" onClick={() => onOpenAtleta(d.id)}>{d.origem || "—"}</td>
                  <td onClick={() => onOpenAtleta(d.id)}><span className={"badge " + d.risco}>{d.risco === "verde" ? "Regular" : d.risco === "amarelo" ? "Atenção" : "Prioridade"}</span></td>
                  <td><button className="pill-btn" onClick={(e) => { e.stopPropagation(); setModo({ editando: d.id }); }}>Editar</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function TimelineAtleta({ atletaId, dados }) {
  const { psiData, fisioData, fisiologiaData, socialData, perfData } = dados;
  let eventos = [];
  (psiData[atletaId] || []).forEach(e => eventos.push({ area: "psi", label: "Psicologia", data: e.data, desc: e.tipo + " — " + e.nota }));
  (fisioData[atletaId] || []).forEach(e => eventos.push({ area: "fisio", label: "Fisioterapia", data: e.data, desc: e.tipo + " — " + e.nota }));
  (fisiologiaData[atletaId] || []).forEach(e => eventos.push({ area: "fisio", label: "Fisiologia", data: e.data, desc: e.tipo + " — " + e.nota }));
  (socialData[atletaId] || []).forEach(e => eventos.push({ area: "social", label: "Serviço social", data: e.data, desc: e.tipo + " — " + (e.detalhe || "") }));
  (perfData[atletaId] || []).forEach(e => eventos.push({ area: "performance", label: "Desempenho", data: e.data, desc: e.tipo + " — " + e.nota }));
  eventos.sort((a, b) => (b.data || "").localeCompare(a.data || ""));

  if (eventos.length === 0) return <div className="empty-state">Nenhum registro lançado para este atleta ainda.</div>;

  return (
    <div className="timeline">
      {eventos.map((e, i) => (
        <div className="tl-item" key={i}>
          <div className="tl-rail">
            <div className={"tl-dot " + e.area}></div>
            {i < eventos.length - 1 && <div className="tl-line"></div>}
          </div>
          <div className="tl-body">
            <div className="tl-date">{formatarData(e.data)}</div>
            <div className={"tl-area " + e.area}>{e.label}</div>
            <div className="tl-desc">{e.desc}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------- Radar de atributos do atleta ---------- */

/** Todas as métricas (construtos de psicologia + estatísticas de desempenho) que ESTE atleta tem. */
function metricasDisponiveisAtleta(dados, atletaId) {
  const metricas = [];
  construtosDisponiveis(dados).forEach((construto) => {
    const r = valorConstrutoAtleta(dados, atletaId, construto);
    if (r) metricas.push({ id: "psi:" + construto, nome: construto, categoria: "psi" });
  });
  estatisticasPerformance(dados).forEach((stat) => {
    const v = valorPerformance(dados, atletaId, stat);
    if (typeof v === "number") metricas.push({ id: "desempenho:" + stat, nome: stat, categoria: "desempenho" });
  });
  return metricas;
}

/** Valor bruto de uma métrica (pelo id "psi:Nome" ou "desempenho:Nome") para um atleta. */
function valorDaMetrica(dados, atletaId, metricaId) {
  const [categoria, nome] = metricaId.split(/:(.+)/);
  if (categoria === "psi") {
    const r = valorConstrutoAtleta(dados, atletaId, nome);
    return r ? r.valor : null;
  }
  return valorPerformance(dados, atletaId, nome);
}

/** Min/max dessa métrica entre TODOS os atletas que a têm — base da normalização. */
function faixaDaMetrica(dados, metricaId) {
  const valores = dados.atletas
    .map((a) => valorDaMetrica(dados, a.id, metricaId))
    .filter((v) => typeof v === "number");
  if (valores.length === 0) return { min: 0, max: 1 };
  return { min: Math.min(...valores), max: Math.max(...valores) };
}

function normalizar(valor, min, max) {
  if (max === min) return 50;
  return ((valor - min) / (max - min)) * 100;
}

function MultiTabSelect({ opcoes, selecionadas, onToggle }) {
  return (
    <div className="tab-select">
      {opcoes.map((op) => (
        <button
          key={op.id}
          type="button"
          className={"tab-select-item" + (selecionadas.includes(op.id) ? " active" : "")}
          onClick={() => onToggle(op.id)}
        >
          {op.nome}
        </button>
      ))}
    </div>
  );
}

function RadarAtleta({ dados, atletaId }) {
  const { useState, useRef, useEffect } = React;
  const metricas = metricasDisponiveisAtleta(dados, atletaId);
  const [selecionadas, setSelecionadas] = useState(metricas.slice(0, 6).map((m) => m.id));
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  function toggle(id) {
    setSelecionadas((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  }

  const ativas = metricas.filter((m) => selecionadas.includes(m.id));
  const pontos = ativas.map((m) => {
    const valor = valorDaMetrica(dados, atletaId, m.id);
    const { min, max } = faixaDaMetrica(dados, m.id);
    return { nome: m.nome, valor, normalizado: normalizar(valor, min, max) };
  });

  useEffect(() => {
    if (!canvasRef.current || pontos.length < 3) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "radar",
      data: {
        labels: pontos.map((p) => p.nome),
        datasets: [{
          label: "Perfil (normalizado, relativo ao elenco)",
          data: pontos.map((p) => p.normalizado),
          backgroundColor: "rgba(184,151,106,0.25)",
          borderColor: "#B8976A",
          pointBackgroundColor: "#0A1F35",
          borderWidth: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const p = pontos[ctx.dataIndex];
                return `${p.nome}: valor real = ${p.valor}`;
              },
            },
          },
        },
        scales: {
          r: { min: 0, max: 100, ticks: { display: false }, pointLabels: { font: { size: 10.5 } } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(selecionadas), JSON.stringify(pontos.map(p => p.valor))]);

  if (metricas.length === 0) return <div className="empty-state">Nenhuma métrica disponível pra este atleta ainda.</div>;

  return (
    <div>
      <div className="chart-controls" style={{marginBottom:6}}>
        <span className="chart-controls-note">Escolha o que entra no radar (múltipla escolha):</span>
      </div>
      <MultiTabSelect opcoes={metricas} selecionadas={selecionadas} onToggle={toggle} />
      <div className="chart-controls-note" style={{marginTop:8}}>
        Cada eixo é normalizado (0–100) comparado com o resto do elenco, pra caber métricas de escalas diferentes no mesmo gráfico. O valor real aparece ao passar o mouse.
      </div>
      {pontos.length < 3 ? (
        <div className="empty-state">Escolha pelo menos 3 métricas pra desenhar o radar.</div>
      ) : (
        <div className="chart-box-wide" style={{marginTop:12, height:340}}><canvas ref={canvasRef}></canvas></div>
      )}
    </div>
  );
}

function EvolucaoPsiAtleta({ dados, atletaId }) {
  const { useState, useRef, useEffect } = React;

  const construtos = Object.keys(CONSTRUCTOS_PSI).filter((c) =>
    CONSTRUCTOS_PSI[c].some((f) => (dados.psiData[atletaId] || []).some((r) => r.tipo === f.tipo))
  );
  const [construto, setConstruto] = useState(construtos[0] || "");
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  const porInstrumento = historicoConstrutoAtleta(dados, atletaId, construto);
  const instrumentosComDado = Object.keys(porInstrumento);
  const datasUnicas = Array.from(new Set(instrumentosComDado.flatMap((t) => porInstrumento[t].map((p) => p.data)))).sort();

  useEffect(() => {
    if (!canvasRef.current || datasUnicas.length === 0) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "line",
      data: {
        labels: datasUnicas.map(formatarData),
        datasets: instrumentosComDado.map((tipo, i) => {
          const mapa = {};
          porInstrumento[tipo].forEach((p) => { mapa[p.data] = p.valor; });
          return {
            label: tipo,
            data: datasUnicas.map((d) => (d in mapa ? mapa[d] : null)),
            borderColor: PALETA_SUBESCALAS[i % PALETA_SUBESCALAS.length],
            backgroundColor: PALETA_SUBESCALAS[i % PALETA_SUBESCALAS.length] + "33",
            tension: 0.25,
            pointRadius: 4,
            spanGaps: true,
          };
        }),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { font: { size: 10.5 } } } },
        scales: {
          x: { ticks: { font: { size: 10.5 } } },
          y: { ticks: { font: { size: 10.5 } } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [construto, JSON.stringify(porInstrumento)]);

  if (construtos.length === 0) return <div className="empty-state">Nenhum dado de psicologia para este atleta ainda.</div>;

  return (
    <div>
      <div className="chart-controls">
        <TabSelect opcoes={construtos} valor={construto} onChange={setConstruto} />
        <span className="chart-controls-note">
          {instrumentosComDado.length > 1 ? `Fontes: ${instrumentosComDado.join(", ")} — cada uma com sua própria linha (escalas diferentes)` : (instrumentosComDado[0] || "")}
        </span>
      </div>
      {datasUnicas.length === 0 ? (
        <div className="empty-state">Sem histórico para esse construto.</div>
      ) : (
        <div className="chart-box-wide"><canvas ref={canvasRef}></canvas></div>
      )}
    </div>
  );
}

function PerformanceAtleta({ dados, atletaId }) {
  const { useState, useRef, useEffect } = React;
  const registrosAtleta = dados.perfData[atletaId] || [];
  const jogos = registrosAtleta.map((r) => r.tipo);
  const [jogo, setJogo] = useState(jogos[0] || "");
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  const registro = registrosAtleta.find((r) => r.tipo === jogo);
  const campos = registro ? parseNota(registro.nota).campos : {};
  const chaves = Object.keys(campos).filter((k) => typeof campos[k] === "number").sort((a, b) => campos[b] - campos[a]);

  useEffect(() => {
    if (!canvasRef.current || chaves.length === 0) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: {
        labels: chaves,
        datasets: [{ label: jogo, data: chaves.map((k) => campos[k]), backgroundColor: "#A6473C" }],
      },
      options: {
        indexAxis: "y",
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { beginAtZero: true, ticks: { precision: 0, font: { size: 10.5 } } },
          y: { ticks: { font: { size: 10.5 } } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [jogo, JSON.stringify(campos)]);

  if (jogos.length === 0) return <div className="empty-state">Nenhum dado de performance para este atleta ainda.</div>;

  return (
    <div>
      <div className="chart-controls">
        <TabSelect opcoes={jogos} valor={jogo} onChange={setJogo} />
        <span className="chart-controls-note">{formatarData(registro ? registro.data : "")}</span>
      </div>
      {chaves.length === 0 ? (
        <div className="empty-state">Sem estatísticas nesse jogo.</div>
      ) : (
        <div className="chart-box-wide" style={{height: Math.max(220, chaves.length * 28)}}><canvas ref={canvasRef}></canvas></div>
      )}
    </div>
  );
}
