function ViewAgenda({ usuario, onNavigate }) {
  const { useState, useEffect } = React;
  const hoje = hojeISO();
  const [eventos, setEventos] = useState(null);
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState(null);
  const [mes, setMes] = useState(hoje.slice(0, 7));
  const [dia, setDia] = useState(hoje);
  const [filtro, setFiltro] = useState("todas");
  const [editando, setEditando] = useState(null);

  function recarregar() {
    return Promise.all([carregarEventos(), carregarPermitido(usuario)])
      .then(([ev, d]) => { setEventos(ev); setDados(d); })
      .catch((e) => setErro(e.message));
  }
  useEffect(() => { recarregar(); }, []);

  if (erro) return <div className="page"><ErroCarregamento mensagem={erro} /></div>;
  if (!eventos) return <div className="page"><Carregando /></div>;

  const visiveis = eventos.filter((e) => filtro === "todas" || eventoDaCategoria(e, filtro));
  const porDia = {};
  visiveis.forEach((e) => { (porDia[e.data] = porDia[e.data] || []).push(e); });

  const [ano, mesNum] = mes.split("-").map(Number);
  const primeiro = new Date(ano, mesNum - 1, 1, 12);
  const deslocamento = (primeiro.getDay() + 6) % 7; // semana começa na segunda
  const diasNoMes = new Date(ano, mesNum, 0).getDate();
  const semanas = Math.ceil((deslocamento + diasNoMes) / 7);
  const inicio = isoMaisDias(isoDeData(primeiro), -deslocamento);
  const grade = Array.from({ length: semanas * 7 }, (_, i) => isoMaisDias(inicio, i));
  const mudarMes = (delta) => { const d = new Date(ano, mesNum - 1 + delta, 1, 12); setMes(isoDeData(d).slice(0, 7)); };

  const lembretes = calcularLembretes(dados, usuario, eventos, hoje);
  const doDia = porDia[dia] || [];
  const proximosTodos = visiveis.filter((e) => e.data > dia && diasEntreIso(dia, e.data) <= 7);
  const proximos = proximosTodos.filter((e) => e.tipo !== "treino");
  const treinosProximos = proximosTodos.length - proximos.length;
  const podeJogos = podeVerJogos(usuario);
  const podeCarga = podeVerMonitoramento(usuario);

  function abrirLembrete(l) {
    if (l.eventoId) convocacaoPendente = l.eventoId;
    onNavigate(l.pagina);
  }
  function abrirConvocacao(ev) { convocacaoPendente = ev.id; onNavigate("jogos"); }
  function abrirCarga(ev) { sessaoCargaPendente = ev.id; onNavigate("monitoramento"); }
  function novoEvento(dataInicial) {
    setEditando({ data: dataInicial || dia, categoria: filtro === "todas" ? "ambas" : filtro });
    window.scrollTo(0, 0);
  }

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>Agenda</h1>
          <div className="crumb">MeuCT · Meia Noite EC · jogos, treinos e avaliações do elenco</div>
        </div>
        <div className="page-head-acoes">
          <div className="tab-select">
            {[{ id: "todas", label: "Todos" }, { id: "sub15", label: "Sub-15" }, { id: "sub17", label: "Sub-17" }].map((f) => (
              <button key={f.id} type="button" className={"tab-select-item" + (filtro === f.id ? " active" : "")} onClick={() => setFiltro(f.id)}>{f.label}</button>
            ))}
          </div>
          <button type="button" className="pill-btn primary" onClick={() => novoEvento()}>+ Novo evento</button>
        </div>
      </div>

      {editando && (
        <FormEvento inicial={editando} usuario={usuario} onCancelar={() => setEditando(null)} onSalvo={() => { setEditando(null); recarregar(); }} />
      )}

      <PainelLembretes itens={lembretes} onAbrir={abrirLembrete} />

      <div className="agenda-grid">
        <div className="panel agenda-cal">
          <div className="panel-head">
            <h3>{MESES[mesNum - 1]} de {ano}</h3>
            <div className="cal-nav">
              <button type="button" className="cal-nav-btn" onClick={() => mudarMes(-1)} aria-label="Mês anterior"><Icone nome="voltar" /></button>
              <button type="button" className="pill-btn" onClick={() => { setMes(hoje.slice(0, 7)); setDia(hoje); }}>Hoje</button>
              <button type="button" className="cal-nav-btn" onClick={() => mudarMes(1)} aria-label="Próximo mês"><Icone nome="seta" /></button>
            </div>
          </div>
          <div className="cal">
            {["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"].map((d) => <div key={d} className="cal-semana">{d}</div>)}
            {grade.map((iso) => {
              const evs = porDia[iso] || [];
              const foraDoMes = iso.slice(0, 7) !== mes;
              return (
                <button key={iso} type="button" className={"cal-dia" + (foraDoMes ? " fora-mes" : "") + (iso === hoje ? " hoje" : "") + (iso === dia ? " selecionado" : "")} onClick={() => setDia(iso)} aria-label={dataPorExtenso(iso) + (evs.length ? `, ${evs.length} evento(s)` : "")}>
                  <span className="cal-num">{Number(iso.slice(8))}</span>
                  <span className="cal-eventos">
                    {evs.slice(0, 3).map((e) => (
                      <span key={e.id} className={"cal-evento tipo-" + e.tipo} title={[e.hora, tituloEvento(e), labelCategoriaEvento(e.categoria)].filter(Boolean).join(" · ")}>
                        {e.categoria === "sub15" || e.categoria === "sub17" ? <b>{e.categoria === "sub15" ? "15" : "17"}</b> : <i></i>}<em>{e.tipo === "jogo" ? "x " + (e.adversario || "?") : e.tipo === "treino" ? "Treino" : tituloEvento(e)}</em>
                      </span>
                    ))}
                    {evs.length > 3 && <span className="cal-mais">+{evs.length - 3}</span>}
                  </span>
                </button>
              );
            })}
          </div>
          <div className="cal-legenda">
            {TIPOS_EVENTO.map((t) => <span key={t.id} className={"tipo-" + t.id}><i></i>{t.label}</span>)}
          </div>
        </div>

        <div className="agenda-lado">
          <div className="panel">
            <div className="panel-head">
              <h3>{dia === hoje ? "Hoje" : dataPorExtenso(dia)}</h3>
              <button type="button" className="pill-btn" onClick={() => novoEvento(dia)}>+ Evento</button>
            </div>
            {doDia.length === 0 ? (
              <div className="empty-state" style={{ padding: "28px 18px" }}>Nada marcado {dia === hoje ? "pra hoje" : "neste dia"}.</div>
            ) : (
              <div className="evento-lista">
                {doDia.map((e) => <ItemEvento key={e.id} ev={e} onEditar={setEditando} onConvocacao={abrirConvocacao} onCarga={abrirCarga} podeJogos={podeJogos} podeCarga={podeCarga} />)}
              </div>
            )}
          </div>
          <div className="panel">
            <div className="panel-head"><h3>Próximos 7 dias</h3></div>
            {proximos.length === 0 ? (
              <div className="empty-state" style={{ padding: "28px 18px" }}>{treinosProximos ? `Só treinos de rotina nos 7 dias seguintes (${treinosProximos}).` : "Sem eventos nos 7 dias seguintes."}</div>
            ) : (
              <div className="evento-lista compacta">
                {proximos.map((e) => (
                  <button key={e.id} type="button" className={"proximo-item tipo-" + e.tipo} onClick={() => { setDia(e.data); setMes(e.data.slice(0, 7)); }}>
                    <span className="proximo-data"><b>{Number(e.data.slice(8))}</b>{diaSemanaCurto(e.data)}</span>
                    <span className="proximo-texto"><b>{tituloEvento(e)}</b><small>{[e.hora, labelCategoriaEvento(e.categoria), e.local].filter(Boolean).join(" · ")}</small></span>
                    <span className={"evento-chip tipo-" + e.tipo}>{labelTipoEvento(e.tipo)}</span>
                  </button>
                ))}
                {treinosProximos > 0 && <div className="proximos-rodape">Mais {treinosProximos} treino{treinosProximos > 1 ? "s" : ""} de rotina no período.</div>}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Jogos: convocação e Central do Jogo ---------- */
function iniciaisTime(nome) {
  const partes = String(nome || "?").replace(/[^A-Za-zÀ-ÿ0-9 ]/g, " ").trim().split(/\s+/).filter((p) => p.length > 2 || /^[A-Z0-9]+$/.test(p));
  return (partes.length ? partes : [String(nome || "?")]).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
}
function EscudoTime({ nome }) {
  if (ehMeiaNoite(nome)) return <img src={ESCUDO_MEIA_NOITE} className="time-escudo" alt="" />;
  return <span className="time-escudo generico" aria-hidden="true">{iniciaisTime(nome)}</span>;
}

/** Relação de convocados em PDF, no mesmo padrão visual dos relatórios. */
async function baixarConvocacaoPdf(evento, titulares, reservas, usuario) {
  try {
    await carregarBiblioteca("pdf");
  } catch (e) {
    alert(e.message);
    return;
  }
  const doc = novoDocPdf();
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const ctx = { doc, W, H, x0: PDF_LAYOUT.margemX, x1: W - PDF_LAYOUT.margemX, y: 0 };
  const placar = placarEvento(evento);
  const rel = {
    departamento: "Comissão Técnica",
    clube: "EC Meia Noite SAF",
    titulo: "RELAÇÃO DE CONVOCADOS",
    subtitulo: "Comissão Técnica · Setor de Futebol" + (placar ? ` · placar ${placar.nos} x ${placar.eles}` : ""),
    rodape: "Comissão Técnica · EC Meia Noite SAF",
    info: [
      ["Jogo", tituloEvento(evento)],
      ["Data", formatarData(evento.data) + (evento.hora ? " às " + evento.hora : "")],
      ["Categoria", labelCategoriaEvento(evento.categoria)],
      ["Local", [evento.local, evento.mando === "fora" ? "fora de casa" : "em casa"].filter(Boolean).join(", ")],
      ["Competição", evento.competicao || "-"],
      ["Convocados", `${titulares.length} titulares e ${reservas.length} reservas`],
    ],
  };
  doc.setProperties({ title: "Relação de convocados", subject: tituloEvento(evento), author: (usuario && usuario.nome) || "MeuCT", creator: "MeuCT · Meia Noite EC" });
  pdfCabecalho(ctx, rel);
  pdfTabelaInfo(ctx, rel);
  const tabela = (titulo, lista) => {
    pdfSecao(ctx, titulo, { reservar: 18 });
    doc.autoTable({
      startY: ctx.y,
      margin: pdfMargensTabela(ctx),
      head: [["Nº", "Atleta", "Posição", "Categoria"]],
      body: lista.length ? lista.map((a, i) => [String(i + 1), textoPdf(a.nome), textoPdf(a.posicao || "-"), textoPdf(a.categoria || "-")]) : [[{ content: "Ninguém nesta lista.", colSpan: 4, styles: { halign: "center", textColor: PDF_COR.cinza, fontStyle: "italic" } }]],
      theme: "grid",
      styles: { font: "times", fontSize: 10, textColor: PDF_COR.preto, lineColor: PDF_COR.preto, lineWidth: 0.2, cellPadding: { top: 1.3, bottom: 1.3, left: 1.8, right: 1.8 }, valign: "middle" },
      headStyles: { fillColor: PDF_COR.navy, textColor: PDF_COR.branco, fontStyle: "bold" },
      alternateRowStyles: { fillColor: PDF_COR.zebra },
      columnStyles: { 0: { cellWidth: 12, halign: "center" }, 2: { cellWidth: 42 }, 3: { cellWidth: 28, halign: "center" } },
      rowPageBreak: "avoid",
      showHead: "everyPage",
    });
    ctx.y = doc.lastAutoTable.finalY + 5;
  };
  tabela("Titulares", ordenarPorPosicao(titulares));
  tabela("Reservas", ordenarPorPosicao(reservas));
  const total = doc.getNumberOfPages();
  for (let p = 1; p <= total; p++) {
    doc.setPage(p);
    if (p > 1) pdfCabecalhoContinuacao(ctx, rel);
    pdfRodape(ctx, rel, p, total);
  }
  doc.save(`Convocacao_${fatiaArquivo(tituloEvento(evento))}_${dataArquivo(evento.data)}.pdf`);
}

function EditorConvocacao({ evento, atletas, usuario, onVoltar, onSalvo }) {
  const { useState } = React;
  useBibliotecas("pdf");
  const categoriasDoJogo = evento.categoria === "ambas" ? ["sub15", "sub17"] : [evento.categoria || "sub15"];
  const [timeAtivo, setTimeAtivo] = useState(categoriasDoJogo[0]);
  const [selecao, setSelecao] = useState(() => {
    const s = {};
    ((evento.convocacao && evento.convocacao.titulares) || []).forEach((id) => { s[id] = "titular"; });
    ((evento.convocacao && evento.convocacao.reservas) || []).forEach((id) => { s[id] = "reserva"; });
    return s;
  });
  const [salvando, setSalvando] = useState(false);
  const [mensagem, setMensagem] = useState(null);
  const [alterado, setAlterado] = useState(false);
  const [chamarId, setChamarId] = useState("");

  function alternar(id) {
    setSelecao((s) => {
      const atual = s[id];
      const proximo = !atual ? "titular" : atual === "titular" ? "reserva" : null;
      const n = { ...s };
      if (proximo) n[id] = proximo; else delete n[id];
      return n;
    });
    setAlterado(true); setMensagem(null);
  }

  const doTime = atletas.filter((a) => normalizarCategoria(a.categoria) === timeAtivo || (selecao[a.id] && !categoriasDoJogo.includes(normalizarCategoria(a.categoria))));
  const outros = atletas.filter((a) => !categoriasDoJogo.includes(normalizarCategoria(a.categoria)) && !selecao[a.id]);
  const titulares = atletas.filter((a) => selecao[a.id] === "titular");
  const reservas = atletas.filter((a) => selecao[a.id] === "reserva");
  const comAlerta = [...titulares, ...reservas].filter((a) => a.disp && a.disp.status !== "disponivel");
  const goleirosTitulares = titulares.filter((a) => a.posicao === "Goleiro").length;
  const contagemDisp = { disponivel: 0, restricao: 0, fora: 0 };
  doTime.forEach((a) => { if (a.disp) contagemDisp[a.disp.status]++; });

  async function salvar() {
    setSalvando(true); setMensagem(null);
    try {
      await atualizarCamposEvento(evento.id, {
        convocacao: {
          titulares: titulares.map((a) => a.id),
          reservas: reservas.map((a) => a.id),
          atualizado_por: usuario.nome || usuario.email || "",
          atualizado_em_iso: new Date().toISOString(),
        },
      });
      setAlterado(false);
      setMensagem({ tipo: "ok", texto: "Convocação salva." });
      onSalvo && onSalvo();
    } catch (e) {
      setMensagem({ tipo: "erro", texto: "Não consegui salvar: " + e.message });
    } finally {
      setSalvando(false);
    }
  }
  function limpar() { setSelecao({}); setAlterado(true); setMensagem(null); }
  function chamarDeOutraCategoria() {
    if (!chamarId) return;
    setSelecao((s) => ({ ...s, [chamarId]: "reserva" }));
    setChamarId(""); setAlterado(true);
  }

  const placar = placarEvento(evento);
  const ladoCasa = evento.mando !== "fora";
  const nomeNos = "Meia Noite", nomeEles = evento.adversario || "Adversário";

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>Convocação</h1>
          <div className="crumb">MeuCT · Meia Noite EC · toque no jogador: 1º toque titular, 2º reserva, 3º tira da lista</div>
        </div>
        <div className="page-head-acoes">
          <button type="button" className="pill-btn" onClick={onVoltar}><Icone nome="voltar" />Voltar</button>
        </div>
      </div>

      <div className="placar-hero compacto">
        <div className="placar-lado">
          <EscudoTime nome={ladoCasa ? nomeNos : nomeEles} />
          <b>{ladoCasa ? nomeNos : nomeEles}</b>
        </div>
        <div className="placar-centro">
          <div className="placar-gols">{placar ? (ladoCasa ? `${placar.nos} x ${placar.eles}` : `${placar.eles} x ${placar.nos}`) : "x"}</div>
          <div className="placar-info">{dataPorExtenso(evento.data)}{evento.hora ? " · " + evento.hora : ""}</div>
          <div className="placar-info">{[labelCategoriaEvento(evento.categoria), evento.competicao, evento.local].filter(Boolean).join(" · ")}</div>
        </div>
        <div className="placar-lado">
          <EscudoTime nome={ladoCasa ? nomeEles : nomeNos} />
          <b>{ladoCasa ? nomeEles : nomeNos}</b>
        </div>
      </div>

      <div className="convocacao-resumo">
        <div className={"conv-contador" + (titulares.length === 11 ? " ok" : " pendente")}><b>{titulares.length}</b><span>de 11 titulares</span></div>
        <div className="conv-contador"><b>{reservas.length}</b><span>reservas</span></div>
        <div className={"conv-contador" + (comAlerta.some((a) => a.disp.status === "fora") ? " alerta" : comAlerta.length ? " pendente" : " ok")}><b>{comAlerta.length}</b><span>com restrição ou fora</span></div>
        <div className="conv-acoes">
          <button type="button" className="pill-btn primary" onClick={salvar} disabled={salvando || !alterado}>{salvando ? "Salvando..." : alterado ? "Salvar convocação" : "Convocação salva"}</button>
          <button type="button" className="pill-btn" onClick={() => baixarConvocacaoPdf(evento, titulares, reservas, usuario)} disabled={titulares.length + reservas.length === 0}><Icone nome="pdf" />Baixar PDF</button>
          <button type="button" className="pill-btn" onClick={limpar} disabled={titulares.length + reservas.length === 0}>Limpar</button>
        </div>
      </div>
      {mensagem && <div className="access-note" style={{ borderLeftColor: mensagem.tipo === "ok" ? "var(--st-good)" : "var(--st-crit)" }}><span>{mensagem.texto}</span></div>}
      {titulares.length > 0 && goleirosTitulares !== 1 && (
        <div className="access-note" style={{ borderLeftColor: "var(--st-warn)" }}><span><b>Confira os titulares:</b> {goleirosTitulares === 0 ? "nenhum goleiro entre os titulares." : `${goleirosTitulares} goleiros entre os titulares.`}</span></div>
      )}

      <CampoConvocacao
        atletas={doTime}
        selecao={selecao}
        onToggle={alternar}
        titulo={categoriasDoJogo.length > 1 ? "Elenco" : labelCategoriaEvento(timeAtivo)}
        subtitulo="Toque para convocar. A cor do ponto é a disponibilidade de hoje."
        controles={categoriasDoJogo.length > 1 ? categoriasDoJogo.map((c) => (
          <button key={c} type="button" className={"pitch-chip" + (timeAtivo === c ? " active" : "")} onClick={() => setTimeAtivo(c)}>{labelCategoriaEvento(c)}</button>
        )) : null}
        rodape={<LegendaDisponibilidade contagem={contagemDisp} />}
      />

      {comAlerta.length > 0 && (
        <div className="panel">
          <div className="panel-head alerta"><h3>Atenção na lista</h3></div>
          <div className="alertas-lista">
            {comAlerta.map((a) => (
              <div key={a.id} className={"alerta-item " + a.disp.status}>
                <span className={"badge " + DISPONIBILIDADE[a.disp.status].sinal}>{DISPONIBILIDADE[a.disp.status].label}</span>
                <b>{nomeExibicao(a)}</b>
                <span className="muted">{a.disp.motivos.join("; ")}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {outros.length > 0 && (
        <div className="chamar-outra">
          <label htmlFor="chamar-outra">Chamar atleta de outra categoria</label>
          <select id="chamar-outra" value={chamarId} onChange={(e) => setChamarId(e.target.value)}>
            <option value="">Escolha um atleta</option>
            {outros.map((a) => <option key={a.id} value={a.id}>{nomeExibicao(a)} · {a.categoria} · {a.posicao || "sem posição"}</option>)}
          </select>
          <button type="button" className="pill-btn" onClick={chamarDeOutraCategoria} disabled={!chamarId}>Chamar como reserva</button>
        </div>
      )}

      <div className="relacao-colunas">
        {[["Titulares", titulares], ["Reservas", reservas]].map(([rotulo, lista]) => (
          <div className="panel" key={rotulo}>
            <div className="panel-head"><h3>{rotulo}</h3><span className="muted" style={{ fontSize: 12 }}>{lista.length}</span></div>
            {lista.length === 0 ? <div className="empty-state" style={{ padding: "22px 16px" }}>Ninguém ainda.</div> : (
              <ol className="relacao-lista">
                {ordenarPorPosicao(lista).map((a) => (
                  <li key={a.id}>
                    <span className="relacao-pos">{SIGLA_POSICAO[a.posicao] || "-"}</span>
                    <span className="relacao-nome">{nomeExibicao(a)}</span>
                    {a.disp && a.disp.status !== "disponivel" && <span className={"badge " + DISPONIBILIDADE[a.disp.status].sinal}>{DISPONIBILIDADE[a.disp.status].label}</span>}
                    <button type="button" className="link-btn" onClick={() => alternar(a.id)}>{selecao[a.id] === "titular" ? "Mover p/ reserva" : "Tirar"}</button>
                  </li>
                ))}
              </ol>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function ResultadoDoJogo({ placar }) {
  if (!placar || placar.golsMandante === null) return null;
  const nosMandante = ehMeiaNoite(placar.mandante) || !ehMeiaNoite(placar.visitante);
  const nos = nosMandante ? placar.golsMandante : placar.golsVisitante;
  const eles = nosMandante ? placar.golsVisitante : placar.golsMandante;
  const r = nos > eles ? ["V", "vitoria", "Vitória"] : nos === eles ? ["E", "empate", "Empate"] : ["D", "derrota", "Derrota"];
  return <span className={"resultado-chip " + r[1]} title={r[2]}>{r[0]}</span>;
}
function resultadoNumerico(placar) {
  if (!placar || placar.golsMandante === null) return null;
  const nosMandante = ehMeiaNoite(placar.mandante) || !ehMeiaNoite(placar.visitante);
  return { nos: nosMandante ? placar.golsMandante : placar.golsVisitante, eles: nosMandante ? placar.golsVisitante : placar.golsMandante };
}

function CentralDoJogo({ jogo, dados, eventoAgenda, onVoltar, onAbrirAtleta }) {
  const { useState } = React;
  const [ordem, setOrdem] = useState({ campo: "PASSE CERTO", dir: -1 });
  const p = jogo.placar;
  const estatisticas = ordenarEstatisticas(Object.keys(jogo.totais));
  const passeCerto = jogo.totais["PASSE CERTO"], passeErrado = jogo.totais["PASSE ERRADO"];
  const precisao = typeof passeCerto === "number" && typeof passeErrado === "number" && passeCerto + passeErrado > 0 ? passeCerto / (passeCerto + passeErrado) : null;
  const jogadores = jogo.jogadores.map(({ atleta, campos }) => ({ ...atleta, campos }));
  const destaquesDe = ["GOL", "ASSISTÊNCIA", "PASSE CERTO", "DESARME", "FINALIZAÇÃO"].filter((k) => estatisticas.includes(k)).slice(0, 4);
  const extras = {};
  jogadores.forEach((j) => {
    const partes = [];
    if (j.campos.GOL) partes.push(`${j.campos.GOL} gol${j.campos.GOL > 1 ? "s" : ""}`);
    if (typeof j.campos["PASSE CERTO"] === "number") partes.push(`${j.campos["PASSE CERTO"]} passes`);
    else if (typeof j.campos.DESARME === "number") partes.push(`${j.campos.DESARME} desarmes`);
    extras[j.id] = partes.join(" · ");
  });
  const convocados = eventoAgenda && eventoAgenda.convocacao ? [...(eventoAgenda.convocacao.titulares || []), ...(eventoAgenda.convocacao.reservas || [])] : [];
  const convocadosSemDados = convocados.filter((id) => !jogadores.some((j) => j.id === id)).map((id) => (dados.atletas || []).find((a) => a.id === id)).filter(Boolean);
  const ordenados = jogadores.slice().sort((a, b) => {
    const va = a.campos[ordem.campo], vb = b.campos[ordem.campo];
    if (ordem.campo === "nome") return nomeExibicao(a).localeCompare(nomeExibicao(b)) * ordem.dir * -1;
    return ((typeof vb === "number" ? vb : -1) - (typeof va === "number" ? va : -1)) * (ordem.dir === -1 ? 1 : -1);
  });
  const mandante = p.mandante || "Meia Noite";
  const visitante = p.visitante || "Adversário";

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>Central do Jogo</h1>
          <div className="crumb">MeuCT · Meia Noite EC · números da análise de jogo importada</div>
        </div>
        <div className="page-head-acoes">
          <button type="button" className="pill-btn" onClick={onVoltar}><Icone nome="voltar" />Voltar</button>
        </div>
      </div>

      <div className="placar-hero">
        <div className="placar-lado">
          <EscudoTime nome={mandante} />
          <b>{mandante}</b>
        </div>
        <div className="placar-centro">
          <div className="placar-eyebrow">{labelCategoriaEvento(jogo.categoria)}{p.competicao ? " · " + p.competicao : ""}</div>
          <div className="placar-gols">{p.golsMandante !== null ? `${p.golsMandante} x ${p.golsVisitante}` : "x"}</div>
          <div className="placar-info">{dataPorExtenso(jogo.data)} · {jogadores.length} atletas na análise</div>
        </div>
        <div className="placar-lado">
          <EscudoTime nome={visitante} />
          <b>{visitante}</b>
        </div>
      </div>

      <div className="stat-tiles">
        {precisao !== null && (
          <div className="stat-tile destaque">
            <span className="stat-rotulo">Precisão de passe</span>
            <b className="stat-numero">{formatarNumero(precisao * 100, 0)}%</b>
            <div className="stat-progresso" role="img" aria-label={`${formatarNumero(precisao * 100, 0)}% de passes certos`}><i style={{ width: (precisao * 100).toFixed(1) + "%" }}></i></div>
            <small>{passeCerto} certos de {passeCerto + passeErrado}</small>
          </div>
        )}
        {estatisticas.map((k) => {
          const lider = jogadores.filter((j) => typeof j.campos[k] === "number").sort((a, b) => b.campos[k] - a.campos[k])[0];
          return (
            <div className="stat-tile" key={k}>
              <span className="stat-rotulo">{rotuloEstatistica(k)}</span>
              <b className="stat-numero">{formatarNumero(jogo.totais[k], 0)}</b>
              <small>{lider && lider.campos[k] > 0 ? `Líder: ${nomeCurtoAtleta(lider)} (${lider.campos[k]})` : "Sem registro individual"}</small>
            </div>
          );
        })}
      </div>

      {destaquesDe.length > 0 && (
        <div className="panel">
          <div className="panel-head"><h3>Destaques</h3></div>
          <div className="destaques-grid">
            {destaquesDe.map((k) => {
              const top = jogadores.filter((j) => typeof j.campos[k] === "number" && j.campos[k] > 0).sort((a, b) => b.campos[k] - a.campos[k]).slice(0, 3);
              const max = top.length ? top[0].campos[k] : 1;
              return (
                <div className="destaque-bloco" key={k}>
                  <div className="destaque-titulo">{rotuloEstatistica(k)}</div>
                  {top.length === 0 ? <div className="muted" style={{ fontSize: 12.5 }}>Ninguém registrou.</div> : top.map((j, i) => (
                    <button type="button" className="destaque-linha" key={j.id} onClick={() => onAbrirAtleta(j.id)} title={"Abrir o perfil de " + j.nome}>
                      <span className="destaque-pos">{i + 1}</span>
                      <span className="destaque-avatar">{j.foto ? <img loading="lazy" decoding="async" src={j.foto} alt="" /> : iniciaisAtleta(j)}</span>
                      <span className="destaque-nome">{nomeCurtoAtleta(j)}</span>
                      <span className="destaque-barra"><i style={{ width: Math.max(8, (j.campos[k] / max) * 100) + "%" }}></i></span>
                      <b>{j.campos[k]}</b>
                    </button>
                  ))}
                </div>
              );
            })}
          </div>
        </div>
      )}

      <CampoConvocacao
        atletas={jogadores}
        onOpen={onAbrirAtleta}
        extras={extras}
        titulo="Quem jogou"
        subtitulo="Atletas que aparecem na análise do jogo, na posição cadastrada. Toque para abrir o perfil."
      />

      {convocadosSemDados.length > 0 && (
        <div className="access-note"><span><b>Convocados sem números na análise:</b> {convocadosSemDados.map(nomeExibicao).join(", ")}.</span></div>
      )}

      <div className="panel">
        <div className="panel-head"><h3>Números por atleta</h3></div>
        <div className="tabela-rolagem">
          <table>
            <thead>

                {estatisticas.map((k) => (
                  <th key={k} className="num"><button type="button" className={"th-ordenar" + (ordem.campo === k ? " ativo" : "")} onClick={() => setOrdem({ campo: k, dir: ordem.campo === k ? -ordem.dir : -1 })}>{rotuloEstatistica(k)}{ordem.campo === k ? (ordem.dir === -1 ? " ↓" : " ↑") : ""}</button></th>
                ))}
              </tr>
            </thead>
            <tbody>
              {ordenados.map((j) => (
                <tr key={j.id} className="clickable" onClick={() => onAbrirAtleta(j.id)}>
                  <td><b>{nomeExibicao(j)}</b></td>

                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function ViewJogos({ usuario, onNavigate }) {

  const disputados = listarJogosDisputados(dados).map((j) => {
    if (j.meta) return j;
    const ev = jogosAgenda.find((e) => e.data === j.data && eventoDaCategoria(e, j.categoria));
    if (!ev || !ev.adversario) return j;
    const p = { ...j.placar, competicao: j.placar.competicao || ev.competicao || "" };
    if (ehMeiaNoite(p.mandante) || !ehMeiaNoite(p.visitante)) { p.mandante = p.mandante || "Meia Noite"; p.visitante = ev.adversario; }
    else { p.mandante = ev.adversario; p.visitante = "Meia Noite"; }
    return { ...j, placar: p };

  const agendaSemAnalise = jogosAgenda.filter((e) => e.data < hoje && !disputados.some((j) => j.data === e.data && eventoDaCategoria(e, j.categoria)));

  function abrirAtleta(id) {

function precisaoPasse(totais) {
  const c = totais["PASSE CERTO"], e = totais["PASSE ERRADO"];
  return typeof c === "number" && typeof e === "number" && c + e > 0 ? c / (c + e) : null;
}

/* ---------- Monitoramento: bem-estar, carga, maturação e links de check-in ---------- */
function QrCode({ texto, tamanho }) {
  const qrPronto = useBibliotecas("qr") || !!window.qrcode;
  const svg = React.useMemo(() => {
    if (!window.qrcode) return null;
    try {
      const qr = window.qrcode(0, "M");
      qr.addData(texto);
      qr.make();
      return qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } catch (e) {
      return null;
    }
  }, [texto, qrPronto]);
  const estilo = { width: tamanho || 120, height: tamanho || 120 };
  if (!svg && !qrPronto) return <div className="qr" style={estilo} aria-label="Carregando QR code" />;
  if (!svg) return <div className="qr qr-falhou" style={estilo}>QR indisponível</div>;
  return <div className="qr" style={estilo} role="img" aria-label="QR code do link de check-in" dangerouslySetInnerHTML={{ __html: svg }} />;
}

function MiniBarras({ valores, destaqueUltima }) {
  const max = Math.max(1, ...valores);
  const w = 64, h = 22, gap = 2, bw = (w - gap * (valores.length - 1)) / valores.length;
  return (
    <svg className="mini-barras" viewBox={`0 0 ${w} ${h}`} width={w} height={h} role="img" aria-label={"Carga semanal: " + valores.map((v) => formatarNumero(v, 0)).join(", ")}>
      {valores.map((v, i) => {
        const bh = Math.max(v > 0 ? 2 : 0, (v / max) * h);
        return <rect key={i} x={i * (bw + gap)} y={h - bh} width={bw} height={bh} rx="1.5" className={destaqueUltima && i === valores.length - 1 ? "ultima" : ""} />;
      })}
    </svg>
  );
}

function TabBemEstar({ atletas, checkins, links, hoje }) {
  const { useState } = React;
  const [selecionado, setSelecionado] = useState(null);

  const respostasPorAtleta = {};
  (checkins || []).filter((c) => c.tipo === "bemestar").forEach((c) => { (respostasPorAtleta[c.atletaId] = respostasPorAtleta[c.atletaId] || []).push(c); });
  const comLink = links ? new Set(links.filter((l) => l.ativo).map((l) => l.atletaId)) : null;
  const esperados = comLink ? atletas.filter((a) => comLink.has(a.id)) : atletas;

  const linhas = atletas.map((a) => {
    const respostas = (respostasPorAtleta[a.id] || []).slice().sort((x, y) => x.data.localeCompare(y.data));
    const porData = {};
    respostas.forEach((r) => { porData[r.data] = r; });
    const celulas = dias.map((d) => ({ data: d, resposta: porData[d] || null, av: avaliarBemEstar(respostas, porData[d] || null) }));
    const hojeAv = celulas[celulas.length - 1].av;
    const ultima = respostas.length ? respostas[respostas.length - 1].data : null;
    return { atleta: a, respostas, celulas, hojeAv, respostaHoje: porData[hoje] || null, ultima };
  });
  const responderamHoje = linhas.filter((l) => l.respostaHoje).length;
  const alertaHoje = linhas.filter((l) => l.hojeAv && (l.hojeAv.abaixo || l.hojeAv.critico));
  const dorAlta = linhas.filter((l) => l.respostaHoje && Number(l.respostaHoje.dor) <= 2);
  const sumidos = esperados.filter((a) => { const l = linhas.find((x) => x.atleta.id === a.id); return !l.ultima || diasEntreIso(l.ultima, hoje) >= 3; });
  const ordenadas = linhas.slice().sort((x, y) => {
    const fx = x.hojeAv && (x.hojeAv.abaixo || x.hojeAv.critico) ? 0 : 1;
    const fy = y.hojeAv && (y.hojeAv.abaixo || y.hojeAv.critico) ? 0 : 1;
    return fx - fy || nomeExibicao(x.atleta).localeCompare(nomeExibicao(y.atleta));
  });
  const sel = selecionado ? linhas.find((l) => l.atleta.id === selecionado.atletaId) : null;
  const celSel = sel ? sel.celulas.find((c) => c.data === selecionado.data) : null;

  return (

        <div className="kpi-card acento-vermelho"><div className="label">Abaixo do normal ou com item crítico hoje</div><div className="value">{alertaHoje.length}</div></div>
        <div className="kpi-card acento-amarelo"><div className="label">Dor muscular alta hoje</div><div className="value">{dorAlta.length}</div></div>
        <div className="kpi-card"><div className="label">Sem responder há 3 dias ou mais</div><div className="value">{sumidos.length}</div></div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <h3>Bem-estar dos últimos 14 dias</h3>

            <span>pior</span>
            {["hm-1", "hm-2", "hm-3", "hm-4", "hm-5"].map((c) => <i key={c} className={c}></i>)}
            <span>melhor</span>
          </div>
        </div>
        {atletas.length === 0 ? <div className="empty-state">Nenhum atleta nesta categoria.</div> : (
          <div className="tabela-rolagem">
            <table className="heatmap">
              <thead>
                <tr>
                  <th className="hm-nome">Atleta</th>
                  {dias.map((d) => <th key={d} className={"hm-dia" + (d === hoje ? " hoje" : "")}><span>{diaSemanaCurto(d).slice(0, 3)}</span>{dataCurta(d)}</th>)}
                </tr>

              <tbody>

              <button type="button" className="link-btn" onClick={() => setSelecionado(null)}>Fechar</button>
            </div>
            <div className="hm-itens">

                const v = Number(celSel.resposta[it.id]);

                    <span className="hm-item-escala" role="img" aria-label={`${it.label}: ${v} de 5`}>{[1, 2, 3, 4, 5].map((n) => <i key={n} className={n <= v ? "cheio nivel-" + v : ""}></i>)}</span>

          </div>
        )}
        <div className="nota-metodo">Total de 5 a 25 (cinco itens de 1 a 5, quanto maior melhor). ▼ marca um dia bem abaixo do normal do próprio atleta (1,5 desvio-padrão e pelo menos 3 pontos abaixo da média dos 28 dias anteriores, com pelo menos 7 respostas) ou com algum item marcado 1.</div>
      </div>
    </React.Fragment>
  );
}

function TabCarga({ atletas, todosAtletas, eventos, checkins, hoje, onRecarregar }) {
  const { useState, useEffect } = React;
  const sessoes = eventos.filter((e) => (e.tipo === "treino" || e.tipo === "jogo") && e.data <= hoje && diasEntreIso(e.data, hoje) <= 28).slice().reverse();
  const [sessaoId, setSessaoId] = useState(() => { const p = sessaoCargaPendente; sessaoCargaPendente = null; return p || (sessoes[0] ? sessoes[0].id : ""); });
  const sessao = sessoes.find((s) => s.id === sessaoId) || eventos.find((s) => s.id === sessaoId) || null;
  const [valores, setValores] = useState({});
  const [salvando, setSalvando] = useState(false);
  const [mensagem, setMensagem] = useState(null);
  const [alterado, setAlterado] = useState(false);

  useEffect(() => {
    if (!sessao) return;
    const v = {};
    Object.entries(sessao.cargas || {}).forEach(([id, c]) => { v[id] = { pse: String(c.pse), minutos: c.minutos ? String(c.minutos) : "" }; });
    setValores(v); setAlterado(false);
  }, [sessaoId, eventos]);
  useEffect(() => { setMensagem(null); }, [sessaoId]);

  const participantes = sessao ? todosAtletas.filter((a) => eventoDaCategoria(sessao, normalizarCategoria(a.categoria))) : [];
  const pseAtleta = {};
  if (sessao) (checkins || []).forEach((c) => { if (c.tipo === "pse" && c.data === sessao.data) pseAtleta[c.atletaId] = c.pse; });
  const dur = sessao ? duracaoPadrao(sessao) : 90;
  const setCampo = (id, campo, valor) => { setValores((v) => ({ ...v, [id]: { ...(v[id] || { pse: "", minutos: "" }), [campo]: valor } })); setAlterado(true); setMensagem(null); };
  const qtdAutorrelato = participantes.filter((a) => typeof pseAtleta[a.id] === "number" && !(valores[a.id] && valores[a.id].pse !== "")).length;

  function usarRespostas() {
    setValores((v) => {
      const n = { ...v };
      participantes.forEach((a) => { if (typeof pseAtleta[a.id] === "number" && !(n[a.id] && n[a.id].pse !== "")) n[a.id] = { pse: String(pseAtleta[a.id]), minutos: (n[a.id] && n[a.id].minutos) || "" }; });
      return n;
    });
    setAlterado(true);
  }
  async function salvar() {
    if (!sessao) return;
    setSalvando(true); setMensagem(null);
    try {
      const cargas = {};
      Object.entries(valores).forEach(([id, c]) => {
        if (!c || c.pse === "" || c.pse === undefined) return;
        const pse = Math.max(0, Math.min(10, Math.round(Number(c.pse))));
        const minutos = c.minutos === "" ? null : Math.max(0, Math.round(Number(c.minutos)));
        cargas[id] = minutos ? { pse, minutos } : { pse };
      });
      await atualizarCamposEvento(sessao.id, { cargas });
      setAlterado(false);
      setMensagem({ tipo: "ok", texto: `Carga salva para ${Object.keys(cargas).length} atleta(s).` });
      onRecarregar && onRecarregar();
    } catch (e) {
      setMensagem({ tipo: "erro", texto: "Não consegui salvar: " + e.message });
    } finally {
      setSalvando(false);
    }
  }

  const cargas = calcularCargas(eventos, checkins, todosAtletas, hoje);
  const resumos = atletas.map((a) => ({ atleta: a, r: resumoCarga(cargas[a.id], hoje) }));
  const ordem = { pico: 0, atencao: 1, baixa: 2, ideal: 3, insuficiente: 4, sem_dados: 5 };
  resumos.sort((x, y) => ordem[x.r.faixa] - ordem[y.r.faixa] || (y.r.acwr || 0) - (x.r.acwr || 0));
  const semanasRotulos = [5, 4, 3, 2, 1, 0].map((k) => { const fim = isoMaisDias(hoje, -k * 7); const ini = isoMaisDias(fim, -6); return dataCurta(ini) + "–" + dataCurta(fim); });
  const comDados = resumos.filter((x) => x.r.semanas.some((v) => v > 0));
  const mediaSemana = [0, 1, 2, 3, 4, 5].map((i) => comDados.length ? Math.round(comDados.reduce((s, x) => s + x.r.semanas[i], 0) / comDados.length) : 0);
  const contagem = { pico: 0, atencao: 0 };
  resumos.forEach((x) => { if (x.r.faixa === "pico") contagem.pico++; if (x.r.faixa === "atencao") contagem.atencao++; });

  return (
    <React.Fragment>
      <div className="kpi-row">
        <div className="kpi-card acento-vermelho"><div className="label">Pico de carga (razão acima de 1,5)</div><div className="value">{contagem.pico}</div></div>
        <div className="kpi-card acento-amarelo"><div className="label">Subindo rápido (1,3 a 1,5)</div><div className="value">{contagem.atencao}</div></div>
        <div className="kpi-card"><div className="label">Sessões nos últimos 7 dias</div><div className="value">{eventos.filter((e) => (e.tipo === "treino" || e.tipo === "jogo") && e.data <= hoje && diasEntreIso(e.data, hoje) <= 6).length}</div></div>
        <div className="kpi-card"><div className="label">Carga média da semana (UA por atleta)</div><div className="value">{formatarNumero(mediaSemana[5], 0)}</div></div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <h3>Lançar carga da sessão</h3>
          {sessoes.length > 0 && (
            <select value={sessaoId} onChange={(e) => setSessaoId(e.target.value)} aria-label="Sessão">
              {sessoes.map((s) => <option key={s.id} value={s.id}>{formatarData(s.data)} · {labelTipoEvento(s.tipo)} · {labelCategoriaEvento(s.categoria)}{s.cargas && Object.keys(s.cargas).length ? " (lançada)" : ""}</option>)}
            </select>
          )}
        </div>
        {!sessao ? (
          <div className="empty-state">Nenhum treino ou jogo nos últimos 28 dias. Cadastre as sessões na Agenda.</div>
        ) : (
          <React.Fragment>
            <div className="carga-topo">
              <span><b>{tituloEvento(sessao)}</b> · {dataPorExtenso(sessao.data)}{sessao.hora ? " · " + sessao.hora : ""} · {dur} min</span>
              <span className="carga-botoes">
                {qtdAutorrelato > 0 && <button type="button" className="pill-btn" onClick={usarRespostas}>Usar {qtdAutorrelato} resposta{qtdAutorrelato > 1 ? "s" : ""} dos atletas</button>}
                <button type="button" className="pill-btn primary" onClick={salvar} disabled={salvando || !alterado}>{salvando ? "Salvando..." : alterado ? "Salvar carga" : "Carga salva"}</button>
              </span>
            </div>
            {mensagem && <div className="access-note" style={{ margin: "0 18px 12px", borderLeftColor: mensagem.tipo === "ok" ? "var(--st-good)" : "var(--st-crit)" }}><span>{mensagem.texto}</span></div>}
            <div className="tabela-rolagem">
              <table className="carga-tabela">
                <thead><tr><th>Atleta</th><th>PSE (0 a 10)</th><th>Minutos</th><th className="num">Atleta respondeu</th><th className="num">Carga (UA)</th></tr></thead>
                <tbody>
                  {ordenarPorPosicao(participantes).map((a) => {
                    const v = valores[a.id] || { pse: "", minutos: "" };
                    const min = v.minutos === "" ? dur : Number(v.minutos);
                    const ua = v.pse === "" ? null : Number(v.pse) * min;
                    return (
                      <tr key={a.id}>
                        <td><b>{nomeExibicao(a)}</b> <span className="muted">{SIGLA_POSICAO[a.posicao] || ""}</span></td>
                        <td>
                          <select className={"pse-select" + (v.pse !== "" ? " pse-" + v.pse : "")} value={v.pse} onChange={(e) => setCampo(a.id, "pse", e.target.value)} aria-label={"PSE de " + nomeExibicao(a)}>
                            <option value="">Não treinou / sem dado</option>
                            {ESCALA_PSE.map((p) => <option key={p.v} value={String(p.v)}>{p.v}{p.t ? " · " + p.t : ""}</option>)}
                          </select>
                        </td>
                        <td><input type="number" min="0" max="300" className="min-input" value={v.minutos} placeholder={String(dur)} onChange={(e) => setCampo(a.id, "minutos", e.target.value)} aria-label={"Minutos de " + nomeExibicao(a)} /></td>
                        <td className="num">{typeof pseAtleta[a.id] === "number" ? <span className="badge neutro">{pseAtleta[a.id]}</span> : <span className="muted">-</span>}</td>
                        <td className="num"><b>{ua === null ? "-" : formatarNumero(ua, 0)}</b></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </React.Fragment>
        )}
      </div>

      <div className="charts-row">
        <GraficoComparativo titulo="Carga semanal média por atleta (UA)" labels={semanasRotulos} datasets={[{ label: "Carga média", data: mediaSemana, backgroundColor: COR_SERIE }]} />
        <div className="chart-box">
          <h4>Como ler</h4>
          <div className="nota-metodo" style={{ padding: 0, border: "none" }}>
            <p><b>Carga da sessão</b> = PSE (0 a 10) × minutos, em unidades arbitrárias (UA).</p>
            <p><b>Aguda</b> = soma dos últimos 7 dias. <b>Crônica</b> = média semanal dos últimos 28 dias.</p>
            <p><b>Razão aguda:crônica</b>: entre 0,8 e 1,3 é a faixa usada como referência segura; acima de 1,5 indica um salto de carga que merece conversa com a comissão e a fisioterapia. É um indicador de monitoramento, não um diagnóstico.</p>
          </div>
        </div>
      </div>

      <div className="panel">
        <div className="panel-head"><h3>Carga por atleta</h3></div>
        <div className="tabela-rolagem">
          <table>
            <thead><tr><th>Atleta</th><th className="num">Aguda (7 dias)</th><th className="num">Crônica (média semanal)</th><th className="num">Razão</th><th>Situação</th><th>Últimas 6 semanas</th></tr></thead>
            <tbody>
              {resumos.map(({ atleta, r }) => (
                <tr key={atleta.id}>
                  <td><b>{nomeExibicao(atleta)}</b> <span className="muted">{atleta.categoria}</span></td>
                  <td className="num">{formatarNumero(r.aguda, 0)}</td>
                  <td className="num">{formatarNumero(r.cronica, 0)}</td>
                  <td className="num"><b>{r.acwr === null ? "-" : formatarNumero(r.acwr, 2)}</b></td>
                  <td><span className={"badge " + FAIXAS_ACWR[r.faixa].sinal}>{FAIXAS_ACWR[r.faixa].label}</span></td>
                  <td><MiniBarras valores={r.semanas} destaqueUltima /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </React.Fragment>
  );
}

function copiarTexto(texto) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(texto);
  return new Promise((res, rej) => {
    try {
      const t = document.createElement("textarea");
      t.value = texto; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t); res();
    } catch (e) { rej(e); }
  });
}

function TabLinks({ atletas, links, onRecarregar }) {
  const { useState, useEffect } = React;
  const [ocupado, setOcupado] = useState(null);
  const [aberto, setAberto] = useState(null);
  const [copiado, setCopiado] = useState(null);
  const [erro, setErro] = useState(null);
  const [imprimindo, setImprimindo] = useState(false);
  const ativos = {};
  (links || []).filter((l) => l.ativo).forEach((l) => { ativos[l.atletaId] = l; });
  const semLink = atletas.filter((a) => !ativos[a.id]);
  const paraImprimir = atletas.filter((a) => ativos[a.id]).map((a) => ({ atleta: a, token: ativos[a.id].token }));

  useEffect(() => {
    if (!imprimindo) return;
    const fim = () => { document.body.classList.remove("imprimindo-cartoes"); setImprimindo(false); };
    document.body.classList.add("imprimindo-cartoes");
    window.addEventListener("afterprint", fim, { once: true });
    const t = setTimeout(() => window.print(), 250);
    return () => { clearTimeout(t); window.removeEventListener("afterprint", fim); document.body.classList.remove("imprimindo-cartoes"); };
  }, [imprimindo]);

  async function executar(chave, fn) {
    setOcupado(chave); setErro(null);
    try { await fn(); await onRecarregar(); }
    catch (e) { setErro("Não foi possível concluir: " + e.message); }
    finally { setOcupado(null); }
  }
  const gerarFaltantes = () => executar("lote", async () => { for (const a of semLink) await criarLinkCheckin(a); });
  const gerar = (a) => executar(a.id, () => criarLinkCheckin(a));
  const renovar = (a) => executar(a.id, async () => { await desativarLinkCheckin(ativos[a.id].token); await criarLinkCheckin(a); });
  const desativar = (a) => executar(a.id, () => desativarLinkCheckin(ativos[a.id].token));
  function copiar(a) {
    copiarTexto(urlCheckin(ativos[a.id].token)).then(() => { setCopiado(a.id); setTimeout(() => setCopiado(null), 1800); }).catch(() => setErro("Não consegui copiar. Abra o QR e copie o link que aparece embaixo."));
  }

  return (
    <React.Fragment>
      <div className="access-note">
        <span>Cada atleta tem um link próprio (e um QR code) que abre o check-in no celular, sem senha. O link só registra respostas daquele atleta e não mostra nenhum dado do clube. Se um link vazar, use "Gerar novo" e o antigo para de funcionar.</span>
      </div>
      <div className="links-acoes">
        <button type="button" className="pill-btn primary" onClick={gerarFaltantes} disabled={!semLink.length || !!ocupado}>{ocupado === "lote" ? "Gerando..." : semLink.length ? `Gerar ${semLink.length} link${semLink.length > 1 ? "s" : ""} que falta${semLink.length > 1 ? "m" : ""}` : "Todos têm link"}</button>
        <button type="button" className="pill-btn" onClick={() => setImprimindo(true)} disabled={!paraImprimir.length}>Imprimir cartões com QR ({paraImprimir.length})</button>
      </div>
      {erro && <div className="access-note" style={{ borderLeftColor: "var(--st-crit)" }}><span>{erro}</span></div>}
      <div className="panel">
        <div className="panel-head"><h3>Links de check-in</h3><span className="muted" style={{ fontSize: 12 }}>{paraImprimir.length} de {atletas.length} com link ativo</span></div>
        <div className="tabela-rolagem">
          <table>
            <thead><tr><th>Atleta</th><th>Categoria</th><th>Link</th><th>Ações</th></tr></thead>
            <tbody>
              {atletas.map((a) => {
                const l = ativos[a.id];
                return (
                  <React.Fragment key={a.id}>
                    <tr>
                      <td><b>{nomeExibicao(a)}</b></td>
                      <td className="muted">{a.categoria}</td>
                      <td>{l ? <span className="badge verde">Ativo</span> : <span className="badge neutro">Sem link</span>}</td>
                      <td><div className="links-botoes">
                        {!l && <button type="button" className="link-btn" onClick={() => gerar(a)} disabled={!!ocupado}>{ocupado === a.id ? "Gerando..." : "Gerar link"}</button>}
                        {l && <button type="button" className="link-btn" onClick={() => copiar(a)}>{copiado === a.id ? "Copiado" : "Copiar link"}</button>}
                        {l && <button type="button" className="link-btn" onClick={() => setAberto(aberto === a.id ? null : a.id)}>{aberto === a.id ? "Esconder QR" : "Mostrar QR"}</button>}
                        {l && <button type="button" className="link-btn" onClick={() => renovar(a)} disabled={!!ocupado}>Gerar novo</button>}
                        {l && <button type="button" className="link-btn perigo" onClick={() => desativar(a)} disabled={!!ocupado}>Desativar</button>}
                      </div></td>
                    </tr>
                    {l && aberto === a.id && (
                      <tr className="linha-qr"><td colSpan={4}>
                        <div className="qr-bloco">
                          <QrCode texto={urlCheckin(l.token)} tamanho={132} />
                          <div><b>{a.nome}</b><div className="qr-url">{urlCheckin(l.token)}</div><div className="muted" style={{ fontSize: 12.5, marginTop: 6 }}>Mande por WhatsApp pro atleta ou deixe ele apontar a câmera aqui.</div></div>
                        </div>
                      </td></tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      {imprimindo && <CartoesCheckin itens={paraImprimir} />}
    </React.Fragment>
  );
}

  useEffect(() => {
    db.collection(COL_CHECKIN_LINKS).doc(token).get()
      .then((s) => { const d = s.exists ? s.data() : null; setLink(d && d.ativo ? { token, ...d } : null); })
      .catch(() => setLink(null));
    const lido = {};
    ["bemestar", "pse"].forEach((t) => { try { if (localStorage.getItem(chaveCheckinLocal(token, hoje, t))) lido[t] = "ja"; } catch (e) { /* navegador sem storage: segue */ } });
    setEstado(lido);
    if (lido.bemestar && !lido.pse) setAba("pse");
  }, []);

  function marcar(tipo, situacao) {
    setEstado((e) => ({ ...e, [tipo]: situacao }));
    try { localStorage.setItem(chaveCheckinLocal(token, hoje, tipo), "1"); } catch (e) { /* sem storage */ }
  }
  async function enviar(tipo) {
    if (!link || enviando) return;
    setEnviando(true); setErro(null);
    const doc = { token, atletaId: link.atletaId, data: hoje, tipo, criado_em: firebase.firestore.FieldValue.serverTimestamp() };
    if (tipo === "bemestar") {
      ITENS_BEMESTAR.forEach((it) => { doc[it.id] = respostas[it.id]; });
      if (comentario.trim()) doc.comentario = comentario.trim().slice(0, 280);
    } else {
      doc.pse = pse;
    }
    try {
      await db.collection(COL_CHECKINS).doc(`${token}_${hoje}_${tipo}`).set(doc);
      marcar(tipo, "enviado");
    } catch (e) {
      if (e && (e.code === "permission-denied" || /permission/i.test(e.message || ""))) marcar(tipo, "ja");
      else setErro("Não deu pra enviar agora. Confira a internet e tente de novo.");
    } finally {
      setEnviando(false);
    }
  }

  const completo = ITENS_BEMESTAR.every((it) => respostas[it.id]);
  const dataHoje = dataPorExtenso(hoje);

  return (
    <div className="checkin-pagina">
      <div className="checkin-caixa">
        <div className="checkin-topo">
          <img src={ESCUDO_MEIA_NOITE} className="checkin-escudo" alt="Escudo do Meia Noite EC" />
          <div className="checkin-eyebrow">Meia Noite Esporte Clube</div>
          <h1>Check-in <span>diário</span></h1>
          {link && <div className="checkin-ola">Olá, <b>{link.nome}</b>! · {dataHoje}</div>}
        </div>

        {link === undefined && <div className="checkin-card"><div className="checkin-msg">Carregando...</div></div>}
        {link === null && (
          <div className="checkin-card">
            <div className="checkin-msg"><b>Link inválido ou desativado.</b><br />Peça um link novo pra comissão técnica.</div>
          </div>
        )}

        {link && (
          <React.Fragment>
            <div className="checkin-abas" role="tablist">
              <button type="button" role="tab" aria-selected={aba === "bemestar"} className={aba === "bemestar" ? "active" : ""} onClick={() => setAba("bemestar")}>
                Antes do treino{estado.bemestar ? " ✓" : ""}
              </button>
              <button type="button" role="tab" aria-selected={aba === "pse"} className={aba === "pse" ? "active" : ""} onClick={() => setAba("pse")}>
                Depois do treino{estado.pse ? " ✓" : ""}
              </button>
            </div>

            {aba === "bemestar" && (
              estado.bemestar ? (
                <div className="checkin-card checkin-ok">
                  <div className="checkin-check" aria-hidden="true">✓</div>
                  <b>{estado.bemestar === "enviado" ? `Valeu, ${link.nome}! Resposta registrada.` : "Você já respondeu isso hoje."}</b>
                  <p>Depois do treino, volte aqui e conte como foi o esforço.</p>
                  {!estado.pse && <button type="button" className="checkin-botao secundario" onClick={() => setAba("pse")}>Ir para depois do treino</button>}
                </div>
              ) : (
                <div className="checkin-card">
                  <div className="checkin-titulo">Como você está hoje?</div>
                  {ITENS_BEMESTAR.map((it) => (
                    <div className="checkin-pergunta" key={it.id}>
                      <div className="checkin-pergunta-texto">{it.pergunta}</div>
                      <div className="checkin-escala" role="radiogroup" aria-label={it.pergunta}>
                        {[1, 2, 3, 4, 5].map((n) => (
                          <button key={n} type="button" role="radio" aria-checked={respostas[it.id] === n} aria-label={`${n} de 5${n === 1 ? ": " + it.pior : n === 5 ? ": " + it.melhor : ""}`}
                            className={"checkin-opcao nivel-" + n + (respostas[it.id] === n ? " marcada" : "")} onClick={() => setRespostas((r) => ({ ...r, [it.id]: n }))}>
                            <span className="emoji" aria-hidden="true">{EMOJIS_BEMESTAR[n - 1]}</span>
                            <span className="num">{n}</span>
                          </button>
                        ))}
                      </div>
                      <div className="checkin-extremos"><span>{it.pior}</span><span>{it.melhor}</span></div>
                    </div>
                  ))}
                  <label className="checkin-comentario">
                    Quer contar alguma coisa? (opcional)
                    <textarea maxLength={280} value={comentario} onChange={(e) => setComentario(e.target.value)} placeholder="Ex.: dormi mal por causa da prova" />
                  </label>
                  {erro && <div className="checkin-erro">{erro}</div>}
                  <button type="button" className="checkin-botao" onClick={() => enviar("bemestar")} disabled={!completo || enviando}>{enviando ? "Enviando..." : completo ? "Enviar" : "Responda as 5 perguntas"}</button>
                </div>
              )
            )}

            {aba === "pse" && (
              estado.pse ? (
                <div className="checkin-card checkin-ok">
                  <div className="checkin-check" aria-hidden="true">✓</div>
                  <b>{estado.pse === "enviado" ? `Valeu, ${link.nome}! Esforço registrado.` : "Você já registrou o esforço de hoje."}</b>
                  <p>Amanhã tem check-in de novo. Bom descanso!</p>
                </div>
              ) : (
                <div className="checkin-card">
                  <div className="checkin-titulo">Quanto o treino de hoje foi puxado?</div>
                  <div className="checkin-sub">Responda uns 30 minutos depois do treino, pensando no treino inteiro.</div>
                  <div className="checkin-pse" role="radiogroup" aria-label="Esforço do treino de 0 a 10">
                    {ESCALA_PSE.slice().reverse().map((p) => (
                      <button key={p.v} type="button" role="radio" aria-checked={pse === p.v} className={"pse-opcao pse-" + p.v + (pse === p.v ? " marcada" : "")} onClick={() => setPse(p.v)}>
                        <span className="pse-num">{p.v}</span>
                        <span className="pse-texto">{p.t}</span>
                      </button>
                    ))}
                  </div>
                  {erro && <div className="checkin-erro">{erro}</div>}
                  <button type="button" className="checkin-botao" onClick={() => enviar("pse")} disabled={pse === null || enviando}>{enviando ? "Enviando..." : pse === null ? "Escolha um número" : "Enviar"}</button>
                </div>
              )
            )}
          </React.Fragment>
        )}
        <div className="checkin-rodape">Suas respostas vão só para a comissão técnica e a equipe de saúde do Meia Noite.</div>
      </div>
    </div>
  );
}

/* ---------- Perfil do atleta: disponibilidade e monitoramento ---------- */
function BlocoDisponibilidade({ disp }) {
  if (!disp || disp.status === "disponivel") return null;
  return (
    <div className={"disp-bloco " + disp.status}>
      <span className={"badge " + DISPONIBILIDADE[disp.status].sinal}>{disp.status === "fora" ? "Fora do próximo jogo" : "Com restrição"}</span>
      <ul>{disp.motivos.map((m, i) => <li key={i}>{m}</li>)}</ul>
    </div>
  );
}

function PainelMonitoramentoAtleta({ atleta }) {
  const { useState, useEffect } = React;
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState(null);
  const hoje = hojeISO();

  useEffect(() => {
    let vivo = true;
    Promise.all([carregarCheckinsAtleta(atleta.id), carregarEventos()])
      .then(([ck, ev]) => { if (vivo) setDados({ checkins: ck, eventos: ev }); })
      .catch((e) => { if (vivo) setErro(e.message); });
    return () => { vivo = false; };
  }, [atleta.id]);

  if (erro) return <div className="empty-state">Não consegui carregar o monitoramento: {erro}</div>;
  if (!dados) return <div className="empty-state">Carregando...</div>;

  const respostas = dados.checkins.filter((c) => c.tipo === "bemestar").sort((a, b) => a.data.localeCompare(b.data));
  const dias = Array.from({ length: 14 }, (_, i) => isoMaisDias(hoje, i - 13));
  const porData = {};
  respostas.forEach((r) => { porData[r.data] = r; });
  const ultima = respostas.length ? respostas[respostas.length - 1] : null;
  const avUltima = ultima ? avaliarBemEstar(respostas, ultima) : null;
  const cargas = calcularCargas(dados.eventos, dados.checkins, [atleta], hoje);
  const r = resumoCarga(cargas[atleta.id], hoje);

  return (
    <div className="monit-atleta">
      <div className="monit-bloco">
        <div className="monit-rotulo">Bem-estar (14 dias)</div>
        <div className="monit-faixa">
          {dias.map((d) => {
            const resp = porData[d];
            const av = resp ? avaliarBemEstar(respostas, resp) : null;
            return (
              <span key={d} className={"monit-dia " + (av ? classeTotalBemEstar(av.total) : "vazia") + (av && (av.abaixo || av.critico) ? " alerta" : "")} title={formatarData(d) + (av ? `: ${av.total} de 25` : ": sem resposta")}>
                {av ? av.total : ""}
              </span>
            );
          })}
        </div>
        <div className="monit-legenda">
          {ultima ? (
            <React.Fragment>
              Última resposta: {formatarData(ultima.data)}, total {avUltima.total} de 25
              {avUltima.abaixo ? " · abaixo do normal dele" : ""}{avUltima.critico ? " · item marcado 1" : ""}
              {ultima.comentario ? <em> · "{ultima.comentario}"</em> : null}
            </React.Fragment>
          ) : "Nenhuma resposta de check-in ainda."}
        </div>
      </div>
      <div className="monit-bloco">
        <div className="monit-rotulo">Carga de treino</div>
        <div className="monit-carga">
          <div><small>Aguda (7 dias)</small><b>{formatarNumero(r.aguda, 0)}</b></div>
          <div><small>Crônica (média semanal)</small><b>{formatarNumero(r.cronica, 0)}</b></div>
          <div><small>Razão</small><b>{r.acwr === null ? "-" : formatarNumero(r.acwr, 2)}</b></div>
          <div><small>Situação</small><span className={"badge " + FAIXAS_ACWR[r.faixa].sinal}>{FAIXAS_ACWR[r.faixa].label}</span></div>
          <div className="monit-semanas"><small>Últimas 6 semanas</small><MiniBarras valores={r.semanas} destaqueUltima /></div>
        </div>
      </div>
    </div>
  );
}

function AppLogado({ usuario }) {
  const [pagina, setPagina] = useState(temPermissao(usuario, "admin") ? "admin" : (usuario.modulos || [])[0] || "admin");
  const [menuAberto, setMenuAberto] = useState(false);
  const [buscaAberta, setBuscaAberta] = useState(false);
  const naoLidas = useNaoLidas(usuario, pagina);

  function navegar(id) {
    setPagina(id);
    setMenuAberto(false);
    window.scrollTo(0, 0);
  }

  useEffect(() => {
    function atalho(e) {
      const alvo = e.target;
      const digitando = alvo && (alvo.tagName === "INPUT" || alvo.tagName === "TEXTAREA" || alvo.tagName === "SELECT" || alvo.isContentEditable);
      if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); setBuscaAberta(true); }
      else if (e.key === "/" && !digitando) { e.preventDefault(); setBuscaAberta(true); }
    }
    window.addEventListener("keydown", atalho);
    return () => window.removeEventListener("keydown", atalho);
  }, []);

  const paginasComponente = {
    elenco: <ViewElenco usuario={usuario} />,
    atualizacoes: <PainelAtualizacoes usuario={usuario} />,
    admin: <ViewAdmin usuario={usuario} onNavigate={navegar} />,
    psicologia: <ViewPsicologia />,
    fisioterapia: <ViewFisioterapia usuario={usuario} />,
    fisiologia: <ViewFisiologia />,
    medicina: <ViewMedicina />,
    social: <ViewSocial />,
    desempenho: <EmbedExterno url={URL_DASHBOARD_DESEMPENHO} titulo="Dashboard de Desempenho" />,
    treinador: <PainelTreinador usuario={usuario} />,
    usuarios: <PainelUsuarios usuarioAtual={usuario} />,
    relatorios: <CentralRelatorios usuario={usuario} />,
    agenda: <ViewAgenda usuario={usuario} onNavigate={navegar} />,
    jogos: <ViewJogos usuario={usuario} onNavigate={navegar} />,
    monitoramento: <ViewMonitoramento usuario={usuario} />,
  };

  const podeVerPagina = pagina === "elenco" ? true
    : pagina === "atualizacoes" ? true
    : pagina === "agenda" ? true
    : pagina === "jogos" ? podeVerJogos(usuario)
    : pagina === "monitoramento" ? podeVerMonitoramento(usuario)
    : pagina === "usuarios" ? usuario.role === "admin"
    : pagina === "relatorios" ? temAcessoRelatorios(usuario)
    : temPermissao(usuario, pagina);

  return (
    <div className="app-shell">
      <HubBar current={pagina} onNavigate={navegar} usuario={usuario} onSair={sair} naoLidas={naoLidas} menuAberto={menuAberto} setMenuAberto={setMenuAberto} />
      <div className="main-content">
        <Topbar pagina={pagina} usuario={usuario} naoLidas={naoLidas} onNavigate={navegar} onAbrirMenu={() => setMenuAberto(true)} onAbrirBusca={() => setBuscaAberta(true)} />
        <ChatWidget />
        {podeVerPagina ? paginasComponente[pagina] : <SemPermissao />}
        <BuscaRapida usuario={usuario} aberta={buscaAberta} onFechar={() => setBuscaAberta(false)} onNavigate={navegar} />
      </div>
    </div>
  );
}

function App() {
  const [authUser, setAuthUser] = useState(undefined); // undefined = ainda checando, null = deslogado
  const [usuario, setUsuario] = useState(null);
  const [carregandoPerm, setCarregandoPerm] = useState(false);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      setAuthUser(u);
      if (u) {
        setCarregandoPerm(true);
        const perm = await buscarPermissoes(u.uid);
        setUsuario(perm);
        setCarregandoPerm(false);
      } else {
        setUsuario(null);
      }
    });
    return unsub;
  }, []);

  if (authUser === undefined || carregandoPerm) {
    return <div className="auth-pendente"><div className="empty-state">Carregando...</div></div>;
  }
  if (!authUser) {
    return <AuthScreen />;
  }
  if (!usuario || (usuario.role !== "admin" && (usuario.modulos || []).length === 0)) {
    return <TelaPendente usuario={usuario || { email: authUser.email }} />;
  }
  return <AppLogado usuario={usuario} />;
}

/** Link de check-in (?c=TOKEN) abre a página pública do atleta; o resto passa pelo login normal. */
function Raiz() {
  const token = new URLSearchParams(location.search).get("c");
  return token ? <CheckinPublico token={token.trim()} /> : <App />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Raiz />);
