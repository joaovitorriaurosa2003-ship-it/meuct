.resultado-chip.vitoria{background:var(--st-good);} .resultado-chip.empate{background:#64748B;} .resultado-chip.derrota{background:var(--st-crit);}
.placar-hero{position:relative; overflow:hidden; border-radius:22px; margin-bottom:22px; padding:26px 28px; color:#fff; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:22px;
  background:linear-gradient(135deg,rgba(11,21,40,0.74) 0%,rgba(8,15,30,0.92) 100%), var(--arte-meia-noite) center/cover no-repeat, #0B1528;
  box-shadow:0 24px 50px rgba(10,18,34,0.28); border:1px solid rgba(255,255,255,0.06);}
.placar-hero::after{content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:linear-gradient(90deg,var(--pitch),var(--gold-400));}
.placar-lado{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; min-width:0;}
.placar-lado .time-escudo{width:76px; height:76px; font-size:24px;}
.placar-lado b{font-family:var(--font-display); font-size:24px; font-weight:700; line-height:1.1;}
.placar-centro{text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px;}
.placar-eyebrow{font-size:11px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--pitch);}
.placar-gols{font-family:var(--font-display); font-size:64px; font-weight:700; line-height:1; letter-spacing:.02em; background:var(--gold-grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
.placar-info{font-size:13px; color:var(--mn-text-2);}
.placar-hero.compacto{padding:18px 22px;}
.placar-hero.compacto .placar-gols{font-size:44px;}
.placar-hero.compacto .placar-lado .time-escudo{width:58px; height:58px; font-size:19px;}
.placar-hero.compacto .placar-lado b{font-size:20px;}
.stat-tiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:22px;}
td.num.zero{color:var(--muted-2);}
.stat-tile{background:var(--surface); border:1px solid var(--line-soft); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:4px; box-shadow:var(--shadow-sm);}
.stat-tile.destaque{background:linear-gradient(160deg,#15264A 0%,#0B1528 100%); border-color:rgba(255,255,255,0.06); color:#fff;}
.stat-rotulo{font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
.stat-tile.destaque .stat-rotulo{color:var(--pitch);}
.stat-numero{font-family:var(--font-display); font-size:38px; font-weight:700; line-height:1.05; color:var(--ink);}
.stat-tile.destaque .stat-numero{color:#fff;}
.stat-tile small{font-size:12px; color:var(--muted);}
.stat-tile.destaque small{color:var(--mn-text-2);}
.stat-progresso{height:8px; border-radius:999px; background:rgba(255,255,255,0.12); overflow:hidden; margin:4px 0 2px;}
.stat-progresso i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--pitch),#7EF0B5);}
.destaques-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:4px 26px; padding:14px 18px 18px;}
.destaque-bloco{padding:8px 0;}
.destaque-titulo{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--pitch-800); margin-bottom:8px;}
.destaque-linha{display:grid; grid-template-columns:16px 30px minmax(0,1fr) 44px 28px; align-items:center; gap:8px; width:100%; padding:5px 0; border:none; background:none; font:inherit; text-align:left; cursor:pointer;}
.destaque-linha:hover .destaque-nome{color:var(--pitch-800);}
.destaque-pos{font-family:var(--font-display); font-weight:700; color:var(--muted); font-size:15px; text-align:center;}
.destaque-avatar{width:30px; height:30px; border-radius:50%; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#1C2C4B,#0E1A31); color:var(--gold-300); font-size:11px; font-weight:800;}
.destaque-avatar img{width:100%; height:100%; object-fit:cover;}
.destaque-nome{font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.destaque-barra{height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden;}
.destaque-barra i{display:block; height:100%; border-radius:999px; background:var(--pitch-700);}
.destaque-linha b{font-family:var(--font-display); font-size:17px; color:var(--ink); text-align:right;}
.convocacao-resumo{display:flex; align-items:stretch; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
.conv-contador{background:var(--surface); border:1px solid var(--line-soft); border-left:4px solid var(--st-neutral); border-radius:14px; padding:10px 16px; display:flex; flex-direction:column; justify-content:center; min-width:130px; box-shadow:var(--shadow-sm);}
.conv-contador b{font-family:var(--font-display); font-size:28px; line-height:1; color:var(--ink);}
.conv-contador span{font-size:12px; font-weight:600; color:var(--muted);}
.conv-contador.ok{border-left-color:var(--st-good);} .conv-contador.pendente{border-left-color:var(--st-warn);} .conv-contador.alerta{border-left-color:var(--st-crit);}
.conv-acoes{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.alertas-lista{display:flex; flex-direction:column;}
.alerta-item{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:11px 18px; border-bottom:1px solid var(--line-soft); font-size:13px;}
.alerta-item:last-child{border-bottom:none;}
.alerta-item b{color:var(--ink);}
.chamar-outra{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:-6px 0 22px; font-size:13px; font-weight:700; color:var(--ink-2);}
.chamar-outra select{padding:9px 12px; border-radius:10px; border:1px solid var(--line); font:inherit; font-size:13px; background:#fff; min-width:260px;}
.relacao-colunas{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
.relacao-lista{list-style:none; margin:0; padding:6px 0; counter-reset:rel;}
.relacao-lista li{display:flex; align-items:center; gap:10px; padding:9px 18px; border-bottom:1px solid var(--line-soft); counter-increment:rel;}
.relacao-lista li:last-child{border-bottom:none;}
.relacao-lista li::before{content:counter(rel); font-family:var(--font-display); font-weight:700; color:var(--muted-2); min-width:18px;}
.relacao-pos{font-size:10.5px; font-weight:800; letter-spacing:.1em; color:#fff; background:var(--mn-800); padding:3px 7px; border-radius:6px; min-width:38px; text-align:center;}
.relacao-nome{flex:1; font-weight:700; font-size:13.5px; color:var(--ink); min-width:0;}

/* ---------- Monitoramento ---------- */
.hm-legenda{display:flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:rgba(255,255,255,0.85);}
.hm-legenda i{width:16px; height:12px; border-radius:3px; display:inline-block;}
.hm-legenda span{margin:0 4px;}
table.heatmap{border-collapse:separate; border-spacing:3px; font-size:12.5px; padding:6px 10px;}
table.heatmap thead th{background:none; border:none; padding:6px 2px; text-align:center; font-size:10px; letter-spacing:.04em;}
table.heatmap th.hm-dia span{display:block; font-size:9.5px; color:var(--muted-2);}
table.heatmap th.hm-dia.hoje{color:var(--pitch-800);}
table.heatmap th.hm-nome, table.heatmap td.hm-nome{text-align:left; position:sticky; left:0; background:var(--surface); z-index:1; padding:4px 12px 4px 8px; min-width:170px;}
table.heatmap td.hm-nome b{display:block; font-size:13px; color:var(--ink); white-space:nowrap;}
table.heatmap td.hm-nome small{font-size:11px; color:var(--muted);}
table.heatmap tbody td{border:none; padding:0;}
table.heatmap tbody tr:hover td{background:transparent;}
table.heatmap tbody tr:hover td.hm-nome{background:var(--surface);}
.hm-td{padding:0;}
.hm-cel{position:relative; width:38px; height:32px; border-radius:8px; border:none; font:inherit; font-size:12.5px; font-weight:800; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;}
.hm-cel:hover{transform:scale(1.08); box-shadow:0 4px 12px rgba(14,23,38,0.2);}
.hm-cel.ativo{box-shadow:0 0 0 2px var(--mn-900);}
.hm-cel.vazia{background:var(--surface-2); color:var(--muted-2); cursor:default; font-weight:600;}
.hm-cel.vazia:hover{transform:none; box-shadow:none;}
.hm-1{background:#C2410C; color:#fff;}
.hm-2{background:#FDBA74; color:#431407;}
.hm-3{background:#E2E8F0; color:#334155;}
.hm-4{background:#93C5FD; color:#0B2A5B;}
.hm-5{background:#1D4ED8; color:#fff;}
.hm-flag{position:absolute; top:-5px; right:-4px; font-style:normal; font-size:8.5px; width:15px; height:15px; border-radius:50%; background:#fff; color:#B42323; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,0.3);}
.hm-detalhe{margin:6px 18px 16px; padding:14px 16px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line-soft);}
.hm-detalhe-topo{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; margin-bottom:10px;}
.hm-detalhe-topo .link-btn{margin-left:auto;}
.hm-itens{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px 24px;}
.hm-item{display:grid; grid-template-columns:96px auto 18px 1fr; align-items:center; gap:8px; font-size:12.5px;}
.hm-item-rotulo{font-weight:700; color:var(--ink-2);}
.hm-item-escala{display:inline-flex; gap:3px;}
.hm-item-escala i{width:12px; height:12px; border-radius:3px; background:var(--line);}
.hm-item-escala i.cheio.nivel-1{background:#C2410C;} .hm-item-escala i.cheio.nivel-2{background:#FB923C;} .hm-item-escala i.cheio.nivel-3{background:#94A3B8;} .hm-item-escala i.cheio.nivel-4{background:#60A5FA;} .hm-item-escala i.cheio.nivel-5{background:#1D4ED8;}
.hm-item b{font-family:var(--font-display); font-size:15px;}
.hm-item small{color:var(--muted); white-space:nowrap;}
.hm-comentario{margin-top:10px; font-size:13px; font-style:italic; color:var(--ink-2);}
.carga-topo{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 18px; font-size:13px; color:var(--ink-2);}
.carga-botoes{display:flex; gap:8px; flex-wrap:wrap;}
.carga-tabela td{padding-top:8px; padding-bottom:8px;}
.pse-select, .min-input{padding:7px 10px; border-radius:9px; border:1px solid var(--line); font:inherit; font-size:13px; background:#fff; color:var(--ink);}
.pse-select{min-width:190px;}
.min-input{width:86px;}
.pse-select:focus, .min-input:focus{outline:none; border-color:var(--pitch-700); box-shadow:0 0 0 3px rgba(43,209,126,0.16);}
.mini-barras rect{fill:#C7D2E0;}
.mini-barras rect.ultima{fill:var(--pitch-700);}
.links-acoes{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
.links-botoes{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
tr.linha-qr td{background:var(--surface-2);}
.qr-bloco{display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:6px 0;}
.qr{background:#fff; padding:8px; border-radius:12px; border:1px solid var(--line-soft); box-sizing:content-box;}
.qr svg{display:block; width:100%; height:100%;}
.qr-falhou{display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); text-align:center;}
.qr-url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--ink-2); word-break:break-all; margin-top:4px;}
.disp-bloco{display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; padding:14px 18px; margin:-6px 0 22px; border-radius:16px; background:#fff; border:1px solid var(--line-soft); border-left:5px solid var(--st-warn); box-shadow:var(--shadow-sm);}
.disp-bloco.fora{border-left-color:var(--st-crit); background:linear-gradient(90deg,rgba(208,59,59,0.06),#fff 55%);}
.disp-bloco ul{margin:0; padding-left:18px; font-size:13px; color:var(--ink-2); line-height:1.55; flex:1; min-width:220px;}
.monit-atleta{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:20px; padding:16px 20px 20px;}
.monit-rotulo{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--pitch-800); margin-bottom:10px;}
.monit-faixa{display:grid; grid-template-columns:repeat(14,minmax(0,1fr)); gap:3px;}
.monit-dia{height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; position:relative;}
.monit-dia.vazia{background:var(--surface-2); border:1px dashed var(--line);}
.monit-dia.alerta{box-shadow:0 0 0 2px #B42323;}
.monit-legenda{font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.5;}
.monit-carga{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 16px;}
.monit-carga small{display:block; font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:3px;}
.monit-carga b{font-family:var(--font-display); font-size:24px; color:var(--ink);}

/* ---------- Check-in do atleta (página pública) ---------- */
.checkin-pagina{min-height:100vh; padding:28px 16px 40px; display:flex; justify-content:center; color:#fff;
  background:linear-gradient(180deg,rgba(6,11,22,0.7) 0%,rgba(6,11,22,0.94) 100%), var(--arte-meia-noite) center/cover no-repeat fixed, #060B16;}
.checkin-caixa{width:100%; max-width:480px;}
.checkin-topo{text-align:center; margin-bottom:18px;}
.checkin-escudo{width:72px; height:72px; border-radius:50%; background:#fff; padding:4px; object-fit:contain; box-shadow:0 0 0 4px rgba(255,255,255,0.12), 0 14px 30px rgba(0,0,0,0.4);}
.checkin-eyebrow{margin-top:14px; font-size:11px; font-weight:800; letter-spacing:.24em; text-transform:uppercase; color:var(--pitch);}
.checkin-topo h1{font-family:var(--font-display); font-size:40px; font-weight:700; line-height:1.05; margin-top:6px;}
.checkin-topo h1 span{background:var(--gold-grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
.checkin-ola{margin-top:8px; font-size:14px; color:var(--mn-text-2);}
.checkin-ola b{color:#fff;}
.checkin-abas{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border-radius:16px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); margin-bottom:14px;}
.checkin-abas button{border:none; border-radius:12px; padding:12px 8px; font:inherit; font-size:14px; font-weight:800; color:var(--mn-text-2); background:transparent; cursor:pointer;}
.checkin-abas button.active{background:var(--pitch); color:var(--pitch-ink); box-shadow:0 8px 20px rgba(43,209,126,0.3);}
.checkin-card{background:rgba(13,23,43,0.94); border:1px solid rgba(255,255,255,0.1); border-radius:22px; padding:20px 18px; box-shadow:0 24px 60px rgba(0,0,0,0.4);}
.checkin-titulo{font-family:var(--font-display); font-size:24px; font-weight:700; margin-bottom:4px;}
.checkin-sub{font-size:13.5px; color:var(--mn-text-2); margin-bottom:14px;}
.checkin-pergunta{padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.07);}
.checkin-pergunta-texto{font-size:15px; font-weight:700; margin-bottom:10px;}
.checkin-escala{display:grid; grid-template-columns:repeat(5,1fr); gap:7px;}
.checkin-opcao{display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 0 7px; border-radius:14px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.04); color:#fff; font:inherit; cursor:pointer; transition:all .12s ease;}
.checkin-opcao .emoji{font-size:25px; line-height:1.1;}
.checkin-opcao .num{font-size:11px; font-weight:800; color:var(--mn-text-3);}
.checkin-opcao.marcada{background:rgba(43,209,126,0.18); border-color:var(--pitch); box-shadow:0 0 0 2px rgba(43,209,126,0.35); transform:translateY(-1px);}
.checkin-opcao.marcada .num{color:var(--pitch);}
.checkin-extremos{display:flex; justify-content:space-between; font-size:11.5px; color:var(--mn-text-3); margin-top:6px;}
.checkin-comentario{display:flex; flex-direction:column; gap:8px; margin-top:16px; font-size:13.5px; font-weight:700; color:var(--mn-text-2);}
.checkin-comentario textarea{min-height:70px; border-radius:12px; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.05); color:#fff; font:inherit; font-size:14px; padding:10px 12px; resize:vertical;}
.checkin-botao{width:100%; margin-top:18px; padding:15px; border-radius:14px; border:none; background:var(--pitch); color:var(--pitch-ink); font:inherit; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 12px 26px rgba(43,209,126,0.3);}
.checkin-botao:disabled{opacity:.45; box-shadow:none; cursor:not-allowed;}
.checkin-botao.secundario{background:rgba(255,255,255,0.08); color:#fff; box-shadow:none; border:1px solid rgba(255,255,255,0.14);}
.checkin-pse{display:flex; flex-direction:column; gap:5px;}
.pse-opcao{display:flex; align-items:center; gap:12px; padding:7px 10px; border-radius:12px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.03); color:#fff; font:inherit; text-align:left; cursor:pointer;}
.pse-num{width:34px; height:30px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:18px; font-weight:700; color:#fff;}
.pse-texto{font-size:14px; font-weight:600; color:var(--mn-text);}
.pse-opcao.marcada{border-color:var(--pitch); background:rgba(43,209,126,0.14); box-shadow:0 0 0 2px rgba(43,209,126,0.3);}
.pse-0 .pse-num{background:#1D4ED8;} .pse-1 .pse-num{background:#2563EB;} .pse-2 .pse-num{background:#0891B2;} .pse-3 .pse-num{background:#0D9488;}
.pse-4 .pse-num{background:#65A30D;} .pse-5 .pse-num{background:#CA8A04; color:#1A1200;} .pse-6 .pse-num{background:#D97706;} .pse-7 .pse-num{background:#EA580C;}
.pse-8 .pse-num{background:#DC2626;} .pse-9 .pse-num{background:#B91C1C;} .pse-10 .pse-num{background:#7F1D1D;}
.checkin-ok{text-align:center; padding:30px 20px;}
.checkin-ok b{display:block; font-size:18px; margin-top:12px;}
.checkin-ok p{color:var(--mn-text-2); font-size:14px; margin:8px 0 0;}
.checkin-check{width:64px; height:64px; margin:0 auto; border-radius:50%; background:var(--pitch); color:var(--pitch-ink); font-size:32px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 8px rgba(43,209,126,0.18);}
.checkin-msg{text-align:center; padding:12px 6px; font-size:15px; color:var(--mn-text); line-height:1.6;}
.checkin-erro{margin-top:12px; padding:10px 12px; border-radius:12px; background:rgba(208,59,59,0.16); color:#FFC9C9; font-size:13.5px;}
.checkin-rodape{text-align:center; font-size:12px; color:var(--mn-text-3); margin-top:18px; line-height:1.5;}

/* ---------- Cartões com QR (impressão) ---------- */
.cartoes-impressao{display:none;}
@media print{
  body.imprimindo-cartoes #root{display:none !important;}
  body.imprimindo-cartoes .cartoes-impressao{display:grid !important; grid-template-columns:repeat(3,1fr); gap:4mm 5mm; padding:0;}
  .cartao-qr{break-inside:avoid; border:1px dashed #94A3B8; border-radius:3mm; padding:3.5mm 3.5mm 3mm; text-align:center; font-family:var(--font); color:#0E1726;}
  .cartao-topo{display:flex; align-items:center; justify-content:center; gap:3mm; font-family:var(--font-display); font-weight:700; font-size:12pt; text-transform:uppercase;}

<script type="text/babel" data-presets="react">
/**
 * CAMADA DE DADOS — Firebase (Firestore) do MeuCT
 * ---------------------------------------------------------
 * Roda no projeto meurh-23fad, sob coleções prefixadas com "ct_"
 * para não colidir com os dados de RH que já vivem no mesmo projeto.
 *
 * Acesso hoje é aberto (sem autenticação), por decisão do responsável.
 * As Firestore Rules liberando /ct_atletas/** já estão publicadas.
 */

const firebaseConfig = {
  apiKey: "AIzaSyARvBxwWERljcaAaJsqLZdMstSVIi-6j2g",
  authDomain: "meurh-23fad.firebaseapp.com",
  projectId: "meurh-23fad",
  storageBucket: "meurh-23fad.firebasestorage.app",
  messagingSenderId: "241699999089",
  appId: "1:241699999089:web:cc50293405d6c17db73ad0",
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();
const auth = firebase.auth();
const storage = firebase.storage();

/** O SDK do Storage fica retentando indefinidamente em erros de rede (ex.: bucket
 *  inexistente, dá 404 no preflight e ele insiste pra sempre sem nunca rejeitar a
 *  Promise). Isso trava a UI em "Enviando 0/N" pra sempre sem gerar nenhum erro.
 *  Essa função força uma desistência depois de `timeoutMs` com uma mensagem útil. */
/* ---------- Bibliotecas sob demanda ----------
   PDF, ZIP e QR code só são usados em algumas telas. Em vez de todo mundo baixar e
   processar essas bibliotecas ao abrir o app, elas carregam na primeira vez que alguém
   precisa delas (e ficam guardadas pelo navegador depois). */
const BIBLIOTECAS = {
  pdf: [
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js",
  ],
  zip: ["https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"],
  qr: ["https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"],
};
const bibliotecasCarregando = {};

function carregarScriptExterno(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = url;
    s.async = false;
    s.onload = resolve;
    s.onerror = () => { s.remove(); reject(new Error("Não consegui carregar um componente do app. Confira a internet e tente de novo.")); };
    document.head.appendChild(s);
  });
}

/** Garante que a biblioteca ("pdf", "zip" ou "qr") está pronta. Pode chamar quantas vezes quiser. */
function carregarBiblioteca(nome) {
  if (!bibliotecasCarregando[nome]) {
    bibliotecasCarregando[nome] = BIBLIOTECAS[nome]
      .reduce((p, url) => p.then(() => carregarScriptExterno(url)), Promise.resolve())
      .catch((e) => { delete bibliotecasCarregando[nome]; throw e; });
  }
  return bibliotecasCarregando[nome];
}

/** Hook: começa a baixar as bibliotecas assim que a tela abre, para estarem prontas no clique. */
function useBibliotecas(...nomes) {
  const [prontas, setProntas] = React.useState(false);
  React.useEffect(() => {
    let vivo = true;
    Promise.all(nomes.map(carregarBiblioteca)).then(() => { if (vivo) setProntas(true); }).catch(() => {});
    return () => { vivo = false; };
  }, []);
  return prontas;
}

/* ---------- Fotos dos atletas ----------
   Fotos tiradas no celular têm 2 a 3 MB, mas aparecem em tamanho de avatar. Antes de enviar,
   a foto é reduzida para no máximo 480 px no lado menor (cerca de 40 KB), girada do jeito
   certo e salva em JPG com cache longo, então o app baixa quase nada para mostrar o elenco. */
const FOTO_LADO = 480;

async function lerImagemArquivo(arquivo) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(arquivo, { imageOrientation: "from-image" }); } catch (e) {}
  }
  const url = URL.createObjectURL(arquivo);
  try {
    return await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Não consegui ler essa imagem. Envie a foto em JPG ou PNG."));
      img.src = url;
    });
  } finally {
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}

async function reduzirFoto(arquivo, lado = FOTO_LADO, qualidade = 0.82) {
  const img = await lerImagemArquivo(arquivo);
  const w = img.width || img.naturalWidth;
  const h = img.height || img.naturalHeight;
  if (!w || !h) throw new Error("Não consegui ler essa imagem. Envie a foto em JPG ou PNG.");
  const escala = Math.min(1, lado / Math.min(w, h));
  const cw = Math.max(1, Math.round(w * escala));
  const ch = Math.max(1, Math.round(h * escala));
  const canvas = document.createElement("canvas");
  canvas.width = cw;
  canvas.height = ch;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, cw, ch);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, cw, ch);
  if (img.close) img.close();
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", qualidade));
  if (!blob) throw new Error("Não consegui preparar a foto para envio.");
  return blob;
}

/** Reduz a foto, envia para o Storage com nome novo (para nenhum navegador mostrar a antiga
 *  guardada no cache) e grava o endereço no cadastro do atleta. A foto antiga continua no Storage. */
async function enviarFotoAtleta(atletaId, arquivo) {
  const blob = await reduzirFoto(arquivo);
  const ref = storage.ref().child(`fotos_atletas/${atletaId}_${Date.now()}.jpg`);
  await subirComTimeout(ref, blob, 30000, { contentType: "image/jpeg", cacheControl: "public, max-age=31536000" });
  const url = await ref.getDownloadURL();
  await db.collection(COL_ATLETAS).doc(atletaId).update({ foto: url });
  return url;
}

function subirComTimeout(ref, arquivo, timeoutMs, metadados) {
  return new Promise((resolve, reject) => {
    const task = metadados ? ref.put(arquivo, metadados) : ref.put(arquivo);
    const timer = setTimeout(() => {
      try { task.cancel(); } catch (e) {}
      reject(new Error("Tempo esgotado enviando a foto. O mais provável é que o Storage do Firebase ainda não foi criado nesse projeto. Confirme em Firebase Console → Storage → \"Get started\"."));
    }, timeoutMs);
    task.then(
      (snap) => { clearTimeout(timer); resolve(snap); },
      (err) => { clearTimeout(timer); reject(err); }
    );
  });
}

const COL_USUARIOS = "ct_usuarios";

/** E-mail que sempre vira Admin automaticamente ao criar conta pela primeira vez. */
const EMAIL_ADMIN_FUNDADOR = "joaovitorriaurosa2003@gmail.com";

/** Lista de módulos do sistema — os ids batem com os ids do HUBS/navegação. */
const MODULOS = [
  { id: "admin", label: "Painel Admin" },
  { id: "psicologia", label: "Psicologia" },
  { id: "fisioterapia", label: "Fisioterapia" },
  { id: "fisiologia", label: "Fisiologia" },
  { id: "medicina", label: "Medicina" },
  { id: "social", label: "Serviço Social" },
  { id: "desempenho", label: "Desempenho" },
  { id: "treinador", label: "Treinadores" },
];

/**
 * Grupos de acesso rápido — pacotes de módulos pra liberar de uma vez pra um
 * colaborador, de acordo com a área que ele atua: Campo (comissão técnica,
 * só Treinadores e Desempenho — sem dado clínico de outras áreas), Departamento
 * Médico (fisiologia, fisioterapia, psicologia e medicina) e Social (psicologia
 * e serviço social). Aplicar um grupo substitui os módulos liberados do
 * colaborador pelo pacote; dá pra ajustar módulo a módulo depois, normalmente.
 */
const GRUPOS_ACESSO = [
  { id: "campo", label: "Campo", modulos: ["treinador", "desempenho"] },
  { id: "dm", label: "Departamento Médico", modulos: ["fisioterapia", "fisiologia", "medicina", "psicologia"] },
  { id: "grupo_social", label: "Social", modulos: ["psicologia", "social"] },
];

/** Módulos de dados que alimentam a Central de Relatórios — quem tem acesso a qualquer um deles pode gerar relatório daquele módulo. */
const MODULOS_RELATORIO = ["psicologia", "fisioterapia", "fisiologia", "medicina", "social", "desempenho"];
function temAcessoRelatorios(usuario) {
  return temPermissao(usuario, "admin") || MODULOS_RELATORIO.some((m) => temPermissao(usuario, m));
}

/** Cria a conta e o documento de permissão (pendente, exceto o e-mail fundador). */
async function cadastrar(email, senha, nome) {
  const cred = await auth.createUserWithEmailAndPassword(email, senha);
  const ehFundador = email.trim().toLowerCase() === EMAIL_ADMIN_FUNDADOR;
  await db.collection(COL_USUARIOS).doc(cred.user.uid).set({
    nome: nome || email,
    email: email,
    role: ehFundador ? "admin" : "colaborador",
    modulos: ehFundador ? MODULOS.map((m) => m.id) : [],
    criado_em: firebase.firestore.FieldValue.serverTimestamp(),
  });
  return cred.user;
}

async function entrar(email, senha) {
  return auth.signInWithEmailAndPassword(email, senha);
}

function sair() {
  limparCacheLeitura();
  return auth.signOut();
}

async function buscarPermissoes(uid) {
  const doc = await db.collection(COL_USUARIOS).doc(uid).get();
  if (!doc.exists) return null;
  return { id: doc.id, ...doc.data() };
}

function temPermissao(usuario, moduloId) {
  if (!usuario) return false;
  if (usuario.role === "admin") return true;
  return (usuario.modulos || []).includes(moduloId);
}

/** Quem pode VER os dados de uma área: quem tem o módulo da área e a comissão técnica (módulo
 *  "treinador"), que enxerga tudo sobre os atletas. As regras do Firestore já liberam essa leitura
 *  pro treinador; lançar ou editar registros continua exigindo o módulo da própria área. */
function podeVerArea(usuario, moduloId) {
  return temPermissao(usuario, moduloId) || temPermissao(usuario, "treinador");
}

/** Quem pode criar/editar/mesclar/excluir atleta: Admin, Treinador, Psicologia, Medicina e Serviço Social. */
function podeGerenciarAtletas(usuario) {
  return temPermissao(usuario, "admin") || temPermissao(usuario, "treinador") || temPermissao(usuario, "psicologia") || temPermissao(usuario, "medicina") || temPermissao(usuario, "social");
}

/** Exclui o atleta e TODOS os registros dele em todas as áreas. Irreversível. */
async function excluirAtleta(atletaId) {
  for (const subcol of Object.values(SUBCOLS)) {
    const snap = await db.collection(COL_ATLETAS).doc(atletaId).collection(subcol).get();
    for (const doc of snap.docs) {
      await doc.ref.delete();
    }
  }
  await db.collection(COL_ATLETAS).doc(atletaId).delete();
}

/**
 * Carrega os dados respeitando a permissão de quem está vendo: só busca
 * (e só tenta ler) as áreas que o usuário pode ver (podeVerArea: o módulo
 * da área ou o módulo treinador, que enxerga tudo). Áreas sem permissão
 * voltam vazias — assim nenhum painel daquela área aparece pra quem não
 * pode ver, e nenhuma leitura é tentada contra as regras do Firestore
 * (que negariam mesmo, mas isso evita a rejeição quebrar o carregamento
 * das áreas que ELE pode ver).
 */
async function carregarPermitido(usuario) {
  const mapaAreaModulo = { psi: "psicologia", fisio: "fisioterapia", fisiologia: "fisiologia", medicina: "medicina", social: "social", performance: "desempenho" };
  const atletas = await carregarAtletas();
  const resultado = { atletas, psiData: {}, fisioData: {}, fisiologiaData: {}, medicinaData: {}, socialData: {}, perfData: {} };
  const chaveParaCampo = { psi: "psiData", fisio: "fisioData", fisiologia: "fisiologiaData", medicina: "medicinaData", social: "socialData", performance: "perfData" };

  await Promise.all(
    Object.entries(mapaAreaModulo)
      .filter(([, modulo]) => podeVerArea(usuario, modulo))
      .map(async ([chave]) => {
        resultado[chaveParaCampo[chave]] = await carregarTodosRegistros(chave);
      })
  );

  return resultado;
}

/* ---------- Cache de leitura ----------
   Antes, cada tela que abria buscava de novo TODOS os atletas e TODOS os registros de
   todas as áreas no Firestore. Agora essas leituras pesadas ficam guardadas por alguns
   minutos e são compartilhadas entre as telas. Qualquer gravação feita por este navegador
   (salvar, editar, excluir) limpa o cache na hora, então quem grava vê o dado novo em
   seguida; o que outras pessoas gravarem aparece em no máximo CACHE_LEITURA_MS. */
let CACHE_LEITURA_MS = 2 * 60 * 1000;
const cacheLeitura = new Map();

function limparCacheLeitura() {
  cacheLeitura.clear();
}

/** Devolve a leitura guardada (se ainda estiver valendo) ou busca de novo. Leituras
 *  iguais que acontecem ao mesmo tempo viram uma só. */
function lerComCache(chave, buscar) {
  const agora = Date.now();
  const item = cacheLeitura.get(chave);
  if (item && agora - item.em < CACHE_LEITURA_MS) return item.promessa;
  const promessa = buscar();
  cacheLeitura.set(chave, { em: agora, promessa });
  promessa.catch(() => {
    const atual = cacheLeitura.get(chave);
    if (atual && atual.promessa === promessa) cacheLeitura.delete(chave);
  });
  return promessa;
}

/** Cópia independente de um valor guardado, para nenhuma tela alterar o dado de outra.
 *  Objetos especiais (Timestamp do Firestore, Date) são mantidos como estão. */
function copiarDado(v) {
  if (Array.isArray(v)) return v.map(copiarDado);
  if (v && typeof v === "object" && Object.getPrototypeOf(v) === Object.prototype) {
    const o = {};
    for (const k in v) o[k] = copiarDado(v[k]);
    return o;
  }
  return v;
}

/* Toda gravação no Firestore limpa o cache (antes e depois de gravar). Se a versão do
   Firebase não permitir instalar esse gancho, o cache é desligado por segurança. */
(function instalarLimpezaDoCache() {
  // Trocou a pessoa logada: nada do que foi lido antes é reaproveitado.
  auth.onAuthStateChanged(() => limparCacheLeitura());
  const fs = firebase.firestore;
  function embrulhar(alvo, metodo) {
    if (!alvo || typeof alvo[metodo] !== "function") return false;
    if (alvo[metodo].__limpaCache) return true;
    const original = alvo[metodo];
    const novo = function () {
      limparCacheLeitura();
      const r = original.apply(this, arguments);
      if (r && typeof r.then === "function") {
        return r.then(
          (v) => { limparCacheLeitura(); return v; },
          (e) => { limparCacheLeitura(); throw e; }
        );
      }
      return r;
    };
    novo.__limpaCache = true;
    alvo[metodo] = novo;
    return true;
  }
  const protoDoc = fs.DocumentReference && fs.DocumentReference.prototype;
  const protoCol = fs.CollectionReference && fs.CollectionReference.prototype;
  const ok = ["set", "update", "delete"].every((m) => embrulhar(protoDoc, m)) && embrulhar(protoCol, "add");
  if (!ok) {
    CACHE_LEITURA_MS = 0;
    console.warn("Cache de leitura desligado: não deu para acompanhar as gravações do Firestore.");
    return;
  }
  const batchOriginal = db.batch.bind(db);
  db.batch = function () {
    const lote = batchOriginal();
    embrulhar(lote, "commit");
    return lote;
  };
  if (typeof db.runTransaction === "function") {
    const transacaoOriginal = db.runTransaction.bind(db);
    db.runTransaction = function () {
      limparCacheLeitura();
      return transacaoOriginal.apply(null, arguments).finally(limparCacheLeitura);
    };
  }
})();

/** Carrega a lista de atletas (ordenada por nome). */
async function carregarAtletas() {
  const lista = await lerComCache("atletas", async () => {
    const snap = await db.collection(COL_ATLETAS).orderBy("nome").get();
    return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  });
  return copiarDado(lista);
}

/**
 * Carrega TODOS os registros de uma área (psi/fisio/fisiologia/social/performance),
 * de todos os atletas de uma vez, via collectionGroup — evita N+1 consultas.
 * Retorna um objeto { [atletaId]: [registros ordenados por data desc] }.
 */
async function carregarTodosRegistros(chave) {
  const porAtleta = await lerComCache("registros:" + chave, async () => {
    const snap = await db.collectionGroup(SUBCOLS[chave]).get();
    const mapa = {};
    snap.docs.forEach((d) => {
      const atletaId = d.ref.parent.parent.id;
      const registro = { id: d.id, ...d.data() };
      if (!mapa[atletaId]) mapa[atletaId] = [];
      mapa[atletaId].push(registro);
    });
    Object.values(mapa).forEach((lista) =>
      lista.sort((a, b) => (b.data || "").localeCompare(a.data || ""))
    );
    return mapa;
  });
  return copiarDado(porAtleta);
}

   Mural de novidades do CT: não é só changelog do sistema — dá pra
   publicar qualquer coisa nova (informação sobre atleta, resultado
   de jogo, aviso, funcionalidade nova, melhoria, correção etc). */
const COL_ATUALIZACOES = "ct_atualizacoes";
const CATEGORIAS_ATUALIZACAO = [
  { id: "atleta", label: "Atleta" },
  { id: "jogo", label: "Resultado de jogo" },

/** Carrega as atualizações mais recentes (mais nova primeiro). */
async function carregarAtualizacoes(limite) {
  let q = db.collection(COL_ATUALIZACOES).orderBy("criadoEm", "desc");
  if (limite) q = q.limit(limite);
  const snap = await q.get();
  return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
}

/** Cria uma nova entrada de atualização (só chamado pela tela de admin). */

  await db.collection(COL_ATUALIZACOES).add({
    titulo: (titulo || "").trim(),
    descricao: (descricao || "").trim(),
    categoria: categoria || "melhoria",
    criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
  });
}

async function excluirAtualizacao(id) {

}

/** Timestamp (ms) mais recente entre "quando a pessoa viu a aba" salvo localmente por conta. */
function chaveVistoAtualizacoes(usuario) {
  return `ct_atualizacoes_visto_${(usuario && (usuario.id || usuario.email)) || "anon"}`;
}
function lerVistoAtualizacoes(usuario) {
  try {
    const v = localStorage.getItem(chaveVistoAtualizacoes(usuario));
    return v ? Number(v) : 0;
  } catch (e) {
    return 0;
  }
}
function marcarAtualizacoesVistas(usuario) {
  try {
    localStorage.setItem(chaveVistoAtualizacoes(usuario), String(Date.now()));
  } catch (e) {}
}

/** Carrega as 6 áreas de uma vez (usado no Painel Admin, que precisa de tudo). */
async function carregarTudo() {
  const [atletas, psiData, fisioData, fisiologiaData, medicinaData, socialData, perfData] = await Promise.all([
    carregarAtletas(),
    carregarTodosRegistros("psi"),
    carregarTodosRegistros("fisio"),
    carregarTodosRegistros("fisiologia"),
    carregarTodosRegistros("medicina"),
    carregarTodosRegistros("social"),
    carregarTodosRegistros("performance"),
  ]);

}

    .collection(COL_ATLETAS)

/* ---------- Motor do semáforo (mesmo cálculo de antes) ---------- */
function nivelParaPeso(s) { return s === "vermelho" ? 2 : s === "amarelo" ? 1 : 0; }

function calcularSemaforo(atletaId, dados) {
  const { psiData, fisioData, medicinaData, socialData, perfData } = dados;
  const sinais = [];
  const psi = (psiData[atletaId] || [])[0];
  const fisio = (fisioData[atletaId] || [])[0];
  const medicina = ((medicinaData || {})[atletaId] || [])[0];
  const social = (socialData[atletaId] || [])[0];
  const perf = (perfData[atletaId] || [])[0];

  let peso = 0;
  if (psi) { peso += nivelParaPeso(psi.sinal); if (psi.sinal !== "verde" && psi.sinal !== "neutro") sinais.push({ area: "psi", label: "Psicologia" }); }
  if (fisio) { peso += nivelParaPeso(fisio.sinal); if (fisio.sinal !== "verde" && fisio.sinal !== "neutro") sinais.push({ area: "fisio", label: "Fisioterapia" }); }
  if (medicina) { peso += nivelParaPeso(medicina.sinal); if (medicina.sinal !== "verde" && medicina.sinal !== "neutro") sinais.push({ area: "medicina", label: "Medicina" }); }
  if (social) { const w = social.statusPublico === "atencao" ? 1 : 0; peso += w; if (w) sinais.push({ area: "social", label: "Serviço social" }); }
  if (perf) { peso += nivelParaPeso(perf.sinal); if (perf.sinal !== "verde" && perf.sinal !== "neutro") sinais.push({ area: "performance", label: "Desempenho" }); }

  const risco = peso >= 3 ? "vermelho" : peso >= 1 ? "amarelo" : "verde";
  return { risco, sinais };
}

function formatarData(iso) {
  if (!iso || typeof iso !== "string" || !iso.includes("-")) return iso || "—";
  const [y, m, d] = iso.split("-");
  return d + "/" + m + "/" + y;
}

function hojeISO() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + mm + "-" + dd;
}

/** Nome pra exibir: usa o apelido quando cadastrado, senão o nome completo. */
function nomeExibicao(atleta) {
  if (!atleta) return "—";
  return atleta.apelido && atleta.apelido.trim() ? atleta.apelido.trim() : atleta.nome;
}

function nomeAtleta(atletas, id) {
  const a = (atletas || []).find((x) => x.id === id);
  return nomeExibicao(a);
}

/* ---------- Fisioterapia: lesões estruturadas, fases de RTP, reincidência ---------- */
const REGIOES_CORPO = ["Coxa", "Joelho", "Tornozelo", "Panturrilha", "Quadril/Virilha", "Pé", "Ombro", "Lombar/Coluna", "Outra região"];
const TIPOS_LESAO = ["Muscular (estiramento/distensão)", "Ligamentar (entorse)", "Tendínea (tendinite)", "Óssea (fratura/fissura)", "Contusão/trauma", "Outra"];
const MECANISMOS_LESAO = ["Sobrecarga / uso excessivo", "Contato / trauma direto", "Movimento brusco / torção", "Não identificado"];
const FASES_RTP = [
  { id: "repouso", label: "Repouso" },
  { id: "mobilidade", label: "Mobilidade" },
  { id: "carga_progressiva", label: "Carga progressiva" },
  { id: "liberado", label: "Liberado (retorno ao jogo)" },
];
function labelFaseRtp(id) { const f = FASES_RTP.find(x => x.id === id); return f ? f.label : (id || "—"); }
function sinalPorGravidadeFase(gravidade, faseRtp) {
  if (faseRtp === "liberado") return "verde";
  if (gravidade === "grave") return "vermelho";
  return "amarelo";
}

/**
 * Agrupa os registros de lesão (evento:"nova" + evento:"atualizacao_fase") de um atleta
 * por região do corpo, e devolve o estado atual de cada episódio: fase mais recente,
 * data de início (da primeira ocorrência "nova" daquela região) e se está ativo.
 */
function calcularEpisodiosLesao(registrosFisio) {
  const porRegiao = {};
  (registrosFisio || []).forEach((r) => {
    if (r.tipo !== "Lesão" || !r.regiao) return;
    if (!porRegiao[r.regiao]) porRegiao[r.regiao] = [];
    porRegiao[r.regiao].push(r);
  });
  return Object.entries(porRegiao).map(([regiao, regs]) => {
    // registros já vêm ordenados desc por data (carregarTodosRegistros)
    const maisRecente = regs[0];
    const primeiraOcorrencia = regs.slice().reverse().find(r => r.evento === "nova") || regs[regs.length - 1];
    const qtdNovas = regs.filter(r => r.evento === "nova").length;
    return {
      regiao,
      faseAtual: maisRecente.fase_rtp || "repouso",
      ativo: (maisRecente.fase_rtp || "repouso") !== "liberado",
      dataInicio: primeiraOcorrencia.data,
      gravidade: primeiraOcorrencia.gravidade,
      reincidente: qtdNovas >= 2,
      registros: regs,
    };
  });
}

function calcularDiasEntre(dataInicioIso) {
  if (!dataInicioIso) return null;
  const inicio = new Date(dataInicioIso + "T00:00:00");
  const hoje = new Date(hojeISO() + "T00:00:00");
  const diff = Math.round((hoje - inicio) / (1000 * 60 * 60 * 24));
  return diff >= 0 ? diff : 0;
}

/** KPIs da fisioterapia para o dashboard do módulo: lesões ativas, dias de afastamento acumulados, por região, por posição. */
function calcularKpisFisio(fisioData, atletas) {
  let lesoesAtivas = 0, diasAfastamentoTotal = 0, reincidencias = 0;
  const porRegiao = {}, porPosicao = {};
  Object.entries(fisioData || {}).forEach(([atletaId, regs]) => {
    const atleta = (atletas || []).find(a => a.id === atletaId);
    const episodios = calcularEpisodiosLesao(regs);
    episodios.forEach((ep) => {
      if (ep.reincidente) reincidencias++;
      if (ep.ativo) {
        lesoesAtivas++;
        const dias = calcularDiasEntre(ep.dataInicio) || 0;
        diasAfastamentoTotal += dias;
        porRegiao[ep.regiao] = (porRegiao[ep.regiao] || 0) + 1;
        const pos = (atleta && atleta.posicao) || "Sem posição definida";
        porPosicao[pos] = (porPosicao[pos] || 0) + 1;
      }
    });
  });
  return { lesoesAtivas, diasAfastamentoTotal, reincidencias, porRegiao, porPosicao };
}

/* ---------- Medicina: PPE, afastamento clínico, concussão, TUE, crescimento ---------- */
const MOTIVOS_AFASTAMENTO_CLINICO = ["Infecção respiratória (gripe/resfriado)", "Gastroenterite", "Infecção de pele/ferimento", "Febre / mal-estar geral", "Outra condição clínica"];
const RESULTADOS_TRIAGEM_CARDIACA = ["Normal", "Alterado — encaminhado ao cardiologista", "Não realizado"];

];

function sinalPorDesfecho(id) { return id === "liberado" ? "verde" : id === "afastado" ? "vermelho" : "amarelo"; }
const FASES_CONCUSSAO = [

];

/**
 * Episódio ATUAL de concussão (mesmo padrão de nova/atualizacao_fase da fisioterapia),
 * escopado a partir do evento "nova" mais recente — assim uma concussão antiga já
 * liberada não fica "grudada" numa concussão nova posterior.
 */
function calcularEpisodiosConcussao(registrosMedicina) {
  const eventos = (registrosMedicina || []).filter((r) => r.tipo === "Concussão");
  const idxNovaMaisRecente = eventos.findIndex((r) => r.evento === "nova");
  if (idxNovaMaisRecente === -1) return [];
  const episodioAtual = eventos.slice(0, idxNovaMaisRecente + 1);
  const maisRecente = episodioAtual[0];
  const inicio = episodioAtual[episodioAtual.length - 1];
  return [{
    faseAtual: maisRecente.fase_concussao || "retirado",
    ativo: (maisRecente.fase_concussao || "retirado") !== "liberado",
    dataInicio: inicio.data,
    registros: episodioAtual,
  }];
}

/** Status do Exame Médico Pré-Participação (PPE) mais recente de um atleta: válido / vencendo / vencido / nunca realizado. */
function calcularStatusPPE(registrosMedicina) {
  const ppes = (registrosMedicina || []).filter((r) => r.tipo === "PPE" && r.validade);
  if (ppes.length === 0) return { status: "nunca_realizado", dias: null, registro: null };
  const maisRecente = ppes[0];
  const hoje = new Date(hojeISO() + "T00:00:00");
  const validade = new Date(maisRecente.validade + "T00:00:00");
  const dias = Math.round((validade - hoje) / (1000 * 60 * 60 * 24));
  const status = dias < 0 ? "vencido" : dias <= 30 ? "vencendo" : "valido";
  return { status, dias, registro: maisRecente };
}

/** Afastamentos clínicos (doença) ativos — sem data de alta preenchida. */
function calcularAfastamentosClinicosAtivos(registrosMedicina) {
  return (registrosMedicina || []).filter((r) => r.tipo === "Afastamento clínico" && !r.data_alta);
}

/**
 * Sinal simples de possível surto: 3 ou mais atletas com afastamento clínico
 * ativo iniciado nos últimos 14 dias — não é diagnóstico, só um alerta pra
 * olhar mais de perto (pode ser coincidência de calendário/temporada).
 */
function detectarPossivelSurto(medicinaData, atletas) {
  const LIMITE_DIAS = 14;
  const casos = [];
  (atletas || []).forEach((a) => {
    calcularAfastamentosClinicosAtivos(medicinaData[a.id]).forEach((r) => {
      if (calcularDiasEntre(r.data) <= LIMITE_DIAS) casos.push({ atleta: a, registro: r });
    });
  });
  return { possivelSurto: casos.length >= 3, casos };
}

/**
 * Velocidade de crescimento real (cm/mês), calculada só a partir de duas
 * medidas de altura efetivamente lançadas. A estimativa de maturação fica
 * em calcularMaturacao (equação validada de Moore et al., 2015).
 */
function calcularVelocidadeCrescimento(registrosMedicina) {
  const medidas = (registrosMedicina || [])
    .filter((r) => r.tipo === "Crescimento" && typeof r.altura_cm === "number")
    .slice()
    .sort((a, b) => (b.data || "").localeCompare(a.data || ""));
  if (medidas.length < 2) return null;
  const atual = medidas[0];
  const anterior = medidas[1];
  const diasEntre = calcularDiasEntre(anterior.data) - calcularDiasEntre(atual.data);
  if (diasEntre <= 0) return null;
  const deltaAltura = atual.altura_cm - anterior.altura_cm;
  const cmPorMes = (deltaAltura / diasEntre) * 30;
  return { cmPorMes, deltaAltura, diasEntre, atual, anterior, historico: medidas };
}

/** TUEs (uso terapêutico com exceção) ainda dentro da validade. */
function calcularTuesAtivas(registrosMedicina) {
  const hoje = new Date(hojeISO() + "T00:00:00");
  return (registrosMedicina || []).filter((r) => {
    if (r.tipo !== "TUE") return false;
    if (!r.validade) return true;
    return new Date(r.validade + "T00:00:00") >= hoje;
  });
}

  psicologia: "Psicologia", fisioterapia: "Fisioterapia", fisiologia: "Fisiologia", medicina: "Medicina",

/** Quantas atualizações o usuário ainda não viu (zera ao abrir a aba Atualizações). */
function useNaoLidas(usuario, paginaAtual) {
  const [naoLidas, setNaoLidas] = useState(0);
  useEffect(() => {
    if (paginaAtual === "atualizacoes") {
      setNaoLidas(0);
      return;
    }
    let cancelado = false;
    lerComCache("atualizacoes:20", () => carregarAtualizacoes(20))
      .then((lista) => {
        if (cancelado) return;
        const visto = lerVistoAtualizacoes(usuario);
        const novas = lista.filter((a) => {
          const t = a.criadoEm && typeof a.criadoEm.toDate === "function" ? a.criadoEm.toDate().getTime() : 0;
          return t > visto;
        });
        setNaoLidas(novas.length);
      })
      .catch(() => {});
    return () => { cancelado = true; };
  }, [paginaAtual]);
  return naoLidas;
}

function iniciaisUsuario(usuario) {
  return (usuario.nome || usuario.email || "?").trim().split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase();
}

function HubBar({ current, onNavigate, usuario, onSair, naoLidas, menuAberto, setMenuAberto }) {
  const [filtroAberto, setFiltroAberto] = useState(null);
  const iniciais = iniciaisUsuario(usuario);
  const hubsVisiveis = HUBS.filter((h) => temPermissao(usuario, h.id));
  const porId = {};
  HUBS.forEach((h) => { porId[h.id] = h; });

  /** Áreas (Campo / DM / Social) agrupam os módulos clínicos como filtro no menu:
   *  em vez de listar tudo solto, cada área vira um botão que expande só os
   *  módulos daquela área que a pessoa tem permissão de ver. */
  const gruposMenu = GRUPOS_ACESSO
    .map((g) => ({
      ...g,
      itens: [
        ...g.modulos.map((mid) => porId[mid]).filter((h) => h && temPermissao(usuario, h.id)),
        ...(g.id === "campo" && podeVerJogos(usuario) ? [{ id: "jogos", label: "Jogos" }] : []),
      ],
    }))
    .filter((g) => g.itens.length > 0);

  const idsAgrupados = new Set(GRUPOS_ACESSO.flatMap((g) => g.modulos));
  const itensSoltos = hubsVisiveis.filter((h) => !idsAgrupados.has(h.id));
  const podeRelatorios = temAcessoRelatorios(usuario);
  const ehAdmin = usuario.role === "admin";

  useEffect(() => {

function ChatWidget() {
  const { useState, useRef, useEffect } = React;
  const [aberto, setAberto] = useState(false);
  const [mensagens, setMensagens] = useState([
    { role: "assistant", content: "Oi! Posso ajudar a entender como usar o MeuCT: onde lançar um registro, o que é o semáforo, como navegar entre os hubs. O que você quer saber?" },
  ]);
  const [input, setInput] = useState("");
  const [carregando, setCarregando] = useState(false);
  const bodyRef = useRef(null);

  useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [mensagens, carregando]);

  async function enviar() {
    const texto = input.trim();
    if (!texto || carregando) return;

    const historico = [...mensagens, { role: "user", content: texto }];
    setMensagens(historico);
    setInput("");
    setCarregando(true);

    try {
      const response = await fetch(CT_CHAT_FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: SYSTEM_PROMPT_CT,
          messages: historico.map((m) => ({ role: m.role, content: m.content })),
        }),
      });
      const data = await response.json();
      const blocos = data.content || [];
      const respostaTexto = blocos
        .filter((b) => b.type === "text")
        .map((b) => b.text)
        .join("\n")
        .trim();

      setMensagens((prev) => [
        ...prev,
        { role: "assistant", content: respostaTexto || "Não consegui gerar uma resposta agora. Tenta reformular a pergunta." },
      ]);
    } catch (e) {
      setMensagens((prev) => [
        ...prev,
        { role: "assistant", content: "Não consegui conectar com o assistente agora. Tenta de novo em instantes." },
      ]);
    }
    setCarregando(false);
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      enviar();
    }
  }

  return (
    <React.Fragment>
      {aberto && (
        <div className="chat-panel">
          <div className="chat-head">
            <div>
              <div className="title">Assistente do MeuCT</div>
              <div className="sub">Dúvidas de uso do sistema</div>
            </div>
            <button onClick={() => setAberto(false)} aria-label="Fechar">×</button>
          </div>
          <div className="chat-body" ref={bodyRef}>
            {mensagens.map((m, i) => (
              <div key={i} className={"chat-msg " + m.role}>{m.content}</div>
            ))}
            {carregando && <div className="chat-msg assistant loading">digitando...</div>}
          </div>
          <div className="chat-input-row">
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="Pergunte algo sobre o sistema..."
              disabled={carregando}
            />
            <button onClick={enviar} disabled={carregando || !input.trim()}>Enviar</button>
          </div>
        </div>
      )}
      <button className="chat-fab" onClick={() => setAberto((v) => !v)} aria-label="Abrir assistente">
        {aberto ? "×" : "💬"}
      </button>
    </React.Fragment>
  );
}

/**
 * Extrai os campos "Chave: valor" embutidos no texto de uma observação
 * (nota) — tanto do formato de psicologia ("CSAI-2R — Ans. Cognitiva: 10,
 * Ans. Somática: 7...") quanto do de performance ("PASSE CERTO: 9, FALTA: 2...").
 * Ignora o sufixo "(importado de...)" quando presente.
 */
function parseNota(nota, tipoConhecido) {
  if (!nota) return { titulo: "", campos: {} };
  const semSufixo = nota.replace(/\s*\([^)]*\)\s*$/, "");
  let titulo = "";
  let corpo = semSufixo;

  if (tipoConhecido && semSufixo.indexOf(tipoConhecido + " — ") === 0) {
    // corte exato pelo nome do instrumento já conhecido — funciona mesmo
    // quando o próprio nome do instrumento contém um travessão (ex: "SIQ — IMAGEM MENTAL").
    titulo = tipoConhecido;
    corpo = semSufixo.slice((tipoConhecido + " — ").length);
  } else {
    const idxTraco = semSufixo.indexOf(" — ");
    if (idxTraco !== -1) {
      titulo = semSufixo.slice(0, idxTraco);
      corpo = semSufixo.slice(idxTraco + 3);
    }
  }

  const campos = {};
  corpo.split(",").forEach((par) => {
    const idx = par.indexOf(":");
    if (idx === -1) return;
    const chave = par.slice(0, idx).trim();
    const valorStr = par.slice(idx + 1).trim();
    const valorNum = Number(valorStr);
    campos[chave] = isNaN(valorNum) || valorStr === "" ? valorStr : valorNum;
  });
  return { titulo, campos };
}

/** Eixo Y legível: com um valor só (ou todos iguais) o Chart.js "dá zoom" no ponto e cria marcas
 *  quebradas (9,90 / 10,10...). Nesses casos o eixo parte do zero, com folga acima do valor. */
function escalaYLegivel(valores, extra) {
  const nums = valores.filter((v) => typeof v === "number" && isFinite(v));
  const escala = { ...(extra || {}) };
  if (nums.length === 0) return escala;
  const min = Math.min(...nums);
  const max = Math.max(...nums);
  if (max - min < 1) {
    escala.beginAtZero = true;
    escala.suggestedMax = max > 0 ? Math.ceil(max * 1.25) : 1;
  }
  return escala;
}

/** Estado do perfil aberto: ao abrir, a página sobe pro topo (o perfil começa no cabeçalho, mesmo
 *  quando o clique veio do campo no fim do painel); ao voltar, retorna ao ponto onde a pessoa estava. */
function usePerfilAberto() {
  const [aberto, setAberto] = useState(() => {
    const pendente = atletaPendenteGlobal;
    atletaPendenteGlobal = null;
    return pendente;
  });
  const scrollAnterior = React.useRef(0);
  useEffect(() => {
    function ouvir(e) {
      atletaPendenteGlobal = null;
      scrollAnterior.current = window.scrollY || 0;
      setAberto(e.detail);
      window.scrollTo(0, 0);
    }
    window.addEventListener("ct:abrir-atleta", ouvir);
    return () => window.removeEventListener("ct:abrir-atleta", ouvir);
  }, []);
  function abrir(id) {
    scrollAnterior.current = window.scrollY || 0;
    setAberto(id);
    window.scrollTo(0, 0);
  }
  function fechar() {
    const y = scrollAnterior.current;
    setAberto(null);
    requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, y)));
  }
  return [aberto, abrir, fechar];
}

/** Paleta categórica validada (ordem fixa, segura pra daltonismo nos pares vizinhos). Série única usa a 1ª cor. */

const COR_SERIE = PALETA_SUBESCALAS[0];
/** Semáforo (status) — sempre acompanhado de rótulo. */

/* Visual padrão de todos os gráficos do app (fonte, tinta, grade discreta, tooltip escuro, barras com ponta arredondada). */
if (window.Chart) {
  Chart.defaults.font.family = "'Barlow', system-ui, sans-serif";
  Chart.defaults.font.size = 12;
  Chart.defaults.color = "#586A82";
  Chart.defaults.borderColor = "rgba(14,23,38,0.07)";
  Object.assign(Chart.defaults.plugins.legend.labels, { usePointStyle: true, pointStyle: "circle", boxWidth: 8, boxHeight: 8, padding: 14 });
  Object.assign(Chart.defaults.plugins.tooltip, { backgroundColor: "#0B1528", titleColor: "#FFFFFF", bodyColor: "#D6DEEA", padding: 10, cornerRadius: 10, boxPadding: 4, borderColor: "rgba(255,255,255,0.08)", borderWidth: 1 });
  Object.assign(Chart.defaults.elements.bar, { borderRadius: 4, borderSkipped: "start" });
  Object.assign(Chart.defaults.elements.line, { borderWidth: 2 });
  Object.assign(Chart.defaults.elements.point, { radius: 3.5, hoverRadius: 6, borderWidth: 2 });
  // Na impressão (relatório do perfil pelo navegador) a largura muda: redesenha os gráficos no tamanho da folha.
  // (o "beforeprint" chega antes do layout da folha, então o tamanho vai explícito: largura útil de uma A4).
  window.addEventListener("beforeprint", () => Object.values(Chart.instances || {}).forEach((c) => { try { c.resize(680, 220); } catch (e) {} }));
  window.addEventListener("afterprint", () => Object.values(Chart.instances || {}).forEach((c) => { try { c.resize(); } catch (e) {} }));
}

function GraficoComparativo({ titulo, labels, datasets, tipo, empilhado }) {
  const { useRef, useEffect } = React;
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: tipo || "bar",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: datasets.length > 1, labels: { font: { size: 10.5 } } } },
        scales: {
          x: { stacked: !!empilhado, ticks: { font: { size: 10.5 } } },
          y: { stacked: !!empilhado, beginAtZero: true, ticks: { precision: 0, font: { size: 10.5 } } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(labels), JSON.stringify(datasets)]);

  return (
    <div className="chart-box">
      <h4>{titulo}</h4>
      <canvas ref={canvasRef}></canvas>
    </div>
  );
}

function estatisticasPerformance(dados) {
  return Array.from(new Set(
    Object.values(dados.perfData).flat().flatMap((r) => Object.keys(parseNota(r.nota, r.tipo).campos))
  )).sort();
}

function subcamposDoInstrumento(dados, instrumento) {
  for (const lista of Object.values(dados.psiData)) {
    const reg = lista.find((r) => r.tipo === instrumento);
    if (reg) {
      const campos = parseNota(reg.nota, reg.tipo).campos;
      return Object.keys(campos).filter((k) => typeof campos[k] === "number");
    }
  }
  return [];
}

/** Valor mais recente de um atleta para instrumento+subcampo de psicologia (ou null). */
function valorPsi(dados, atletaId, instrumento, subcampo) {
  const reg = (dados.psiData[atletaId] || []).find((r) => r.tipo === instrumento);
  if (!reg) return null;
  const v = parseNota(reg.nota, reg.tipo).campos[subcampo];
  return typeof v === "number" ? v : null;
}

/** Valor mais recente de um atleta para uma estatística de performance (ou null). */
function valorPerformance(dados, atletaId, estatistica) {
  const regs = dados.perfData[atletaId] || [];
  if (!regs.length) return null;
  const v = parseNota(regs[0].nota).campos[estatistica];
  return typeof v === "number" ? v : null;
}

/**
 * Mapeamento de CONSTRUTOS psicológicos -> quais instrumentos/campos
 * alimentam cada um. Um construto pode ser medido por mais de um
 * instrumento (ex: ansiedade somática aparece no CSAI-2R, no SAS e no
 * HAM-A). Isso é uma categorização clínica — o agrupamento abaixo é
 * uma proposta inicial baseada nos nomes dos campos; vale revisão de
