/** Mostra a folha A4 (794 px) inteira, reduzindo proporcionalmente em telas estreitas. Só afeta a prévia: o PDF é gerado à parte e sai sempre igual. */
function PreviewRelatorio({ children }) {
  const { useRef, useEffect, useState } = React;
  const wrapRef = useRef(null);
  const [zoom, setZoom] = useState(1);
  useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    function medir() {
      const cs = getComputedStyle(el);
      const util = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      setZoom(Math.min(1, util / 794));
    }
    medir();
    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(medir) : null;
    if (ro) ro.observe(el);
    return () => { if (ro) ro.disconnect(); };
  }, []);
  return (
    <div className="relatorio-preview-wrap" ref={wrapRef}>
      <div className="relatorio-preview-escala" style={{ zoom }}>{children}</div>
    </div>
  );
}

/* ==================== PDF nativo, no padrão do relatório de referência ==================== */
/* O PDF é desenhado de verdade (texto vetorial, página A4 fixa), em vez de fotografar a tela:
   sai igual em qualquer aparelho, não corta linha de tabela na virada da página, repete o
   cabeçalho da tabela, mantém margem em todas as páginas e numera as páginas no rodapé. */

const PDF_COR = {
  navy: [27, 42, 74],             // #1B2A4A — título, cabeçalho da tabela
  verde: [46, 125, 79],           // #2E7D4F — subtítulo, filetes das seções
  vermelho: [176, 58, 46],        // #B03A2E — nomes e dados em destaque
  rosa: [251, 234, 232],          // #FBEAE8 — caixa e linhas de atenção
  zebra: [242, 242, 242],
  verdeClaro: [234, 245, 238],    // #EAF5EE
  amareloClaro: [255, 246, 218],  // #FFF6DA
  rotuloInfo: [230, 242, 234],    // #E6F2EA — rótulos da tabela de informações
  cinza: [115, 115, 115],
  preto: [0, 0, 0],
  branco: [255, 255, 255],
};
const PDF_PONTO = { verde: [67, 160, 71], amarelo: [242, 194, 48], vermelho: [217, 70, 59], neutro: [158, 163, 170] };
const PDF_FUNDO_SINAL = { verde: PDF_COR.verdeClaro, amarelo: PDF_COR.amareloClaro, vermelho: PDF_COR.rosa, neutro: PDF_COR.branco };
const PDF_LAYOUT = { margemX: 14, topoContinuacao: 21, base: 17 };
const PT_MM = 0.3528;
const CP1252_EXTRA = "€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ";

/** Deixa o texto seguro pras fontes padrão do PDF (Times): mantém acentos e pontuação, tira emoji/símbolos que a fonte não desenha. */
function textoPdf(v) {
  if (v === null || v === undefined) return "";
  let s = "";
  for (const ch of String(v)) {
    const c = ch.codePointAt(0);
    if (ch === "\n" || (c >= 0x20 && c <= 0x7e) || (c >= 0xa0 && c <= 0xff) || CP1252_EXTRA.includes(ch)) s += ch;
    else if (ch === "\t") s += " ";
    else if (ch === "→") s += "->";
  }
  return s.replace(/ {2,}/g, " ").trim();
}

function novoDocPdf() {
  const { jsPDF } = window.jspdf;
  return new jsPDF({ unit: "mm", format: "a4", compress: true });
}

function pdfIconeAtencao(doc, x, y, tamanho) {
  const h = tamanho, w = tamanho * 1.12;
  doc.setLineWidth(0.15);
  doc.setDrawColor(191, 138, 0);
  doc.setFillColor(242, 184, 0);
  doc.triangle(x, y + h, x + w / 2, y, x + w, y + h, "FD");
  doc.setFillColor(42, 31, 0);
  doc.rect(x + w / 2 - tamanho * 0.055, y + h * 0.33, tamanho * 0.11, h * 0.36, "F");
  doc.circle(x + w / 2, y + h * 0.82, tamanho * 0.065, "F");
}

function pdfGarantirEspaco(ctx, altura) {
  if (ctx.y + altura > ctx.H - PDF_LAYOUT.base) {
    ctx.doc.addPage();
    ctx.y = PDF_LAYOUT.topoContinuacao;
  }
}

/** "DEPARTAMENTO MÉDICO · EC Meia Noite SAF", alinhado à direita (negrito azul + verde). */
function pdfLinhaDepartamento(doc, rel, xDireita, yBase, tamanho) {
  const dep = textoPdf(rel.departamento).toLocaleUpperCase("pt-BR");
  const sep = "  ·  ";
  const clube = textoPdf(rel.clube);
  doc.setFontSize(tamanho);
  doc.setFont("times", "bold");
  const w1 = doc.getTextWidth(dep);
  doc.setFont("times", "normal");
  const w2 = doc.getTextWidth(sep);
  const w3 = doc.getTextWidth(clube);
  let x = xDireita - (w1 + w2 + w3);
  doc.setFont("times", "bold");
  doc.setTextColor(...PDF_COR.navy);
  doc.text(dep, x, yBase);
  x += w1;
  doc.setFont("times", "normal");
  doc.setTextColor(...PDF_COR.verde);
  doc.text(sep, x, yBase);
  doc.text(clube, x + w2, yBase);
  return w1 + w2 + w3;
}

function pdfCabecalho(ctx, rel) {
  const { doc } = ctx;
  const largura = ctx.x1 - ctx.x0;
  try { doc.addImage(ESCUDO_MEIA_NOITE, "PNG", ctx.x0 + largura * 0.25 - 6.5, 11, 13, 13, "escudo-meia-noite", "FAST"); } catch (e) { /* segue sem o escudo */ }
  pdfLinhaDepartamento(doc, rel, ctx.x1, 19.6, 10);
  doc.setDrawColor(...PDF_COR.navy);
  doc.setLineWidth(0.45);
  doc.line(ctx.x0 + largura * 0.5, 23.4, ctx.x1, 23.4);
  const cx = (ctx.x0 + ctx.x1) / 2;
  doc.setFont("times", "bold");
  doc.setFontSize(15);
  doc.setTextColor(...PDF_COR.navy);
  let y = 30;
  doc.splitTextToSize(textoPdf(rel.titulo), largura).forEach((ln) => { doc.text(ln, cx, y, { align: "center" }); y += 6.2; });
  doc.setFont("times", "italic");
  doc.setFontSize(11);
  doc.setTextColor(...PDF_COR.verde);
  doc.text(textoPdf(rel.subtitulo), cx, y - 0.6, { align: "center" });
  ctx.y = y + 2.6;
}

function pdfCabecalhoContinuacao(ctx, rel) {
  const { doc } = ctx;
  const largura = ctx.x1 - ctx.x0;
  const larguraDep = pdfLinhaDepartamento(doc, rel, ctx.x1, 12.6, 8.5);
  doc.setDrawColor(...PDF_COR.navy);
  doc.setLineWidth(0.35);
  doc.line(ctx.x0 + largura * 0.5, 15.2, ctx.x1, 15.2);
  try { doc.addImage(ESCUDO_MEIA_NOITE, "PNG", ctx.x0, 7.6, 8, 8, "escudo-meia-noite", "FAST"); } catch (e) { /* segue sem o escudo */ }
  doc.setFont("times", "italic");
  doc.setFontSize(8);
  doc.setTextColor(...PDF_COR.cinza);
  const espaco = largura - larguraDep - 14;
  let titulo = textoPdf(rel.titulo);
  while (titulo.length > 8 && doc.getTextWidth(titulo) > espaco) titulo = titulo.slice(0, -2);
  if (titulo !== textoPdf(rel.titulo)) titulo = titulo.trim() + "…";
  doc.text(titulo, ctx.x0 + 10, 12.6);
}

function pdfRodape(ctx, rel, numero, total) {
  const { doc } = ctx;
  const cx = (ctx.x0 + ctx.x1) / 2;
  const y = ctx.H - 9.5;
  const parte1 = textoPdf(rel.rodape) + "   |   Página ";
  const parte2 = String(numero);
  const parte3 = total > 1 ? ` de ${total}` : "";
  doc.setFont("times", "normal");
  doc.setFontSize(8);
  const w1 = doc.getTextWidth(parte1);
  const w3 = doc.getTextWidth(parte3);
  doc.setFontSize(10);
  const w2 = doc.getTextWidth(parte2);
  let x = cx - (w1 + w2 + w3) / 2;
  doc.setFontSize(8);
  doc.setTextColor(...PDF_COR.cinza);
  doc.text(parte1, x, y);
  x += w1;
  doc.setFontSize(10);
  doc.setTextColor(...PDF_COR.preto);
  doc.text(parte2, x, y);
  x += w2;
  if (parte3) {
    doc.setFontSize(8);
    doc.setTextColor(...PDF_COR.cinza);
    doc.text(parte3, x, y);
  }
}

function pdfSecao(ctx, titulo, opcoes) {
  const { doc } = ctx;
  const o = opcoes || {};
  pdfGarantirEspaco(ctx, 8 + (o.reservar || 0));
  let x = ctx.x0;
  if (o.icone) { pdfIconeAtencao(doc, x, ctx.y + 0.7, 3.5); x += 5.3; }
  doc.setFont("times", "bold");
  doc.setFontSize(11);
  doc.setTextColor(...PDF_COR.navy);
  doc.text(textoPdf(titulo).toLocaleUpperCase("pt-BR"), x, ctx.y + 3.9);
  doc.setDrawColor(...PDF_COR.verde);
  doc.setLineWidth(0.3);
  doc.line(ctx.x0, ctx.y + 5.4, ctx.x1, ctx.y + 5.4);
  ctx.y += 6.8;
}

function pdfParagrafo(ctx, texto) {
  const { doc } = ctx;
  const tam = 10;
  const lh = tam * 1.2 * PT_MM;
  doc.setFont("times", "normal");
  doc.setFontSize(tam);
  doc.setTextColor(...PDF_COR.preto);
  doc.splitTextToSize(textoPdf(texto), ctx.x1 - ctx.x0).forEach((ln) => {
    pdfGarantirEspaco(ctx, lh + 0.5);
    doc.text(ln, ctx.x0, ctx.y + tam * 0.8 * PT_MM);
    ctx.y += lh;
  });
}

function pdfMargensTabela(ctx) {
  return { left: ctx.x0, right: ctx.W - ctx.x1, top: PDF_LAYOUT.topoContinuacao, bottom: PDF_LAYOUT.base };
}

function pdfTabelaInfo(ctx, rel) {
  const { doc } = ctx;
  doc.autoTable({
    startY: ctx.y,
    margin: pdfMargensTabela(ctx),
    body: rel.info.map(([k, v]) => [textoPdf(k), textoPdf(v)]),
    theme: "grid",
    styles: { font: "times", fontSize: 9, textColor: PDF_COR.preto, lineColor: PDF_COR.preto, lineWidth: 0.25, cellPadding: { top: 0.75, bottom: 0.75, left: 1.8, right: 1.8 }, valign: "middle" },
    bodyStyles: { fillColor: PDF_COR.branco },
    columnStyles: { 0: { cellWidth: 36, fontStyle: "bold", fillColor: PDF_COR.rotuloInfo } },
    rowPageBreak: "avoid",
  });
  ctx.y = doc.lastAutoTable.finalY + 3.4;
}

/** Caixa rosa com os pontos de atenção. Se não couber tudo na página, fecha a caixa e continua na próxima. */
function pdfCaixaAtencao(ctx, itens) {
  const { doc } = ctx;
  const largura = ctx.x1 - ctx.x0;
  const padX = 2.8, padY = 2.1, tam = 10, lh = tam * 1.2 * PT_MM;
  let inicioSegmento = null;
  function fecharSegmento() {
    if (inicioSegmento === null) return;
    doc.setDrawColor(...PDF_COR.preto);
    doc.setLineWidth(0.25);
    doc.rect(ctx.x0, inicioSegmento, largura, ctx.y - inicioSegmento, "S");
    inicioSegmento = null;
  }
  itens.forEach((it, i) => {
    doc.setFontSize(tam);
    doc.setFont("times", "bold");
    const tituloLinhas = doc.splitTextToSize(textoPdf(it.titulo), largura - 2 * padX);
    doc.setFont("times", "normal");
    const corpoLinhas = it.corpo ? doc.splitTextToSize(textoPdf(it.corpo), largura - 2 * padX) : [];
    const ultimo = i === itens.length - 1;
    const h = padY + tituloLinhas.length * lh + 0.9 + corpoLinhas.length * lh + (ultimo ? padY : 1.2);
    if (ctx.y + h > ctx.H - PDF_LAYOUT.base) {
      fecharSegmento();
      doc.addPage();
      ctx.y = PDF_LAYOUT.topoContinuacao;
    }
    if (inicioSegmento === null) inicioSegmento = ctx.y;
    doc.setFillColor(...PDF_COR.rosa);
    doc.rect(ctx.x0, ctx.y, largura, h, "F");
    let yy = ctx.y + padY;
    doc.setFont("times", "bold");
    doc.setTextColor(...PDF_COR.vermelho);
    tituloLinhas.forEach((ln) => { doc.text(ln, ctx.x0 + padX, yy + tam * 0.8 * PT_MM); yy += lh; });
    yy += 0.9;
    doc.setFont("times", "normal");
    doc.setTextColor(...PDF_COR.preto);
    corpoLinhas.forEach((ln) => { doc.text(ln, ctx.x0 + padX, yy + tam * 0.8 * PT_MM); yy += lh; });
    ctx.y += h;
  });
  fecharSegmento();
  ctx.y += 3.2;
}

function pdfTabelaDetalhe(ctx, rel) {
  const { doc } = ctx;
  const centro = new Set(rel.colunasCentro);
  const emDestaque = new Set(rel.colunasEmDestaque);
  const vazio = rel.linhas.length === 0;
  const padrao = { top: 1.1, bottom: 1.1, left: 1.6, right: 1.6 };
  const columnStyles = {};
  rel.colunas.forEach((_, i) => {
    columnStyles[i] = {};
    if (centro.has(i)) columnStyles[i].halign = "center";
    if (rel.larguras[i]) columnStyles[i].cellWidth = rel.larguras[i];
  });
  doc.autoTable({
    startY: ctx.y,
    margin: pdfMargensTabela(ctx),
    head: [rel.colunas.map(textoPdf)],
    body: vazio
      ? [[{ content: "Nenhum registro no período selecionado.", colSpan: rel.colunas.length, styles: { halign: "center", textColor: PDF_COR.cinza, fontStyle: "italic" } }]]
      : rel.linhas.map((linha) => linha.map(textoPdf)),
    theme: "grid",
    styles: { font: "times", fontSize: 9, textColor: PDF_COR.preto, lineColor: PDF_COR.preto, lineWidth: 0.2, cellPadding: padrao, valign: "middle", overflow: "linebreak" },
    headStyles: { fillColor: PDF_COR.navy, textColor: PDF_COR.branco, fontStyle: "bold", valign: "middle" },
    bodyStyles: { fillColor: PDF_COR.branco },
    alternateRowStyles: { fillColor: PDF_COR.zebra },
    columnStyles,
    rowPageBreak: "avoid",
    showHead: "everyPage",
    didParseCell(data) {
      if (data.section === "head") {
        if (centro.has(data.column.index)) data.cell.styles.halign = "center";
        return;
      }
      if (data.section !== "body" || vazio || !rel.destaques[data.row.index]) return;
      data.cell.styles.fillColor = PDF_COR.rosa;
      if (emDestaque.has(data.column.index)) {
        data.cell.styles.textColor = PDF_COR.vermelho;
        data.cell.styles.fontStyle = "bold";
      }
      if (data.column.index === rel.colunaNome) data.cell.styles.cellPadding = { ...padrao, left: 6.2 };
    },
    didDrawCell(data) {
      if (data.section !== "body" || vazio || !rel.destaques[data.row.index] || data.column.index !== rel.colunaNome) return;
      const t = 3.1;
      pdfIconeAtencao(doc, data.cell.x + 1.5, data.cell.y + data.cell.height / 2 - t / 2 - 0.15, t);
    },
  });
  ctx.y = doc.lastAutoTable.finalY + 4;
}

function pdfResumoPratico(ctx, rel) {
  const { doc } = ctx;
  pdfSecao(ctx, rel.secaoResumoPratico, { reservar: 12 });
  doc.setFont("times", "italic");
  doc.setFontSize(7.5);
  doc.setTextColor(...PDF_COR.cinza);
  let x = ctx.x0;
  const yb = ctx.y + 2.3;
  function escrever(t) { doc.text(t, x, yb); x += doc.getTextWidth(t); }
  escrever("Leitura rápida por atleta: ");
  rel.legenda.forEach(([sinal, label], i) => {
    if (i > 0) escrever(" · ");
    doc.setFillColor(...PDF_PONTO[sinal]);
    doc.circle(x + 1.1, yb - 0.85, 0.95, "F");
    x += 2.7;
    escrever(label);
  });
  ctx.y += 3.9;
  doc.autoTable({
    startY: ctx.y,
    margin: pdfMargensTabela(ctx),
    body: rel.resumoPratico.map((r) => ["", textoPdf(r.nome), textoPdf(r.categoria), textoPdf(r.texto)]),
    theme: "grid",
    styles: { font: "times", fontSize: 8, textColor: PDF_COR.preto, lineColor: PDF_COR.preto, lineWidth: 0.2, cellPadding: { top: 0.7, bottom: 0.7, left: 1.6, right: 1.6 }, valign: "middle", overflow: "linebreak" },
    bodyStyles: { fillColor: PDF_COR.branco },
    columnStyles: { 0: { cellWidth: 9, halign: "center" }, 1: { cellWidth: 57 }, 2: { cellWidth: 16, halign: "center" } },
    rowPageBreak: "avoid",
    didParseCell(data) {
      const r = rel.resumoPratico[data.row.index];
      if (!r) return;
      data.cell.styles.fillColor = PDF_FUNDO_SINAL[r.sinal] || PDF_COR.branco;
      if (data.column.index === 1 && r.destaque) {
        data.cell.styles.textColor = PDF_COR.vermelho;
        data.cell.styles.fontStyle = "bold";
      }
    },
    didDrawCell(data) {
      if (data.section !== "body" || data.column.index !== 0) return;
      const r = rel.resumoPratico[data.row.index];
      if (!r) return;
      const cor = PDF_PONTO[r.sinal] || PDF_PONTO.neutro;
      doc.setFillColor(...cor);
      doc.setDrawColor(Math.round(cor[0] * 0.75), Math.round(cor[1] * 0.75), Math.round(cor[2] * 0.75));
      doc.setLineWidth(0.15);
      doc.circle(data.cell.x + data.cell.width / 2, data.cell.y + data.cell.height / 2, 1.5, "FD");
    },
  });
  ctx.y = doc.lastAutoTable.finalY + 4;
}

/** Desenha um gráfico Chart.js num canvas fora da tela, em alta resolução e fundo branco, e devolve a imagem pro PDF. */
function graficoParaImagem(chartConfig, largura, altura) {
  const canvas = document.createElement("canvas");
  canvas.width = largura;
  canvas.height = altura;
  const opcoes = chartConfig.options || {};
  const pluginsOpc = opcoes.plugins || {};
  const ehRosca = chartConfig.type === "doughnut" || chartConfig.type === "pie";
  const config = {
    type: chartConfig.type,
    data: JSON.parse(JSON.stringify(chartConfig.data)),
    options: {
      ...opcoes,
      responsive: false,
      maintainAspectRatio: false,
      animation: false,
      devicePixelRatio: 2,
      plugins: { ...pluginsOpc, legend: { ...(pluginsOpc.legend || {}), ...(ehRosca ? { display: true, position: "right" } : {}) } },
    },
    plugins: [{
      id: "fundoBrancoPdf",
      beforeDraw(chart) {
        const c = chart.ctx;
        c.save();
        c.fillStyle = "#ffffff";
        c.fillRect(0, 0, chart.width, chart.height);
        c.restore();
      },
    }],
  };
  const fonteAnterior = Chart.defaults.font.family;
  const corAnterior = Chart.defaults.color;
  Chart.defaults.font.family = "'Times New Roman', Times, serif";
  Chart.defaults.color = "#333333";
  try {
    const chart = new Chart(canvas, config);
    // JPEG entra no PDF sem ser recodificado (bem mais rápido que PNG em lote) e o fundo já é branco
    const url = canvas.toDataURL("image/jpeg", 0.92);
    chart.destroy();
    return url;
  } finally {
    Chart.defaults.font.family = fonteAnterior;
    Chart.defaults.color = corAnterior;
  }
}

function pdfGrafico(ctx, grafico) {
  const largura = ctx.x1 - ctx.x0;
  const pxL = 760, pxA = 250;
  const altura = largura * pxA / pxL;
  pdfSecao(ctx, grafico.titulo, { reservar: altura + 2 });
  let img = null;
  try { img = graficoParaImagem(grafico.chartConfig, pxL, pxA); } catch (e) { img = null; }
  if (img) ctx.doc.addImage(img, "JPEG", ctx.x0, ctx.y, largura, altura);
  ctx.y += altura + 3;
}

function pdfAssinatura(ctx, rel) {
  const { doc } = ctx;
  pdfGarantirEspaco(ctx, 20);
  const cx = (ctx.x0 + ctx.x1) / 2;
  let y = ctx.y + 2.4;
  doc.setFontSize(7.5);
  doc.setTextColor(...PDF_COR.preto);
  doc.setFont("times", "normal");
  doc.text(textoPdf(`${rel.local}, ${rel.dataAssinatura}`), cx, y, { align: "center" });
  y += 3.5;
  if (rel.responsavelNome) {
    doc.setFont("times", "bold");
    doc.text(textoPdf(rel.responsavelNome), cx, y, { align: "center" });
    y += 3.1;
  }
  doc.setFont("times", "normal");
  if (rel.responsavelRegistro) { doc.text(textoPdf(rel.responsavelRegistro), cx, y, { align: "center" }); y += 3.1; }
  doc.text(textoPdf(rel.cargoLinha), cx, y, { align: "center" });
  ctx.y = y + 3;
}

/** Desenha um relatório completo no doc. Se não for o primeiro conteúdo do doc, começa em página nova
 *  (é o que permite juntar vários atletas num PDF só); a numeração "Página N de M" é por relatório. */
function desenharRelatorioPdf(doc, rel, primeiroDoDocumento) {
  if (!primeiroDoDocumento) doc.addPage();
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const ctx = { doc, W, H, x0: PDF_LAYOUT.margemX, x1: W - PDF_LAYOUT.margemX, y: 0 };
  const paginaInicial = doc.getNumberOfPages();

  pdfCabecalho(ctx, rel);
  pdfTabelaInfo(ctx, rel);
  pdfSecao(ctx, rel.secaoResumo, { reservar: 8 });
  pdfParagrafo(ctx, rel.resumoTexto);
  ctx.y += 2.6;
  if (rel.pontosAtencao.length > 0) {
    pdfSecao(ctx, "Pontos de atenção", { icone: true, reservar: 14 });
    pdfCaixaAtencao(ctx, rel.pontosAtencao);
  }
  pdfSecao(ctx, rel.secaoDetalhe, { reservar: 16 });
  pdfTabelaDetalhe(ctx, rel);
  if (rel.resumoPratico.length > 0) pdfResumoPratico(ctx, rel);
  rel.graficos.forEach((g) => pdfGrafico(ctx, g));
  pdfAssinatura(ctx, rel);

  const paginaFinal = doc.getNumberOfPages();
  const total = paginaFinal - paginaInicial + 1;
  for (let p = paginaInicial; p <= paginaFinal; p++) {
    doc.setPage(p);
    if (p > paginaInicial) pdfCabecalhoContinuacao(ctx, rel);
    pdfRodape(ctx, rel, p - paginaInicial + 1, total);
  }
  doc.setPage(paginaFinal);
}

/** Gera o PDF de um relatório e dispara o download direto. */
function baixarRelatorioPDF(rel, nomeArquivo) {
  const doc = novoDocPdf();
  doc.setProperties({ title: textoPdf(rel.titulo), subject: textoPdf(rel.rodape), author: textoPdf(rel.responsavelNome || "MeuCT"), creator: "MeuCT · Meia Noite EC" });
  desenharRelatorioPdf(doc, rel, true);
  doc.save(nomeArquivo);
}

/** Deixa um texto seguro pra usar em nome de arquivo: sem acento, sem espaço/caractere especial. */
function fatiaArquivo(txt) {
  const limpo = (txt || "")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-zA-Z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
  return limpo || "Relatorio";
}

/** Converte "YYYY-MM-DD" pra "DD-MM-AAAA" (padrão usado no nome do arquivo). */
function dataArquivo(dataIso) {
  const [y, m, d] = (dataIso || hojeISO()).split("-");
  return `${d}-${m}-${y}`;
}

/** Nome do arquivo do relatório: sempre Setor_Atleta(ouGrupo)_Data. */
function nomeArquivoRelatorio(setorLabel, sujeito) {
  return `${fatiaArquivo(setorLabel)}_${fatiaArquivo(sujeito)}_${dataArquivo(hojeISO())}.pdf`;
}

/** Dispara o download de um Blob já pronto (usado pro .zip de PDFs em lote). */
function baixarBlob(blob, nomeArquivo) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nomeArquivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/** Atletas (dentre os candidatos) que têm pelo menos 1 registro dentro do período escolhido no relatório. */
function atletasComDadosNoPeriodo(registros, atletasCandidatos, filtros) {
  return atletasCandidatos.filter((a) => (registros[a.id] || []).some((r) => dataNoPeriodo(r.data, filtros)));
}

function CentralRelatorios({ usuario }) {
  const { useState, useEffect, useRef } = React;
  useBibliotecas("pdf", "zip");
  const modulosPermitidos = MODULOS_RELATORIO.filter((m) => temPermissao(usuario, m));
  const [moduloId, setModuloId] = useState(modulosPermitidos[0] || "");
  const [modo, setModo] = useState("individual"); // "individual" | "grupo"
  const [tipoPeriodo, setTipoPeriodo] = useState("dia");
  const [dataDia, setDataDia] = useState(hojeISO());
  const [dataInicio, setDataInicio] = useState(hojeISO());
  const [dataFim, setDataFim] = useState(hojeISO());
  const [atletaId, setAtletaId] = useState("");
  const [categoria, setCategoria] = useState("");
  const [status, setStatus] = useState("");
  const [destinatario, setDestinatario] = useState("Coordenação do Setor de Futebol");
  const [responsavelNome, setResponsavelNome] = useState(usuario.nome || usuario.email || "");
  const [responsavelRegistro, setResponsavelRegistro] = useState("");
  const [responsavelCargo, setResponsavelCargo] = useState("");
  const [local, setLocal] = useState("Patrocínio Paulista");
  const [atletas, setAtletas] = useState(null);
  const [carregando, setCarregando] = useState(false);
  const [erro, setErro] = useState(null);
  const [conteudo, setConteudo] = useState(null);
  const [baixando, setBaixando] = useState(false);

  // ---- Modo grupo ----
  const [grupoIds, setGrupoIds] = useState([]); // ids dos atletas marcados pro grupo
  const [gerandoGrupo, setGerandoGrupo] = useState(null); // null | "zip" | "combinado"
  const [progressoGrupo, setProgressoGrupo] = useState(null); // { atual, total, nome }

  const config = CONFIG_RELATORIO_MODULO[moduloId];

  useEffect(() => {
    carregarAtletas().then(setAtletas).catch((e) => setErro("Não consegui carregar os dados: " + e.message));
  }, []);

  useEffect(() => { setStatus(""); setConteudo(null); setGrupoIds([]); }, [moduloId]);

  const candidatosGrupo = (atletas || []).filter(
    (a) => !categoria || normalizarCategoria(a.categoria) === categoria
  );

  async function gerar() {
    if (!config) return;
    setCarregando(true); setErro(null);
    try {
      const listaAtletas = atletas || await carregarAtletas();
      if (!atletas) setAtletas(listaAtletas);
      const registros = await carregarTodosRegistros(config.subcol);
      const filtros = { tipoPeriodo, dataDia, dataInicio, dataFim, atletaId, categoria, status };
      // guarda os filtros usados junto do conteúdo: mexer nos campos depois não "descola" o cabeçalho do conteúdo
      setConteudo({ ...config.construir(registros, listaAtletas, filtros), filtrosUsados: { atletaId, tipoPeriodo, dataDia, dataInicio, dataFim, categoria } });
    } catch (e) {
      setErro("Não consegui carregar os dados: " + e.message);
    } finally {
      setCarregando(false);
    }
  }

  const rotuloPeriodo = (f) => (f.tipoPeriodo === "dia" ? formatarData(f.dataDia) : `${formatarData(f.dataInicio)} a ${formatarData(f.dataFim)}`);
  const rotuloCategoria = (c) => (c === "sub15" ? "Sub-15" : c === "sub17" ? "Sub-17" : "");
  const periodoLabel = rotuloPeriodo({ tipoPeriodo, dataDia, dataInicio, dataFim });
  const categoriaLabel = rotuloCategoria(categoria);

  /** Tudo que vai no cabeçalho/assinatura do documento (o conteúdo vem do módulo).
   *  Período/atleta/categoria vêm dos filtros usados na geração; responsável e destinatário são livres. */
  function metaDocumento(filtros) {
    const atleta = filtros.atletaId ? (atletas || []).find((a) => a.id === filtros.atletaId) : null;
    return {
      tipoPeriodo: filtros.tipoPeriodo, periodoLabel: rotuloPeriodo(filtros), destinatario, local,
      atletaNome: atleta ? `${nomeExibicao(atleta)}${atleta.categoria ? " (" + atleta.categoria + ")" : ""}` : "",
      categoriaLabel: rotuloCategoria(filtros.categoria),
      responsavelNome, responsavelRegistro, responsavelCargo,
    };
  }

  const filtrosAtuais = { atletaId, tipoPeriodo, dataDia, dataInicio, dataFim, categoria };
  const documento = conteudo && config ? montarDocumentoRelatorio(config, conteudo, metaDocumento(conteudo.filtrosUsados || filtrosAtuais)) : null;

  async function baixar() {
    if (!documento) return;
    setBaixando(true);
    setErro(null);
    try {
      await new Promise((res) => setTimeout(res, 30)); // deixa o botão mostrar "Preparando PDF..."
      const usados = conteudo.filtrosUsados || filtrosAtuais;
      const sujeito = usados.atletaId ? nomeAtleta(atletas, usados.atletaId) : (rotuloCategoria(usados.categoria) || "Todos");
      await carregarBiblioteca("pdf");
      baixarRelatorioPDF(documento, nomeArquivoRelatorio(config.label, sujeito));
    } catch (e) {
      setErro("Não foi possível gerar o PDF: " + (e && e.message ? e.message : e));
    } finally {
      setBaixando(false);
    }
  }

  function toggleGrupoId(id) {
    setGrupoIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  }

  async function marcarComDadosNoPeriodo() {
    if (!config) return;
    setCarregando(true); setErro(null);
    try {
      const listaAtletas = atletas || await carregarAtletas();
      if (!atletas) setAtletas(listaAtletas);
      const registros = await carregarTodosRegistros(config.subcol);
      const filtros = { tipoPeriodo, dataDia, dataInicio, dataFim };
      const candidatos = listaAtletas.filter((a) => !categoria || normalizarCategoria(a.categoria) === categoria);
      const comDados = atletasComDadosNoPeriodo(registros, candidatos, filtros);
      setGrupoIds(comDados.map((a) => a.id));
    } catch (e) {
      setErro("Não consegui carregar os dados: " + e.message);
    } finally {
      setCarregando(false);
    }
  }

  /** Gera os relatórios de todos os atletas do grupo, um de cada vez (direto no PDF, sem depender da tela),
   *  e junta o resultado num .zip (um PDF por atleta) ou num único PDF combinado. */
  async function processarGrupo(saida) {
    if (!config || grupoIds.length === 0) return;
    setGerandoGrupo(saida); setErro(null);
    try {
      const listaAtletas = atletas || await carregarAtletas();
      if (!atletas) setAtletas(listaAtletas);
      const registros = await carregarTodosRegistros(config.subcol);
      await Promise.all([carregarBiblioteca("pdf"), saida === "zip" ? carregarBiblioteca("zip") : null]);
      const filtrosBase = { tipoPeriodo, dataDia, dataInicio, dataFim, categoria, status };
      const zip = saida === "zip" ? new JSZip() : null;
      const pdfCombinado = saida === "combinado" ? novoDocPdf() : null;

      for (let i = 0; i < grupoIds.length; i++) {
        const idAtual = grupoIds[i];
        const nomeAtual = nomeAtleta(listaAtletas, idAtual);
        setProgressoGrupo({ atual: i + 1, total: grupoIds.length, nome: nomeAtual });
        await new Promise((res) => setTimeout(res, 0)); // deixa a tela atualizar o progresso

        const filtros = { ...filtrosBase, atletaId: idAtual };
        const conteudoAtleta = config.construir(registros, listaAtletas, filtros);
        const atleta = listaAtletas.find((a) => a.id === idAtual);
        const docAtleta = montarDocumentoRelatorio(config, conteudoAtleta, {
          ...metaDocumento({ ...filtrosAtuais, atletaId: "" }),
          atletaNome: atleta ? `${nomeExibicao(atleta)}${atleta.categoria ? " (" + atleta.categoria + ")" : ""}` : nomeAtual,
        });

        if (saida === "zip") {
          const pdfIndividual = novoDocPdf();
          desenharRelatorioPdf(pdfIndividual, docAtleta, true);
          zip.file(nomeArquivoRelatorio(config.label, nomeAtual), pdfIndividual.output("blob"));
        } else {
          desenharRelatorioPdf(pdfCombinado, docAtleta, i === 0);
        }
      }

      const sujeitoGrupo = categoriaLabel || "Todos";
      if (saida === "zip") {
        const blob = await zip.generateAsync({ type: "blob" });
        baixarBlob(blob, `${fatiaArquivo(config.label)}_Grupo-${fatiaArquivo(sujeitoGrupo)}_${dataArquivo(hojeISO())}.zip`);
      } else {
        pdfCombinado.save(`${fatiaArquivo(config.label)}_Grupo-${fatiaArquivo(sujeitoGrupo)}_${dataArquivo(hojeISO())}.pdf`);
      }
    } catch (e) {
      setErro("Não foi possível gerar os PDFs do grupo: " + (e && e.message ? e.message : e));
    } finally {
      setGerandoGrupo(null);
      setProgressoGrupo(null);
    }
  }

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>Central de Relatórios</h1>
          <div className="crumb">MeuCT · Meia Noite EC · gera relatórios em PDF por módulo, período e filtros</div>
        </div>
      </div>

      {erro && (
        <div className="access-note" style={{ background: "var(--vermelho-bg)", borderColor: "var(--vermelho)" }}>
          <span>{erro}</span>
        </div>
      )}

      {modulosPermitidos.length === 0 ? (
        <div className="empty-state">Você não tem acesso a nenhum módulo com dados pra relatório.</div>
      ) : (
        <React.Fragment>
          <div className="panel">
            <div className="panel-head"><h3>Filtros</h3></div>
            <div className="panel-body" style={{ padding: "16px 20px" }}>
              <div className="relatorio-filtros-grid">
                <div className="field">
                  <label>Módulo</label>
                  <select value={moduloId} onChange={e => setModuloId(e.target.value)}>
                    {modulosPermitidos.map((m) => <option key={m} value={m}>{CONFIG_RELATORIO_MODULO[m].label}</option>)}
                  </select>
                </div>
                <div className="field">
                  <label>Período</label>
                  <TabSelect opcoes={["Dia", "Intervalo"]} valor={tipoPeriodo === "dia" ? "Dia" : "Intervalo"} onChange={(v) => setTipoPeriodo(v === "Dia" ? "dia" : "intervalo")} tamanho="sm" />
                </div>
                {tipoPeriodo === "dia" ? (
                  <div className="field"><label>Data</label><input type="date" value={dataDia} onChange={e => setDataDia(e.target.value)} /></div>
                ) : (
                  <React.Fragment>
                    <div className="field"><label>De</label><input type="date" value={dataInicio} onChange={e => setDataInicio(e.target.value)} /></div>
                    <div className="field"><label>Até</label><input type="date" value={dataFim} onChange={e => setDataFim(e.target.value)} /></div>
                  </React.Fragment>
                )}
                <div className="field">
                  <label>Categoria</label>
                  <select value={categoria} onChange={e => setCategoria(e.target.value)}>
                    <option value="">Todas</option>
                    <option value="sub15">Sub-15</option>
                    <option value="sub17">Sub-17</option>
                  </select>
                </div>
                <div className="field">
                  <label>Gerar para</label>
                  <TabSelect opcoes={["Atleta único", "Grupo de atletas"]} valor={modo === "individual" ? "Atleta único" : "Grupo de atletas"} onChange={(v) => setModo(v === "Atleta único" ? "individual" : "grupo")} tamanho="sm" />
                </div>
                {modo === "individual" && (
                  <div className="field">
                    <label>Atleta</label>
                    <select value={atletaId} onChange={e => setAtletaId(e.target.value)}>
                      <option value="">Todos</option>
                      {(atletas || []).map(a => <option key={a.id} value={a.id}>{nomeExibicao(a)}</option>)}
                    </select>
                  </div>
                )}
                {config && config.statusOpcoes.length > 0 && (
                  <div className="field">
                    <label>Desfecho / status</label>
                    <select value={status} onChange={e => setStatus(e.target.value)}>
                      <option value="">Todos</option>
                      {config.statusOpcoes.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                    </select>
                  </div>
                )}
              </div>

              <div className="form-grid full" style={{ marginTop: 14 }}>
                <div className="field"><label>Destinatário</label><input type="text" value={destinatario} onChange={e => setDestinatario(e.target.value)} /></div>
              </div>
              <div className="relatorio-filtros-grid" style={{ marginTop: 0 }}>
                <div className="field"><label>Responsável pelo relatório</label><input type="text" value={responsavelNome} onChange={e => setResponsavelNome(e.target.value)} /></div>
                <div className="field"><label>Registro profissional</label><input type="text" placeholder="Ex.: CRM-SP 12345" value={responsavelRegistro} onChange={e => setResponsavelRegistro(e.target.value)} /></div>
                <div className="field"><label>Cargo</label><input type="text" placeholder={"Ex.: " + (config ? config.cargoSugerido : "Responsável")} value={responsavelCargo} onChange={e => setResponsavelCargo(e.target.value)} /></div>
                <div className="field"><label>Local (linha da assinatura)</label><input type="text" value={local} onChange={e => setLocal(e.target.value)} /></div>
              </div>

              {modo === "individual" ? (
                <div className="form-actions" style={{ marginTop: 16 }}>
                  <button className="pill-btn primary" onClick={gerar} disabled={!config || carregando}>{carregando ? "Gerando..." : "Gerar relatório"}</button>
                  {conteudo && <button className="pill-btn" onClick={baixar} disabled={baixando}>{baixando ? "Preparando PDF..." : "Baixar PDF"}</button>}
                </div>
              ) : (
                <div style={{ marginTop: 16 }}>
                  <div className="chart-controls-note" style={{ marginBottom: 8 }}>
                    Marque os atletas que entram no grupo{categoria ? ` (filtrados por ${categoria === "sub15" ? "Sub-15" : "Sub-17"})` : ""}:
                  </div>
                  <div className="form-actions" style={{ marginBottom: 10 }}>
                    <button className="pill-btn" onClick={() => setGrupoIds(candidatosGrupo.map(a => a.id))} disabled={!!gerandoGrupo}>Selecionar todos</button>
                    <button className="pill-btn" onClick={() => setGrupoIds([])} disabled={!!gerandoGrupo}>Limpar seleção</button>
                    <button className="pill-btn" onClick={marcarComDadosNoPeriodo} disabled={!config || carregando || !!gerandoGrupo}>{carregando ? "Verificando..." : "Marcar com dados no período"}</button>
                  </div>
                  <div className="panel-body" style={{ maxHeight: 260, overflowY: "auto", border: "1px solid var(--line-soft)", borderRadius: 9, padding: "6px 4px" }}>
                    {candidatosGrupo.length === 0 ? (
                      <div className="empty-state">Nenhum atleta encontrado com esse filtro de categoria.</div>
                    ) : candidatosGrupo.map(a => (
                      <label key={a.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 10px", fontSize: 13.5, cursor: "pointer" }}>
                        <input type="checkbox" checked={grupoIds.includes(a.id)} onChange={() => toggleGrupoId(a.id)} disabled={!!gerandoGrupo} />
                        {nomeExibicao(a)}{a.categoria ? ` · ${a.categoria}` : ""}
                      </label>
                    ))}
                  </div>
                  <div className="chart-controls-note" style={{ marginTop: 8 }}>{grupoIds.length} atleta(s) selecionado(s).</div>
                  <div className="form-actions" style={{ marginTop: 12 }}>
                    <button className="pill-btn primary" onClick={() => processarGrupo("zip")} disabled={!config || grupoIds.length === 0 || !!gerandoGrupo}>
                      {gerandoGrupo === "zip" ? "Gerando..." : "Baixar PDFs em lote (.zip)"}
                    </button>
                    <button className="pill-btn" onClick={() => processarGrupo("combinado")} disabled={!config || grupoIds.length === 0 || !!gerandoGrupo}>
                      {gerandoGrupo === "combinado" ? "Gerando..." : "Baixar PDF único (todos juntos)"}
                    </button>
                  </div>
                  {progressoGrupo && (
                    <div className="chart-controls-note" style={{ marginTop: 8 }}>
                      Gerando relatório {progressoGrupo.atual} de {progressoGrupo.total}: {progressoGrupo.nome}...
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>

          {modo === "individual" && documento && (
            <PreviewRelatorio>
              <RelatorioModelo rel={documento} />
            </PreviewRelatorio>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

/* =====================================================================
   Agenda, jogos, disponibilidade, check-in diário, carga de treino,
   maturação e busca rápida
   ===================================================================== */
const COL_EVENTOS = "ct_eventos";
const COL_CHECKIN_LINKS = "ct_checkin_links";
const COL_CHECKINS = "ct_checkins";

/* ---------- Quem vê o quê (espelha as regras do Firestore) ---------- */
/** Jogos (convocação e Central do Jogo): comissão técnica e desempenho. */
function podeVerJogos(usuario) {
  return temPermissao(usuario, "treinador") || temPermissao(usuario, "desempenho");
}
/** Monitoramento (bem-estar, carga, maturação): comissão técnica e equipe de saúde. */
function podeVerMonitoramento(usuario) {
  return ["psicologia", "fisiologia", "fisioterapia", "medicina", "treinador"].some((m) => temPermissao(usuario, m));
}
/** Gerar e desativar os links de check-in dos atletas. */
function podeGerirCheckin(usuario) {
  return ["psicologia", "fisiologia", "treinador"].some((m) => temPermissao(usuario, m));
}
/** Disponibilidade depende de Medicina e Fisioterapia: sem ver as duas, o selo mentiria. */
function podeVerDisponibilidade(usuario) {
  return podeVerArea(usuario, "medicina") && podeVerArea(usuario, "fisioterapia");
}

/* ---------- Datas ---------- */
function isoDeData(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function isoMaisDias(iso, n) {
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + n);
  return isoDeData(d);
}
function diasEntreIso(de, ate) {
  return Math.round((new Date(ate + "T12:00:00") - new Date(de + "T12:00:00")) / 86400000);
}
const DIAS_SEMANA_CURTO = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
function diaSemanaCurto(iso) { return DIAS_SEMANA_CURTO[new Date(iso + "T12:00:00").getDay()]; }
function dataCurta(iso) { const [, m, d] = iso.split("-"); return d + "/" + m; }
function dataPorExtenso(iso) {
  const d = new Date(iso + "T12:00:00");
  const semana = d.toLocaleDateString("pt-BR", { weekday: "long" });
  return semana.charAt(0).toUpperCase() + semana.slice(1) + ", " + d.getDate() + " de " + MESES[d.getMonth()];
}

/** Firestore não aceita undefined: tira as chaves vazias antes de gravar. */
function semIndefinidos(obj) {
  const out = {};
  Object.keys(obj).forEach((k) => { if (obj[k] !== undefined) out[k] = obj[k]; });
  return out;
}

/* ---------- Agenda (ct_eventos) ---------- */
const TIPOS_EVENTO = [
  { id: "jogo", label: "Jogo" },
  { id: "treino", label: "Treino" },
  { id: "avaliacao", label: "Avaliação" },
  { id: "outro", label: "Outro" },
];
function labelTipoEvento(id) { const t = TIPOS_EVENTO.find((x) => x.id === id); return t ? t.label : "Outro"; }
const CATEGORIAS_EVENTO = [
  { id: "sub15", label: "Sub-15" },
  { id: "sub17", label: "Sub-17" },
  { id: "ambas", label: "Sub-15 e Sub-17" },
];
function labelCategoriaEvento(id) { const c = CATEGORIAS_EVENTO.find((x) => x.id === id); return c ? c.label : "Sub-15 e Sub-17"; }
function eventoDaCategoria(evento, categoriaNorm) {
  return !evento.categoria || evento.categoria === "ambas" || evento.categoria === categoriaNorm;
}
function duracaoPadrao(evento) {
  const d = Number(evento.duracao_min);
  return d > 0 ? d : evento.tipo === "jogo" ? 80 : 90;
}
function tituloEvento(evento) {
  if (evento.titulo && evento.titulo.trim()) return evento.titulo.trim();
  if (evento.tipo === "jogo") return "Meia Noite x " + ((evento.adversario || "").trim() || "adversário a definir");
  return labelTipoEvento(evento.tipo);
}
function placarEvento(evento) {
  const n = evento.placar_nos, e = evento.placar_eles;
  if (n === null || n === undefined || n === "" || e === null || e === undefined || e === "") return null;
  return { nos: Number(n), eles: Number(e) };
}

async function carregarEventos() {
  const lista = await lerComCache("eventos", async () => {
    const snap = await db.collection(COL_EVENTOS).get();
    return snap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => ((a.data || "") + (a.hora || "")).localeCompare((b.data || "") + (b.hora || "")));
  });
  return copiarDado(lista);
}
async function salvarEvento(evento, usuario) {
  const { id, criado_em, atualizado_em, ...dados } = evento;
  const agora = firebase.firestore.FieldValue.serverTimestamp();
  if (id) {
    await db.collection(COL_EVENTOS).doc(id).update(semIndefinidos({ ...dados, atualizado_em: agora }));
    return id;
  }
  const ref = await db.collection(COL_EVENTOS).add(semIndefinidos({
    ...dados,
    criado_por: (auth.currentUser && auth.currentUser.uid) || null,
    criado_por_nome: usuario ? (usuario.nome || usuario.email || "") : "",
    criado_em: agora,
  }));
  return ref.id;
}
async function atualizarCamposEvento(id, campos) {
  await db.collection(COL_EVENTOS).doc(id).update(semIndefinidos({ ...campos, atualizado_em: firebase.firestore.FieldValue.serverTimestamp() }));
}
async function excluirEvento(id) {
  await db.collection(COL_EVENTOS).doc(id).delete();
}

/* ---------- Check-in diário (link individual, sem login) ---------- */
function gerarTokenCheckin() {
  const alfabeto = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, (b) => alfabeto[b % alfabeto.length]).join("");
}
function urlCheckin(token) {
  return location.origin + location.pathname + "?c=" + token;
}
function primeiroNomeOuApelido(atleta) {
  if (atleta.apelido && atleta.apelido.trim()) return atleta.apelido.trim();
  return (atleta.nome || "").trim().split(/\s+/)[0] || "Atleta";
}
async function carregarLinksCheckin() {
  const lista = await lerComCache("links-checkin", async () => {
    const snap = await db.collection(COL_CHECKIN_LINKS).get();
    return snap.docs.map((d) => ({ token: d.id, ...d.data() }));
  });
  return copiarDado(lista);
}
async function criarLinkCheckin(atleta) {
  const token = gerarTokenCheckin();
  await db.collection(COL_CHECKIN_LINKS).doc(token).set({
    atletaId: atleta.id,
    nome: primeiroNomeOuApelido(atleta),
    categoria: atleta.categoria || "",
    ativo: true,
    criado_em: firebase.firestore.FieldValue.serverTimestamp(),
  });
  return token;
}
async function desativarLinkCheckin(token) {
  await db.collection(COL_CHECKIN_LINKS).doc(token).update({ ativo: false, desativado_em: firebase.firestore.FieldValue.serverTimestamp() });
}
async function carregarCheckins(desdeIso) {
  const snap = await db.collection(COL_CHECKINS).where("data", ">=", desdeIso).get();
  return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
}
async function carregarCheckinsAtleta(atletaId) {
  const snap = await db.collection(COL_CHECKINS).where("atletaId", "==", atletaId).get();
  return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
}

const ITENS_BEMESTAR = [
  { id: "sono", label: "Sono", pergunta: "Como você dormiu?", pior: "Muito mal", melhor: "Muito bem" },
  { id: "cansaco", label: "Cansaço", pergunta: "Como está seu cansaço?", pior: "Exausto", melhor: "Descansado" },
  { id: "dor", label: "Dor muscular", pergunta: "Como está a dor muscular?", pior: "Muita dor", melhor: "Sem dor" },
  { id: "estresse", label: "Estresse", pergunta: "Como está o estresse?", pior: "Muito estressado", melhor: "Tranquilo" },
  { id: "humor", label: "Humor", pergunta: "Como está seu humor?", pior: "Muito mal", melhor: "Muito bem" },
];
/** Escala CR-10 de percepção de esforço da sessão (Foster), versão em português. */
const ESCALA_PSE = [
  { v: 0, t: "Repouso" }, { v: 1, t: "Muito, muito fácil" }, { v: 2, t: "Fácil" }, { v: 3, t: "Moderado" },
  { v: 4, t: "Um pouco difícil" }, { v: 5, t: "Difícil" }, { v: 6, t: "" }, { v: 7, t: "Muito difícil" },
  { v: 8, t: "" }, { v: 9, t: "" }, { v: 10, t: "Máximo" },
];
function totalBemEstar(c) {
  return ITENS_BEMESTAR.reduce((s, it) => s + (Number(c[it.id]) || 0), 0);
}
/**
 * Leitura de uma resposta de bem-estar contra o histórico do próprio atleta:
 * "abaixo do normal" = total pelo menos 1,5 desvio-padrão abaixo da média dos 28 dias
 * anteriores (e no mínimo 3 pontos abaixo), com pelo menos 7 respostas;
 * "item crítico" = algum item marcado 1 de 5.
 */
function avaliarBemEstar(respostasDoAtleta, resposta) {
  if (!resposta) return null;
  const total = totalBemEstar(resposta);
  const base = respostasDoAtleta
    .filter((r) => r.data < resposta.data && diasEntreIso(r.data, resposta.data) <= 28)
    .map(totalBemEstar);
  let media = null, dp = null, abaixo = false;
  if (base.length >= 7) {
    media = base.reduce((a, b) => a + b, 0) / base.length;
    dp = Math.sqrt(base.reduce((a, b) => a + (b - media) * (b - media), 0) / (base.length - 1));
    abaixo = total <= media - Math.max(1.5 * dp, 3);
  }
  const critico = ITENS_BEMESTAR.some((it) => Number(resposta[it.id]) === 1);
  return { total, media, dp, abaixo, critico };
}
function classeTotalBemEstar(total) {
  if (total <= 9) return "hm-1";
  if (total <= 13) return "hm-2";
  if (total <= 16) return "hm-3";
  if (total <= 20) return "hm-4";
  return "hm-5";
}

/* ---------- Carga de treino (PSE da sessão × minutos) ---------- */
/**
 * Junta a carga de cada atleta a partir das sessões da agenda (treinos e jogos):
 * 1) o que a comissão lançou na sessão (PSE e minutos por atleta);
 * 2) se não houver lançamento, a PSE que o próprio atleta respondeu no check-in daquele dia,
 *    aplicada à primeira sessão do dia da categoria dele (minutos = duração da sessão).
 */
function calcularCargas(eventos, checkins, atletas, hoje) {
  const porAtleta = {};
  const push = (id, item) => { (porAtleta[id] = porAtleta[id] || []).push(item); };
  const sessoes = (eventos || []).filter((e) => (e.tipo === "treino" || e.tipo === "jogo") && e.data && e.data <= hoje);
  const lancado = new Set();
  sessoes.forEach((ev) => {
    const dur = duracaoPadrao(ev);
    Object.entries(ev.cargas || {}).forEach(([atletaId, v]) => {
      if (!v || typeof v.pse !== "number") return;
      const min = Number(v.minutos) > 0 ? Number(v.minutos) : dur;
      push(atletaId, { data: ev.data, ua: v.pse * min, pse: v.pse, minutos: min, origem: "comissao", eventoId: ev.id });
      lancado.add(atletaId + "|" + ev.data);
    });
  });
  const catDe = {};
  (atletas || []).forEach((a) => { catDe[a.id] = normalizarCategoria(a.categoria); });
  (checkins || []).forEach((c) => {
    if (c.tipo !== "pse" || typeof c.pse !== "number" || !c.data || c.data > hoje) return;
    if (lancado.has(c.atletaId + "|" + c.data)) return;
    const sessao = sessoes.find((s) => s.data === c.data && eventoDaCategoria(s, catDe[c.atletaId]));
    if (!sessao) return;
    const min = duracaoPadrao(sessao);
    push(c.atletaId, { data: c.data, ua: c.pse * min, pse: c.pse, minutos: min, origem: "atleta", eventoId: sessao.id });
    lancado.add(c.atletaId + "|" + c.data);
  });
  return porAtleta;
}

const FAIXAS_ACWR = {
  pico: { label: "Pico de carga", sinal: "vermelho" },
  atencao: { label: "Subindo rápido", sinal: "amarelo" },
  ideal: { label: "Faixa segura", sinal: "verde" },
  baixa: { label: "Abaixo do habitual", sinal: "neutro" },
  insuficiente: { label: "Histórico curto", sinal: "neutro" },

/** Carga aguda (7 dias), crônica (média semanal de 28 dias) e razão aguda:crônica. */
function resumoCarga(itens, hoje) {
  const lista = (itens || []).filter((i) => i.data <= hoje);
  const soma = (de, ate) => lista.filter((i) => { const d = diasEntreIso(i.data, hoje); return d >= de && d <= ate; }).reduce((s, i) => s + i.ua, 0);
  const aguda = soma(0, 6);
  const cronica = soma(0, 27) / 4;
  const primeira = lista.reduce((m, i) => (!m || i.data < m ? i.data : m), null);
  const historicoDias = primeira ? diasEntreIso(primeira, hoje) : 0;
  const acwr = cronica > 0 ? aguda / cronica : null;
  let faixa = "sem_dados";
  if (lista.length === 0) faixa = "sem_dados";
  else if (historicoDias < 21 || acwr === null) faixa = "insuficiente";
  else if (acwr > 1.5) faixa = "pico";
  else if (acwr >= 1.3) faixa = "atencao";
  else if (acwr >= 0.8) faixa = "ideal";
  else faixa = "baixa";
  const semanas = [5, 4, 3, 2, 1, 0].map((k) => soma(k * 7, k * 7 + 6));
  return { aguda, cronica, acwr, faixa, semanas, historicoDias };
}

const DISPONIBILIDADE = {

/**
 * Disponibilidade calculada só a partir do que já está lançado:
 * Fora: afastamento clínico sem alta, protocolo de concussão em andamento, lesão nas fases
 *       de repouso ou mobilidade, atendimento médico com afastamento nos últimos 3 dias.

function calcularDisponibilidade(atletaId, dados) {

  const fora = [], restricao = [];

  const concussao = calcularEpisodiosConcussao(med)[0];
  if (concussao && concussao.ativo) fora.push(`Protocolo de concussão: ${labelFaseConcussao(concussao.faseAtual)}`);
  calcularEpisodiosLesao(fisio).filter((ep) => ep.ativo).forEach((ep) => {
    const txt = `Lesão (${ep.regiao}): ${labelFaseRtp(ep.faseAtual)}`;
    if (ep.faseAtual === "carga_progressiva") restricao.push(txt); else fora.push(txt);
  });
  const atendimentos = med
    .filter((r) => r.tipo === "Atendimento" && r.data && r.data <= hojeISO() && calcularDiasEntre(r.data) <= 3)
    .sort((a, b) => ((b.data || "") + (b.horario || "")).localeCompare((a.data || "") + (a.horario || "")));
  const atend = atendimentos[0];
  if (atend && atend.desfecho === "afastado") fora.push(`Atendimento médico de ${formatarData(atend.data)}: afastado das atividades`);
  else if (atend && atend.desfecho === "restricao") restricao.push(`Atendimento médico de ${formatarData(atend.data)}: restrição e acompanhamento`);
  const ppe = calcularStatusPPE(med);
  if (ppe.status === "vencido") restricao.push(`Exame pré-participação vencido desde ${formatarData(ppe.registro.validade)}`);
  const status = fora.length ? "fora" : restricao.length ? "restricao" : "disponivel";
  return { status, motivos: [...fora, ...restricao] };
}

/* ---------- Maturação biológica (pico de crescimento) ---------- */
/** Idade em anos decimais entre o nascimento e uma data (padrão: hoje). */
function idadeDecimal(nascimentoIso, referenciaIso) {
  const n = new Date(nascimentoIso + "T12:00:00");
  const r = new Date((referenciaIso || hojeISO()) + "T12:00:00");
  return (r - n) / (365.25 * 86400000);
}
const FASES_MATURACAO = {
  pre: { label: "Antes do pico", sinal: "neutro" },
  circa: { label: "Perto do pico", sinal: "amarelo" },
  pos: { label: "Depois do pico", sinal: "neutro" },
};
/**
 * Maturação somática estimada pela equação de Moore et al. (2015) para meninos, que usa só
 * idade e estatura: maturity offset = -7,999994 + 0,0036124 × (idade × estatura em cm).
 * Erro típico perto de 0,5 ano; tende a atrasar o pico de quem amadurece cedo e adiantar
 * o de quem amadurece tarde. A fase usa a janela de ±1 ano em torno do pico.
 */
function calcularMaturacao(atleta, registrosMedicina) {
  if (!atleta || !atleta.data_nascimento) return { semDados: "nascimento" };
  const medidas = (registrosMedicina || [])
    .filter((r) => r.tipo === "Crescimento" && typeof r.altura_cm === "number" && r.altura_cm > 90 && r.data)
    .sort((a, b) => b.data.localeCompare(a.data));
  if (medidas.length === 0) return { semDados: "estatura" };
  const medida = medidas[0];
  const idadeMedida = idadeDecimal(atleta.data_nascimento, medida.data);
  if (!(idadeMedida > 7 && idadeMedida < 23)) return { semDados: "nascimento" };
  const offsetNaMedida = -7.999994 + 0.0036124 * (idadeMedida * medida.altura_cm);
  const idadePico = idadeMedida - offsetNaMedida;
  const idadeHoje = idadeDecimal(atleta.data_nascimento);
  const offset = idadeHoje - idadePico;
  const fase = offset < -1 ? "pre" : offset > 1 ? "pos" : "circa";
  return { offset, idadePico, idadeHoje, fase, medida };
}
function textoOffset(offset) {
  const anos = formatarNumero(Math.abs(offset), 1);
  if (Math.abs(offset) < 0.05) return "no pico";
  return offset < 0 ? `${anos} ano${Math.abs(offset) >= 1.95 ? "s" : ""} antes do pico` : `${anos} ano${Math.abs(offset) >= 1.95 ? "s" : ""} depois do pico`;
}

const ORDEM_ESTATISTICAS = ["GOL", "ASSISTÊNCIA", "FINALIZAÇÃO", "PASSE CERTO", "PASSE ERRADO", "DESARME", "FALTA"];
function rotuloEstatistica(chave) {
  const s = String(chave || "").toLowerCase();
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function ordenarEstatisticas(chaves) {
  return chaves.slice().sort((a, b) => {
    const ia = ORDEM_ESTATISTICAS.indexOf(a), ib = ORDEM_ESTATISTICAS.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    return a.localeCompare(b);

/** "Jogo — Meia Noite 3 x 1 Rival FC Copa" -> mandante, visitante (com a competição junto) e placar. */
function parseTituloJogo(tipo, meta) {
  if (meta && (meta.local || meta.visitante)) {
    const m = String(meta.resultado || "").match(/(\d+)\s*(?:x|×|-|a)\s*(\d+)/i);
    return { mandante: meta.local || "", visitante: meta.visitante || "", golsMandante: m ? Number(m[1]) : null, golsVisitante: m ? Number(m[2]) : null, competicao: meta.competicao || "" };
  }
  const t = semTravessao(tipo || "").replace(/^jogo\s*(·|-)?\s*/i, "").trim();
  const m = t.match(/(\d+)\s*(?:x|×|-)\s*(\d+)/i);
  if (!m) return { mandante: t, visitante: "", golsMandante: null, golsVisitante: null, competicao: "" };
  return {
    mandante: t.slice(0, m.index).trim(),
    visitante: t.slice(m.index + m[0].length).replace(/^\s*(x|×)\s*/i, "").trim(),
    golsMandante: Number(m[1]),
    golsVisitante: Number(m[2]),
    competicao: "",
  };
}
/** Agrupa os registros de desempenho importados por partida (data + título do jogo). */
function listarJogosDisputados(dados) {
  const mapa = {};
  (dados.atletas || []).forEach((a) => {
    ((dados.perfData || {})[a.id] || []).forEach((r) => {
      if (!r.data || !r.tipo || !/^jogo/i.test(r.tipo)) return;
      const chave = r.data + "|" + r.tipo;
      if (!mapa[chave]) mapa[chave] = { chave, data: r.data, tipo: r.tipo, meta: r.jogo_meta || null, jogadores: [] };
      mapa[chave].jogadores.push({ atleta: a, campos: parseNota(r.nota).campos });
    });
  });
  return Object.values(mapa)
    .map((j) => {
      const contagem = {};
      j.jogadores.forEach(({ atleta }) => { const c = normalizarCategoria(atleta.categoria); contagem[c] = (contagem[c] || 0) + 1; });
      const categoria = Object.keys(contagem).sort((x, y) => contagem[y] - contagem[x])[0] || "";
      const totais = {};
      j.jogadores.forEach(({ campos }) => {
        Object.entries(campos).forEach(([k, v]) => { if (typeof v === "number") totais[k] = (totais[k] || 0) + v; });
      });
      return { ...j, categoria, totais, placar: parseTituloJogo(j.tipo, j.meta) };
    })
    .sort((a, b) => b.data.localeCompare(a.data));
}

/* ---------- Lembretes da agenda ---------- */
function listaNomes(atletas, max) {
  const nomes = atletas.map(nomeExibicao);

  return nomes.length <= lim ? nomes.join(", ") : nomes.slice(0, lim).join(", ") + ` e mais ${nomes.length - lim}`;
}
function calcularLembretes(dados, usuario, eventos, hoje) {
  const itens = [];
  if (!dados) return itens;
  const atletas = dados.atletas || [];
  if (podeVerArea(usuario, "medicina")) {
    const vencidos = [], vencendo = [], concussao = [], afastados = [];
    atletas.forEach((a) => {
      const reg = (dados.medicinaData || {})[a.id] || [];
      const s = calcularStatusPPE(reg);
      if (s.status === "vencido") vencidos.push(a);
      if (s.status === "vencendo") vencendo.push(a);
      const c = calcularEpisodiosConcussao(reg)[0];
      if (c && c.ativo) concussao.push(a);
      if (calcularAfastamentosClinicosAtivos(reg).length) afastados.push(a);
    });
    if (concussao.length) itens.push({ id: "concussao", sinal: "vermelho", texto: `${concussao.length} atleta${concussao.length > 1 ? "s" : ""} em protocolo de concussão`, detalhe: listaNomes(concussao), pagina: "medicina" });
    if (vencidos.length) itens.push({ id: "ppe-vencido", sinal: "vermelho", texto: `${vencidos.length} exame${vencidos.length > 1 ? "s" : ""} pré-participação vencido${vencidos.length > 1 ? "s" : ""}`, detalhe: listaNomes(vencidos), pagina: "medicina" });
    if (vencendo.length) itens.push({ id: "ppe-vencendo", sinal: "amarelo", texto: `${vencendo.length} exame${vencendo.length > 1 ? "s" : ""} pré-participação vencendo em até 30 dias`, detalhe: listaNomes(vencendo), pagina: "medicina" });
    if (afastados.length) itens.push({ id: "afastados", sinal: "amarelo", texto: `${afastados.length} atleta${afastados.length > 1 ? "s" : ""} em afastamento clínico`, detalhe: listaNomes(afastados), pagina: "medicina" });
  }
  if (podeVerArea(usuario, "psicologia")) {
    const atrasados = atletas.filter((a) => { const d = diasDesdeUltimaAvaliacaoPsi((dados.psiData || {})[a.id]); return d !== null && d > 30; });
    if (atrasados.length) itens.push({ id: "psi", sinal: "amarelo", texto: `${atrasados.length} atleta${atrasados.length > 1 ? "s" : ""} sem reavaliação psicológica há mais de 30 dias`, detalhe: listaNomes(atrasados), pagina: "psicologia" });
  }
  if (podeVerArea(usuario, "fisioterapia")) {
    const emRetorno = atletas.filter((a) => calcularEpisodiosLesao((dados.fisioData || {})[a.id]).some((ep) => ep.ativo));
    if (emRetorno.length) itens.push({ id: "lesoes", sinal: "neutro", texto: `${emRetorno.length} atleta${emRetorno.length > 1 ? "s" : ""} em retorno de lesão`, detalhe: listaNomes(emRetorno), pagina: "fisioterapia" });
  }
  if (podeVerJogos(usuario)) {
    (eventos || [])
      .filter((e) => e.tipo === "jogo" && e.data >= hoje && diasEntreIso(hoje, e.data) <= 7)
      .forEach((e) => {
        const qtd = e.convocacao ? (e.convocacao.titulares || []).length + (e.convocacao.reservas || []).length : 0;
        if (qtd === 0) itens.push({ id: "conv-" + e.id, sinal: "amarelo", texto: `Convocação pendente: ${tituloEvento(e)} (${dataCurta(e.data)})`, detalhe: labelCategoriaEvento(e.categoria), pagina: "jogos", eventoId: e.id });
      });
  }
  return itens;
}

                      <span className="mini">{d.foto ? <img loading="lazy" decoding="async" src={d.foto} alt="" /> : iniciaisAtleta(d)}</span>
                      {nomeCurtoAtleta(d)}{estado ? (estado === "titular" ? " · T" : " · R") : ""}
                    </button>
                  );
                })}
              </div>
            </React.Fragment>
          )}
        </div>
        {rodape}
      </div>
    </div>
  );
}

/* ---------- Busca rápida (Ctrl+K) ---------- */
let cacheAtletasBusca = { lista: null, em: 0 };
function normalizarBusca(s) {
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}
function paginasDaBusca(usuario) {
  const lista = [];
  if (temPermissao(usuario, "admin")) lista.push({ id: "admin", label: "Painel geral" });
  lista.push({ id: "elenco", label: "Elenco" }, { id: "agenda", label: "Agenda" });
  if (podeVerJogos(usuario)) lista.push({ id: "jogos", label: "Jogos" });
  if (podeVerMonitoramento(usuario)) lista.push({ id: "monitoramento", label: "Monitoramento" });
  HUBS.filter((h) => h.id !== "admin" && temPermissao(usuario, h.id)).forEach((h) => lista.push({ id: h.id, label: h.label }));
  if (temAcessoRelatorios(usuario)) lista.push({ id: "relatorios", label: "Relatórios" });
  lista.push({ id: "atualizacoes", label: "Atualizações" });
  if (usuario.role === "admin") lista.push({ id: "usuarios", label: "Usuários" });
  return lista;
}

function BuscaRapida({ usuario, aberta, onFechar, onNavigate }) {
  const { useState, useEffect, useRef } = React;
  const [q, setQ] = useState("");
  const [atletas, setAtletas] = useState(cacheAtletasBusca.lista);
  const [ativo, setAtivo] = useState(0);
  const listaRef = useRef(null);

  useEffect(() => {
    if (!aberta) return;
    setQ(""); setAtivo(0);
    if (!cacheAtletasBusca.lista || Date.now() - cacheAtletasBusca.em > 5 * 60 * 1000) {
      carregarAtletas().then((l) => { cacheAtletasBusca = { lista: l, em: Date.now() }; setAtletas(l); }).catch(() => {});
    }
  }, [aberta]);

  if (!aberta) return null;

  const termos = normalizarBusca(q).split(/\s+/).filter(Boolean);
  const casa = (texto) => termos.every((t) => normalizarBusca(texto).includes(t));
  const paginas = paginasDaBusca(usuario).filter((p) => !termos.length || casa(p.label));
  const encontrados = (atletas || [])
    .filter((a) => !termos.length || casa([a.nome, a.apelido, a.categoria, a.posicao].filter(Boolean).join(" ")))
    .slice(0, termos.length ? 12 : 6);
  const itens = [
    ...encontrados.map((a) => ({ tipo: "atleta", id: a.id, atleta: a })),
    ...paginas.map((p) => ({ tipo: "pagina", id: p.id, label: p.label })),
  ];
  const idxAtivo = Math.min(ativo, Math.max(itens.length - 1, 0));

  function escolher(item) {
    if (!item) return;
    onFechar();
    if (item.tipo === "pagina") { onNavigate(item.id); return; }
    const abriuAqui = pedirAberturaAtleta(item.id);
    if (!abriuAqui) onNavigate("elenco", { manterPendente: true });
  }
  function teclas(e) {
    if (e.key === "ArrowDown") { e.preventDefault(); setAtivo((i) => Math.min(i + 1, itens.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setAtivo((i) => Math.max(i - 1, 0)); }
    else if (e.key === "Enter") { e.preventDefault(); escolher(itens[idxAtivo]); }
    else if (e.key === "Escape") { e.preventDefault(); onFechar(); }
  }

  let ultimoTipo = null;
  return (
    <div className="busca-overlay" onMouseDown={onFechar}>
      <div className="busca-caixa" role="dialog" aria-modal="true" aria-label="Busca rápida" onMouseDown={(e) => e.stopPropagation()}>
        <div className="busca-campo">
          <Icone nome="busca" />
          <input autoFocus value={q} onChange={(e) => { setQ(e.target.value); setAtivo(0); }} onKeyDown={teclas} placeholder="Buscar atleta ou página" aria-label="Buscar atleta ou página" />
          <kbd>Esc</kbd>
        </div>
        <div className="busca-lista" ref={listaRef} role="listbox">
          {itens.length === 0 && <div className="busca-vazio">{atletas ? "Nada encontrado." : "Carregando atletas..."}</div>}
          {itens.map((it, i) => {
            const cabecalho = it.tipo !== ultimoTipo ? <div className="busca-grupo" key={"g-" + it.tipo}>{it.tipo === "atleta" ? "Atletas" : "Páginas"}</div> : null;
            ultimoTipo = it.tipo;
            return (
              <React.Fragment key={it.tipo + it.id}>
                {cabecalho}
                <button type="button" role="option" aria-selected={i === idxAtivo} className={"busca-item" + (i === idxAtivo ? " ativo" : "")} onMouseEnter={() => setAtivo(i)} onClick={() => escolher(it)}>
                  {it.tipo === "atleta" ? (
                    <React.Fragment>
                      <span className="busca-avatar">{it.atleta.foto ? <img loading="lazy" decoding="async" src={it.atleta.foto} alt="" /> : iniciaisAtleta(it.atleta)}</span>
                      <span className="busca-texto">
                        <b>{nomeExibicao(it.atleta)}</b>
                        <small>{[it.atleta.apelido ? it.atleta.nome : "", it.atleta.categoria, it.atleta.posicao].filter(Boolean).join(" · ")}</small>
                      </span>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <span className="busca-avatar pagina"><Icone nome={it.id} /></span>
                      <span className="busca-texto"><b>{it.label}</b></span>
                    </React.Fragment>
                  )}
                  <Icone nome="seta" className="busca-seta" />
                </button>
              </React.Fragment>
            );
          })}
        </div>
        <div className="busca-rodape"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Ctrl</kbd><kbd>K</kbd> de qualquer tela</span></div>
      </div>
    </div>
  );
}

let sessaoCargaPendente = null;

function FormEvento({ inicial, usuario, onSalvo, onCancelar }) {
  const { useState } = React;
  const [ev, setEv] = useState(() => ({
    tipo: "treino", titulo: "", data: hojeISO(), hora: "", duracao_min: "", categoria: "ambas", local: "",
    adversario: "", mando: "casa", competicao: "", placar_nos: "", placar_eles: "", observacao: "",
    ...inicial,
  }));
  const [salvando, setSalvando] = useState(false);
  const [confirmarExclusao, setConfirmarExclusao] = useState(false);
  const [erro, setErro] = useState(null);
  const editando = !!ev.id;
  const uid = auth.currentUser && auth.currentUser.uid;
  const podeExcluir = editando && (temPermissao(usuario, "admin") || temPermissao(usuario, "treinador") || (ev.criado_por && ev.criado_por === uid));
  const set = (campo) => (e) => setEv((x) => ({ ...x, [campo]: e && e.target ? e.target.value : e }));

  async function salvar() {
    if (!ev.data || salvando) return;
    if (ev.tipo === "jogo" && !(ev.adversario || "").trim()) { setErro("Informe o adversário do jogo."); return; }
    setSalvando(true); setErro(null);
    try {
      const dados = {
        ...ev,
        titulo: (ev.titulo || "").trim(),
        local: (ev.local || "").trim(),
        observacao: (ev.observacao || "").trim(),
        duracao_min: ev.duracao_min === "" ? null : Number(ev.duracao_min),
        adversario: ev.tipo === "jogo" ? (ev.adversario || "").trim() : "",
        mando: ev.tipo === "jogo" ? ev.mando : "",
        competicao: ev.tipo === "jogo" ? (ev.competicao || "").trim() : "",
        placar_nos: ev.tipo === "jogo" && ev.placar_nos !== "" && ev.placar_nos !== null ? Number(ev.placar_nos) : null,
        placar_eles: ev.tipo === "jogo" && ev.placar_eles !== "" && ev.placar_eles !== null ? Number(ev.placar_eles) : null,
      };
      await salvarEvento(dados, usuario);
      onSalvo();
    } catch (e) {
      setErro("Não consegui salvar: " + e.message);
    } finally {
      setSalvando(false);
    }
  }
  async function excluir() {
    setSalvando(true); setErro(null);
    try { await excluirEvento(ev.id); onSalvo(); }
    catch (e) { setErro("Não consegui excluir: " + e.message); setSalvando(false); }
  }

  return (
    <div className="panel">
      <div className="panel-head"><h3>{editando ? "Editar evento" : "Novo evento"}</h3></div>
      <div className="form-panel" style={{ borderTop: "none" }}>
        <div className="field" style={{ marginBottom: 14 }}>
          <label>Tipo</label>
          <div className="tab-select">
            {TIPOS_EVENTO.map((t) => (
              <button key={t.id} type="button" className={"tab-select-item evento-tipo-" + t.id + (ev.tipo === t.id ? " active" : "")} onClick={() => setEv((x) => ({ ...x, tipo: t.id }))}>{t.label}</button>
            ))}
          </div>
        </div>
        {ev.tipo === "jogo" && (
          <div className="form-grid">
            <div className="field"><label>Adversário</label><input type="text" value={ev.adversario || ""} onChange={set("adversario")} placeholder="Ex.: União Franca" /></div>
            <div className="field"><label>Competição</label><input type="text" value={ev.competicao || ""} onChange={set("competicao")} placeholder="Ex.: Copa Regional" /></div>
            <div className="field">
              <label>Mando</label>
              <select value={ev.mando || "casa"} onChange={set("mando")}><option value="casa">Em casa</option><option value="fora">Fora de casa</option></select>
            </div>
            <div className="field">
              <label>Placar (depois do jogo)</label>
              <div className="placar-inputs">
                <span>Meia Noite</span>
                <input type="number" min="0" max="99" value={ev.placar_nos ?? ""} onChange={set("placar_nos")} aria-label="Gols do Meia Noite" />
                <b>x</b>
                <input type="number" min="0" max="99" value={ev.placar_eles ?? ""} onChange={set("placar_eles")} aria-label="Gols do adversário" />
                <span>{ev.adversario || "Adversário"}</span>
              </div>
            </div>
          </div>
        )}
        <div className="form-grid">
          <div className="field"><label>Título {ev.tipo === "jogo" ? "(opcional)" : ""}</label><input type="text" value={ev.titulo || ""} onChange={set("titulo")} placeholder={ev.tipo === "jogo" ? "Meia Noite x " + (ev.adversario || "adversário") : ev.tipo === "treino" ? "Ex.: Treino tático" : "Ex.: Avaliação física"} /></div>
          <div className="field">
            <label>Categoria</label>
            <select value={ev.categoria || "ambas"} onChange={set("categoria")}>{CATEGORIAS_EVENTO.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}</select>
          </div>
          <div className="field"><label>Data</label><input type="date" value={ev.data} onChange={set("data")} /></div>
          <div className="field"><label>Horário</label><input type="time" value={ev.hora || ""} onChange={set("hora")} /></div>
          <div className="field"><label>Duração (min)</label><input type="number" min="0" max="400" value={ev.duracao_min ?? ""} onChange={set("duracao_min")} placeholder={ev.tipo === "jogo" ? "80" : "90"} /></div>
          <div className="field"><label>Local</label><input type="text" value={ev.local || ""} onChange={set("local")} placeholder="Ex.: CT Meia Noite" /></div>
        </div>
        <div className="form-grid full">
          <div className="field"><label>Observação</label><textarea value={ev.observacao || ""} onChange={set("observacao")} placeholder="Horário de chegada, uniforme, transporte..." /></div>
        </div>
        {erro && <div className="access-note" style={{ borderLeftColor: "var(--st-crit)" }}><span>{erro}</span></div>}
        <div className="form-actions">
          <button type="button" className="pill-btn primary" onClick={salvar} disabled={salvando}>{salvando ? "Salvando..." : "Salvar"}</button>
          <button type="button" className="pill-btn" onClick={onCancelar} disabled={salvando}>Cancelar</button>
          {podeExcluir && !confirmarExclusao && <button type="button" className="pill-btn perigo" onClick={() => setConfirmarExclusao(true)} disabled={salvando}>Excluir</button>}
          {podeExcluir && confirmarExclusao && (
            <span className="confirmar-inline">Excluir este evento? <button type="button" className="pill-btn perigo" onClick={excluir} disabled={salvando}>Sim, excluir</button><button type="button" className="pill-btn" onClick={() => setConfirmarExclusao(false)}>Não</button></span>
          )}
        </div>
      </div>
    </div>
  );
}
