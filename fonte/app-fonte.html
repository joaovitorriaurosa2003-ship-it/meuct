/* ---------- Importador de CSV de análise de jogo ---------- */

function dataBrTracoParaIso(dataBr) {
  const [d, m, y] = (dataBr || "").split("-");
  if (!d || !m || !y) return dataBr || "";
  return `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
}

function extrairNomesJogadores(campoPlayer) {
  campoPlayer = (campoPlayer || "").trim();
  if (!campoPlayer) return [];
  return campoPlayer
    .split("|")
    .map((p) => p.trim())
    .filter(Boolean)
    .map((parte) => {
      const m = parte.match(/^\d+-(.+)$/);
      return m ? m[1].trim() : parte;
    });
}

/** Porta em JS do parse_jogo_csv.py — lê o CSV bruto de eventos e agrega por jogador. */
function parseJogoCsv(texto) {
  const linhas = texto.split(/\r?\n/);
  const n = linhas.length;
  let i = 0;

  const meta = {};
  while (i < n && linhas[i].trim() !== "") {
    const linha = linhas[i];
    if (linha.includes(";") && linha.trim() !== "Resumo") {
      const idx = linha.indexOf(";");
      meta[linha.slice(0, idx).trim()] = linha.slice(idx + 1).trim();
    }
    i++;
  }

  const dataIso = dataBrTracoParaIso(meta["Data"]);
  const tituloJogo = `Jogo — ${meta["Equipe Local"] || "?"} ${meta["Resultado"] || "?"} x ${meta["Equipe Visitante"] || "?"} ${meta["Competição"] || ""}`.trim();

  const contagem = {};
  let categoriaAtual = null;

  while (i < n) {
    const linha = linhas[i];
    const mCat = linha.match(/^CATEGORY:\s*(.+?)\s*$/);
    if (mCat) {
      categoriaAtual = mCat[1].trim();
      i++;
      if (i < n) i++; // pula linha de cabeçalho da categoria
      continue;
    }
    if (categoriaAtual && linha.trim() !== "") {
      const campos = linha.split(";");
      if (campos.length > 5) {
        extrairNomesJogadores(campos[5]).forEach((jogador) => {
          if (!contagem[jogador]) contagem[jogador] = {};
          contagem[jogador][categoriaAtual] = (contagem[jogador][categoriaAtual] || 0) + 1;
        });
      }
      i++;
      continue;
    }
    if (linha.trim() === "") categoriaAtual = null;
    i++;
  }

  const registros = Object.keys(contagem)
    .sort()
    .map((jogador) => {
      const cats = contagem[jogador];
      const nota = Object.keys(cats).sort().map((c) => `${c}: ${cats[c]}`).join(", ") + " (importado da análise de jogo)";
      return {
        atletaNome: jogador, data: dataIso, tipo: tituloJogo, nota, sinal: "neutro", origem: "analise_jogo_import_csv",
        jogo_meta: { local: meta["Equipe Local"] || "", visitante: meta["Equipe Visitante"] || "", resultado: meta["Resultado"] || "", competicao: meta["Competição"] || "" },
      };
    });

  return { meta, tituloJogo, dataIso, registros };
}

function ImportadorCSV({ atletas, onImportado }) {
  const { useState } = React;
  const [preview, setPreview] = useState(null);
  const [erroLeitura, setErroLeitura] = useState(null);
  const [importando, setImportando] = useState(false);
  const [resultado, setResultado] = useState(null);

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setResultado(null);
    setErroLeitura(null);
    setPreview(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = parseJogoCsv(ev.target.result);
        if (parsed.registros.length === 0) {
          setErroLeitura("Não consegui identificar nenhum jogador nesse arquivo. Confere se é o formato certo de análise de jogo.");
          return;
        }
        setPreview(parsed);
      } catch (err) {
        setErroLeitura("Erro ao ler o arquivo: " + err.message);
      }
    };
    reader.readAsText(file, "utf-8");
  }

  async function confirmarImportacao() {
    if (!preview) return;
    setImportando(true);
    let importados = 0, pulados = 0, novosAtletas = 0;

    for (const reg of preview.registros) {
      let atleta = atletas.find((a) => (a.nome || "").trim().toLowerCase() === reg.atletaNome.trim().toLowerCase());
      let atletaId;
      if (atleta) {
        atletaId = atleta.id;
      } else {
        const novo = await db.collection(COL_ATLETAS).add({
          nome: reg.atletaNome,
          categoria: "",
          origem: "importacao_csv_site",
          pendente_vinculo: true,
        });
        atletaId = novo.id;
        novosAtletas++;
      }

      // evita duplicar o mesmo jogo pro mesmo atleta
      const existentes = await db.collection(COL_ATLETAS).doc(atletaId)
        .collection(SUBCOLS.performance).where("tipo", "==", reg.tipo).limit(1).get();
      if (!existentes.empty) {
        pulados++;
        continue;
      }

      await adicionarRegistro(atletaId, "performance", {
        data: reg.data, tipo: reg.tipo, nota: reg.nota, sinal: reg.sinal, origem: reg.origem,
      });
      importados++;
    }

    setImportando(false);
    setResultado({ importados, pulados, novosAtletas });
    setPreview(null);
    onImportado();
  }

  return (
    <div className="import-box">
      <div className="import-drop">
        <input type="file" accept=".csv" id="csv-input" onChange={handleFile} style={{display:"none"}} />
        <label htmlFor="csv-input" className="pill-btn primary">Escolher arquivo CSV</label>
        <span className="import-hint">Exporte do sistema de análise de jogo e envie aqui, um arquivo por partida.</span>
      </div>

      {erroLeitura && (
        <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)", marginTop:14}}>
          <span>{erroLeitura}</span>
        </div>
      )}

      {preview && (
        <div className="import-preview">
          <div className="access-note admin" style={{marginTop:14}}>
            <span><b>{preview.tituloJogo}</b> · {preview.registros.length} jogador(es) identificado(s). Confira antes de confirmar.</span>
          </div>
          <table>
            <thead><tr><th>Jogador</th><th>Estatísticas</th><th>Já cadastrado?</th></tr></thead>
            <tbody>
              {preview.registros.map((r, i) => {
                const existe = atletas.some((a) => (a.nome || "").trim().toLowerCase() === r.atletaNome.trim().toLowerCase());
                return (
                  <tr key={i}>
                    <td style={{fontWeight:600, color:"var(--navy)"}}>{r.atletaNome}</td>
                    <td className="muted">{semTravessao(r.nota)}</td>
                    <td>{existe ? <span className="badge verde">Sim</span> : <span className="badge amarelo">Novo atleta</span>}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="form-actions" style={{padding:"14px 0 0"}}>
            <button className="pill-btn" onClick={() => setPreview(null)} disabled={importando}>Cancelar</button>
            <button className="pill-btn primary" onClick={confirmarImportacao} disabled={importando}>
              {importando ? "Importando..." : `Confirmar importação (${preview.registros.length})`}
            </button>
          </div>
        </div>
      )}

      {resultado && (
        <div className="access-note" style={{background:"var(--verde-bg)", borderColor:"var(--verde)", marginTop:14}}>
          <span><b>Importado:</b> {resultado.importados} registro(s) novo(s), {resultado.pulados} pulado(s) (jogo já existia pro atleta), {resultado.novosAtletas} atleta(s) novo(s) criado(s) (marcados como pendente de vínculo).</span>
        </div>
      )}
    </div>
  );
}

/* ---------- Importador de CSV do MeuPsi (psicologia) ----------
   Lê o export "MeuPsi_Grupo_..." (relatório de grupo com o histórico
   completo por atleta) e lança os registros estruturados/de instrumento
   direto nas subcoleções de psicologia, um por instrumento+data, evitando
   duplicar o que já foi importado antes (o export sempre traz o histórico
   inteiro, não só o delta). RESUMO (contadores da sessão) é ignorado —
   não é medição. DIÁRIO vira registros de tipo "DIÁRIO EMOCIONAL". */

function dataBrBarraParaIso(dataBr) {
  const [d, m, y] = (dataBr || "").split("/");
  if (!d || !m || !y) return dataBr || "";
  return `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
}

/** Parser simples de uma linha CSV com campos entre aspas (lida com vírgula dentro de aspas). */
function parseLinhaCsv(linha) {
  const campos = [];
  let atual = "";
  let dentroAspas = false;
  for (let i = 0; i < linha.length; i++) {
    const c = linha[i];
    if (c === '"') {
      if (dentroAspas && linha[i + 1] === '"') { atual += '"'; i++; }
      else dentroAspas = !dentroAspas;
    } else if (c === "," && !dentroAspas) {
      campos.push(atual);
      atual = "";
    } else {
      atual += c;
    }
  }
  campos.push(atual);
  return campos.map((c) => c.trim());
}

/** Porta do export de grupo do MeuPsi — lê o texto bruto e devolve os registros por atleta. */
function parseMeuPsiCsv(texto) {
  const linhas = texto.split(/\r?\n/);
  const n = linhas.length;
  // Export de grupo: começa com linhas "Chave: valor", uma seção de médias e o
  // marcador "DADOS INDIVIDUAIS" antes dos blocos "--- Nome ---" de cada atleta.
  // Export de atleta único: não tem nada disso, começa direto em "RESUMO" — nesse
  // caso criamos um único atleta "implícito" e pegamos o nome do campo "Paciente".
  const ehExportDeGrupo = linhas.some((l) => l.trim() === "DADOS INDIVIDUAIS");
  let i = 0;

  const meta = {};
  if (ehExportDeGrupo) {
    while (i < n && linhas[i].trim() !== "") {
      const linha = linhas[i];
      const idx = linha.indexOf(":");
      if (idx !== -1) meta[linha.slice(0, idx).trim()] = linha.slice(idx + 1).trim();
      i++;
    }
    while (i < n && linhas[i].trim() !== "DADOS INDIVIDUAIS") i++;
    i++;
  }

  const atletas = [];
  let atletaAtual = ehExportDeGrupo ? null : { nome: null, registros: [] };
  if (atletaAtual) atletas.push(atletaAtual);
  let secaoAtual = null;

  while (i < n) {
    const linhaRaw = linhas[i];
    const linha = linhaRaw.trim();

    const mAtleta = linha.match(/^-{2,}\s*(.+?)\s*-{2,}$/);
    if (mAtleta) {
      atletaAtual = { nome: mAtleta[1].trim(), registros: [] };
      atletas.push(atletaAtual);
      secaoAtual = null;
      i++;
      continue;
    }

    if (!atletaAtual) { i++; continue; }

    if (linha === "") { secaoAtual = null; i++; continue; }
    if (linha === "RESUMO") { secaoAtual = { resumo: true, colunas: null }; i++; continue; }

    const mHist = linha.match(/^(.+?)\s*\(HIST[OÓ]RICO\)$/i);
    if (mHist) {
      secaoAtual = { tipo: mHist[1].trim(), colunas: null, diario: false };
      i++;
      continue;
    }
    if (linha === "DIÁRIO") {
      secaoAtual = { tipo: "DIÁRIO EMOCIONAL", colunas: null, diario: true };
      i++;
      continue;
    }

    if (secaoAtual && secaoAtual.resumo) {
      // Seção RESUMO: "Campo","Valor" — só nos interessa "Paciente", pra exports
      // de atleta único onde não veio nenhum "--- Nome ---" antes. O resto (contadores
      // de tarefas etc.) não é medição e é ignorado.
      const camposResumo = parseLinhaCsv(linhaRaw);
      if (!secaoAtual.colunas) { secaoAtual.colunas = camposResumo; i++; continue; }
      if (camposResumo[0] === "Paciente" && !atletaAtual.nome) atletaAtual.nome = (camposResumo[1] || "").trim();
      i++;
      continue;
    }

    if (secaoAtual) {
      const campos = parseLinhaCsv(linhaRaw);
      if (!secaoAtual.colunas) {
        secaoAtual.colunas = campos;
        i++;
        continue;
      }
      const obj = {};
      secaoAtual.colunas.forEach((c, idx) => { obj[c] = campos[idx]; });
      const dataIso = dataBrBarraParaIso(obj["Data"]);

      if (secaoAtual.diario) {
        const partes = [`Emoção: ${obj["Emoção"] || "—"}`, `Intensidade: ${obj["Intensidade"] || "—"}`];
        if (obj["Hora"]) partes.push(`Hora: ${obj["Hora"]}`);
        if (obj["Contexto"] && obj["Contexto"] !== "—") partes.push(`Contexto: ${obj["Contexto"]}`);
        atletaAtual.registros.push({
          tipo: "DIÁRIO EMOCIONAL", data: dataIso, nota: `DIÁRIO EMOCIONAL — ${partes.join(", ")}`, sinal: "neutro",
        });
      } else {
        const camposSemData = secaoAtual.colunas.filter((c) => c !== "Data");
        const notaCampos = camposSemData.map((c) => `${c}: ${obj[c]}`).join(", ");
        const inst = instrumentoPsiPorId(secaoAtual.tipo);
        let sinal = "neutro", valorTotal = null, instrumentoId = null;
        if (inst) {
          instrumentoId = inst.id;
          if (inst.campoTotal) {
            const t = Number(obj[inst.campoTotal]);
            if (!isNaN(t)) { valorTotal = t; sinal = inst.calcularSinal(t); }
          }
        }
        atletaAtual.registros.push({
          tipo: secaoAtual.tipo, data: dataIso, nota: `${secaoAtual.tipo} — ${notaCampos}`,
          sinal, instrumento_id: instrumentoId, valor_total: valorTotal,
        });
      }
      i++;
      continue;
    }

    i++;
  }

  return { grupo: meta["GRUPO"] || meta["Grupo"] || "", dataExport: meta["Data"] || "", atletas: atletas.filter((a) => a.nome) };
}

function ImportadorMeuPsiCSV({ atletas, registrosPsi, onImportado }) {
  const { useState } = React;
  const [preview, setPreview] = useState(null);
  const [erroLeitura, setErroLeitura] = useState(null);
  const [importando, setImportando] = useState(false);
  const [resultado, setResultado] = useState(null);

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setResultado(null);
    setErroLeitura(null);
    setPreview(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = parseMeuPsiCsv(ev.target.result);
        if (parsed.atletas.length === 0) {
          setErroLeitura("Não consegui identificar nenhum atleta nesse arquivo. Confere se é o export de grupo do MeuPsi.");
          return;
        }
        const linhas = parsed.atletas.map((pa) => {
          const atleta = atletas.find((a) => (a.nome || "").trim().toLowerCase() === pa.nome.trim().toLowerCase());
          const existentes = atleta ? (registrosPsi[atleta.id] || []) : [];
          const jaTem = (r) => existentes.some((e) => e.tipo === r.tipo && e.data === r.data);
          const novos = pa.registros.filter((r) => !jaTem(r));
          const repetidos = pa.registros.length - novos.length;
          return { nomeCsv: pa.nome, atletaId: atleta ? atleta.id : null, novos, repetidos };
        });
        setPreview({ ...parsed, linhas });
      } catch (err) {
        setErroLeitura("Erro ao ler o arquivo: " + err.message);
      }
    };
    reader.readAsText(file, "utf-8");
    e.target.value = "";
  }

  async function confirmarImportacao() {
    if (!preview) return;
    setImportando(true);
    let importados = 0, pulados = 0;

    for (const linha of preview.linhas) {
      if (!linha.atletaId) continue;
      for (const reg of linha.novos) {
        await adicionarRegistro(linha.atletaId, "psi", {
          data: reg.data, tipo: reg.tipo, nota: reg.nota, sinal: reg.sinal,
          instrumento_id: reg.instrumento_id || null, valor_total: typeof reg.valor_total === "number" ? reg.valor_total : null,
          origem: "meupsi_import_csv",
        });
        importados++;
      }
      pulados += linha.repetidos;
    }

    setImportando(false);
    setResultado({ importados, pulados, naoEncontrados: preview.linhas.filter((l) => !l.atletaId).length });
    setPreview(null);
    onImportado();
  }

  const totalNovos = preview ? preview.linhas.reduce((s, l) => s + (l.atletaId ? l.novos.length : 0), 0) : 0;
  const naoEncontrados = preview ? preview.linhas.filter((l) => !l.atletaId) : [];

  return (
    <div className="import-box">
      <div className="import-drop">
        <input type="file" accept=".csv" id="meupsi-csv-input" onChange={handleFile} style={{display:"none"}} />
        <label htmlFor="meupsi-csv-input" className="pill-btn primary">Escolher arquivo CSV do MeuPsi</label>
        <span className="import-hint">Export de grupo (Sub-15 ou Sub-17) com o histórico completo por atleta. Pode reenviar o mesmo grupo depois, os registros já lançados não duplicam.</span>
      </div>

      {erroLeitura && (
        <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)", marginTop:14}}>
          <span>{erroLeitura}</span>
        </div>
      )}

      {preview && (
        <div className="import-preview">
          <div className="access-note admin" style={{marginTop:14}}>
            <span><b>Grupo {preview.grupo || "?"}</b> · {preview.linhas.length} atleta(s) no arquivo · {totalNovos} registro(s) novo(s) a lançar.</span>
          </div>
          {naoEncontrados.length > 0 && (
            <div className="access-note" style={{background:"var(--amarelo-bg)", borderColor:"var(--amarelo)", marginTop:10}}>
              <span><b>{naoEncontrados.length} nome(s) do CSV não bateram com nenhum atleta cadastrado</b> (não serão importados; confere se é erro de digitação no MeuPsi ou no elenco): {naoEncontrados.map((l) => l.nomeCsv).join(", ")}</span>
            </div>
          )}
          <table>
            <thead><tr><th>Atleta (CSV)</th><th>Cadastrado?</th><th>Registros novos</th><th>Já existentes (pulados)</th></tr></thead>
            <tbody>
              {preview.linhas.map((l, i) => (
                <tr key={i}>
                  <td style={{fontWeight:600, color:"var(--navy)"}}>{l.nomeCsv}</td>
                  <td>{l.atletaId ? <span className="badge verde">Sim</span> : <span className="badge amarelo">Não encontrado</span>}</td>
                  <td>{l.atletaId ? l.novos.length : "—"}</td>
                  <td>{l.atletaId ? l.repetidos : "—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="form-actions" style={{padding:"14px 0 0"}}>
            <button className="pill-btn" onClick={() => setPreview(null)} disabled={importando}>Cancelar</button>
            <button className="pill-btn primary" onClick={confirmarImportacao} disabled={importando || totalNovos === 0}>
              {importando ? "Importando..." : `Confirmar importação (${totalNovos})`}
            </button>
          </div>
        </div>
      )}

      {resultado && (
        <div className="access-note" style={{background:"var(--verde-bg)", borderColor:"var(--verde)", marginTop:14}}>
          <span><b>Importado:</b> {resultado.importados} registro(s) novo(s), {resultado.pulados} pulado(s) (já existiam), {resultado.naoEncontrados} atleta(s) do arquivo não encontrado(s) no elenco.</span>
        </div>
      )}
    </div>
  );
}

/** Importador em massa de fotos dos atletas — casa cada arquivo pelo nome (sem extensão)
 *  com o campo "nome" cadastrado do atleta, sobe pro Storage em fotos_atletas/{atletaId}.<ext>
 *  e grava a URL pública em ct_atletas/{atletaId}.foto. */
function ImportadorFotosAtletas({ atletas, onImportado }) {
  const { useState } = React;
  const [linhas, setLinhas] = useState([]);
  const [enviando, setEnviando] = useState(false);
  const [progresso, setProgresso] = useState(0);
  const [resultado, setResultado] = useState(null);
  const [erro, setErro] = useState(null);

  function nomeArquivoSemExtensao(nome) {
    return nome.replace(/\.[^.]+$/, "").trim();
  }

  function encontrarAtleta(nomeArquivo) {
    const alvo = nomeArquivoSemExtensao(nomeArquivo).toLowerCase();
    return atletas.find((a) => (a.nome || "").trim().toLowerCase() === alvo) || null;
  }

  function onFilesSelected(e) {
    const arquivos = Array.from(e.target.files || []).filter((f) => f.type.startsWith("image/"));
    e.target.value = "";
    setLinhas(arquivos.map((file) => ({ file, atleta: encontrarAtleta(file.name) })));
    setResultado(null);
  }

  async function confirmarEnvio() {
    if (enviando) return;
    setEnviando(true);
    setProgresso(0);
    setErro(null);
    let enviados = 0;
    const falhas = [];
    const comMatch = linhas.filter((l) => l.atleta);
    for (const linha of comMatch) {
      try {
        await enviarFotoAtleta(linha.atleta.id, linha.file);
        enviados++;
        setProgresso(enviados);
      } catch (err) {
        falhas.push({ nome: linha.file.name, msg: (err && err.message) || String(err) });
        // Se o primeiro arquivo já falhar, muito provavelmente é um problema geral
        // (Storage não configurado, regras bloqueando etc.) — para de bater a cabeça
        // tentando os outros um por um e mostra o erro de uma vez.
        if (enviados === 0 && falhas.length >= 1) break;
      }
    }
    setEnviando(false);
    if (falhas.length > 0 && enviados === 0) {
      setErro(falhas[0].msg);
    } else {
      setResultado({ enviados, semMatch: linhas.length - comMatch.length, falhas: falhas.length });
      setLinhas([]);
      onImportado();
    }
  }

  const comMatch = linhas.filter((l) => l.atleta);
  const semMatch = linhas.filter((l) => !l.atleta);

  return (
    <div>
      <div className="access-note" style={{marginBottom:12}}>
        <span>Selecione várias fotos de uma vez. O nome de cada arquivo (sem a extensão) precisa ser <b>idêntico</b> ao nome cadastrado do atleta, ex.: "Pedro Kamau Cordeiro Rocha.jpg".</span>
      </div>
      <input type="file" accept="image/*" multiple onChange={onFilesSelected} disabled={enviando} />

      {linhas.length > 0 && (
        <div style={{marginTop:14}}>
          <table>
            <thead><tr><th>Arquivo</th><th>Atleta reconhecido</th></tr></thead>
            <tbody>
              {linhas.map((l, idx) => (
                <tr key={idx}>
                  <td>{l.file.name}</td>
                  <td>{l.atleta ? <span className="badge verde">{nomeExibicao(l.atleta)}</span> : <span className="badge vermelho">Não encontrado</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{display:"flex", alignItems:"center", gap:10, marginTop:12}}>
            <button className="pill-btn primary" disabled={enviando || comMatch.length === 0} onClick={confirmarEnvio}>
              {enviando ? `Enviando ${progresso}/${comMatch.length}...` : `Importar ${comMatch.length} foto(s)`}
            </button>
            {semMatch.length > 0 && <span className="muted" style={{fontSize:12.5}}>{semMatch.length} arquivo(s) sem atleta correspondente não serão importados.</span>}
          </div>
        </div>
      )}

      {erro && (
        <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)", marginTop:14}}>
          <span><b>Erro ao enviar:</b> {erro}</span>
        </div>
      )}

      {resultado && (
        <div className="access-note" style={{background:"var(--verde-bg)", borderColor:"var(--verde)", marginTop:14}}>
          <span><b>Importado:</b> {resultado.enviados} foto(s). {resultado.semMatch > 0 ? `${resultado.semMatch} arquivo(s) sem atleta correspondente.` : ""} {resultado.falhas > 0 ? `${resultado.falhas} arquivo(s) falharam no envio.` : ""}</span>
        </div>
      )}
    </div>
  );
}

/**
 * Painel da Comissão Técnica: mesma visão completa que o Admin usa no
 * Elenco (carregarPermitido + PerfilAtleta). O treinador enxerga todas as
 * áreas (podeVerArea), então o semáforo é o mesmo do Admin e o perfil de
 * cada atleta mostra tudo; lançar registros continua sendo de cada área.
 */
function PainelTreinador({ usuario }) {
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState(null);
  const [atletaAberto, abrirAtleta, fecharAtleta] = usePerfilAberto();

  function recarregar() {
    return carregarPermitido(usuario).then(setDados).catch(e => setErro(e.message));
  }

  useEffect(() => { recarregar(); }, []);

  if (erro) {
    return (
      <div className="page">
        <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)"}}>
          <span><b>Não consegui carregar os dados:</b> {erro}</span>
        </div>
      </div>
    );
  }
  if (!dados) {
    return <div className="page"><SkeletonDashboard /></div>;
  }

  const linha = atletasComSinais(dados, usuario);
  const contagem = { verde: 0, amarelo: 0, vermelho: 0 };
  linha.forEach(d => contagem[d.risco]++);
  const dispHoje = { disponivel: 0, restricao: 0, fora: 0 };
  linha.forEach(d => { if (d.disp) dispHoje[d.disp.status]++; });

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>{atletaAberto ? "Perfil do atleta" : "Painel da Comissão Técnica"}</h1>
          <div className="crumb">MeuCT · Meia Noite EC · visão completa de cada atleta, com todas as áreas</div>
        </div>
      </div>

      {!atletaAberto && (
        <React.Fragment>
          <div className="kpi-row">
            <div className="kpi-card"><div className="label">Atletas monitorados</div><div className="value">{dados.atletas.length}</div></div>
            <div className="kpi-card acento-verde"><div className="label">Sem alerta</div><div className="value verde">{contagem.verde}</div></div>
            <div className="kpi-card acento-amarelo"><div className="label">Atenção</div><div className="value amarelo">{contagem.amarelo}</div></div>
            <div className="kpi-card acento-vermelho"><div className="label">Prioridade</div><div className="value vermelho">{contagem.vermelho}</div></div>
          </div>
          {linha.some(d => d.disp) && (
            <div className="disp-faixa">
              <span className="disp-faixa-titulo">Disponibilidade hoje</span>
              <span className="badge verde">{dispHoje.disponivel} disponíveis</span>
              <span className="badge amarelo">{dispHoje.restricao} com restrição</span>
              <span className="badge vermelho">{dispHoje.fora} fora</span>
            </div>
          )}
          <ElencoPorPosicao atletasComSinal={linha} onOpenAtleta={abrirAtleta} modoInicial="disponibilidade" />
        </React.Fragment>
      )}

      {atletaAberto && (
        <PerfilAtleta atletaId={atletaAberto} onBack={fecharAtleta} dados={dados} onRecarregar={recarregar} usuario={usuario} />
      )}
    </div>
  );
}

function ViewPsicologia() {
  const [atletas, setAtletas] = useState(null);
  const [registros, setRegistros] = useState({});
  const [fisioRegistros, setFisioRegistros] = useState({});
  const [erro, setErro] = useState(null);
  const [formAberto, setFormAberto] = useState(false);
  const [tipoForm, setTipoForm] = useState("Avaliação estruturada");
  const [importadorAberto, setImportadorAberto] = useState(false);
  const [toast, setToast] = useState(null);

  async function carregar() {
    const [listaAtletas, dadosArea, dadosFisio] = await Promise.all([
      carregarAtletas(),
      carregarTodosRegistros("psi"),
      carregarTodosRegistros("fisio"),
    ]);
    setAtletas(listaAtletas);
    setRegistros(dadosArea);
    setFisioRegistros(dadosFisio);
  }

  useEffect(() => { carregar().catch(e => setErro(e.message)); }, []);

  async function adicionar(atletaId, registro) {
    await adicionarRegistro(atletaId, "psi", registro);
    await carregar();
    setToast("Registro salvo para " + nomeAtleta(atletas, atletaId));
    setFormAberto(false);
    setTimeout(() => setToast(null), 3200);
  }

  // Alertas de variação relevante entre as 2 últimas avaliações do mesmo instrumento.
  const alertasVariacao = variacoesRelevantesPsi(registros);

  // Calendário de reavaliação: atletas sem avaliação de psicologia há mais de 30 dias (ou nunca avaliados).
  const LIMITE_REAVALIACAO_DIAS = 30;
  const semReavaliacao = atletas
    ? atletas
        .map((a) => ({ atleta: a, dias: diasDesdeUltimaAvaliacaoPsi(registros[a.id]) }))
        .filter((x) => x.dias === null || x.dias > LIMITE_REAVALIACAO_DIAS)
        .sort((a, b) => (b.dias || 9999) - (a.dias || 9999))
    : [];

function ViewMedicina() {
  const [atletas, setAtletas] = useState(null);
  const [registros, setRegistros] = useState({});
  const [erro, setErro] = useState(null);
  const [formAberto, setFormAberto] = useState(false);
  const [tipoForm, setTipoForm] = useState("Atendimento");
  const [toast, setToast] = useState(null);

  async function carregar() {
    const [listaAtletas, dadosArea] = await Promise.all([
      carregarAtletas(),
      carregarTodosRegistros("medicina"),
    ]);
    setAtletas(listaAtletas);
    setRegistros(dadosArea);
  }

  useEffect(() => { carregar().catch(e => setErro(e.message)); }, []);

  async function adicionar(atletaId, registro) {
    await adicionarRegistro(atletaId, "medicina", registro);
    await carregar();
    setToast("Registro salvo para " + nomeAtleta(atletas, atletaId));
    setFormAberto(false);
    setTimeout(() => setToast(null), 3200);
  }

  async function darAlta() {
    await carregar();
    setToast("Alta clínica registrada");
    setTimeout(() => setToast(null), 3200);
  }

  // PPE por atleta: vencidos, vencendo em até 30 dias, nunca realizado.
  const statusPPEPorAtleta = atletas
    ? atletas.map((a) => ({ atleta: a, ...calcularStatusPPE(registros[a.id]) }))
    : [];
  const ppeVencidosOuVencendo = statusPPEPorAtleta.filter((x) => x.status === "vencido" || x.status === "vencendo");

  // Afastamentos clínicos ativos + possível surto.
  const afastamentosAtivos = atletas
    ? atletas
        .map((a) => ({ atleta: a, registros: calcularAfastamentosClinicosAtivos(registros[a.id]) }))
        .filter((x) => x.registros.length > 0)
    : [];
  const { possivelSurto } = atletas ? detectarPossivelSurto(registros, atletas) : { possivelSurto: false };

  // Concussões em acompanhamento (fase ainda não liberada).
  const concussoesAtivas = atletas
    ? atletas
        .map((a) => ({ atleta: a, episodio: calcularEpisodiosConcussao(registros[a.id]).find((ep) => ep.ativo) }))
        .filter((x) => x.episodio)
    : [];

  // TUEs dentro da validade.
  const tuesAtivas = atletas
    ? atletas
        .map((a) => ({ atleta: a, tues: calcularTuesAtivas(registros[a.id]) }))
        .filter((x) => x.tues.length > 0)
    : [];

  return (
    <div>
      <div className="page">
        <div className="page-head">
          <div>
            <h1>Medicina</h1>
            <div className="crumb">MeuCT · Meia Noite EC</div>
          </div>
        </div>

        {erro ? (
          <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)"}}>
            <span><b>Não consegui carregar os dados:</b> {erro}</span>
          </div>
        ) : !atletas ? (
          <SkeletonPanel />
        ) : (
          <React.Fragment>
            <div className="kpi-row">
              <div className="kpi-card acento-amarelo">
                <div className="label">PPE vencido ou vencendo (30 dias)</div>
                <div className="value amarelo">{ppeVencidosOuVencendo.length}</div>
              </div>
              <div className="kpi-card">
                <div className="label">Afastamentos clínicos ativos</div>
                <div className="value">{afastamentosAtivos.reduce((s, x) => s + x.registros.length, 0)}</div>
              </div>
              <div className="kpi-card acento-vermelho">
                <div className="label">Concussões em acompanhamento</div>
                <div className="value vermelho">{concussoesAtivas.length}</div>
              </div>
            </div>

            {possivelSurto && (
              <div className="access-note" style={{background:"var(--amarelo-bg)", borderColor:"var(--amarelo)"}}>
                <span><b>Possível surto:</b> 3 ou mais atletas com afastamento clínico iniciado nos últimos 14 dias. Vale olhar se há um padrão em comum (mesmo grupo de treino, viagem, etc.). Não é um diagnóstico automático.</span>
              </div>
            )}

            {concussoesAtivas.length > 0 && (
              <div className="panel">
                <div className="panel-head"><h3>Concussão · acompanhamento de retorno gradual</h3></div>
                <div className="panel-body">
                  <table>
                    <thead><tr><th>Atleta</th><th>Fase atual</th><th>Dias desde o evento</th><th></th></tr></thead>

function AuthScreen() {
  const [modo, setModo] = useState("entrar"); // "entrar" | "cadastrar"
  const [nome, setNome] = useState("");
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState(null);
  const [carregando, setCarregando] = useState(false);

  function traduzirErro(codigo) {
    const mapa = {
      "auth/email-already-in-use": "Esse e-mail já tem uma conta. Tenta entrar em vez de cadastrar.",
      "auth/invalid-email": "E-mail inválido.",
      "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
      "auth/user-not-found": "Não achei conta com esse e-mail.",
      "auth/wrong-password": "Senha incorreta.",
      "auth/invalid-credential": "E-mail ou senha incorretos.",
      "auth/invalid-login-credentials": "E-mail ou senha incorretos.",
      "auth/too-many-requests": "Muitas tentativas. Espera um pouco e tenta de novo.",
      "auth/network-request-failed": "Falha de rede. Confere sua conexão e tenta de novo.",
      "auth/user-disabled": "Essa conta foi desativada.",
    };
    return mapa[codigo] || `Não consegui completar (código: ${codigo || "desconhecido"}). Se persistir, manda esse código pra quem administra o sistema.`;
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setErro(null);
    setCarregando(true);
    try {
      if (modo === "cadastrar") {
        await cadastrar(email.trim(), senha, nome.trim());
      } else {
        await entrar(email.trim(), senha);
      }
    } catch (err) {
      setErro(traduzirErro(err.code));
    }
    setCarregando(false);
  }

  return (
    <div className="auth-screen">
      <div className="auth-layout">
      <div className="auth-hero">
        <img src={ESCUDO_MEIA_NOITE} className="auth-crest" alt="Escudo do Meia Noite EC" />
        <div className="auth-eyebrow">Meia Noite Esporte Clube</div>
        <h1 className="auth-titulo">Meu<span>CT</span></h1>
        <p className="auth-lead">Psicologia, fisioterapia, fisiologia, medicina, serviço social e desempenho do elenco num só lugar, com o semáforo de cada atleta sempre à vista.</p>
        <div className="auth-chips"><span>Sub-15</span><span>Sub-17</span><span>Semáforo integrado</span></div>
      </div>
      <div className="auth-card">
        <div className="auth-card-titulo">{modo === "cadastrar" ? "Criar conta" : "Bem-vindo de volta"}</div>
        <div className="auth-card-sub">{modo === "cadastrar" ? "Depois de criada, o administrador libera os módulos da sua área." : "Entre com o e-mail e a senha da sua conta."}</div>
        <div className="auth-tabs">
          <button type="button" className={"auth-tab" + (modo === "entrar" ? " active" : "")} onClick={() => setModo("entrar")}>Entrar</button>
          <button type="button" className={"auth-tab" + (modo === "cadastrar" ? " active" : "")} onClick={() => setModo("cadastrar")}>Criar conta</button>
        </div>
        {erro && <div className="auth-erro">{erro}</div>}
        <form onSubmit={handleSubmit}>
          {modo === "cadastrar" && (
            <div className="auth-field">
              <label>Nome</label>
              <input type="text" value={nome} onChange={(e) => setNome(e.target.value)} required />
            </div>
          )}
          <div className="auth-field">
            <label>E-mail</label>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required />
          </div>
          <div className="auth-field">
            <label>Senha</label>
            <input type="password" value={senha} onChange={(e) => setSenha(e.target.value)} required minLength={6} />
          </div>
          <button className="auth-submit" type="submit" disabled={carregando}>
            {carregando ? "Aguenta aí..." : modo === "cadastrar" ? "Criar conta" : "Entrar"}
          </button>
        </form>
        <div className="auth-rodape">Acesso restrito à comissão técnica e aos profissionais do CT.</div>
      </div>
      </div>
    </div>
  );
}

function PainelUsuarios({ usuarioAtual }) {
  const [usuarios, setUsuarios] = useState(null);
  const [erro, setErro] = useState(null);
  const [salvandoId, setSalvandoId] = useState(null);

  async function carregar() {
    const snap = await db.collection(COL_USUARIOS).orderBy("email").get();
    setUsuarios(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
  }

  useEffect(() => { carregar().catch((e) => setErro(e.message)); }, []);

  async function alternarModulo(usr, moduloId) {
    const atual = usr.modulos || [];
    const novo = atual.includes(moduloId) ? atual.filter((m) => m !== moduloId) : [...atual, moduloId];
    setSalvandoId(usr.id);
    await db.collection(COL_USUARIOS).doc(usr.id).update({ modulos: novo });
    await carregar();
    setSalvandoId(null);
  }

  async function aplicarGrupo(usr, grupo) {
    setSalvandoId(usr.id);
    await db.collection(COL_USUARIOS).doc(usr.id).update({ modulos: grupo.modulos });
    await carregar();
    setSalvandoId(null);
  }

  async function alternarRole(usr) {
    const novoRole = usr.role === "admin" ? "colaborador" : "admin";
    setSalvandoId(usr.id);
    await db.collection(COL_USUARIOS).doc(usr.id).update({ role: novoRole });
    await carregar();
    setSalvandoId(null);
  }

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>Usuários</h1>
          <div className="crumb">MeuCT · Meia Noite EC · quem acessa cada área</div>
        </div>
      </div>

      {erro ? (
        <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)"}}><span>{erro}</span></div>
      ) : !usuarios ? (
        <SkeletonPanel />
      ) : (
        <div className="panel">
          <div className="panel-head"><h3>Todas as contas ({usuarios.length})</h3></div>
          <div className="panel-body">
            <table>
              <thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Módulos liberados</th></tr></thead>
              <tbody>
                {usuarios.map((u) => (
                  <tr key={u.id}>
                    <td style={{fontWeight:600, color:"var(--navy)"}}>{u.nome || "—"}</td>
                    <td className="muted">{u.email}</td>
                    <td>
                      <button
                        className={"badge " + (u.role === "admin" ? "verde" : "pendente")}
                        style={{cursor: u.id === usuarioAtual.id ? "not-allowed" : "pointer", border:"none"}}
                        onClick={() => u.id !== usuarioAtual.id && alternarRole(u)}
                        disabled={salvandoId === u.id || u.id === usuarioAtual.id}
                        title={u.id === usuarioAtual.id ? "Não dá pra tirar seu próprio acesso de admin por aqui" : "Clique pra alternar"}
                      >
                        {u.role === "admin" ? "Admin" : "Colaborador"}
                      </button>
                    </td>
                    <td>
                      {u.role === "admin" ? (
                        <span className="muted">Acesso total (é admin)</span>
                      ) : (
                        <React.Fragment>
                          <div className="grupo-acesso-row">
                            {GRUPOS_ACESSO.map((g) => (
                              <button
                                key={g.id}
                                type="button"
                                className="grupo-btn"
                                onClick={() => aplicarGrupo(u, g)}
                                disabled={salvandoId === u.id}
                                title={"Libera de uma vez: " + g.modulos.map((mid) => (MODULOS.find((m) => m.id === mid) || {}).label).join(", ")}
                              >
                                Aplicar {g.label}
                              </button>
                            ))}
                          </div>
                          <div className="modulo-toggle-row">
                            {MODULOS.filter((m) => m.id !== "admin").map((m) => (
                              <button
                                key={m.id}
                                className={"modulo-toggle" + ((u.modulos || []).includes(m.id) ? " on" : "")}
                                onClick={() => alternarModulo(u, m.id)}
                                disabled={salvandoId === u.id}
                              >
                                {m.label}
                              </button>
                            ))}
                          </div>
                        </React.Fragment>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function labelCategoriaAtualizacao(id) {
  const c = CATEGORIAS_ATUALIZACAO.find((x) => x.id === id);
  return c ? c.label : id || "—";
}

/** Formata um Firestore Timestamp (ou já convertido) em "DD/MM/AAAA às HH:MM". */
function formatarDataHoraAtualizacao(ts) {
  if (!ts) return "—";
  const d = typeof ts.toDate === "function" ? ts.toDate() : new Date(ts);
  if (isNaN(d.getTime())) return "—";
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const hh = String(d.getHours()).padStart(2, "0");
  const mi = String(d.getMinutes()).padStart(2, "0");
  return `${dd}/${mm}/${d.getFullYear()} às ${hh}:${mi}`;
}

function FormNovaAtualizacao({ onSalvar, onCancelar }) {
  const { useState } = React;
  const [titulo, setTitulo] = useState("");
  const [descricao, setDescricao] = useState("");
  const [categoria, setCategoria] = useState("nova");
  const [salvando, setSalvando] = useState(false);

  async function handleSubmit() {
    if (!titulo.trim() || salvando) return;
    setSalvando(true);
    try {
      await onSalvar({ titulo, descricao, categoria });
      setTitulo(""); setDescricao(""); setCategoria("nova");
    } finally {
      setSalvando(false);
    }
  }

  return (
    <div className="form-panel">
      <div className="form-grid">
        <div className="field">
          <label>Título</label>
          <input type="text" value={titulo} onChange={e => setTitulo(e.target.value)} placeholder="Ex.: Relatórios em grupo (.zip)" />
        </div>
        <div className="field">
          <label>Categoria</label>
          <select value={categoria} onChange={e => setCategoria(e.target.value)}>
            {CATEGORIAS_ATUALIZACAO.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
          </select>
        </div>
      </div>
      <div className="form-grid full">
        <div className="field">
          <label>Descrição</label>
          <textarea value={descricao} onChange={e => setDescricao(e.target.value)} placeholder="Explique em poucas linhas o que mudou e como usar." />
        </div>
      </div>
      <div className="form-actions">
        <button className="pill-btn" onClick={onCancelar} disabled={salvando}>Cancelar</button>
        <button className="pill-btn primary" onClick={handleSubmit} disabled={!titulo.trim() || salvando}>{salvando ? "Publicando..." : "Publicar atualização"}</button>
      </div>
    </div>
  );
}

function PainelAtualizacoes({ usuario }) {
  const { useState, useEffect } = React;
  const [lista, setLista] = useState(null);
  const [erro, setErro] = useState(null);
  const [mostrarForm, setMostrarForm] = useState(false);
  const ehAdmin = usuario.role === "admin";

  async function recarregar() {
    try {
      setLista(await carregarAtualizacoes(100));
    } catch (e) {
      setErro(e.message);
    }
  }

  useEffect(() => {
    recarregar();
    marcarAtualizacoesVistas(usuario);
  }, []);

  async function salvar(dados) {
    await criarAtualizacao(dados);
    setMostrarForm(false);
    await recarregar();
  }

  async function excluir(id) {
    await excluirAtualizacao(id);
    await recarregar();
  }

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>Atualizações</h1>
          <div className="crumb">MeuCT · Meia Noite EC · novidades sobre atletas, jogos, avisos e a plataforma</div>
        </div>
        {ehAdmin && !mostrarForm && (
          <button className="pill-btn primary" onClick={() => setMostrarForm(true)}>+ Nova atualização</button>
        )}
      </div>

      {erro && (
        <div className="access-note" style={{ background: "var(--vermelho-bg)", borderColor: "var(--vermelho)" }}>
          <span><b>Não consegui carregar as atualizações:</b> {erro}</span>
        </div>
      )}

      {ehAdmin && mostrarForm && (
        <div className="panel" style={{ marginBottom: 20 }}>
          <div className="panel-head"><h3>Nova atualização</h3></div>
          <FormNovaAtualizacao onSalvar={salvar} onCancelar={() => setMostrarForm(false)} />
        </div>
      )}

      {lista === null ? (
        <div className="empty-state">Carregando...</div>
      ) : lista.length === 0 ? (
        <div className="empty-state">Nenhuma atualização publicada ainda.</div>
      ) : (
        <div>
          {lista.map((a) => (
            <div className="atualizacao-item" key={a.id}>
              <div className="atualizacao-topo">
                <span className={"atualizacao-tag " + (a.categoria || "melhoria")}>{labelCategoriaAtualizacao(a.categoria)}</span>
                <span className="atualizacao-data">{formatarDataHoraAtualizacao(a.criadoEm)}</span>
                {ehAdmin && <button className="atualizacao-excluir" onClick={() => excluir(a.id)}>Excluir</button>}
              </div>
              <div className="atualizacao-titulo">{a.titulo}</div>
              {a.descricao && <div className="atualizacao-descricao">{a.descricao}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ==================== Central de Relatórios ==================== */

/** Verifica se uma data ISO ("YYYY-MM-DD") cai dentro do período escolhido nos filtros do relatório. */
function dataNoPeriodo(dataIso, filtros) {
  if (!dataIso) return false;
  if (filtros.tipoPeriodo === "dia") return dataIso === filtros.dataDia;
  return dataIso >= filtros.dataInicio && dataIso <= filtros.dataFim;
}

/** Cores de sinal usadas nos gráficos do relatório (mesma família de cores do padrão impresso). */
const COR_SINAL_RELATORIO = { verde: "#2E7D4F", amarelo: "#D9A21B", vermelho: "#B03A2E", neutro: "#9AA3AE" };

/** Config Chart.js pronta pra um gráfico simples de barra/doughnut (1 série), no padrão visual do relatório. */
function chartConfigSimples(tipo, labels, dados, cores) {
  return {
    type: tipo,
    data: { labels, datasets: [{ data: dados, backgroundColor: cores, borderColor: "#1B2A4A", borderWidth: 1 }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: tipo === "doughnut", position: "bottom", labels: { font: { size: 11 }, boxWidth: 12 } },
      },
      scales: tipo === "doughnut" ? undefined : {
        y: { beginAtZero: true, ticks: { precision: 0, font: { size: 10.5 } } },
        x: { ticks: { font: { size: 10.5 } } },
      },
    },
  };
}

/** Um gráfico de evolução (linha, uma série por instrumento) por construto de psicologia que o atleta realmente tem — mesma lógica de EvolucaoPsiAtleta, reaproveitada aqui pra vir tudo embutido no PDF. */
function construirGraficosPsicologiaAtleta(registros, atletaId) {
  const dadosWrap = { psiData: registros };
  const construtos = Object.keys(CONSTRUCTOS_PSI).filter((c) => Object.keys(historicoConstrutoAtleta(dadosWrap, atletaId, c)).length > 0);
  return construtos.map((construto) => {
    const porInstrumento = historicoConstrutoAtleta(dadosWrap, atletaId, construto);
    const instrumentos = Object.keys(porInstrumento);
    const datasUnicas = Array.from(new Set(instrumentos.flatMap((t) => porInstrumento[t].map((p) => p.data)))).sort();
    return {
      titulo: construto,
      chartConfig: {
        type: "line",
        data: {
          labels: datasUnicas.map(formatarData),
          datasets: instrumentos.map((tipo, i) => {
            const mapa = {};
            porInstrumento[tipo].forEach((p) => { mapa[p.data] = p.valor; });
            return {
              label: semTravessao(tipo),
              data: datasUnicas.map((d) => (d in mapa ? mapa[d] : null)),
              borderColor: PALETA_SUBESCALAS[i % PALETA_SUBESCALAS.length],
              backgroundColor: PALETA_SUBESCALAS[i % PALETA_SUBESCALAS.length] + "33",
              tension: 0.25,
              pointRadius: 4,
              spanGaps: true,
            };
          }),
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: { legend: { labels: { font: { size: 10.5 } } } },
          scales: {
            x: { offset: datasUnicas.length === 1, ticks: { font: { size: 10.5 } } },
            y: escalaYLegivel(instrumentos.flatMap((t) => porInstrumento[t].map((p) => p.valor)), { ticks: { font: { size: 10.5 } } }),
          },
        },
      },
    };
  });
}

/** Relatório de Medicina — usa só os registros do tipo "Atendimento" (consultas de ambulatório), no molde do relatório diário de referência. */
function construirRelatorioMedicina(registros, atletas, filtros) {
  const linhas = [];
  atletas.forEach((a) => {
    if (filtros.atletaId && filtros.atletaId !== a.id) return;
    if (filtros.categoria && normalizarCategoria(a.categoria) !== filtros.categoria) return;
    (registros[a.id] || []).forEach((r) => {
      if (r.tipo !== "Atendimento") return;
      if (!dataNoPeriodo(r.data, filtros)) return;
      if (filtros.status && r.desfecho !== filtros.status) return;
      linhas.push({ atleta: a, registro: r });
    });
  });
  linhas.sort((x, y) => (x.registro.data + (x.registro.horario || "")).localeCompare(y.registro.data + (y.registro.horario || "")));

  const total = linhas.length;
  const porDesfecho = { liberado: 0, restricao: 0, afastado: 0 };
  linhas.forEach(({ registro }) => { porDesfecho[registro.desfecho] = (porDesfecho[registro.desfecho] || 0) + 1; });

  const resumoTexto = total === 0
    ? "Nenhum atendimento registrado no período selecionado."
    : `Foram realizados ${total} atendimento${total === 1 ? "" : "s"} no ambulatório médico. Desfechos: ${porDesfecho.liberado} liberado(s) para treino/jogo, ${porDesfecho.restricao} com restrição/orientação e acompanhamento e ${porDesfecho.afastado} afastado(s) das atividades.`;

  const pontosAtencao = linhas
    .filter(({ registro }) => registro.ponto_atencao)
    .map(({ atleta, registro }) => ({
      titulo: `${nomeExibicao(atleta)} (${atleta.categoria || "-"})${registro.horario ? " · " + registro.horario : ""}`,
      corpo: registro.nota_atencao || registro.conduta || registro.queixa_principal,
    }));

  const colunasDetalhe = ["Horário", "Atleta", "Categoria", "Queixa Principal", "Hipótese Diagnóstica", "Conduta / Encaminhamento"];
  const linhasDetalhe = linhas.map(({ atleta, registro }) => [
    registro.horario || "-",
    nomeExibicao(atleta),
    atleta.categoria || "-",
    registro.queixa_principal || "-",
    registro.hipotese_diagnostica || "-",
    registro.conduta || "-",
  ]);
  const destaques = linhas.map(({ registro }) => !!registro.ponto_atencao);

  const resumoColorido = linhas.map(({ atleta, registro }) => ({
    sinal: sinalPorDesfecho(registro.desfecho),
    nome: nomeExibicao(atleta),
    categoria: atleta.categoria || "-",
    texto: registro.conduta || labelDesfechoAtendimento(registro.desfecho),
    destaque: !!registro.ponto_atencao,
  }));

  const graficos = total > 0 ? [{
    titulo: "Atendimentos por desfecho",
    chartConfig: chartConfigSimples("bar", ["Liberado", "Restrição/orientação", "Afastado"], [porDesfecho.liberado, porDesfecho.restricao, porDesfecho.afastado], [COR_SINAL_RELATORIO.verde, COR_SINAL_RELATORIO.amarelo, COR_SINAL_RELATORIO.vermelho]),
  }] : [];

  return { total, resumoTexto, pontosAtencao, colunasDetalhe, linhasDetalhe, destaques, colunaNome: 1, colunasEmDestaque: [1, 4], resumoColorido, graficos };
}

/** Relatório de Fisioterapia — agrupa por episódio de lesão (mesmo agrupamento do painel), restrito aos episódios com alguma movimentação no período. */
function construirRelatorioFisioterapia(registros, atletas, filtros) {
  const linhas = [];
  atletas.forEach((a) => {
    if (filtros.atletaId && filtros.atletaId !== a.id) return;
    if (filtros.categoria && normalizarCategoria(a.categoria) !== filtros.categoria) return;
    const episodios = calcularEpisodiosLesao(registros[a.id]);
    episodios.forEach((ep) => {
      const teveAtividadeNoPeriodo = ep.registros.some((r) => dataNoPeriodo(r.data, filtros));
      if (!teveAtividadeNoPeriodo) return;
      if (filtros.status === "ativo" && !ep.ativo) return;
      if (filtros.status === "liberado" && ep.ativo) return;
      linhas.push({ atleta: a, episodio: ep });
    });
  });

  const total = linhas.length;
  const ativos = linhas.filter(({ episodio }) => episodio.ativo).length;
  const reincidentes = linhas.filter(({ episodio }) => episodio.reincidente).length;
  const emDestaque = ({ episodio }) => episodio.gravidade === "grave" || episodio.reincidente;

  const resumoTexto = total === 0
    ? "Nenhum episódio de lesão com atividade no período selecionado."
    : `${total} episódio${total === 1 ? "" : "s"} de lesão com atividade no período, sendo ${ativos} ainda ativo${ativos === 1 ? "" : "s"} e ${reincidentes} reincidente${reincidentes === 1 ? "" : "s"}.`;

  const pontosAtencao = linhas
    .filter(emDestaque)
    .map(({ atleta, episodio }) => ({
      titulo: `${nomeExibicao(atleta)} (${atleta.categoria || "-"}) · ${episodio.regiao}`,
      corpo: `${episodio.reincidente ? "Lesão reincidente. " : ""}Gravidade ${episodio.gravidade || "não informada"}, fase atual: ${labelFaseRtp(episodio.faseAtual)}.`,
    }));

  const colunasDetalhe = ["Atleta", "Categoria", "Região", "Gravidade", "Fase RTP", "Dias desde o início", "Reincidente", "Avaliador"];
  const linhasDetalhe = linhas.map(({ atleta, episodio }) => [
    nomeExibicao(atleta),
    atleta.categoria || "-",
    episodio.regiao,
    episodio.gravidade || "-",
    labelFaseRtp(episodio.faseAtual),
    String(calcularDiasEntre(episodio.dataInicio) || 0),
    episodio.reincidente ? "Sim" : "Não",
    (episodio.registros[0] && episodio.registros[0].avaliador) || "-",
  ]);
  const destaques = linhas.map(emDestaque);

  const resumoColorido = linhas.map((l) => ({
    sinal: l.episodio.faseAtual === "liberado" ? "verde" : l.episodio.gravidade === "grave" ? "vermelho" : "amarelo",
    nome: nomeExibicao(l.atleta),
    categoria: l.atleta.categoria || "-",
    texto: `${l.episodio.regiao} · ${labelFaseRtp(l.episodio.faseAtual)}`,
    destaque: emDestaque(l),
  }));

  const porRegiao = {};
  linhas.forEach(({ episodio }) => { porRegiao[episodio.regiao] = (porRegiao[episodio.regiao] || 0) + 1; });
  const graficos = total > 0 ? [{
    titulo: "Episódios por região",
    chartConfig: chartConfigSimples("bar", Object.keys(porRegiao), Object.values(porRegiao), "#1B2A4A"),
  }] : [];

  return { total, resumoTexto, pontosAtencao, colunasDetalhe, linhasDetalhe, destaques, colunaNome: 0, colunasEmDestaque: [0, 3], resumoColorido, graficos };
}

/** Relatório genérico (Fisiologia, Psicologia, Desempenho) — registros simples com campo "sinal" (verde/amarelo/vermelho). */
function construirRelatorioGenerico(registros, atletas, filtros, opts) {
  const linhas = [];
  atletas.forEach((a) => {
    if (filtros.atletaId && filtros.atletaId !== a.id) return;
    if (filtros.categoria && normalizarCategoria(a.categoria) !== filtros.categoria) return;
    (registros[a.id] || []).forEach((r) => {
      if (!dataNoPeriodo(r.data, filtros)) return;
      if (filtros.status && (r.sinal || "neutro") !== filtros.status) return;
      linhas.push({ atleta: a, registro: r });
    });
  });
  linhas.sort((x, y) => (y.registro.data || "").localeCompare(x.registro.data || ""));

  const total = linhas.length;
  const porSinal = { verde: 0, amarelo: 0, vermelho: 0, neutro: 0 };
  linhas.forEach(({ registro }) => { const s = registro.sinal || "neutro"; porSinal[s] = (porSinal[s] || 0) + 1; });

  const resumoTexto = total === 0
    ? (opts.textoVazio || "Nenhum registro no período selecionado.")
    : `${total} ${total === 1 ? opts.itemSingular : opts.itemPlural} no período. Sinais: ${porSinal.verde} regular(es), ${porSinal.amarelo} em atenção, ${porSinal.vermelho} prioritário(s)${porSinal.neutro ? ` e ${porSinal.neutro} informativo(s)` : ""}.`;

  const pontosAtencao = linhas
    .filter(({ registro }) => registro.sinal === "vermelho")
    .map(({ atleta, registro }) => ({
      titulo: `${nomeExibicao(atleta)} (${atleta.categoria || "-"}) · ${formatarData(registro.data)}`,
      corpo: registro.nota || registro.tipo || "-",
    }));

  const colunasDetalhe = ["Data", "Atleta", "Categoria", "Tipo", "Observação", "Sinal"];
  const linhasDetalhe = linhas.map(({ atleta, registro }) => [
    formatarData(registro.data),
    nomeExibicao(atleta),
    atleta.categoria || "-",
    registro.tipo || "-",
    registro.nota || "-",
    registro.sinal === "verde" ? "Regular" : registro.sinal === "amarelo" ? "Atenção" : registro.sinal === "vermelho" ? "Prioridade" : "Informativo",
  ]);
  const destaques = linhas.map(({ registro }) => registro.sinal === "vermelho");

  const resumoColorido = linhas.map(({ atleta, registro }) => ({
    sinal: ["verde", "amarelo", "vermelho"].includes(registro.sinal) ? registro.sinal : "neutro",
    nome: nomeExibicao(atleta),
    categoria: atleta.categoria || "-",
    texto: registro.tipo || "-",
    destaque: registro.sinal === "vermelho",
  }));

  const graficos = total > 0 ? [{
    titulo: "Distribuição por sinal",
    chartConfig: chartConfigSimples("doughnut", ["Regular", "Atenção", "Prioridade", "Informativo"], [porSinal.verde, porSinal.amarelo, porSinal.vermelho, porSinal.neutro], [COR_SINAL_RELATORIO.verde, COR_SINAL_RELATORIO.amarelo, COR_SINAL_RELATORIO.vermelho, COR_SINAL_RELATORIO.neutro]),
  }] : [];

  return { total, resumoTexto, pontosAtencao, colunasDetalhe, linhasDetalhe, destaques, colunaNome: 1, colunasEmDestaque: [1, 5], resumoColorido, graficos };
}

/** Relatório de Serviço Social — usa o campo statusPublico ("ativo"/"atencao") em vez de "sinal". */
function construirRelatorioSocial(registros, atletas, filtros) {
  const linhas = [];
  atletas.forEach((a) => {
    if (filtros.atletaId && filtros.atletaId !== a.id) return;
    if (filtros.categoria && normalizarCategoria(a.categoria) !== filtros.categoria) return;
    (registros[a.id] || []).forEach((r) => {
      if (!dataNoPeriodo(r.data, filtros)) return;
      if (filtros.status && r.statusPublico !== filtros.status) return;
      linhas.push({ atleta: a, registro: r });
    });
  });
  linhas.sort((x, y) => (y.registro.data || "").localeCompare(x.registro.data || ""));

  const total = linhas.length;
  const emAtencao = linhas.filter(({ registro }) => registro.statusPublico === "atencao").length;

  const resumoTexto = total === 0
    ? "Nenhum acompanhamento registrado no período selecionado."
    : `${total} acompanhamento${total === 1 ? "" : "s"} no período, sendo ${emAtencao} em atenção.`;

  const pontosAtencao = linhas
    .filter(({ registro }) => registro.statusPublico === "atencao")
    .map(({ atleta, registro }) => ({
      titulo: `${nomeExibicao(atleta)} (${atleta.categoria || "-"}) · ${formatarData(registro.data)}`,
      corpo: registro.detalhe || registro.tipo || "-",
    }));

  const colunasDetalhe = ["Data", "Atleta", "Categoria", "Tipo", "Status", "Detalhe"];
  const linhasDetalhe = linhas.map(({ atleta, registro }) => [
    formatarData(registro.data),
    nomeExibicao(atleta),
    atleta.categoria || "-",
    registro.tipo || "-",
    registro.statusPublico === "atencao" ? "Em atenção" : "Ativo",
    registro.detalhe || "-",
  ]);
  const destaques = linhas.map(({ registro }) => registro.statusPublico === "atencao");

  const resumoColorido = linhas.map(({ atleta, registro }) => ({
    sinal: registro.statusPublico === "atencao" ? "amarelo" : "verde",
    nome: nomeExibicao(atleta),
    categoria: atleta.categoria || "-",
    texto: registro.tipo || "-",
    destaque: registro.statusPublico === "atencao",
  }));

  const graficos = total > 0 ? [{
    titulo: "Acompanhamentos por status",
    chartConfig: chartConfigSimples("doughnut", ["Ativo", "Em atenção"], [total - emAtencao, emAtencao], [COR_SINAL_RELATORIO.verde, COR_SINAL_RELATORIO.amarelo]),
  }] : [];

  return { total, resumoTexto, pontosAtencao, colunasDetalhe, linhasDetalhe, destaques, colunaNome: 1, colunasEmDestaque: [1, 4], resumoColorido, graficos };
}

/** Relatório de Psicologia — quando filtrado por UM atleta específico, troca o gráfico genérico por um gráfico de evolução por construto (linha, uma série por instrumento) pra cada construto que esse atleta tem dado — a mesma visão de EvolucaoPsiAtleta, só que todas de uma vez, encaixadas no PDF. */
function construirRelatorioPsicologia(registros, atletas, filtros) {
  const base = construirRelatorioGenerico(registros, atletas, filtros, { itemSingular: "avaliação", itemPlural: "avaliações", textoVazio: "Nenhuma avaliação registrada no período selecionado." });
  if (filtros.atletaId) {
    const graficosAtleta = construirGraficosPsicologiaAtleta(registros, filtros.atletaId);
    if (graficosAtleta.length > 0) return { ...base, graficos: graficosAtleta };
  }
  return base;
}

/** "2026-09-22" -> "22 / 09 / 2026" (formato da linha de local e data do padrão). */
function dataAssinaturaRelatorio(dataIso) {
  const [y, m, d] = (dataIso || hojeISO()).split("-");
  return `${d} / ${m} / ${y}`;
}

/** Texto que entra no documento: o separador " — " dos registros antigos vira " · " e o travessão
 *  sozinho vira "-" (o padrão dos relatórios não usa travessão). Não altera o dado salvo. */
function semTravessao(v) {
  if (v === null || v === undefined) return v;
  const s = String(v);
  if (/^\s*[—–]\s*$/.test(s)) return "-";
  return s.replace(/\s+[—–]\s+/g, " · ").replace(/[—–]/g, "-");
}

/**
 * Monta o documento do relatório (tudo que aparece na folha) num único objeto: a MESMA
 * estrutura alimenta a prévia na tela e o PDF, então os dois nunca saem diferentes.
 */
function montarDocumentoRelatorio(config, conteudo, meta) {
  const td = semTravessao;
  const ehDia = meta.tipoPeriodo === "dia";
  const info = [[ehDia ? "Data" : "Período", meta.periodoLabel]];
  if (meta.atletaNome) info.push(["Atleta", td(meta.atletaNome)]);
  else if (meta.categoriaLabel) info.push(["Categoria", meta.categoriaLabel]);
  info.push(["Destinatário", td(meta.destinatario) || "-"]);
  info.push([config.totalLabel, String(conteudo.total)]);
  const temNeutro = (conteudo.resumoColorido || []).some((r) => r.sinal === "neutro");
  return {
    departamento: config.departamento,
    clube: "EC Meia Noite SAF",
    titulo: ehDia ? config.tituloDia : config.tituloPeriodo,
    subtitulo: "Comunicação à Coordenação · Setor de Futebol",
    info,
    secaoResumo: ehDia ? "Resumo do dia" : "Resumo do período",
    resumoTexto: td(conteudo.resumoTexto),
    pontosAtencao: (conteudo.pontosAtencao || []).map((p) => ({ ...p, titulo: td(p.titulo), corpo: td(p.corpo) })),
    secaoDetalhe: config.secaoDetalhe,
    colunas: conteudo.colunasDetalhe,
    linhas: (conteudo.linhasDetalhe || []).map((linha) => linha.map(td)),
    destaques: conteudo.destaques || [],
    colunaNome: conteudo.colunaNome,
    colunasEmDestaque: conteudo.colunasEmDestaque || [],
    colunasCentro: config.colunasCentro || [],
    larguras: config.larguras || {},
    secaoResumoPratico: ehDia ? "Resumo prático do dia" : "Resumo prático do período",
    legenda: temNeutro ? [...config.legenda, ["neutro", "informativo"]] : config.legenda,
    resumoPratico: (conteudo.resumoColorido || []).map((r) => ({ ...r, nome: td(r.nome), categoria: td(r.categoria), texto: td(r.texto) })),
    graficos: (conteudo.graficos || []).map((g) => {
      const dados = g.chartConfig && g.chartConfig.data;
      if (!dados) return { ...g, titulo: td(g.titulo) };
      return {
        ...g,
        titulo: td(g.titulo),
        chartConfig: {
          ...g.chartConfig,
          data: {
            ...dados,
            labels: (dados.labels || []).map(td),
            datasets: (dados.datasets || []).map((ds) => ({ ...ds, label: td(ds.label) })),
          },
        },
      };
    }),
    local: (meta.local || "").trim() || "Patrocínio Paulista",
    dataAssinatura: dataAssinaturaRelatorio(hojeISO()),
    responsavelNome: (meta.responsavelNome || "").trim(),
    responsavelRegistro: (meta.responsavelRegistro || "").trim(),
    cargoLinha: (meta.responsavelCargo || "").trim() ? `${meta.responsavelCargo.trim()} · EC Meia Noite SAF` : "EC Meia Noite SAF",
    rodape: `${config.departamento} · EC Meia Noite SAF`,
  };
}

/** Gráfico embutido na prévia do relatório (no PDF ele é redesenhado em alta resolução). */
function MiniChartRelatorio({ grafico }) {
  const { useRef, useEffect } = React;
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !grafico) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, grafico.chartConfig);
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(grafico)]);

  if (!grafico) return null;
  return <div className="relatorio-grafico-box"><canvas ref={canvasRef}></canvas></div>;
}

/** Na prévia, siglas curtas com hífen (HAM-A, CSAI-2R, ACSI-28) não podem quebrar no hífen,
 *  como já acontece no PDF. */
function semQuebraEmSiglas(texto) {
  const s = texto === null || texto === undefined ? "" : String(texto);
  if (!/\S-\S/.test(s)) return s;
  return s.split(/(\s+)/).map((parte, i) => (/^\S{1,12}$/.test(parte) && parte.includes("-") ? <span key={i} className="sem-quebra">{parte}</span> : parte));
}
