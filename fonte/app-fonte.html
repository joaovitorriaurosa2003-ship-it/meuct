/** Todos os construtos para os quais existe pelo menos 1 registro no banco. */
function construtosDisponiveis(dados) {
  const tiposExistentes = new Set(Object.values(dados.psiData).flat().map((r) => r.tipo));
  return Object.keys(CONSTRUCTOS_PSI).filter((construto) =>
    CONSTRUCTOS_PSI[construto].some((fonte) => tiposExistentes.has(fonte.tipo))
  );
}

/** Fontes (instrumentos) de um construto que realmente têm dado no banco. */
function fontesDoConstruto(dados, construto) {
  const tiposExistentes = new Set(Object.values(dados.psiData).flat().map((r) => r.tipo));
  return (CONSTRUCTOS_PSI[construto] || []).filter((f) => tiposExistentes.has(f.tipo));
}

/** Valor mais recente de um atleta para um construto, entre todas as fontes que ele tiver. */
function valorConstrutoAtleta(dados, atletaId, construto) {
  const fontes = CONSTRUCTOS_PSI[construto] || [];
  let melhor = null;
  fontes.forEach(({ tipo, campo }) => {
    (dados.psiData[atletaId] || []).filter((r) => r.tipo === tipo).forEach((r) => {
      const v = parseNota(r.nota, r.tipo).campos[campo];
      if (typeof v === "number" && (!melhor || r.data > melhor.data)) {
        melhor = { valor: v, data: r.data, instrumento: tipo, campo };
      }
    });
  });
  return melhor;
}

/** Todo o histórico (todas as datas) de um atleta para um construto, agrupado por instrumento. */
function historicoConstrutoAtleta(dados, atletaId, construto) {
  const fontes = CONSTRUCTOS_PSI[construto] || [];
  const porInstrumento = {};
  fontes.forEach(({ tipo, campo }) => {
    (dados.psiData[atletaId] || []).filter((r) => r.tipo === tipo).forEach((r) => {
      const v = parseNota(r.nota, r.tipo).campos[campo];
      if (typeof v === "number") {
        if (!porInstrumento[tipo]) porInstrumento[tipo] = [];
        porInstrumento[tipo].push({ data: r.data, valor: v });
      }
    });
  });
  Object.values(porInstrumento).forEach((lista) => lista.sort((a, b) => a.data.localeCompare(b.data)));
  return porInstrumento;
}

/* ---------- Psicologia: instrumentos estruturados, limiares clínicos reais, normas, variação ---------- */

/**
 * Config de instrumentos pro lançamento estruturado. Só o HAM-A tem corte
 * clínico publicado (Hamilton, 1959) — os demais (CSAI-2R, SAS, ACSI-28) são
 * normativos/comparativos, sem ponto de corte clínico validado na literatura,
 * então ficam com sinal neutro + aviso explícito em vez de um limiar inventado.
 */
const INSTRUMENTOS_PSI = [
  {
    id: "HAM-A",
    nome: "HAM-A — Escala de Ansiedade de Hamilton",
    campos: ["Ansiedade Psíquica", "Ansiedade Somática", "Total"],
    campoTotal: "Total",
    corteInfo: "Corte clínico publicado (Hamilton, 1959): até 17 = leve, 18–24 = leve-moderada, 25–30 = moderada-grave, acima de 30 = grave.",
    calcularSinal(total) {
      if (typeof total !== "number") return "neutro";
      if (total > 24) return "vermelho";
      if (total >= 18) return "amarelo";
      return "verde";
    },
    labelFaixa(total) {
      if (typeof total !== "number") return "—";
      if (total > 30) return "Grave";
      if (total > 24) return "Moderada-grave";
      if (total >= 18) return "Leve-moderada";
      return "Leve";
    },
  },
  {
    id: "CSAI-2R",
    nome: "CSAI-2R — Ansiedade competitiva",
    campos: ["Ans. Cognitiva", "Ans. Somática", "Autoconfiança"],
    campoTotal: null,
    corteInfo: "Instrumento normativo/comparativo, sem corte clínico validado publicado. Útil pra acompanhar variação individual e comparação com o elenco.",
    calcularSinal() { return "neutro"; },
  },
  {
    id: "SAS",
    nome: "SAS — Sport Anxiety Scale",
    campos: ["Somática", "Preocupação", "Concentração"],
    campoTotal: null,
    corteInfo: "Instrumento normativo, sem corte clínico validado publicado.",
    calcularSinal() { return "neutro"; },
  },
  {
    id: "ACSI-28",
    nome: "ACSI-28 — Inventário de habilidades de enfrentamento",
    campos: ["Enfrentamento de Adversidade", "Treinabilidade", "Concentração", "Confiança", "Metas", "Pressão"],
    campoTotal: null,
    corteInfo: "Instrumento normativo, sem corte clínico validado publicado.",
    calcularSinal() { return "neutro"; },
  },
];

function instrumentoPsiPorId(id) {
  return INSTRUMENTOS_PSI.find((i) => i.id === id) || null;
}

/**
 * Normas clínicas reais, por "instrumento:campo" (média/desvio-padrão de uma
 * amostra normativa publicada, com fonte). Fica vazio até alguém cadastrar
 * uma norma real — enquanto isso, a comparação cai automaticamente pro
 * percentil do elenco (ver normalizarMetrica), então nada aqui é inventado.
 */
const NORMAS_PSI = {
  // Formato esperado, se uma norma real for adicionada no futuro:
  // "HAM-A:Total": { media: 12.5, desvioPadrao: 6.2, fonte: "Hamilton, 1959 — amostra clínica" },
};

/** Normaliza 0–100 usando norma clínica real quando cadastrada; senão cai pro min/max do elenco (comportamento anterior). */
function normalizarMetrica(dados, metricaId, valor) {
  const [categoria, nome] = metricaId.split(/:(.+)/);
  if (categoria === "psi") {
    const fontes = CONSTRUCTOS_PSI[nome] || [];
    for (const f of fontes) {
      const norma = NORMAS_PSI[f.tipo + ":" + f.campo];
      if (norma) {
        const z = norma.desvioPadrao ? (valor - norma.media) / norma.desvioPadrao : 0;
        return { valor: Math.max(0, Math.min(100, 50 + z * 20)), fonte: "norma", detalheFonte: norma.fonte };
      }
    }
  }
  const { min, max } = faixaDaMetrica(dados, metricaId);
  return { valor: normalizar(valor, min, max), fonte: "elenco" };
}

/** Compara as duas avaliações mais recentes do mesmo instrumento pra um atleta e sinaliza variação relevante. */
function calcularVariacaoInstrumento(registrosAtletaPsi, instrumentoId) {
  const regs = (registrosAtletaPsi || [])
    .filter((r) => r.instrumento_id === instrumentoId || r.tipo === instrumentoId)
    .slice()
    .sort((a, b) => (b.data || "").localeCompare(a.data || ""));
  if (regs.length < 2) return null;
  const inst = instrumentoPsiPorId(instrumentoId);
  const campoRef = inst && inst.campoTotal;
  const extrair = (r) => {
    if (typeof r.valor_total === "number") return r.valor_total;
    if (campoRef) {
      const v = parseNota(r.nota, r.tipo).campos[campoRef];
      return typeof v === "number" ? v : null;
    }
    return null;
  };
  const atual = extrair(regs[0]);
  const anterior = extrair(regs[1]);
  if (typeof atual !== "number" || typeof anterior !== "number") return null;
  const delta = atual - anterior;
  const percentual = anterior !== 0 ? (delta / Math.abs(anterior)) * 100 : (delta !== 0 ? 100 : 0);
  const mudouFaixa = inst && inst.labelFaixa ? inst.labelFaixa(atual) !== inst.labelFaixa(anterior) : false;
  const relevante = Math.abs(percentual) >= 30 || mudouFaixa;
  return { atual, anterior, delta, percentual, mudouFaixa, relevante, dataAtual: regs[0].data, dataAnterior: regs[1].data, instrumento: inst };
}

/** Todas as variações relevantes (do instrumento mais recente lançado) por atleta — pra alertas no painel. */
function variacoesRelevantesPsi(registrosPsi) {
  const alertas = [];
  Object.entries(registrosPsi || {}).forEach(([atletaId, regs]) => {
    const instrumentosDoAtleta = Array.from(new Set(regs.map((r) => r.instrumento_id || r.tipo).filter((t) => instrumentoPsiPorId(t))));
    instrumentosDoAtleta.forEach((instId) => {
      const v = calcularVariacaoInstrumento(regs, instId);
      if (v && v.relevante) alertas.push({ atletaId, ...v });
    });
  });
  return alertas;
}

/** Dias desde a última avaliação de psicologia de um atleta (null se nunca avaliado). */
function diasDesdeUltimaAvaliacaoPsi(registrosAtleta) {
  if (!registrosAtleta || registrosAtleta.length === 0) return null;
  return calcularDiasEntre(registrosAtleta[0].data);
}

function DadosPorConstruto({ dados }) {
  const { useState } = React;

  const construtos = construtosDisponiveis(dados);
  const [construto, setConstruto] = useState(construtos[0] || "");
  const fontes = fontesDoConstruto(dados, construto);

  const registros = dados.atletas
    .map((a) => {
      const porFonte = {};
      fontes.forEach(({ tipo, campo }) => {
        const reg = (dados.psiData[a.id] || []).filter((r) => r.tipo === tipo).sort((x, y) => y.data.localeCompare(x.data))[0];
        if (reg) {
          const v = parseNota(reg.nota, reg.tipo).campos[campo];
          if (typeof v === "number") porFonte[tipo] = v;
        }
      });
      if (Object.keys(porFonte).length === 0) return null;
      return { atleta: nomeExibicao(a), porFonte };
    })
    .filter(Boolean);

  const labels = registros.map((r) => r.atleta);
  const datasets = fontes.map((f, i) => ({
    label: semTravessao(f.tipo),
    backgroundColor: PALETA_SUBESCALAS[i % PALETA_SUBESCALAS.length],
    data: registros.map((r) => (typeof r.porFonte[f.tipo] === "number" ? r.porFonte[f.tipo] : null)),
  }));

  if (construtos.length === 0) {
    return <div className="empty-state">Nenhum dado de psicologia lançado ainda.</div>;
  }

  return (
    <div>
      <div className="chart-controls">
        <TabSelect opcoes={construtos} valor={construto} onChange={setConstruto} />
        <span className="chart-controls-note">
          {fontes.length > 1
            ? `Medido por ${fontes.length} instrumentos diferentes (${fontes.map(f => semTravessao(f.tipo)).join(", ")}): barras separadas por instrumento, sem misturar escalas.`
            : fontes[0] ? `Fonte: ${fontes[0].tipo}` : ""}
        </span>
      </div>
      {registros.length === 0 ? (
        <div className="empty-state">Nenhum atleta com esse construto lançado.</div>
      ) : (
        <div className="chart-box-wide">
          <canvas ref={el => renderizarBarras(el, labels, datasets)}></canvas>
        </div>
      )}
    </div>
  );
}


function DadosPorEstatistica({ dados }) {
  const { useState } = React;

  const stats = Array.from(new Set(
    Object.values(dados.perfData).flat().flatMap(r => Object.keys(parseNota(r.nota, r.tipo).campos))
  )).sort();
  const [stat, setStat] = useState(stats.includes("AÇÃO COM BOLA") ? "AÇÃO COM BOLA" : (stats[0] || ""));

  const registros = dados.atletas
    .map(a => {
      const regs = dados.perfData[a.id] || [];
      if (!regs.length) return null;
      const campos = parseNota(regs[0].nota).campos;
      const valor = campos[stat];
      return typeof valor === "number" ? { atleta: nomeExibicao(a), valor } : null;
    })
    .filter(Boolean)
    .sort((a, b) => b.valor - a.valor);

  if (stats.length === 0) {
    return <div className="empty-state">Nenhum dado de performance lançado ainda.</div>;
  }

  const labels = registros.map(r => r.atleta);
  const datasets = [{ label: stat, backgroundColor: COR_SERIE, data: registros.map(r => r.valor), maxBarThickness: 28 }];

  return (
    <div>
      <div className="chart-controls">
        <TabSelect opcoes={stats} valor={stat} onChange={setStat} />
        <span className="chart-controls-note">{registros.length} atleta{registros.length === 1 ? "" : "s"} com essa estatística no jogo mais recente, ordenado do maior pro menor</span>
      </div>
      {registros.length === 0 ? (
        <div className="empty-state">Nenhum atleta com essa estatística lançada.</div>
      ) : (
        <div className="chart-box chart-box-wide">
          <canvas ref={el => renderizarBarras(el, labels, datasets)}></canvas>
        </div>
      )}
    </div>
  );
}

function renderizarBarras(canvas, labels, datasets) {
  if (!canvas) return;
  if (canvas._chartInstance) canvas._chartInstance.destroy();
  canvas._chartInstance = new Chart(canvas, {
    type: "bar",
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: datasets.length > 1, labels: { font: { size: 10.5 } } } },
      scales: {
        x: { ticks: { font: { size: 10.5 }, maxRotation: 45, minRotation: 0 } },
        y: { beginAtZero: true, ticks: { precision: 0, font: { size: 10.5 } } },
      },
    },
  });
}

function EixoPicker({ label, dados, config, onChange }) {
  const areas = ["Psicologia", "Desempenho"];
  const construtos = construtosDisponiveis(dados);
  const stats = estatisticasPerformance(dados);

  function setArea(area) {
    if (area === "Psicologia") {
      onChange({ area, construto: construtos[0] || "", estatistica: "" });
    } else {
      onChange({ area, construto: "", estatistica: stats[0] || "" });
    }
  }

  return (
    <div className="eixo-picker">
      <div className="eixo-label">{label}</div>
      <TabSelect opcoes={areas} valor={config.area} onChange={setArea} tamanho="sm" />
      {config.area === "Psicologia" ? (
        <TabSelect opcoes={construtos} valor={config.construto} onChange={(c) => onChange({ ...config, construto: c })} tamanho="sm" />
      ) : (
        <TabSelect opcoes={stats} valor={config.estatistica} onChange={(e) => onChange({ ...config, estatistica: e })} tamanho="sm" />
      )}
    </div>
  );
}

function valorDoEixo(dados, atletaId, config) {
  if (config.area === "Psicologia") {
    const r = valorConstrutoAtleta(dados, atletaId, config.construto);
    return r ? r.valor : null;
  }
  return valorPerformance(dados, atletaId, config.estatistica);
}

function labelDoEixo(config) {
  if (config.area === "Psicologia") return config.construto;
  return config.estatistica;
}

function CruzamentoDados({ dados }) {
  const { useState, useRef, useEffect } = React;
  const construtosIniciais = construtosDisponiveis(dados);
  const statsIniciais = estatisticasPerformance(dados);

  const [eixoX, setEixoX] = useState({
    area: "Psicologia",
    construto: construtosIniciais[0] || "",
    estatistica: "",
  });
  const [eixoY, setEixoY] = useState({
    area: "Desempenho",
    construto: "",
    estatistica: statsIniciais[0] || "",
  });

  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  const pontosBrutos = dados.atletas
    .map((a) => {
      const x = valorDoEixo(dados, a.id, eixoX);
      const y = valorDoEixo(dados, a.id, eixoY);
      if (typeof x !== "number" || typeof y !== "number") return null;
      const fonteX = eixoX.area === "Psicologia" ? (valorConstrutoAtleta(dados, a.id, eixoX.construto) || {}).instrumento : null;
      const fonteY = eixoY.area === "Psicologia" ? (valorConstrutoAtleta(dados, a.id, eixoY.construto) || {}).instrumento : null;
      return { x, y, nome: nomeExibicao(a), fonteX, fonteY };
    })
    .filter(Boolean);

  // Agrupa atletas que caem exatamente no mesmo ponto (x,y) pra mostrar quantos são, em vez de esconder uns atrás dos outros.
  const mapaPontos = {};
  pontosBrutos.forEach((p) => {
    const chave = `${p.x}|${p.y}`;
    if (!mapaPontos[chave]) mapaPontos[chave] = { x: p.x, y: p.y, atletas: [] };
    mapaPontos[chave].atletas.push({ nome: p.nome, fonteX: p.fonteX, fonteY: p.fonteY });
  });
  const pontos = Object.values(mapaPontos);

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();

    const contagemPlugin = {
      id: "contagemPontos",
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        const meta = chart.getDatasetMeta(0);
        meta.data.forEach((elemento, i) => {
          const ponto = pontos[i];
          if (!ponto || ponto.atletas.length < 2) return;
          const pos = elemento.tooltipPosition ? elemento.tooltipPosition() : elemento;
          ctx.save();
          ctx.font = "bold 10px sans-serif";
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(String(ponto.atletas.length), pos.x, pos.y);
          ctx.restore();
        });
      },
    };

    chartRef.current = new Chart(canvasRef.current, {
      type: "scatter",
      data: {
        datasets: [{
          label: `${labelDoEixo(eixoX)} × ${labelDoEixo(eixoY)}`,
          data: pontos,
          backgroundColor: "rgba(42,120,214,0.78)",
          borderColor: "#FFFFFF",
          borderWidth: 2,
          pointRadius: (ctx) => {
            const c = ctx.raw && ctx.raw.atletas ? ctx.raw.atletas.length : 1;
            return Math.min(6 + (c - 1) * 2.5, 16);
          },
          pointHoverRadius: (ctx) => {
            const c = ctx.raw && ctx.raw.atletas ? ctx.raw.atletas.length : 1;
            return Math.min(8 + (c - 1) * 2.5, 18);
          },
        }],
      },
      plugins: [contagemPlugin],
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const p = ctx.raw;
                return p.atletas.map((a) => {
                  const partX = a.fonteX ? `${labelDoEixo(eixoX)} (${a.fonteX}) = ${p.x}` : `${labelDoEixo(eixoX)} = ${p.x}`;
                  const partY = a.fonteY ? `${labelDoEixo(eixoY)} (${a.fonteY}) = ${p.y}` : `${labelDoEixo(eixoY)} = ${p.y}`;
                  return `${a.nome}: ${partX}, ${partY}`;
                });
              },
            },
          },
        },
        scales: {
          x: { title: { display: true, text: labelDoEixo(eixoX), font: { size: 11 } }, ticks: { font: { size: 10.5 } } },
          y: { title: { display: true, text: labelDoEixo(eixoY), font: { size: 11 } }, ticks: { font: { size: 10.5 } } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(eixoX), JSON.stringify(eixoY), JSON.stringify(pontos)]);

  return (
    <div>
      <div className="cruzamento-eixos">
        <EixoPicker label="Eixo X" dados={dados} config={eixoX} onChange={setEixoX} />
        <div className="cruzamento-x">×</div>
        <EixoPicker label="Eixo Y" dados={dados} config={eixoY} onChange={setEixoY} />
      </div>
      {pontosBrutos.length === 0 ? (
        <div className="empty-state">Nenhum atleta tem os dois dados selecionados ao mesmo tempo. Escolha outra combinação.</div>
      ) : (
        <React.Fragment>
          <div className="chart-box-wide" style={{marginTop:14}}>
            <canvas ref={canvasRef}></canvas>
          </div>
          <div className="chart-controls-note" style={{marginTop:8}}>{pontosBrutos.length} atleta{pontosBrutos.length === 1 ? "" : "s"} com os dois valores disponíveis, em {pontos.length} ponto{pontos.length === 1 ? "" : "s"}. O número dentro do ponto mostra quantos atletas têm esse mesmo resultado; passe o mouse pra ver quem são.</div>
        </React.Fragment>
      )}
    </div>
  );
}

/** Normaliza "Sub 15" / "Sub-15" / "sub15" etc. pra comparar categorias sem depender da grafia exata. */
function normalizarCategoria(cat) {
  return (cat || "").toLowerCase().replace(/[\s-]/g, "");
}

const SIGLA_POSICAO = {
  "Goleiro": "GOL", "Lateral-direito": "LD", "Lateral-esquerdo": "LE", "Zagueiro": "ZAG",
  "Volante": "VOL", "Meia": "MEI", "Extremo": "EXT", "Atacante": "ATA",
};

/** Nome curto pra caber no campo: apelido, ou primeiro + último nome. */
function nomeCurtoAtleta(atleta) {
  if (atleta.apelido && atleta.apelido.trim()) return atleta.apelido.trim();
  const partes = (atleta.nome || "").trim().split(/\s+/);
  if (partes.length < 2) return partes[0] || "Atleta";
  const primeiroUltimo = partes[0] + " " + partes[partes.length - 1];
  return primeiroUltimo.length <= 14 ? primeiroUltimo : partes[0] + " " + partes[partes.length - 1][0] + ".";
}

function iniciaisAtleta(atleta) {
  return (atleta.nome || "?").split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase();
}

/** Semáforo + disponibilidade de cada atleta (a disponibilidade só entra pra quem vê Medicina e Fisioterapia). */
function atletasComSinais(dados, usuario) {
  const comDisp = !usuario || podeVerDisponibilidade(usuario);
  return dados.atletas.map((a) => ({ ...a, ...calcularSemaforo(a.id, dados), disp: comDisp ? calcularDisponibilidade(a.id, dados) : null }));
}

/** Elenco desenhado num campo de futebol, linha por linha (ataque no alto, goleiro embaixo),
 *  com foto, nome e o sinal de cada atleta: semáforo das áreas ou disponibilidade pro jogo. */
function ElencoPorPosicao({ atletasComSinal, onOpenAtleta, modoInicial }) {
  const { useState } = React;
  const times = [
    { id: "sub15", label: "Sub-15" },
    { id: "sub17", label: "Sub-17" },
  ];
  const [timeAtivo, setTimeAtivo] = useState("sub15");
  const temDisp = atletasComSinal.some((a) => a.disp);
  const [modo, setModo] = useState(modoInicial === "disponibilidade" ? "disponibilidade" : "semaforo");
  const verDisp = modo === "disponibilidade" && temDisp;

  const doTime = atletasComSinal.filter((a) => normalizarCategoria(a.categoria) === timeAtivo);
  const semTime = atletasComSinal.filter((a) => !["sub15", "sub17"].includes(normalizarCategoria(a.categoria)));
  const { linhas, semPosicao } = montarLinhasCampo(doTime);
  const banco = [...semPosicao, ...semTime];
  const contagemDisp = { disponivel: 0, restricao: 0, fora: 0 };
  doTime.forEach((a) => { if (a.disp) contagemDisp[a.disp.status]++; });

  function rotuloSinal(r) { return r === "verde" ? "Regular" : r === "amarelo" ? "Atenção" : r === "vermelho" ? "Prioridade" : "Sem sinal"; }
  function sinalDe(d) { return verDisp && d.disp ? DISPONIBILIDADE[d.disp.status].sinal : d.risco; }

  function Jogador(d) {
    const outras = [d.posicao_secundaria, d.posicao_terciaria].filter(Boolean).join(" / ");
    const situacao = verDisp && d.disp ? DISPONIBILIDADE[d.disp.status].label + (d.disp.motivos.length ? ": " + d.disp.motivos.join("; ") : "") : rotuloSinal(d.risco);
    const dica = `${d.nome}${d.posicao ? " · " + d.posicao : ""}${outras ? " (também joga: " + outras + ")" : ""} · ${situacao}`;
    return (
      <button key={d.id} type="button" className={"jogador" + (verDisp && d.disp && d.disp.status === "fora" ? " fora" : "")} onClick={() => onOpenAtleta(d.id)} title={dica} aria-label={dica}>
        <span className="jogador-foto">
          {d.foto ? <img loading="lazy" decoding="async" src={d.foto} alt="" /> : iniciaisAtleta(d)}
          <span className={"jogador-sinal " + sinalDe(d)}></span>
        </span>
        <span className="jogador-nome">{nomeCurtoAtleta(d)}</span>
        <span className="jogador-pos">{SIGLA_POSICAO[d.posicao] || ""}{outras ? " +" : ""}</span>
        {verDisp && <PillDisponibilidade disp={d.disp} />}
      </button>
    );
  }

  return (
    <div className="pitch-panel">
      <div className="pitch-head">
        <div>
          <h3>Elenco em campo</h3>
          <div className="sub">{verDisp ? "Disponibilidade pro jogo, calculada pela Medicina e pela Fisioterapia" : "Toque em um jogador para abrir o perfil completo"}</div>
        </div>
        <div className="pitch-controles">
          {temDisp && (
            <div className="pitch-modo" role="group" aria-label="O que o ponto de cada jogador mostra">
              <button type="button" className={modo === "semaforo" ? "active" : ""} aria-pressed={modo === "semaforo"} onClick={() => setModo("semaforo")}>Semáforo</button>
              <button type="button" className={modo === "disponibilidade" ? "active" : ""} aria-pressed={modo === "disponibilidade"} onClick={() => setModo("disponibilidade")}>Disponibilidade</button>
            </div>
          )}
          {times.map((t) => {
            const qtd = atletasComSinal.filter((a) => normalizarCategoria(a.categoria) === t.id).length;
            return (
              <button key={t.id} type="button" className={"pitch-chip" + (timeAtivo === t.id ? " active" : "")} onClick={() => setTimeAtivo(t.id)}>
                {t.label}<span className="qtd">{qtd}</span>
              </button>
            );
          })}
        </div>
      </div>

      <div className="pitch-campo">
        <div className="pitch-marcas" aria-hidden="true">
          <div className="area topo"></div><div className="pequena topo"></div>
          <div className="meio"></div><div className="circulo"></div>
          <div className="area base"></div><div className="pequena base"></div>
        </div>
        {linhas.length === 0 ? (
          <div className="empty-state" style={{ color: "rgba(255,255,255,0.8)", position: "relative" }}>Nenhum atleta com posição definida neste time ainda.</div>
        ) : linhas.map((l) => (
          <div className="pitch-linha" key={l.id}>
            <div className="pitch-linha-rotulo">{l.label}<span>{l.atletas.length}</span></div>
            <div className="pitch-linha-jogadores">{l.atletas.map(Jogador)}</div>
          </div>
        ))}
      </div>

      <div className="pitch-rodape">
        <div className="pitch-banco">
          {banco.length > 0 && (
            <React.Fragment>
              <div className="pitch-banco-titulo">Banco · sem posição ou time definido ({banco.length})</div>
              <div className="pitch-banco-lista">
                {banco.map((d) => (
                  <button key={d.id} type="button" className="banco-jogador" onClick={() => onOpenAtleta(d.id)} title={d.nome}>
                    <span className="mini">{d.foto ? <img loading="lazy" decoding="async" src={d.foto} alt="" /> : iniciaisAtleta(d)}</span>
                    {nomeCurtoAtleta(d)}
                    <span className={"ponto " + sinalDe(d)}></span>
                  </button>
                ))}
              </div>
            </React.Fragment>
          )}
        </div>
        {verDisp ? <LegendaDisponibilidade contagem={contagemDisp} /> : (
          <div className="pitch-legenda" aria-label="Legenda do semáforo">
            <span><i style={{ background: "var(--st-good)" }}></i>Regular</span>
            <span><i style={{ background: "var(--st-warn)" }}></i>Atenção</span>
            <span><i style={{ background: "var(--st-crit)" }}></i>Prioridade</span>
          </div>
        )}
      </div>
    </div>
  );
}

/**
 * Elenco compartilhado — acessível de qualquer módulo, pra qualquer
 * usuário logado navegar o time e abrir o perfil de um atleta. Os dados
 * de cada área só carregam se a pessoa tiver permissão naquela área
 * (carregarPermitido cuida disso); o resto do perfil simplesmente não
 * aparece pra quem não pode ver.
 */
function ViewElenco({ usuario }) {
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState(null);
  const [atletaAberto, abrirAtleta, fecharAtleta] = usePerfilAberto();

  function recarregar() {
    return carregarPermitido(usuario).then(setDados).catch(e => setErro(e.message));
  }

  useEffect(() => { recarregar(); }, []);

  if (erro) {
    return <div className="page"><ErroCarregamento mensagem={erro} /></div>;
  }
  if (!dados) {
    return <div className="page"><Carregando /></div>;
  }

  const linha = atletasComSinais(dados, usuario);

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>{atletaAberto ? "Perfil do atleta" : "Elenco"}</h1>
          <div className="crumb">MeuCT · Meia Noite EC</div>
        </div>
      </div>

      {atletaAberto ? (
        <PerfilAtleta atletaId={atletaAberto} onBack={fecharAtleta} dados={dados} onRecarregar={recarregar} usuario={usuario} />
      ) : (
        <React.Fragment>
          {podeGerenciarAtletas(usuario) ? (
            <ListaAtletas dados={dados} onOpenAtleta={abrirAtleta} onRecarregar={recarregar} usuario={usuario} />
          ) : (
            <ElencoPorPosicao atletasComSinal={linha} onOpenAtleta={abrirAtleta} />
          )}
        </React.Fragment>
      )}
    </div>
  );
}

/** Painel geral: só o essencial do dia a dia. Semáforo do elenco, próximo jogo,
 *  compromissos da semana, pendências, atletas em prioridade e últimas novidades. */
function Dashboard({ dados, usuario, onOpenAtleta, onNavigate }) {
  const hoje = hojeISO();
  const [eventos, setEventos] = useState(null);
  const [novidades, setNovidades] = useState(null);

  useEffect(() => {
    let vivo = true;
    carregarEventos().then((l) => { if (vivo) setEventos(l); }).catch(() => { if (vivo) setEventos([]); });
    lerComCache("atualizacoes:4", () => carregarAtualizacoes(4))
      .then((l) => { if (vivo) setNovidades(l); })
      .catch(() => { if (vivo) setNovidades([]); });
    return () => { vivo = false; };
  }, []);

  const linha = atletasComSinais(dados, usuario);
  const contagem = { verde: 0, amarelo: 0, vermelho: 0 };
  linha.forEach((d) => contagem[d.risco]++);
  const prioridade = linha.filter((d) => d.risco === "vermelho").sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));

  const ate = isoMaisDias(hoje, 7);
  const proximoJogo = (eventos || []).find((e) => e.tipo === "jogo" && e.data >= hoje);
  const semana = (eventos || []).filter((e) => e.data >= hoje && e.data <= ate);
  const lembretes = eventos ? calcularLembretes(dados, usuario, eventos, hoje) : [];
  const ir = (pagina) => onNavigate && onNavigate(pagina);

  function abrirLembrete(l) {
    if (l.eventoId) convocacaoPendente = l.eventoId;
    ir(l.pagina);
  }

  const convocados = proximoJogo && proximoJogo.convocacao
    ? (proximoJogo.convocacao.titulares || []).length + (proximoJogo.convocacao.reservas || []).length
    : 0;

  return (
    <div>
      <div className="kpi-row">
        <div className="kpi-card"><div className="label">Atletas</div><div className="value">{dados.atletas.length}</div></div>
        <div className="kpi-card acento-verde"><div className="label">Sem alerta</div><div className="value verde">{contagem.verde}</div></div>
        <div className="kpi-card acento-amarelo"><div className="label">Atenção</div><div className="value amarelo">{contagem.amarelo}</div></div>
        <div className="kpi-card acento-vermelho"><div className="label">Prioridade</div><div className="value vermelho">{contagem.vermelho}</div></div>
      </div>

      <ElencoPorPosicao atletasComSinal={linha} onOpenAtleta={onOpenAtleta} />

      <div className="inicio-grid">
        <div className="inicio-coluna">
          <div className="panel">
            <div className="panel-head"><h3>Próximo jogo</h3><button type="button" className="pill-btn" onClick={() => ir("jogos")}>Jogos</button></div>
            {!eventos ? (
              <div className="inicio-vazio">Carregando...</div>
            ) : !proximoJogo ? (
              <div className="inicio-vazio">Nenhum jogo marcado.</div>
            ) : (
              <div className="inicio-jogo">
                <span className="proximo-data"><b>{Number(proximoJogo.data.slice(8))}</b>{diaSemanaCurto(proximoJogo.data)}</span>
                <div className="inicio-jogo-info">
                  <b>{tituloEvento(proximoJogo)}</b>
                  <span>{[dataCurta(proximoJogo.data) + (proximoJogo.hora ? " às " + proximoJogo.hora : ""), labelCategoriaEvento(proximoJogo.categoria), proximoJogo.mando === "fora" ? "Fora de casa" : "Em casa", proximoJogo.local, proximoJogo.competicao].filter(Boolean).join(" · ")}</span>
                  <span className={"inicio-jogo-conv" + (convocados ? "" : " pendente")}>{convocados ? convocados + " convocados" : "Convocação pendente"}</span>
                </div>
              </div>
            )}
          </div>

          <div className="panel">
            <div className="panel-head"><h3>Próximos 7 dias</h3><button type="button" className="pill-btn" onClick={() => ir("agenda")}>Agenda</button></div>
            {!eventos ? (
              <div className="inicio-vazio">Carregando...</div>
            ) : semana.length === 0 ? (
              <div className="inicio-vazio">Nada marcado para os próximos dias.</div>
            ) : (
              <div className="inicio-lista">
                {semana.slice(0, 8).map((e) => (
                  <button type="button" key={e.id} className={"inicio-evento tipo-" + e.tipo} onClick={() => ir(e.tipo === "jogo" ? "jogos" : "agenda")}>
                    <span className="inicio-evento-dia">{e.data === hoje ? "Hoje" : diaSemanaCurto(e.data) + " " + dataCurta(e.data)}<small>{e.hora || ""}</small></span>
                    <span className="inicio-evento-texto"><b>{tituloEvento(e)}</b><small>{[labelTipoEvento(e.tipo), labelCategoriaEvento(e.categoria), e.local].filter(Boolean).join(" · ")}</small></span>
                  </button>
                ))}
                {semana.length > 8 && <button type="button" className="link-btn inicio-mais" onClick={() => ir("agenda")}>Mais {semana.length - 8} na agenda</button>}

          <PainelLembretes itens={lembretes} onAbrir={abrirLembrete} />

        <div className="inicio-coluna">
          <div className="panel">
            <div className="panel-head alerta"><h3>Atletas em prioridade</h3><span className="muted" style={{ fontSize: 12 }}>{prioridade.length}</span></div>
            {prioridade.length === 0 ? (
              <div className="inicio-vazio">Nenhum atleta em prioridade.</div>
            ) : (
              <div className="inicio-lista">
                {prioridade.slice(0, 8).map((d) => (
                  <button type="button" key={d.id} className="inicio-atleta" onClick={() => onOpenAtleta(d.id)}>
                    <span className="inicio-avatar">{d.foto ? <img loading="lazy" decoding="async" src={d.foto} alt="" /> : iniciaisAtleta(d)}</span>
                    <span className="inicio-evento-texto"><b>{nomeExibicao(d)}</b><small>{[d.categoria, d.sinais.map((x) => x.label).join(", ")].filter(Boolean).join(" · ")}</small></span>
                  </button>
                ))}
                {prioridade.length > 8 && <button type="button" className="link-btn inicio-mais" onClick={() => ir("elenco")}>Ver os outros {prioridade.length - 8} no Elenco</button>}

          </div>

          <div className="panel">
            <div className="panel-head"><h3>Novidades</h3><button type="button" className="pill-btn" onClick={() => ir("atualizacoes")}>Ver todas</button></div>
            {!novidades ? (
              <div className="inicio-vazio">Carregando...</div>
            ) : novidades.length === 0 ? (
              <div className="inicio-vazio">Nenhuma novidade publicada.</div>
            ) : (
              <div className="inicio-lista">
                {novidades.map((n) => (
                  <button type="button" key={n.id} className="inicio-novidade" onClick={() => ir("atualizacoes")}>
                    <small>{formatarDataHoraAtualizacao(n.criadoEm)}</small>
                    <b>{n.titulo}</b>
                    {n.descricao && <span>{n.descricao.length > 140 ? n.descricao.slice(0, 140).trim() + "..." : n.descricao}</span>}
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Ficha do atleta — criar/editar ---------- */

function calcularIdade(dataNascimento) {
  if (!dataNascimento) return null;
  const [ano, mes, dia] = dataNascimento.split("-").map(Number);
  const hoje = new Date();
  let idade = hoje.getFullYear() - ano;
  const aindaNaoFezAniversario = hoje.getMonth() + 1 < mes || (hoje.getMonth() + 1 === mes && hoje.getDate() < dia);
  if (aindaNaoFezAniversario) idade--;
  return idade;
}

function FormClube({ clube, onChange, onRemover }) {
  return (
    <div className="clube-row">
      <input type="text" placeholder="Nome do clube" value={clube.clube || ""} onChange={(e) => onChange({ ...clube, clube: e.target.value })} />
      <input type="date" value={clube.inicio || ""} onChange={(e) => onChange({ ...clube, inicio: e.target.value })} />
      <input type="date" value={clube.fim || ""} onChange={(e) => onChange({ ...clube, fim: e.target.value })} placeholder="Atual" />
      <button type="button" className="pill-btn" onClick={onRemover}>Remover</button>
    </div>
  );
}

const POSICOES = ["Goleiro", "Lateral-direito", "Lateral-esquerdo", "Zagueiro", "Volante", "Meia", "Extremo", "Atacante"];

function FormAtleta({ atleta, onSalvar, onCancelar }) {
  const { useState } = React;
  const [nome, setNome] = useState(atleta ? atleta.nome : "");
  const [apelido, setApelido] = useState(atleta ? atleta.apelido || "" : "");
  const [categoria, setCategoria] = useState(atleta ? atleta.categoria || "" : "");
  const [posicao, setPosicao] = useState(atleta ? atleta.posicao || "" : "");
  const [posicaoSecundaria, setPosicaoSecundaria] = useState(atleta ? atleta.posicao_secundaria || "" : "");
  const [posicaoTerciaria, setPosicaoTerciaria] = useState(atleta ? atleta.posicao_terciaria || "" : "");
  const [dataNascimento, setDataNascimento] = useState(atleta ? atleta.data_nascimento || "" : "");
  const [localidade, setLocalidade] = useState(atleta ? atleta.localidade || "" : "");
  const [pernaDominante, setPernaDominante] = useState(atleta ? atleta.perna_dominante || "" : "");
  const [acertoDireita, setAcertoDireita] = useState(atleta && atleta.percentual_acerto_perna_direita != null ? String(atleta.percentual_acerto_perna_direita) : "");
  const [acertoEsquerda, setAcertoEsquerda] = useState(atleta && atleta.percentual_acerto_perna_esquerda != null ? String(atleta.percentual_acerto_perna_esquerda) : "");
  const [clubes, setClubes] = useState(atleta && atleta.historico_clubes ? atleta.historico_clubes : []);
  const [tipoSanguineo, setTipoSanguineo] = useState(atleta ? atleta.tipo_sanguineo || "" : "");
  const [alergias, setAlergias] = useState(atleta ? atleta.alergias || "" : "");
  const [condicoesCronicas, setCondicoesCronicas] = useState(atleta ? atleta.condicoes_cronicas || "" : "");
  const [medicacoesContinuas, setMedicacoesContinuas] = useState(atleta ? atleta.medicacoes_continuas || "" : "");
  const [contatoEmergenciaNome, setContatoEmergenciaNome] = useState(atleta ? atleta.contato_emergencia_nome || "" : "");
  const [contatoEmergenciaTelefone, setContatoEmergenciaTelefone] = useState(atleta ? atleta.contato_emergencia_telefone || "" : "");
  const [salvando, setSalvando] = useState(false);

  function atualizarClube(i, novo) {
    setClubes((prev) => prev.map((c, idx) => (idx === i ? novo : c)));
  }
  function removerClube(i) {
    setClubes((prev) => prev.filter((_, idx) => idx !== i));
  }
  function adicionarClube() {
    setClubes((prev) => [...prev, { clube: "", inicio: "", fim: "" }]);
  }

  async function handleSubmit() {
    if (!nome.trim() || salvando) return;

function MesclarAtletas({ atletas, onMesclado }) {
  const { useState } = React;
  const [idA, setIdA] = useState("");
  const [idB, setIdB] = useState("");
  const [canonico, setCanonico] = useState("");
  const [mesclando, setMesclando] = useState(false);
  const [erro, setErro] = useState(null);

  async function confirmarMescla() {
    if (!idA || !idB || idA === idB || !canonico) return;
    setMesclando(true);
    setErro(null);
    try {
      const duplicadoId = canonico === idA ? idB : idA;
      const canonicoId = canonico;
      for (const subcol of Object.values(SUBCOLS)) {
        const snap = await db.collection(COL_ATLETAS).doc(duplicadoId).collection(subcol).get();
        for (const doc of snap.docs) {
          await db.collection(COL_ATLETAS).doc(canonicoId).collection(subcol).add(doc.data());
          await doc.ref.delete();
        }
      }
      await db.collection(COL_ATLETAS).doc(canonicoId).update({ pendente_vinculo: false });
      await db.collection(COL_ATLETAS).doc(duplicadoId).delete();
      setIdA(""); setIdB(""); setCanonico("");
      onMesclado();
    } catch (e) {
      setErro(e.message);
    }
    setMesclando(false);
  }

  const atletaA = atletas.find((a) => a.id === idA);
  const atletaB = atletas.find((a) => a.id === idB);

  return (
    <div className="form-panel">
      <div className="form-grid">
        <div className="field">
          <label>Atleta 1</label>
          <select value={idA} onChange={(e) => { setIdA(e.target.value); setCanonico(""); }}>
            <option value="">Selecione...</option>
            {atletas.map((a) => <option key={a.id} value={a.id}>{nomeExibicao(a)}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Atleta 2</label>
          <select value={idB} onChange={(e) => { setIdB(e.target.value); setCanonico(""); }}>
            <option value="">Selecione...</option>
            {atletas.map((a) => <option key={a.id} value={a.id}>{nomeExibicao(a)}</option>)}
          </select>
        </div>
      </div>
      {idA && idB && idA !== idB && (
        <div className="field" style={{marginBottom:14}}>
          <label>Qual nome fica? (o outro é apagado e o histórico é movido pra este)</label>
          <div className="sinal-picker">
            <div className={"sinal-opt verde" + (canonico === idA ? " on" : "")} onClick={() => setCanonico(idA)}>{atletaA.nome}</div>
            <div className={"sinal-opt verde" + (canonico === idB ? " on" : "")} onClick={() => setCanonico(idB)}>{atletaB.nome}</div>
          </div>
        </div>
      )}
      {erro && <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)"}}><span>{erro}</span></div>}
      <div className="form-actions">
        <button className="pill-btn primary" onClick={confirmarMescla} disabled={!canonico || mesclando}>{mesclando ? "Mesclando..." : "Confirmar mesclagem"}</button>
      </div>
      <div className="save-note"><span>Move todos os registros (psicologia, fisioterapia, fisiologia, medicina, social, desempenho) do duplicado para o nome escolhido, depois apaga o duplicado.</span></div>
    </div>
  );
}

function ConfirmarExclusao({ atleta, dados, onCancelar, onExcluido }) {
  const { useState } = React;
  const [excluindo, setExcluindo] = useState(false);
  const totalRegistros = ["psiData", "fisioData", "fisiologiaData", "medicinaData", "socialData", "perfData"]
    .reduce((soma, chave) => soma + ((dados[chave] || {})[atleta.id] || []).length, 0);

  async function confirmar() {
    setExcluindo(true);
    await excluirAtleta(atleta.id);
    onExcluido();
  }

  return (
    <div className="form-panel">
      <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)"}}>
        <span>
          <b>Excluir {nomeExibicao(atleta)}{atleta.apelido ? ` (${atleta.nome})` : ""}?</b> Isso apaga o cadastro e {totalRegistros > 0 ? <b>todos os {totalRegistros} registro(s)</b> : "nenhum registro (não tem dado lançado ainda)"} dele em todas as áreas. Não tem como desfazer.
        </span>
      </div>
      <div className="form-actions">
        <button className="pill-btn" onClick={onCancelar} disabled={excluindo}>Cancelar</button>
        <button className="pill-btn primary" style={{background:"var(--vermelho)", borderColor:"var(--vermelho)"}} onClick={confirmar} disabled={excluindo}>
          {excluindo ? "Excluindo..." : "Sim, excluir definitivamente"}
        </button>
      </div>
    </div>
  );
}

function TimelineAtleta({ atletaId, dados }) {
  const { psiData, fisioData, fisiologiaData, medicinaData, socialData, perfData } = dados;
  const juntar = (tipo, texto) => [tipo, texto].filter(Boolean).map(semTravessao).join(" · ");
  let eventos = [];
  (psiData[atletaId] || []).forEach(e => eventos.push({ area: "psi", label: "Psicologia", data: e.data, desc: juntar(e.tipo, e.nota) }));
  (fisioData[atletaId] || []).forEach(e => eventos.push({ area: "fisio", label: "Fisioterapia", data: e.data, desc: juntar(e.tipo, e.nota) }));
  (fisiologiaData[atletaId] || []).forEach(e => eventos.push({ area: "fisiologia", label: "Fisiologia", data: e.data, desc: juntar(e.tipo, e.nota) }));
  ((medicinaData || {})[atletaId] || []).forEach(e => eventos.push({ area: "medicina", label: "Medicina", data: e.data, desc: juntar(e.tipo, e.nota) }));
  (socialData[atletaId] || []).forEach(e => eventos.push({ area: "social", label: "Serviço social", data: e.data, desc: juntar(e.tipo, e.detalhe) }));
  (perfData[atletaId] || []).forEach(e => eventos.push({ area: "performance", label: "Desempenho", data: e.data, desc: juntar(e.tipo, e.nota) }));
  eventos.sort((a, b) => (b.data || "").localeCompare(a.data || ""));

  if (eventos.length === 0) return <div className="empty-state">Nenhum registro lançado para este atleta ainda.</div>;

  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  function quando(iso) {
    if (!iso) return { dia: "-", ano: "" };
    const [y, m, d] = iso.split("-");
    return { dia: `${d} ${MESES[Number(m) - 1] || ""}`, ano: y };
  }

  return (
    <div className="timeline">
      {eventos.map((e, i) => {
        const q = quando(e.data);
        return (
          <div className="tl-item" key={i}>
            <div className="tl-quando"><div className="dia">{q.dia}</div><div className="ano">{q.ano}</div></div>
            <div className="tl-rail">
              <div className={"tl-dot " + e.area}></div>
              {i < eventos.length - 1 && <div className="tl-line"></div>}
            </div>
            <div className="tl-body">
              <div className={"tl-area " + e.area}>{e.label}</div>
              <div className="tl-desc">{e.desc}</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/** Todas as métricas (construtos de psicologia + estatísticas de desempenho) que ESTE atleta tem. */
function metricasDisponiveisAtleta(dados, atletaId) {
  const metricas = [];
  construtosDisponiveis(dados).forEach((construto) => {
    const r = valorConstrutoAtleta(dados, atletaId, construto);
    if (r) metricas.push({ id: "psi:" + construto, nome: construto, categoria: "psi" });
  });
  estatisticasPerformance(dados).forEach((stat) => {
    const v = valorPerformance(dados, atletaId, stat);
    if (typeof v === "number") metricas.push({ id: "desempenho:" + stat, nome: stat, categoria: "desempenho" });
  });
  return metricas;
}

/** Valor bruto de uma métrica (pelo id "psi:Nome" ou "desempenho:Nome") para um atleta. */
function valorDaMetrica(dados, atletaId, metricaId) {
  const [categoria, nome] = metricaId.split(/:(.+)/);
  if (categoria === "psi") {
    const r = valorConstrutoAtleta(dados, atletaId, nome);
    return r ? r.valor : null;
  }
  return valorPerformance(dados, atletaId, nome);
}

/** Min/max dessa métrica entre TODOS os atletas que a têm — base da normalização. */
function faixaDaMetrica(dados, metricaId) {
  const valores = dados.atletas
    .map((a) => valorDaMetrica(dados, a.id, metricaId))
    .filter((v) => typeof v === "number");
  if (valores.length === 0) return { min: 0, max: 1 };
  return { min: Math.min(...valores), max: Math.max(...valores) };
}

function normalizar(valor, min, max) {
  if (max === min) return 50;
  return ((valor - min) / (max - min)) * 100;
}

function RadarAtleta({ dados, atletaId }) {
  const { useState, useRef, useEffect } = React;
  const metricas = metricasDisponiveisAtleta(dados, atletaId);
  const [selecionadas, setSelecionadas] = useState(metricas.slice(0, 6).map((m) => m.id));
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  function toggle(id) {
    setSelecionadas((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  }

  const ativas = metricas.filter((m) => selecionadas.includes(m.id));
  const pontos = ativas.map((m) => {
    const valor = valorDaMetrica(dados, atletaId, m.id);
    const { valor: normalizado, fonte, detalheFonte } = normalizarMetrica(dados, m.id, valor);
    return { nome: m.nome, valor, normalizado, fonte, detalheFonte };
  });
  const usaNormaReal = pontos.some((p) => p.fonte === "norma");

  useEffect(() => {
    if (!canvasRef.current || pontos.length < 3) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "radar",
      data: {
        labels: pontos.map((p) => p.nome),
        datasets: [{
          label: "Perfil (normalizado, relativo ao elenco)",
          data: pontos.map((p) => p.normalizado),
          backgroundColor: "rgba(42,120,214,0.16)",
          borderColor: COR_SERIE,
          pointBackgroundColor: "#FFFFFF",
          pointBorderColor: COR_SERIE,
          borderWidth: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const p = pontos[ctx.dataIndex];
                return `${p.nome}: valor real = ${p.valor}` + (p.fonte === "norma" ? ` (comparado a norma clínica: ${p.detalheFonte})` : "");
              },
            },
          },
        },
        scales: {
          r: { min: 0, max: 100, ticks: { display: false }, pointLabels: { font: { size: 10.5 } } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(selecionadas), JSON.stringify(pontos.map(p => p.valor))]);

  if (metricas.length === 0) return <div className="empty-state">Nenhuma métrica disponível pra este atleta ainda.</div>;

  return (
    <div>
      <div className="chart-controls" style={{marginBottom:6}}>
        <span className="chart-controls-note">Escolha o que entra no radar (múltipla escolha):</span>
      </div>
      <MultiTabSelect opcoes={metricas} selecionadas={selecionadas} onToggle={toggle} />
      <div className="chart-controls-note" style={{marginTop:8}}>
        Cada eixo é normalizado (0–100){usaNormaReal ? ", usando norma clínica publicada quando cadastrada, e o percentil do elenco nos demais casos" : ", comparado com o resto do elenco (nenhuma norma clínica cadastrada ainda)"}. O valor real aparece ao passar o mouse.
      </div>
      {pontos.length < 3 ? (
        <div className="empty-state">Escolha pelo menos 3 métricas pra desenhar o radar.</div>
      ) : (
        <div className="chart-box-wide" style={{marginTop:12, height:340}}><canvas ref={canvasRef}></canvas></div>
      )}
    </div>
  );
}

function EvolucaoPsiAtleta({ dados, atletaId }) {
  const { useState, useRef, useEffect } = React;

  const construtos = Object.keys(CONSTRUCTOS_PSI).filter((c) =>
    CONSTRUCTOS_PSI[c].some((f) => (dados.psiData[atletaId] || []).some((r) => r.tipo === f.tipo))
  );
  const [construto, setConstruto] = useState(construtos[0] || "");
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  const porInstrumento = historicoConstrutoAtleta(dados, atletaId, construto);
  const instrumentosComDado = Object.keys(porInstrumento);
  const datasUnicas = Array.from(new Set(instrumentosComDado.flatMap((t) => porInstrumento[t].map((p) => p.data)))).sort();

  useEffect(() => {
    if (!canvasRef.current || datasUnicas.length === 0) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "line",
      data: {
        labels: datasUnicas.map(formatarData),
        datasets: instrumentosComDado.map((tipo, i) => {
          const mapa = {};
          porInstrumento[tipo].forEach((p) => { mapa[p.data] = p.valor; });
          return {
            label: semTravessao(tipo),
            data: datasUnicas.map((d) => (d in mapa ? mapa[d] : null)),
            borderColor: PALETA_SUBESCALAS[i % PALETA_SUBESCALAS.length],
            backgroundColor: PALETA_SUBESCALAS[i % PALETA_SUBESCALAS.length] + "33",
            tension: 0.25,
            pointRadius: 4,
            spanGaps: true,
          };
        }),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { font: { size: 10.5 } } } },
        scales: {
          x: { offset: datasUnicas.length === 1, ticks: { font: { size: 10.5 } } },
          y: escalaYLegivel(instrumentosComDado.flatMap((t) => porInstrumento[t].map((p) => p.valor)), { ticks: { font: { size: 10.5 } } }),
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [construto, JSON.stringify(porInstrumento)]);

  if (construtos.length === 0) return <div className="empty-state">Nenhum dado de psicologia para este atleta ainda.</div>;

  return (
    <div>
      <div className="chart-controls">
        <TabSelect opcoes={construtos} valor={construto} onChange={setConstruto} />
        <span className="chart-controls-note">
          {instrumentosComDado.length > 1 ? `Fontes: ${instrumentosComDado.map(semTravessao).join(", ")}, cada uma com sua própria linha (escalas diferentes)` : semTravessao(instrumentosComDado[0] || "")}
        </span>
      </div>
      {datasUnicas.length === 0 ? (
        <div className="empty-state">Sem histórico para esse construto.</div>
      ) : (
        <div className="chart-box-wide"><canvas ref={canvasRef}></canvas></div>
      )}
    </div>
  );
}

function PerformanceAtleta({ dados, atletaId }) {
  const { useState, useRef, useEffect } = React;
  const registrosAtleta = dados.perfData[atletaId] || [];
  const jogos = registrosAtleta.map((r) => r.tipo);
  const [jogo, setJogo] = useState(jogos[0] || "");
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  const registro = registrosAtleta.find((r) => r.tipo === jogo);
  const campos = registro ? parseNota(registro.nota).campos : {};
  const chaves = Object.keys(campos).filter((k) => typeof campos[k] === "number").sort((a, b) => campos[b] - campos[a]);

  useEffect(() => {
    if (!canvasRef.current || chaves.length === 0) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: {
        labels: chaves,
        datasets: [{ label: jogo, data: chaves.map((k) => campos[k]), backgroundColor: COR_SERIE, maxBarThickness: 22 }],
      },
      options: {
        indexAxis: "y",
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { beginAtZero: true, ticks: { precision: 0, font: { size: 10.5 } } },
          y: { ticks: { font: { size: 10.5 } } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [jogo, JSON.stringify(campos)]);

  if (jogos.length === 0) return <div className="empty-state">Nenhum dado de performance para este atleta ainda.</div>;

  return (
    <div>
      <div className="chart-controls">
        <TabSelect opcoes={jogos} valor={jogo} onChange={setJogo} />
        <span className="chart-controls-note">{formatarData(registro ? registro.data : "")}</span>
      </div>
      {chaves.length === 0 ? (
        <div className="empty-state">Sem estatísticas nesse jogo.</div>
      ) : (
        <div className="chart-box-wide" style={{height: Math.max(220, chaves.length * 28)}}><canvas ref={canvasRef}></canvas></div>
      )}
    </div>
  );
}

  const maturacao = calcularMaturacao((dados.atletas || []).find((a) => a.id === atletaId), registros);
  const tuesAtivas = calcularTuesAtivas(registros);

  return (
    <div>
      <div className="ficha-grid" style={{padding:0, marginBottom:16}}>

          <div className="ficha-label">PPE</div>
          <div className="ficha-valor">
            {statusPPE.status === "nunca_realizado" ? "Nunca realizado" : (
              <span className={"badge " + (statusPPE.status === "vencido" ? "vermelho" : statusPPE.status === "vencendo" ? "amarelo" : "verde")}>

          </div>
        )}
        {!maturacao.semDados && (
          <div className="ficha-item">
            <div className="ficha-label">Maturação estimada (Moore, 2015)</div>
            <div className="ficha-valor">
              <span className={"badge " + FASES_MATURACAO[maturacao.fase].sinal}>{FASES_MATURACAO[maturacao.fase].label}</span>{" "}
              {textoOffset(maturacao.offset)} <span className="muted" style={{fontWeight:500, fontSize:11.5}}>(pico estimado aos {formatarNumero(maturacao.idadePico, 1)} anos, erro típico de meio ano)</span>
            </div>
          </div>
        )}
        {tuesAtivas.length > 0 && (
          <div className="ficha-item">
            <div className="ficha-label">TUE ativas</div>

          </div>

      <table>
        <thead><tr><th>Data</th><th>Tipo</th><th>Observação</th><th>Sinal</th></tr></thead>
        <tbody>
          {registros.map((r, i) => (
            <tr key={i}>
              <td>{formatarData(r.data)}</td>
              <td>{semTravessao(r.tipo)}</td>

            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function PerfilAtleta({ atletaId, onBack, dados, onRecarregar, usuario }) {
  const { useState, useRef } = React;
  const atleta = dados.atletas.find(a => a.id === atletaId);
  if (!atleta) return <div className="empty-state">Atleta não encontrado.</div>;
  const { risco } = calcularSemaforo(atletaId, dados);
  const dispAtleta = podeVerDisponibilidade(usuario) ? calcularDisponibilidade(atletaId, dados) : null;
  const iniciais = atleta.nome.split(" ").map(p => p[0]).slice(0, 2).join("");
  const [editando, setEditando] = useState(false);
  const [enviandoFoto, setEnviandoFoto] = useState(false);
  const [erroFoto, setErroFoto] = useState(null);
  const inputFotoRef = useRef(null);
  const podeEditar = podeGerenciarAtletas(usuario);
  const idadeAtleta = calcularIdade(atleta.data_nascimento);

  async function trocarFoto(e) {
    const arquivo = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!arquivo || enviandoFoto) return;
    setEnviandoFoto(true);
    setErroFoto(null);
    try {
      await enviarFotoAtleta(atletaId, arquivo);
      onRecarregar();
    } catch (err) {
      setErroFoto((err && err.message) || "Falha ao enviar a foto.");
    } finally {
      setEnviandoFoto(false);
    }
  }

  const temPsi = (dados.psiData[atletaId] || []).length > 0;
  const temPerf = (dados.perfData[atletaId] || []).length > 0;
  const temMedicina = ((dados.medicinaData || {})[atletaId] || []).length > 0;
  const episodiosLesao = calcularEpisodiosLesao(dados.fisioData[atletaId]);
  const lesaoLongaAtiva = episodiosLesao.find((ep) => ep.ativo && calcularDiasEntre(ep.dataInicio) >= 30);
  const statusPPE = calcularStatusPPE((dados.medicinaData || {})[atletaId]);
  const episodioConcussaoAtivo = calcularEpisodiosConcussao((dados.medicinaData || {})[atletaId]).find((ep) => ep.ativo);

  async function salvarFicha(campos) {
    await db.collection(COL_ATLETAS).doc(atletaId).update(campos);
    setEditando(false);
    onRecarregar();
  }

  return (
    <div>
      <button className="back-link" onClick={onBack}><Icone nome="voltar" />Voltar</button>
      <div className={"perfil-hero " + risco}>
        <img className="perfil-hero-marca" src={ESCUDO_MEIA_NOITE} alt="" aria-hidden="true" />
        <div
          className={"profile-avatar" + (podeEditar ? " clicavel" : "")}
          onClick={() => podeEditar && !enviandoFoto && inputFotoRef.current && inputFotoRef.current.click()}
          title={podeEditar ? "Trocar foto" : undefined}
        >
          {atleta.foto ? <img loading="lazy" decoding="async" className="profile-foto" src={atleta.foto} alt="" /> : iniciais}
          {podeEditar && <div className="profile-avatar-hint">{enviandoFoto ? "Enviando..." : "Trocar foto"}</div>}
          {podeEditar && (
            <input ref={inputFotoRef} type="file" accept="image/*" style={{display:"none"}} onChange={trocarFoto} />
          )}
        </div>
        <div className="perfil-hero-info">
          <div className="perfil-hero-eyebrow">
            <span>{atleta.categoria || "Categoria não definida"}</span>
            {atleta.posicao && <React.Fragment><span className="sep">·</span><span>{atleta.posicao}</span></React.Fragment>}
          </div>
          <div className="profile-name">{nomeExibicao(atleta)}</div>
          {atleta.apelido && <div className="profile-meta">{atleta.nome}</div>}
          <div className="perfil-hero-chips">
            <span className={"hero-chip status " + risco}>{risco === "verde" ? "Regular" : risco === "amarelo" ? "Atenção" : "Prioridade"}</span>
            {dispAtleta && <span className={"hero-chip status " + DISPONIBILIDADE[dispAtleta.status].sinal} title={dispAtleta.motivos.join("\n")}>{DISPONIBILIDADE[dispAtleta.status].label}</span>}
            {idadeAtleta != null && <span className="hero-chip"><b>{idadeAtleta}</b> anos</span>}
            {atleta.perna_dominante && <span className="hero-chip">Perna <b>{atleta.perna_dominante.toLowerCase()}</b></span>}
            {atleta.localidade && <span className="hero-chip">{atleta.localidade}</span>}
          </div>
        </div>
        <div className="perfil-hero-acoes">
          <button className="pill-btn" onClick={() => window.print()}><Icone nome="pdf" />Gerar relatório PDF</button>
        </div>
      </div>
      {erroFoto && (
        <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)", marginBottom:16}}>
          <span><b>Erro ao enviar a foto:</b> {erroFoto}</span>
        </div>
      )}
      <BlocoDisponibilidade disp={dispAtleta} />
      <div className="print-only" style={{marginBottom:16, color:"var(--navy)"}}>
        <div style={{fontSize:12, color:"#667"}}>Relatório individual gerado em {formatarData(hojeISO())} · MeuCT · Meia Noite EC</div>
      </div>
      {atleta.pendente_vinculo && (
        <div className="access-note" style={{background:"var(--amarelo-bg)", borderColor:"var(--amarelo)"}}>
          <span><b>Pendente de vínculo:</b> este atleta foi criado automaticamente a partir de uma importação e ainda não foi confirmado como correspondência de outro cadastro.</span>
        </div>
      )}
      {lesaoLongaAtiva && (
        <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)"}}>
          <span><b>Afastamento prolongado:</b> lesão em {lesaoLongaAtiva.regiao.toLowerCase()} há {calcularDiasEntre(lesaoLongaAtiva.dataInicio)} dias, ainda na fase "{labelFaseRtp(lesaoLongaAtiva.faseAtual)}". Vale considerar acompanhamento psicológico durante o afastamento.</span>
        </div>
      )}
      {episodioConcussaoAtivo && (
        <div className="access-note" style={{background:"var(--vermelho-bg)", borderColor:"var(--vermelho)"}}>
          <span><b>Concussão em acompanhamento:</b> fase atual "{labelFaseConcussao(episodioConcussaoAtivo.faseAtual)}", desde {formatarData(episodioConcussaoAtivo.dataInicio)}. Retorno ao jogo só após liberação médica.</span>
        </div>
      )}
      {(statusPPE.status === "vencido" || statusPPE.status === "vencendo") && (
        <div className="access-note" style={{background:"var(--amarelo-bg)", borderColor:"var(--amarelo)"}}>
          <span><b>PPE {statusPPE.status === "vencido" ? "vencido" : "vencendo"}:</b> {statusPPE.status === "vencido" ? `venceu há ${-statusPPE.dias} dias` : `vence em ${statusPPE.dias} dias`}. Renovar o exame médico pré-participação antes de liberar o atleta pra próxima temporada/torneio.</span>
        </div>
      )}
      {statusPPE.status === "nunca_realizado" && (
        <div className="access-note">
          <span><b>PPE não cadastrado:</b> este atleta ainda não tem exame médico pré-participação registrado.</span>
        </div>
      )}

      {editando && podeEditar ? (
        <div className="panel">
          <div className="panel-head"><h3>Editar ficha</h3></div>
          <FormAtleta atleta={atleta} onSalvar={salvarFicha} onCancelar={() => setEditando(false)} />
        </div>
      ) : (
        <FichaAtleta atleta={atleta} onEditar={podeEditar ? () => setEditando(true) : null} />
      )}

      <div className="panel">
        <div className="panel-head"><h3>Radar de atributos</h3></div>
        <div className="panel-body" style={{padding:"16px 20px 20px"}}>
          <RadarAtleta dados={dados} atletaId={atletaId} />
        </div>

/** Botão compacto pra avançar a fase de RTP de uma lesão ativa, sem reabrir o formulário inteiro. */
function AvancarFaseRtp({ atletaId, episodio, usuario, onSalvar }) {
  const [aberto, setAberto] = useState(false);
  const [fase, setFase] = useState(episodio.faseAtual);
  const [salvando, setSalvando] = useState(false);

  async function confirmar() {
    setSalvando(true);
    try {
      await onSalvar(atletaId, {
        tipo: "Lesão",
        evento: "atualizacao_fase",
        data: hojeISO(),
        regiao: episodio.regiao,
        gravidade: episodio.gravidade,
        fase_rtp: fase,
        avaliador: usuario ? (usuario.nome || usuario.email || "") : "",
        nota: `Atualização de fase — ${episodio.regiao}: ${labelFaseRtp(fase)}.`,
        sinal: sinalPorGravidadeFase(episodio.gravidade, fase),
      });
      setAberto(false);
    } finally {
      setSalvando(false);
    }
  }

  if (!aberto) {
    return <button className="pill-btn" style={{fontSize:11.5, padding:"5px 10px"}} onClick={() => setAberto(true)}>Atualizar fase</button>;
  }
  return (
    <div style={{display:"flex", gap:6, alignItems:"center"}}>
      <select value={fase} onChange={e => setFase(e.target.value)} style={{padding:"5px 8px", borderRadius:7, border:"1px solid var(--line-soft)", fontSize:11.5}}>
        {FASES_RTP.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
      </select>
      <button className="pill-btn primary" style={{fontSize:11.5, padding:"5px 10px"}} disabled={salvando} onClick={confirmar}>{salvando ? "..." : "Salvar"}</button>
      <button className="pill-btn" style={{fontSize:11.5, padding:"5px 10px"}} onClick={() => setAberto(false)}>×</button>
    </div>
  );
}

function FormPsicologiaEstruturada({ atletas, onSalvar, onCancelar }) {
  const [atletaId, setAtletaId] = useState(atletas[0] ? atletas[0].id : "");
  const [data, setData] = useState(hojeISO());
  const [instrumentoId, setInstrumentoId] = useState(INSTRUMENTOS_PSI[0].id);
  const [valores, setValores] = useState({});
  const [salvando, setSalvando] = useState(false);

  const instrumento = instrumentoPsiPorId(instrumentoId);
  const camposPreenchidos = instrumento.campos.every((c) => typeof valores[c] === "number" && !isNaN(valores[c]));
  const totalRef = instrumento.campoTotal ? valores[instrumento.campoTotal] : null;
  const sinal = camposPreenchidos ? instrumento.calcularSinal(totalRef) : "neutro";
  const faixa = camposPreenchidos && instrumento.labelFaixa ? instrumento.labelFaixa(totalRef) : null;

  function setCampo(campo, v) {
    setValores((prev) => ({ ...prev, [campo]: v === "" ? undefined : Number(v) }));
  }

  function trocarInstrumento(id) {
    setInstrumentoId(id);
    setValores({});
  }

  async function handleSubmit() {
    if (!atletaId || !camposPreenchidos || salvando) return;
    setSalvando(true);
    try {
      const notaCampos = instrumento.campos.map((c) => `${c}: ${valores[c]}`).join(", ");
      const nota = `${instrumento.nome} — ${notaCampos}` + (faixa && faixa !== "—" ? ` (faixa: ${faixa})` : "");
      await onSalvar(atletaId, {
        data,
        tipo: instrumento.id,
        instrumento_id: instrumento.id,
        valor_total: instrumento.campoTotal ? totalRef : null,
        nota,
        sinal,
      });
      setValores({});
    } finally {
      setSalvando(false);
    }
  }

  return (
    <div className="form-panel">
      <div className="form-grid">
        <div className="field">
          <label>Atleta</label>
          <select value={atletaId} onChange={e => setAtletaId(e.target.value)}>
            {atletas.map(a => <option key={a.id} value={a.id}>{nomeExibicao(a)}{a.categoria ? " · " + a.categoria : ""}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Data</label>
          <input type="date" value={data} onChange={e => setData(e.target.value)} />
        </div>
      </div>
      <div className="form-grid full">
        <div className="field">
          <label>Instrumento</label>
          <select value={instrumentoId} onChange={e => trocarInstrumento(e.target.value)}>
            {INSTRUMENTOS_PSI.map(i => <option key={i.id} value={i.id}>{semTravessao(i.nome)}</option>)}
          </select>
        </div>
      </div>
      <div className="form-grid">
        {instrumento.campos.map((c) => (
          <div className="field" key={c}>
            <label>{c}</label>
            <input type="number" value={valores[c] === undefined ? "" : valores[c]} onChange={e => setCampo(c, e.target.value)} />
          </div>
        ))}
      </div>
      <div className="access-note">
        <span>{instrumento.corteInfo}</span>
      </div>
      {camposPreenchidos && faixa && faixa !== "—" && (
        <div className="access-note" style={sinal === "vermelho" ? {background:"var(--vermelho-bg)", borderColor:"var(--vermelho)"} : sinal === "amarelo" ? {background:"var(--amarelo-bg)", borderColor:"var(--amarelo)"} : {}}>
          <span><b>Faixa calculada:</b> {faixa}</span>
        </div>
      )}
      <div className="form-actions">
        <button className="pill-btn" onClick={onCancelar} disabled={salvando}>Cancelar</button>
        <button className="pill-btn primary" onClick={handleSubmit} disabled={!atletaId || !camposPreenchidos || salvando}>{salvando ? "Salvando..." : "Salvar avaliação"}</button>
      </div>
    </div>
  );
}
